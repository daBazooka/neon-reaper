<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7ec8ff">
<meta name="description" content="WOBBLE BOW: a physics archery duel between wobbly ragdolls. Drag back, aim and fire, land headshots or knock your rival off their pillar. 60 levels, bosses, upgrades, hats and a 2-player mode.">
<title>WOBBLE BOW</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%237ec8ff%22/%3E%3Cpath d=%22M5 2a8 8 0 0 1 0 12%22 fill=%22none%22 stroke=%22%23b8743a%22 stroke-width=%222%22/%3E%3Cpath d=%22M5 2v12M2 8h11%22 stroke=%22%232a1d2e%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <button id="pauseBtn" class="ico" aria-label="Pause">❚❚</button>
  <div id="lvTxt">LEVEL 1</div>
  <div class="chip coin" id="hCoins">0</div>
</div>

<div id="menu" class="hidden">
  <div id="mTop"><div class="chip coin" id="mCoins">0</div><div class="chip" id="mStars">★ 0</div></div>
  <h1 id="logo"><span>WOBBLE</span><span>BOW</span></h1>
  <button id="playBtn" class="btn go big pulse">▶ PLAY <small id="playLv">LEVEL 1</small></button>
  <div id="mBtns">
    <div class="row">
      <button id="mapBtn" class="btn"><span>🗺️</span>LEVELS</button>
      <button id="upBtn" class="btn"><span>⬆️</span>UPGRADES<i class="badge hidden" id="upBadge">!</i></button>
      <button id="hatBtn" class="btn"><span>🎩</span>HATS</button>
      <button id="miBtn" class="btn"><span>🎯</span>MISSIONS<i class="badge hidden" id="miBadge">!</i></button>
    </div>
    <div class="row">
      <button id="arenaBtn" class="btn"><span>🏟️</span>ARENA<small id="arenaTxt"></small></button>
      <button id="duoBtn" class="btn"><span>👥</span>2 PLAYERS</button>
      <button id="setBtn" class="btn sq"><span>⚙</span></button>
    </div>
  </div>
</div>

<div id="banner" class="hidden"><b></b><small></small></div>
<div id="toasts"></div>
<div id="duoHelp" class="hidden"><div><b>P1</b> hold <kbd>W</kbd> or drag on the left half</div><div><b>P2</b> hold <kbd>↑</kbd> or drag on the right half</div></div>

<div id="result" class="screen hidden"><div class="card">
  <div id="rTitle" class="ttl">VICTORY!</div>
  <div id="rStars"><i>★</i><i>★</i><i>★</i></div>
  <div id="rStats" class="small"></div>
  <div id="rCoins" class="coin big">+0</div>
  <div id="rUps" class="list"></div>
  <div id="rMiss" class="qmini"></div>
  <div class="rRow"><button id="rMenu" class="btn">☰</button><button id="rRetry" class="btn">↻ RETRY</button><button id="rNext" class="btn go big">NEXT ▶</button></div>
</div></div>

<div id="map" class="screen hidden"><div class="card wide">
  <div class="ttl">LEVELS <small id="mapStars"></small></div>
  <div class="tabs" id="mapTabs"></div>
  <div id="mapGrid"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="shop" class="screen hidden"><div class="card wide">
  <div class="ttl">UPGRADES <small class="coin" id="sCoins"></small></div>
  <div id="sList" class="list"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="hats" class="screen hidden"><div class="card wide">
  <div class="ttl">HATS <small class="coin" id="hatCoins"></small></div>
  <div id="hatGrid"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="missions" class="screen hidden"><div class="card">
  <div class="ttl">MISSIONS</div>
  <div id="miList" class="list"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="settings" class="screen hidden"><div class="card">
  <div class="ttl">SETTINGS</div>
  <div class="list">
    <button class="setRow" data-opt="sfx"><span>Sound effects</span><b></b></button>
    <button class="setRow" data-opt="music"><span>Music</span><b></b></button>
  </div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="pause" class="screen hidden"><div class="card">
  <div class="ttl">PAUSED</div>
  <button id="pResume" class="btn go wide">▶ RESUME</button>
  <button id="pRetry" class="btn wide">↻ RESTART</button>
  <button id="pQuit" class="btn ghost wide">MENU</button>
</div></div>
<div id="login" class="screen hidden"><div class="card wide">
  <div class="ttl">DAILY REWARD</div>
  <div class="small">Come back every day: the reward grows for 7 days in a row.</div>
  <div id="loginRow"></div>
  <button id="loginBtn" class="btn go big">CLAIM</button>
</div></div>
<div id="duoRes" class="screen hidden"><div class="card">
  <div id="dTitle" class="ttl">P1 WINS!</div>
  <div id="dScore" class="big2">0 : 0</div>
  <div class="rRow"><button id="dMenu" class="btn">MENU</button><button id="dAgain" class="btn go big">REMATCH ▶</button></div>
</div></div>

<div id="boot"><div class="bootLogo">WOBBLE BOW</div><div class="bootBar"><i></i></div></div>

<script src="js/sdk.js"></script>
<script src="js/core.js"></script>
<script src="js/body.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
