<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a120c">
<meta name="description" content="UNDERNEATH: every picture hides another. Scrub away the grime, find treasure and secrets, and dive into the painting beneath the painting.">
<title>UNDERNEATH</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%221%22 width=%2214%22 height=%2214%22 fill=%22%23c8962e%22/%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 fill=%22%236ec2ff%22/%3E%3Ccircle cx=%228%22 cy=%227%22 r=%221.6%22 fill=%22%231a0e04%22/%3E%3Cpath d=%22M7 8h2l.6 3H6.4z%22 fill=%22%231a0e04%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="hudTop">
    <div id="depthChip" class="chip"><b id="depthTxt">DEPTH 1</b><span id="bioTxt">Sunny Meadow</span><div class="pbar"><i id="restBar"></i></div></div>
    <div id="dustBox"><div id="dust">0</div><div id="rate">+0/s</div><div id="streak" class="hidden"><b id="streakTxt">x1.5</b><div class="sbar"><i id="streakBar"></i></div></div></div>
    <div class="hBtns">
      <button id="dailyBtn" class="icoBtn hidden" aria-label="Daily painting">🎁</button>
      <button id="codexBtn" class="icoBtn" aria-label="Codex">📖<i id="codexDot" class="dot hidden"></i><small id="secretN">0/12</small></button>
      <button id="setBtn" class="icoBtn" aria-label="Settings">⚙️</button>
    </div>
  </div>
  <div id="skills"></div>
  <button id="diveBtn" class="btn primary hidden">DIVE ▼</button>
  <div id="tip" class="hidden"></div>
</div>
<div id="panel" class="hidden"><div class="pHead">UPGRADES</div><div id="upList"></div></div>
<div id="banner"></div>
<div id="toasts"></div>

<!-- ============ TITLE ============ -->
<div id="title" class="screen">
  <h1 id="logo"><span>UNDER</span><span>NEATH</span></h1>
  <div class="tagline">Every picture hides <b>another</b>.</div>
  <button id="playBtn" class="btn big primary">PLAY</button>
  <div id="titleInfo" class="hint"></div>
</div>

<!-- ============ CODEX ============ -->
<div id="codex" class="screen hidden dim">
  <div class="panelHead"><h2>CODEX</h2><button class="btn ghost closeBtn">CLOSE</button></div>
  <div class="tabs"><button class="tab on" data-tab="secrets">SECRETS</button><button class="tab" data-tab="critters">CREATURES</button><button class="tab" data-tab="relics">RELICS</button><button class="tab" data-tab="lore">NOTES</button></div>
  <div id="codexBody" class="list"></div>
  <div id="codexStats" class="hint"></div>
</div>

<!-- ============ SETTINGS ============ -->
<div id="settings" class="screen hidden dim">
  <div class="panelHead"><h2>SETTINGS</h2></div>
  <div class="list">
    <label class="setRow"><span>Sound effects</span><input type="checkbox" data-opt="sfx"><i class="sw"></i></label>
    <label class="setRow"><span>Music</span><input type="checkbox" data-opt="music"><i class="sw"></i></label>
    <div class="setRow"><span>Effects</span><div class="seg" data-opt="fx"><button data-v="low">LOW</button><button data-v="high">HIGH</button></div></div>
  </div>
  <button id="replayTut" class="btn wide">SHOW HINTS AGAIN</button>
  <button class="btn wide ghost closeBtn">BACK</button>
</div>

<!-- ============ OFFLINE ============ -->
<div id="offline" class="screen hidden dim">
  <div class="bigIco">🦋</div>
  <h2>WELCOME BACK</h2>
  <div class="hint">While you were away, your moths kept scrubbing.</div>
  <div class="bigDust" id="offDust">+0</div>
  <button id="offBtn" class="btn big primary">COLLECT</button>
</div>

<div id="boot"><div class="bootLogo">UNDERNEATH</div><div class="bootBar"><i></i></div></div>

<script src="js/sdk.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/gen.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
