<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1fa8d8">
<meta name="description" content="TIDECALLER: you don't steer the boat, you ARE the ocean. Raise the tide over reefs, drop it under caves, and fling your boat into the sky.">
<title>TIDECALLER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%235ec8f2%22/%3E%3Cpath d=%22M0 10q4-3 8 0t8 0v6H0z%22 fill=%22%231a8ac0%22/%3E%3Cpath d=%22M4 9h8l-1 2H5z%22 fill=%22%23e8553c%22/%3E%3Cpath d=%22M8 3v6h3z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<style>
:root{--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--gold:#ffd23a;--ink:#0c2a44;--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1fa8d8;color:#fff;font-family:var(--f);touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:ns-resize}
button{font-family:var(--f);cursor:pointer;border:0;color:inherit}
.hidden{display:none !important}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--sat)) 12px 0;display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:10}
#hL,#hR{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
#hR{flex-direction:row;align-items:center;margin-left:auto}
#hC{flex:1;display:flex;justify-content:center}
#dist{font:italic 900 28px/1 var(--f);text-shadow:0 3px 0 var(--ink),0 0 12px rgba(0,40,80,.5);-webkit-text-stroke:1px var(--ink)}
#hearts{font-size:20px;letter-spacing:2px;text-shadow:0 2px 0 var(--ink)}
#hearts .off{opacity:.25;filter:grayscale(1)}
#coins{font:900 22px/1 var(--f);color:var(--gold);text-shadow:0 2px 0 var(--ink);padding:6px 12px 6px 34px;border-radius:20px;background:rgba(12,42,68,.55) no-repeat 8px 50%/20px;position:relative}
#coins::before{content:'';position:absolute;left:9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6b0,#ffd23a 45%,#d8900a);box-shadow:0 0 8px rgba(255,210,58,.8)}
.icoBtn{pointer-events:auto;width:44px;height:44px;border-radius:12px;background:rgba(12,42,68,.55);font-size:16px;font-weight:900;margin-left:8px}
#combo{display:flex;flex-direction:column;align-items:center;position:relative;animation:pulse .3s}
#combo b{font:italic 900 40px/1 var(--f);color:var(--gold);text-shadow:0 4px 0 var(--ink),0 0 20px rgba(255,210,58,.6);-webkit-text-stroke:1.5px var(--ink)}
#combo span{font:900 10px/1 var(--f);letter-spacing:3px;text-shadow:0 2px 0 var(--ink)}
#combo i{display:block;height:4px;width:70px;margin-top:4px;border-radius:2px;background:linear-gradient(90deg,#ffd23a,#ff8a3a);transform-origin:left}
@keyframes pulse{0%{transform:scale(1.4)}100%{transform:scale(1)}}

#hint{position:fixed;left:0;right:0;top:24%;text-align:center;z-index:12;pointer-events:none;font:italic 900 clamp(24px,5.4vw,46px)/1.1 var(--f);color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink),0 0 30px rgba(255,255,255,.4);animation:hintIn 2.6s ease-out forwards;padding:0 5vw}
#hint.big{color:#e8a8ff}
@keyframes hintIn{0%{opacity:0;transform:scale(1.5)}10%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:44%;text-align:center;z-index:11;pointer-events:none;font:italic 900 clamp(26px,6vw,56px)/1 var(--f);letter-spacing:2px;color:#fff;text-shadow:0 5px 0 var(--ink);-webkit-text-stroke:2px var(--ink);animation:bannerIn 2.8s ease-out forwards}
#banner small{display:block;font-size:.34em;letter-spacing:6px;margin-bottom:8px;-webkit-text-stroke:0;color:var(--gold)}
@keyframes bannerIn{0%{opacity:0;letter-spacing:30px}15%{opacity:1;letter-spacing:2px}80%{opacity:1}100%{opacity:0}}
#toasts{position:fixed;left:50%;top:calc(80px + var(--sat));transform:translateX(-50%);z-index:13;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(92vw,420px)}
.toast{background:linear-gradient(90deg,#1a8a4a,#2ab86a);border:2px solid #7dff9a;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:toast 3.4s ease-out forwards}
.toast b{display:block;font:900 12px/1 var(--f);letter-spacing:2px;color:#d8ffe0}
.toast span{display:block;font:800 15px/1.25 var(--f);margin-top:4px}
.toast.gold{background:linear-gradient(90deg,#a86a10,#e8a21a);border-color:#ffe68a}
@keyframes toast{0%{opacity:0;transform:translateY(-20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* title */
#title{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(7vh + var(--sat));pointer-events:none;transition:opacity .4s,transform .4s}
#title.gone{opacity:0;transform:translateY(-30px)}
#logo{font:italic 900 clamp(48px,12vw,118px)/.9 var(--f);letter-spacing:.01em;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 7px 0 var(--ink),0 0 40px rgba(255,255,255,.35);text-align:center}
#logo span{color:var(--gold)}
.tag{margin-top:12px;font:800 clamp(14px,2.6vw,22px)/1.2 var(--f);text-shadow:0 2px 0 var(--ink);text-align:center;padding:0 16px}
.tag b{color:var(--gold)}
.drag{margin-top:auto;margin-bottom:6px;font:900 clamp(13px,2.4vw,18px)/1 var(--f);letter-spacing:2px;text-shadow:0 2px 0 var(--ink);display:flex;align-items:center;gap:10px;animation:bob 1.4s ease-in-out infinite}
.hand{display:inline-block;font-size:1.8em;animation:hand 1.4s ease-in-out infinite}
@keyframes hand{0%,100%{transform:translateY(-12px)}50%{transform:translateY(12px)}}
@keyframes bob{0%,100%{opacity:1}50%{opacity:.75}}
#tBest{font:800 14px/1 var(--f);color:#dff6ff;text-shadow:0 2px 0 var(--ink);margin-bottom:12px;min-height:14px}
.tBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto;padding:0 10px}

/* buttons */
.btn{padding:12px 18px;border-radius:14px;background:#fff;color:var(--ink);font:900 15px/1 var(--f);letter-spacing:1px;box-shadow:0 5px 0 #0c2a4499,0 8px 16px rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0c2a4499}
.btn.icon{width:46px;padding:12px 0;font-size:18px}
.btn.primary{background:linear-gradient(180deg,#ffe066,#ffb81a);color:#4a2a00}
.btn.gold{background:linear-gradient(180deg,#ffe066,#ff9a1a);color:#4a2a00;animation:glowB 1s ease-in-out infinite alternate}
@keyframes glowB{from{box-shadow:0 5px 0 #8a4a0099,0 0 10px #ffd23a}to{box-shadow:0 5px 0 #8a4a0099,0 0 30px #ffd23a}}
.btn.big{padding:16px 22px;font-size:19px}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}

/* screens */
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,24,44,.55);padding:12px;backdrop-filter:blur(2px)}
.card{width:min(94vw,440px);max-height:94vh;overflow:auto;background:linear-gradient(180deg,#1a5a8a,#0f3a60);border:3px solid #7dd8ff55;border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;animation:cardIn .3s ease-out}
.card.wide{width:min(96vw,640px)}
@keyframes cardIn{from{transform:translateY(30px) scale(.95);opacity:0}}
h2{font:italic 900 26px/1 var(--f);text-align:center;letter-spacing:1px;text-shadow:0 3px 0 var(--ink);display:flex;justify-content:center;align-items:center;gap:12px}
.money{font:900 16px/1 var(--f);color:var(--gold);background:rgba(0,0,0,.25);padding:6px 10px;border-radius:12px;font-style:normal}
.secT{font:900 12px/1 var(--f);letter-spacing:2px;color:#9adcff;margin-top:6px;display:flex;justify-content:space-between}
.hint2{font:700 13px/1.3 var(--f);color:#b8e4ff;text-align:center}
.closeBtn{align-self:center;margin-top:4px}

/* result */
.rCard{align-items:stretch;text-align:center}
#rTitle{font:italic 900 22px/1 var(--f);letter-spacing:3px;color:#9adcff}
#rTitle.best{color:var(--gold);font-size:30px;animation:pulse .5s}
#rDist{font:italic 900 64px/1 var(--f);text-shadow:0 5px 0 var(--ink);-webkit-text-stroke:2px var(--ink)}
#rBest{font:800 14px/1 var(--f);color:#b8e4ff}
#rCoins{font:900 26px/1 var(--f);color:var(--gold);text-shadow:0 3px 0 var(--ink)}
.mis{display:flex;flex-direction:column;gap:8px;text-align:left}
.mi{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px}
.mi .ck{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:3px solid #7dd8ff66;display:flex;align-items:center;justify-content:center;font:900 15px/1 var(--f)}
.mi.done .ck{background:#2ab86a;border-color:#7dff9a}
.mi .mt{flex:1;font:800 14px/1.25 var(--f)}
.mi .mp{font:800 11px/1 var(--f);color:#9adcff;margin-top:4px}
.mi .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.mi .bar i{display:block;height:100%;background:linear-gradient(90deg,#7dd8ff,#7dff9a)}
.mi.new{animation:newM .8s ease-out}
@keyframes newM{0%{transform:scale(1.08);background:rgba(125,255,154,.4)}}
.rankLine{text-align:center;font:900 16px/1.2 var(--f);color:var(--gold)}
#rLetter{background:#f6e8c8;color:#4a3420;border-radius:10px;padding:12px;font:italic 600 14px/1.4 Georgia,serif;text-align:left;box-shadow:inset 0 0 20px rgba(120,80,30,.35)}
#rLetter b{display:block;font:900 11px/1 var(--f);letter-spacing:2px;color:#8a5a2a;margin-bottom:6px;font-style:normal}
.rBtns{display:flex;gap:8px;margin-top:6px}
.rBtns .big{flex:1}

/* shipyard */
.tabs{display:flex;gap:6px;justify-content:center}
.tabs button{padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.25);font:900 13px/1 var(--f);letter-spacing:1px}
.tabs button.on{background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ship{background:rgba(0,0,0,.22);border:2px solid transparent;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.ship.sel{border-color:var(--gold);background:rgba(255,210,58,.12)}
.ship canvas{width:140px;height:80px}
.ship b{font:900 15px/1 var(--f)}
.ship p{font:600 12px/1.3 var(--f);color:#b8e4ff;min-height:32px}
.ship .st{font:800 11px/1.2 var(--f);color:#dff6ff}
.ship .btn{padding:9px 12px;font-size:13px;width:100%}
.list{display:flex;flex-direction:column;gap:8px}
.up{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px}
.up .ic{font-size:26px;width:36px;text-align:center}
.up .ut{flex:1}
.up b{font:900 15px/1 var(--f)}
.up span{display:block;font:700 12px/1.3 var(--f);color:#b8e4ff;margin-top:3px}
.up span.nx{color:#7dff9a;margin-top:1px}
.up .pips{display:flex;gap:3px;margin-top:5px}
.up .pips i{width:10px;height:5px;border-radius:2px;background:rgba(255,255,255,.18)}
.up .pips i.on{background:var(--gold)}
.up .btn{padding:10px 12px;font-size:14px;min-width:88px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stats div{background:rgba(0,0,0,.22);border-radius:10px;padding:8px 10px;font:700 12px/1.2 var(--f);color:#b8e4ff}
.stats b{display:block;font:900 18px/1 var(--f);color:#fff;margin-top:3px}
.letter{background:#f6e8c8;color:#4a3420;border-radius:10px;padding:10px 12px;font:italic 600 13px/1.4 Georgia,serif}
.letter.locked{background:rgba(0,0,0,.22);color:#6a8aa8;font-style:normal;font-family:var(--f);font-weight:800}

/* settings */
.setRow{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.22);border-radius:12px;padding:12px 14px;font:800 15px/1 var(--f)}
.setRow input{display:none}
.sw{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative;transition:.2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.setRow input:checked+.sw{background:#2ab86a}
.setRow input:checked+.sw::after{left:23px}
.seg{display:flex;gap:4px}
.seg button{padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.15);font:900 12px/1 var(--f)}
.seg button.on{background:#fff;color:var(--ink)}

/* boot */
#boot{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#5ec8f2,#1a8ac0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
.bootLogo{font:italic 900 44px/1 var(--f);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink)}
.bootBar{width:200px;height:10px;border-radius:5px;background:rgba(0,0,0,.25);overflow:hidden}
.bootBar i{display:block;height:100%;width:30%;background:var(--gold);animation:boot 1s ease-in-out infinite alternate}
@keyframes boot{to{width:100%}}

@media (max-width:520px){#dist{font-size:22px}#hearts{font-size:16px}#coins{font-size:18px}#combo b{font-size:32px}#rDist{font-size:52px}.grid{grid-template-columns:1fr 1fr}.ship canvas{width:120px;height:68px}}
@media (max-height:500px){#title{padding-top:3vh}#logo{font-size:64px}.card{max-height:96vh;padding:12px;gap:7px}#rDist{font-size:44px}}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="hL"><div id="dist">0 m</div><div id="hearts"></div></div>
  <div id="hC"><div id="combo" class="hidden"><b>×1</b><span>COMBO</span><i></i></div></div>
  <div id="hR"><div id="coins">0</div><button id="pauseBtn" class="icoBtn" aria-label="Pause">❚❚</button></div>
</div>
<div id="hint" class="hidden"></div>
<div id="banner" class="hidden"></div>
<div id="toasts"></div>

<!-- ============ TITLE ============ -->
<div id="title">
  <h1 id="logo">TIDE<span>CALLER</span></h1>
  <div class="tag">You don't steer the boat. <b>You ARE the ocean.</b></div>
  <div class="drag"><span class="hand">☝</span> DRAG UP &amp; DOWN TO MOVE THE SEA</div>
  <div id="tBest"></div>
  <div class="tBtns">
    <button id="tShop" class="btn">⚓ SHIPYARD</button>
    <button id="tMis" class="btn">🎯 MISSIONS</button>
    <button id="tLog" class="btn">📜 LOGBOOK</button>
    <button id="tSet" class="btn icon">⚙</button>
  </div>
</div>

<!-- ============ RESULT ============ -->
<div id="result" class="screen hidden">
  <div class="card rCard">
    <div id="rTitle">SHIPWRECKED</div>
    <div id="rDist">0 m</div>
    <div id="rBest"></div>
    <div id="rCoins">+0</div>
    <div class="secT">MISSIONS <span id="rRank"></span></div>
    <div id="rMis" class="mis"></div>
    <button id="rRankUp" class="btn gold hidden">⭐ RANK UP! CLAIM REWARD</button>
    <div id="rLetter" class="hidden"></div>
    <div class="rBtns">
      <button id="rHome" class="btn ghost">⌂</button>
      <button id="rShop" class="btn">⚓ SHIPYARD</button>
      <button id="rAgain" class="btn primary big">SAIL AGAIN ▶</button>
    </div>
  </div>
</div>

<!-- ============ SHIPYARD ============ -->
<div id="shop" class="screen hidden">
  <div class="card wide">
    <h2>SHIPYARD <span class="money" id="sCoins">0</span></h2>
    <div class="tabs"><button data-tab="ships" class="on">SHIPS</button><button data-tab="ups">UPGRADES</button></div>
    <div id="shipList" class="grid"></div>
    <div id="upList" class="list hidden"></div>
    <button class="btn ghost closeBtn">BACK</button>
  </div>
</div>

<!-- ============ MISSIONS ============ -->
<div id="missions" class="screen hidden">
  <div class="card">
    <h2>MISSIONS</h2>
    <div id="mRank" class="rankLine"></div>
    <div id="mList" class="mis"></div>
    <button id="mClaim" class="btn gold hidden">⭐ RANK UP! CLAIM REWARD</button>
    <div class="hint2">Finish all three to rank up. New ranks unlock new ships.</div>
    <button class="btn ghost closeBtn">BACK</button>
  </div>
</div>

<!-- ============ LOGBOOK ============ -->
<div id="log" class="screen hidden">
  <div class="card wide">
    <h2>LOGBOOK</h2>
    <div id="logStats" class="stats"></div>
    <div class="secT">MESSAGES IN BOTTLES <span id="logN"></span></div>
    <div id="logList" class="list"></div>
    <button class="btn ghost closeBtn">BACK</button>
  </div>
</div>

<!-- ============ PAUSE / SETTINGS ============ -->
<div id="pause" class="screen hidden">
  <div class="card">
    <h2>PAUSED</h2>
    <button id="pResume" class="btn primary big">▶ RESUME</button>
    <button id="pSet" class="btn wide">SETTINGS</button>
    <button id="pHome" class="btn ghost wide">END VOYAGE</button>
  </div>
</div>
<div id="settings" class="screen hidden">
  <div class="card">
    <h2>SETTINGS</h2>
    <div class="list">
      <label class="setRow"><span>Sound effects</span><input type="checkbox" data-opt="sfx"><i class="sw"></i></label>
      <label class="setRow"><span>Music</span><input type="checkbox" data-opt="music"><i class="sw"></i></label>
      <div class="setRow"><span>Effects</span><div class="seg" data-opt="fx"><button data-v="low">LOW</button><button data-v="high">HIGH</button></div></div>
    </div>
    <button class="btn ghost closeBtn">BACK</button>
  </div>
</div>

<div id="boot"><div class="bootLogo">TIDECALLER</div><div class="bootBar"><i></i></div></div>

<script>
'use strict';
/* =====================================================================
   CrazyGames SDK v3 wrapper.
   - Documented order: SDK.init() -> loadingStart() -> (load) -> loadingStop()
   - gameplayStart/Stop are de-duplicated so the portal never sees two
     starts (or two stops) in a row.
   - Every call is wrapped: off-portal (localhost, itch, file://) the game
     runs identically with the SDK absent.
   - ADS_ENABLED stays false during Basic Launch: CrazyGames does not allow
     ads in Basic Launch, so no ad API is touched at all while it's false.
     Flip it to true once the dashboard shows Full Implementation.
   ===================================================================== */
const ADS_ENABLED = false;

const SDK = {
  cg: null, env: 'none', playing: false, lastAd: 0, adBusy: false,
  onMute: null,

  async init(){
    await new Promise(res => {
      let done = false; const fin = () => { if(!done){ done = true; res(); } };
      try{
        const s = document.createElement('script');
        s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
        s.onload = fin; s.onerror = fin;
        document.head.appendChild(s);
      }catch(e){ fin(); }
      setTimeout(fin, 4000);
    });
    try{
      const sdk = window.CrazyGames && window.CrazyGames.SDK;
      if(!sdk) return;
      await Promise.race([sdk.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('sdk timeout')), 5000))]);
      this.env = sdk.environment || 'crazygames';
      if(this.env === 'disabled') return;   // not on a CrazyGames domain
      this.cg = sdk;
      try{
        this.applySettings(sdk.game.settings);
        sdk.game.addSettingsChangeListener(s => this.applySettings(s));
      }catch(e){}
    }catch(e){ this.cg = null; }
  },
  applySettings(s){
    if(!s) return;
    if(this.onMute) this.onMute(!!s.muteAudio);
  },
  data(){ try{ return this.cg && this.cg.data ? this.cg.data : null; }catch(e){ return null; } },

  loadingStart(){ try{ this.cg && this.cg.game.loadingStart(); }catch(e){} },
  loadingStop(){ try{ this.cg && this.cg.game.loadingStop(); }catch(e){} },
  gameplayStart(){ if(this.playing) return; this.playing = true; try{ this.cg && this.cg.game.gameplayStart(); }catch(e){} },
  gameplayStop(){ if(!this.playing) return; this.playing = false; try{ this.cg && this.cg.game.gameplayStop(); }catch(e){} },
  happytime(){ try{ this.cg && this.cg.game.happytime(); }catch(e){} },

  canRewarded(){ return ADS_ENABLED && !!this.cg && !this.adBusy; },

  /* rewarded ad: cb(true) only when the ad finished */
  rewarded(cb){
    if(!this.canRewarded()){ cb(false); return; }
    this._ad('rewarded', cb);
  },
  /* midgame ad at natural breaks, self-limited to one per 3 minutes */
  midgame(cb){
    if(!ADS_ENABLED || !this.cg || this.adBusy || Date.now() - this.lastAd < 180000){ cb(); return; }
    this._ad('midgame', () => cb());
  },
  _ad(type, cb){
    this.adBusy = true; this.gameplayStop();
    let fin = false;
    const end = ok => { if(fin) return; fin = true; this.adBusy = false; this.lastAd = Date.now(); AU.adMute(false); cb(ok); };
    try{
      this.cg.ad.requestAd(type, {
        adStarted: () => AU.adMute(true),
        adFinished: () => end(true),
        adError: () => end(false)
      });
    }catch(e){ end(false); }
  }
};

function mergeInto(base, src){

<script>
'use strict';
/* =====================================================================
   TIDECALLER audio: everything synthesized.
   - ocean: filtered noise whose swell follows the tide
   - music: a gentle 6/8 sea-shanty arpeggio, key changes by biome,
     drums join as the combo climbs
   - coins climb a scale with the combo
   ===================================================================== */
const AU = {
  ctx:null, master:null, sfx:null, mus:null, amb:null, rev:null, noiseBuf:null,
  portalMute:false, adMuted:false, hidden:false, last:{}, step:0, nextT:0, timer:null, key:62, heat:0, coinN:0,
  init(){
    if(this.ctx) return;
    try{ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; this.ctx = new AC(); }catch(e){ return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 8; comp.attack.value = .003; comp.release.value = .25;
    this.master = c.createGain(); this.master.connect(comp); comp.connect(c.destination);
    const rl = c.sampleRate * 1.6 | 0, ir = c.createBuffer(2, rl, c.sampleRate);
    for(let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for(let i = 0; i < rl; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.8); }
    this.rev = c.createConvolver(); this.rev.buffer = ir; const rg = c.createGain(); rg.gain.value = .35; this.rev.connect(rg); rg.connect(this.master);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.connect(this.master);
    this.amb = c.createGain(); this.amb.connect(this.master);
    const len = c.sampleRate * 2; this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0); let br = 0; for(let i = 0; i < len; i++){ const w = Math.random() * 2 - 1; br = (br + .02 * w) / 1.02; d[i] = w * .5 + br * 3; }
    // the sea: looping noise through a lowpass whose cutoff follows the tide
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    this.seaF = c.createBiquadFilter(); this.seaF.type = 'lowpass'; this.seaF.frequency.value = 500; this.seaF.Q.value = .4;
    this.seaG = c.createGain(); this.seaG.gain.value = .12;
    s.connect(this.seaF); this.seaF.connect(this.seaG); this.seaG.connect(this.amb); s.start();
    this.apply(); this.startMusic();
  },
  resume(){ try{ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); }catch(e){} },
  apply(){
    if(!this.ctx) return;
    const on = !this.portalMute && !this.adMuted && !this.hidden, t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(on ? 1 : 0, t, .03);
    this.sfx.gain.setTargetAtTime(save.opt.sfx ? .6 : 0, t, .02);
    this.amb.gain.setTargetAtTime(save.opt.sfx ? .9 : 0, t, .1);
    this.mus.gain.setTargetAtTime(save.opt.music ? .32 : 0, t, .05);
  },
  setPortalMute(m){ this.portalMute = m; this.apply(); },
  adMute(m){ this.adMuted = m; this.apply(); },
  setHidden(h){ this.hidden = h; this.apply(); },
  gate(k, gap){ const t = this.ctx.currentTime; if(t - (this.last[k] || -1) < gap) return false; this.last[k] = t; return true; },
  mf(m){ return 440 * Math.pow(2, (m - 69) / 12); },
  tone(f, d, type, v, f2, delay, wet){
    const c = this.ctx; if(!c) return;

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.sfx); if(wet) g.connect(this.rev); o.start(t); o.stop(t + d + .05);
  },
  noise(d, freq, v, type, f2, delay, q, wet){
    const c = this.ctx; if(!c) return;
    const t = c.currentTime + (delay || 0), s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq, t); if(f2) f.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + d); f.Q.value = q || 1;
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);

  },
  // the sea follows the tide's movement
  tide(v, surf){ if(!this.ctx || !this.seaF) return; const t = this.ctx.currentTime, k = Math.min(1, Math.abs(v) / 1200); this.seaF.frequency.setTargetAtTime(380 + k * 1400 + (600 - surf) * .6, t, .08); this.seaG.gain.setTargetAtTime(.1 + k * .2, t, .08); },
  SCALE:[0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24],
  coin(combo){ if(!this.ctx || !this.gate('coin', .03)) return; const n = this.SCALE[Math.min(this.SCALE.length - 1, (this.coinN++ % 5) + Math.min(6, combo - 1))]; this.tone(this.mf(this.key + 12 + n), .18, 'triangle', .09, 0, 0, 1); this.tone(this.mf(this.key + 24 + n), .08, 'sine', .04); },
  gem(){ if(!this.ctx) return; [0, 4, 7, 12, 16].forEach((k, i) => this.tone(this.mf(this.key + 24 + k), .3, 'triangle', .07, 0, i * .04, 1)); },
  heart(){ if(!this.ctx) return; [0, 7, 12].forEach((k, i) => this.tone(this.mf(this.key + 12 + k), .35, 'sine', .1, 0, i * .07, 1)); },
  bottle(){ if(!this.ctx) return; this.noise(.4, 3000, .1, 'bandpass', 800, 0, 3); [0, 4, 7, 11, 14].forEach((k, i) => this.tone(this.mf(this.key + 12 + k), .6, 'triangle', .07, 0, .1 + i * .08, 1)); },
  splash(v){ if(!this.ctx || !this.gate('spl', .08)) return; this.noise(.35 + v * .25, 1800, .18 + v * .18, 'lowpass', 300, 0, .7, 1); this.noise(.12, 5000, .06 + v * .06, 'highpass', 2500); },
  launch(v){ if(!this.ctx || !this.gate('launch', .2)) return; const k = Math.min(1, v / 1300); this.noise(.5, 600, .2 + k * .2, 'bandpass', 3000, 0, 1.2, 1); this.tone(180, .4, 'sine', .1, 420 + k * 300); },
  perfect(flips){ if(!this.ctx) return; this.splash(1); const ch = flips >= 2 ? [0, 4, 7, 12, 16, 19] : flips ? [0, 4, 7, 12] : [0, 7, 12]; ch.forEach((k, i) => this.tone(this.mf(this.key + 12 + k), .7, 'triangle', .09, 0, .03 + i * .045, 1)); this.noise(.5, 6000, .07, 'highpass', 9000, .05, 1, 1); },
  combo(n){ if(!this.ctx) return; this.heat = Math.min(1, n / 7); this.tone(this.mf(this.key + 24 + Math.min(12, n * 2)), .2, 'square', .025, 0, .12); },
  hop(){ if(!this.ctx) return; this.tone(this.mf(this.key + 19), .15, 'triangle', .08); this.tone(this.mf(this.key + 24), .2, 'triangle', .08, 0, .06, 1); },
  crash(why){ if(!this.ctx) return; this.heat = 0; if(why === 'mine'){ this.noise(1.1, 900, .7, 'lowpass', 50, 0, 1, 1); this.tone(70, .8, 'sine', .5, 25); } else { this.noise(.4, 1200, .5, 'lowpass', 120, 0, 1.5, 1); this.tone(120, .3, 'square', .1, 45); this.noise(.15, 3500, .2, 'bandpass', 900, .02, 4); } },

  best(){ if(!this.ctx) return; [0, 7, 12, 16, 19, 24].forEach((k, i) => this.tone(this.mf(this.key + 12 + k), .7, 'triangle', .09, 0, i * .08, 1)); },

  count(){ if(!this.ctx || !this.gate('cnt', .05)) return; this.tone(this.mf(this.key + 24 + ((Math.random() * 3) | 0) * 2), .05, 'square', .02); },
  setBiome(i){ this.key = BIOMES[i].key; },

  kick(t, v){ const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + .14); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .2); o.connect(g); g.connect(this.mus); o.start(t); o.stop(t + .25); },
  shk(t, v){ const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noiseBuf; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000; const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05); s.connect(f); f.connect(g); g.connect(this.mus); s.start(t, Math.random()); s.stop(t + .07); },
  sched(){
    const c = this.ctx; if(!c || c.state !== 'running'){ if(c) this.nextT = c.currentTime + .05; return; }

    // i - VI - III - VII (minor-ish shanty), 12 eighths per 2 bars
    const prog = [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]];

    while(this.nextT < c.currentTime + .15){
      const st = this.step, t = this.nextT, s6 = st % 6, bar = (st / 6 | 0) % 8, ch = prog[(bar / 2 | 0) % 4], r = this.key - 12 - 3, h = this.heat;
      if(s6 === 0) this.mt(this.mf(r + ch[0] - 12), t, sp * 5.5, 'triangle', .11, 500);
      if(s6 === 3) this.mt(this.mf(r + ch[0] - 5), t, sp * 2.5, 'triangle', .06, 500);
      // plucked arpeggio
      const ar = [0, 1, 2, 1, 2, 1][s6]; this.mt(this.mf(r + 12 + ch[ar]), t, sp * 1.6, 'triangle', .035, 2400);
      // the tune comes in once the combo warms up
      if(h > .25 && st % 2 === 0){ const n = MEL[(st / 2 | 0) % MEL.length]; this.mt(this.mf(r + 24 + n), t, sp * 1.8, 'square', .012 + h * .012, 1600); }
      if(h > .1 && (s6 === 0 || s6 === 3)) this.kick(t, .16 + h * .2);
      if(h > .45) this.shk(t, .012 + h * .02);
      this.heat = Math.max(0, this.heat - .0015);
      this.nextT += sp; this.step++;
    }
  },
};

<script>
'use strict';
/* =====================================================================
   TIDECALLER simulation.
   The boat sails by itself. The player moves the whole sea: raise the
   tide over reefs, lower it under sea caves, and throw the water up to
   launch the boat into the air. Land it level for a Perfect Splash.
   ===================================================================== */
const STEP = 20;
const G = {
  state:'title', t:0, rt:0,
  x:0, x0:0, speed:260, boost:0, slowT:0,
  surf:420, surfV:0, target:420,
  b:{ y:420, vy:0, ang:0, av:0, air:false, airT:0, rot:0, ground:false, sink:0 },
  hearts:3, maxHearts:3, inv:0, shake:0, flash:0,
  bed:{}, genX:0, ceil:[], mines:[], tent:[], items:[], deco:[],
  parts:[], pops:[], rings:[], hints:[], banner:null,
  dist:0, coinsRun:0, combo:1, comboT:0, perfects:0, perfRow:0, bestFlip:0, minesRun:0, cavesRun:0, bottlesRun:0, maxCombo:1, maxAir:0, nohitFrom:0, nohitBest:0,
  biome:0, biomeK:0, kraken:null, nextKraken:1800, lastHeartM:0, rain:[], bolt:0,
  newMission:[], result:null,
};

/* ---------------- terrain ---------------- */
function bedAt(x){
  const f = x / STEP, i = Math.floor(f), k = f - i;
  const a = G.bed[i] ?? WORLD.BED, b = G.bed[i + 1] ?? WORLD.BED;
  return a + (b - a) * k;
}
function raiseBed(x0, x1, fn){ // fn(t in 0..1) -> bed y; keeps the higher (smaller y) of old and new
  for(let i = Math.floor(x0 / STEP); i <= Math.ceil(x1 / STEP); i++){
    const x = i * STEP; if(x < x0 || x > x1) continue;
    const y = fn((x - x0) / (x1 - x0)); G.bed[i] = Math.min(G.bed[i] ?? WORLD.BED, y);
  }
}
function baseBed(x0, x1){ for(let i = Math.floor(x0 / STEP); i <= Math.ceil(x1 / STEP); i++){ const x = i * STEP; G.bed[i] = Math.min(G.bed[i] ?? 999, WORLD.BED - 18 + Math.sin(x * .004) * 12 + Math.sin(x * .011 + 1) * 6); } }
function ceilAt(x){ let y = -1e9; for(const c of G.ceil) if(x >= c.x0 && x <= c.x1) y = Math.max(y, c.y); return y; }

/* ---------------- generation ---------------- */
// room to swing the tide between hazards, scaled by how fast you'll be sailing there
const gapU = k => (255 + Math.min(265, (G.genX - G.x0) / 10 * .055)) * (k || .55);
const diff = () => clamp((G.genX - G.x0) / 10 / 4500, 0, 1);   // 0 at start, 1 at 4.5 km
function coinLine(x0, x1, y0, y1, n, kind){ for(let i = 0; i < n; i++){ const t = n === 1 ? .5 : i / (n - 1); G.items.push({ x:lerp(x0, x1, t), y:lerp(y0, y1, t), k:kind || 'coin', got:false, ph:Math.random() * TAU }); } }
function coinArc(xc, w, yBase, h, n, kind){ for(let i = 0; i < n; i++){ const t = i / (n - 1); G.items.push({ x:xc - w / 2 + w * t, y:yBase - Math.sin(t * Math.PI) * h, k:kind || 'coin', got:false, ph:Math.random() * TAU }); } }
function maybeBottle(x, y){ const p = .05 * (1 + save.up.luck * .25); if(Math.random() < p) G.items.push({ x, y, k:'bottle', got:false, ph:0 }); }
const PAT = {
  open(x, d){
    const L = rnd(500, 900) - d * 200; baseBed(x, x + L);
    const y = rnd(340, 470); coinLine(x + 120, x + L - 120, y, y + rnd(-60, 60), 6 + (Math.random() * 5 | 0));
    if(Math.random() < .5) G.deco.push({ x:x + rnd(100, L - 100), k:pick(['weed', 'shell', 'star', 'weed']) });
    maybeBottle(x + L * .5, rnd(250, 330));
    return L;
  },
  reef(x, d){
    const L = rnd(280, 520), peak = clamp(lerp(405, 300, d) + rnd(-25, 25), 280, 430); baseBed(x, x + L + 80);
    raiseBed(x, x + L, t => lerp(WORLD.BED, peak, Math.pow(Math.sin(t * Math.PI), .7)));
    coinArc(x + L / 2, L * .7, peak - 60, 30, 5);
    G.deco.push({ x:x + L / 2, k:'coral' }, { x:x + L * .3, k:'coral' });
    return L + gapU();
  },
  spikes(x, d){
    const n = 1 + (Math.random() * (1 + d * 2.5) | 0); let cx = x + 60; baseBed(x, x + 60 + n * 260);
    for(let i = 0; i < n; i++){ const w = rnd(70, 110), p = clamp(lerp(410, 310, d) + rnd(-25, 25), 285, 430); raiseBed(cx, cx + w, t => lerp(WORLD.BED - 10, p, 1 - Math.abs(t * 2 - 1))); G.items.push({ x:cx + w / 2, y:p - 50, k:'coin', got:false, ph:0 }); cx += w + rnd(140, 260); }
    return cx - x + gapU();
  },
  cave(x, d){
    const L = rnd(300, 620) + d * 200, y = clamp(lerp(400, 452, d) + rnd(-15, 15), 385, 465); baseBed(x, x + L + 60);
    G.ceil.push({ x0:x, x1:x + L, y, k:'rock', passed:false, seed:Math.random() * 1000 });
    coinLine(x + 60, x + L - 60, y + WORLD.TOP + 22, y + WORLD.TOP + 22, Math.max(3, L / 90 | 0));
    return L + gapU();
  },
  channel(x, d){
    const L = rnd(360, 640), gap = lerp(125, 78, d) + rnd(-6, 10), peak = clamp(lerp(510, 420, d) + rnd(-25, 25), 380, 540), y = peak - gap;
    baseBed(x - 40, x + L + 80);
    raiseBed(x - 60, x + L + 60, t => lerp(WORLD.BED, peak, clamp(Math.sin(t * Math.PI) * 1.6, 0, 1)));
    G.ceil.push({ x0:x, x1:x + L, y, k:'rock', passed:false, seed:Math.random() * 1000 });
    const mid = (y + WORLD.TOP + peak - WORLD.DRAFT) / 2 - 16; coinLine(x + 60, x + L - 60, mid, mid, Math.max(3, L / 80 | 0));
    return L + gapU(.7);
  },
  zigzag(x, d){
    let L = 0; L += PAT.reef(x, d * .8) - gapU() + gapU(.42); L += PAT.cave(x + L, d * .8) - gapU() + gapU(.42); if(Math.random() < .5 + d * .4) L += PAT.reef(x + L, d * .8);
    return L;
  },
  mines(x, d){
    const n = 1 + (Math.random() * (1 + d * 2.2) | 0), sp = rnd(420, 560) - d * 60; baseBed(x, x + n * sp + 200);
    for(let i = 0; i < n; i++){ const mx = x + 200 + i * sp; G.mines.push({ x:mx, hit:false, hop:false }); coinArc(mx, 220, 300, 110, 5); }
    return n * sp + 200;
  },
  sky(x, d){
    const L = 700; baseBed(x, x + L);
    coinArc(x + L / 2, 520, 330, 170 + d * 40, 9); G.items.push({ x:x + L / 2, y:120 - d * 20, k:'gem', got:false, ph:0 });
    maybeBottle(x + L / 2 + 60, 150);
    return L;
  },
  cavemine(x, d){ // a mine right after a cave: jump out of the dark
    let L = PAT.cave(x, d); L += 60; L += PAT.mines(x + L, d * .6); return L;
  },
};
const PAT_W = d => [
  ['open', 1.6 - d], ['reef', 1.4], ['cave', 1.3], ['spikes', .3 + d * .9], ['zigzag', d * 1.6], ['channel', d * 1.4],
  ['mines', d < .08 ? 0 : .5 + d * .9], ['sky', .55], ['cavemine', d < .3 ? 0 : d * .7],
];
function pickPat(d){ const W = PAT_W(d); let s = 0; for(const w of W) s += Math.max(0, w[1]); let r = Math.random() * s; for(const w of W){ r -= Math.max(0, w[1]); if(r <= 0) return w[0]; } return 'open'; }
const TUT = [['open', 0], ['reef', 0, 'RAISE THE TIDE ↑', 'reef'], ['open', 0], ['cave', 0, 'LOWER THE TIDE ↓', 'cave'], ['open', 0], ['sky', 0, 'FLICK UP FAST TO LAUNCH!', 'sky'], ['open', 0, 'PULL THE SEA DOWN TO CATCH IT SOFTLY!', 'flip'], ['sky', .2], ['open', 0], ['mines', .05, 'JUMP OVER THE MINE!', 'mine'], ['open', 0]];
function generate(){
  while(G.genX < G.x + 2600){
    const d = diff(), m = (G.genX - G.x0) / 10;
    // the Kraken rises every 2 km
    if(m >= G.nextKraken){ G.genX += krakenSection(G.genX, d); G.nextKraken += 2000; continue; }
    let L;
    if(G.tutQ && G.tutQ.length){ const [p, dd, hint, key] = G.tutQ.shift(); if(hint) G.hints.push({ x:G.genX + (p === 'mines' ? 0 : -60), txt:hint, key }); L = PAT[p](G.genX, dd); }
    else L = PAT[pickPat(d)](G.genX, d);
    // a spare heart now and then when you are hurt
    if(m - G.lastHeartM > 1400 && Math.random() < .35){ G.items.push({ x:G.genX + L * .5, y:rnd(260, 330), k:'heart', got:false, ph:0 }); G.lastHeartM = m; }
    G.genX += L;
  }
}
function krakenSection(x, d){
  const n = 6 + (d * 3 | 0), sp = (255 + Math.min(265, (x - G.x0) / 10 * .055)) * rnd(2.3, 2.6); baseBed(x, x + n * sp + 600);
  G.hints.push({ x:x - 500, txt:'THE KRAKEN RISES!', key:'kraken', big:true });
  for(let i = 0; i < n; i++){ const tx = x + 400 + i * sp; G.tent.push({ x:tx, h:rnd(120, 170) + d * 40, rise:0, hit:false, passed:false, ph:Math.random() * TAU, last:i === n - 1 }); coinArc(tx, 240, 260, 90, 4); }
  G.items.push({ x:x + 400 + n * sp + 120, y:200, k:'gem', got:false, ph:0 });
  return n * sp + 700;
}

/* ---------------- round ---------------- */
function resetWorld(){
  Object.assign(G, { bed:{}, ceil:[], mines:[], tent:[], items:[], deco:[], parts:[], pops:[], rings:[], hints:[], banner:null, kraken:null });
  G.x = 0; G.x0 = 0; G.genX = -600; baseBed(-800, 1200); G.genX = 900;
  G.surf = G.target = 420; G.surfV = 0;
  Object.assign(G.b, { y:420, vy:0, ang:0, av:0, air:false, airT:0, rot:0, ground:false, sink:0 });
  G.tutQ = save.tut < 1 ? TUT.map(t => t.slice()) : null;
  G.nextKraken = 1800; G.lastHeartM = 0;
  generate();
}
function startRun(){
  const sh = shipById(save.ship);
  G.ship = sh; G.maxHearts = sh.hearts + save.up.hull; G.hearts = G.maxHearts;
  Object.assign(G, { state:'run', t:0, speed:260, boost:0, slowT:0, inv:0, dist:0, coinsRun:0, combo:1, comboT:0, perfects:0, perfRow:0, bestFlip:0, minesRun:0, cavesRun:0, bottlesRun:0, maxCombo:1, maxAir:0, nohitFrom:0, nohitBest:0, newMission:[], result:null, runLetters:[] });
  save.stats.runs++;
}

/* ---------------- effects ---------------- */
function pop(txt, x, y, c, s, d){ G.pops.push({ txt, x, y, c, s:s || 18, t:0, d:d || 1 }); if(G.pops.length > 30) G.pops.shift(); }
function splash(x, y, n, pow){ const lim = save.opt.fx === 'low' ? 160 : 420; for(let i = 0; i < n && G.parts.length < lim; i++){ const a = -Math.PI / 2 + rnd(-1.1, 1.1); const s = rnd(120, 420) * pow; G.parts.push({ x:x + rnd(-24, 24), y, vx:Math.cos(a) * s - G.speed * .3, vy:Math.sin(a) * s, g:1100, l:rnd(.4, .9), c:pick(['#ffffff', '#dff8ff', '#bdefff']), s:rnd(2, 5) }); } }
function burst(x, y, n, cols, sp){ const lim = save.opt.fx === 'low' ? 160 : 420; for(let i = 0; i < n && G.parts.length < lim; i++){ const a = rnd(0, TAU), s = rnd(60, sp || 300); G.parts.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, g:200, l:rnd(.3, .8), c:pick(cols), s:rnd(2, 4.5) }); } }
function addCombo(n, why){ const was = G.combo; G.combo = Math.min(10, G.combo + n); G.comboT = 0; G.maxCombo = Math.max(G.maxCombo, G.combo); if(G.combo > was){ AU.combo(G.combo); if(G.combo >= 5 && was < 5) SDK.happytime(); } missionTick(); }

/* ---------------- damage ---------------- */
function crash(why, x, y){
  if(G.inv > 0 || G.state !== 'run') return;
  G.hearts--; G.inv = 1.7; G.shake = 16; G.flash = .35;
  G.combo = 1; G.comboT = 0; G.perfRow = 0;
  G.nohitBest = Math.max(G.nohitBest, G.dist - G.nohitFrom); G.nohitFrom = G.dist;
  G.speed *= .55; G.boost = 0;
  const b = G.b; b.vy = Math.min(b.vy, -380); b.air = true; b.av = rnd(-7, -4); b.airT = 0; b.rot = 0; b.hurt = true;
  burst(x ?? G.x, y ?? b.y - 10, 30, ['#ffffff', '#ffb070', '#ff5a3c', '#8a6a4a'], 360);
  AU.crash(why);
  pop(why === 'mine' ? 'BOOM!' : why === 'tent' ? 'WHACK!' : 'CRUNCH!', G.x, b.y - 70, '#ff5a3c', 26);
  if(G.hearts <= 0){ G.state = 'dying'; G.dieT = 0; AU.sink(); }
}

/* ---------------- landing ---------------- */
function land(){
  const b = G.b, sh = G.ship, flips = Math.round(Math.abs(b.rot) / TAU), fall = b.vy, rel = fall - Math.max(G.surfV, G.downV || 0);
  splash(G.x, G.surf, rel > 700 ? 26 : 12, rel > 700 ? 1.2 : .7);
  G.rings.push({ x:G.x, y:G.surf, r:10, R:rel > 700 ? 120 : 70, t:0 });
  b.air = false; b.ang = angNorm(b.ang) * .5; b.av = 0; b.rot = 0; b.landT = G.rt;
  b.vy = Math.max(G.surfV, Math.min(b.vy, G.surfV + 220));   // the sea absorbs the fall
  if(b.hurt){ b.hurt = false; b.ang = 0; AU.splash(.6); return; }
  if(b.airT > G.maxAir) G.maxAir = b.airT;
  if(b.airT < .5){ AU.splash(.4); missionTick(); return; }
  if(flips){ G.bestFlip = Math.max(G.bestFlip, flips); save.stats.flips += flips; }
  const label = flips >= 3 ? 'TRIPLE FLIP!' : flips === 2 ? 'DOUBLE FLIP!' : flips === 1 ? 'FLIP!' : '';
  if(rel < Math.max(480, fall * .6) * sh.land){
    // PERFECT CATCH: the sea met the boat softly
    G.perfects++; G.perfRow++; save.stats.perfects++;
    G.boost = 240; G.flash = .12;
    addCombo(1 + flips);
    pop(label || 'PERFECT CATCH!', G.x, b.y - 80, label ? '#ffd23a' : '#7dff9a', label ? 30 : 24, 1.2);
    if(label) pop('PERFECT CATCH', G.x, b.y - 48, '#7dff9a', 16, 1.2);
    AU.perfect(flips);
    burst(G.x, G.surf - 10, 24, ['#ffffff', '#7dff9a', '#ffd23a'], 320);
  } else if(rel < 1380){
    G.perfRow = 0;
    if(flips){ addCombo(flips); pop(label, G.x, b.y - 70, '#ffd23a', 24); } else pop('SPLASH', G.x, b.y - 60, '#bdefff', 16);
    AU.splash(1);
  } else {
    // belly flop: costs the combo, not a heart
    G.perfRow = 0; G.combo = 1; G.comboT = 0; G.shake = 8;
    pop(flips ? label + ' BELLY FLOP!' : 'BELLY FLOP!', G.x, b.y - 80, '#ff9a5a', 22, 1.1);
    AU.splash(1.4); AU.scrape();
  }
  missionTick();
}

/* ---------------- missions ---------------- */
function missionVal(m){
  switch(m.k){
    case 'dist': return G.dist; case 'coins': return G.coinsRun; case 'perfect': return G.perfects; case 'flip': return G.bestFlip;
    case 'combo': return G.maxCombo; case 'nohit': return Math.max(G.nohitBest, G.dist - G.nohitFrom); case 'air': return Math.floor(G.maxAir * 10) / 10;
    default: return m.p;
  }
}
function missionAdd(k, n){ for(const m of save.missions) if(!m.done && m.k === k) m.p += n; missionTick(); }
function missionTick(){
  if(G.state !== 'run') return;
  for(const m of save.missions){
    if(m.done) continue;
    if(missionVal(m) >= m.n){ m.done = true; G.newMission.push(m); AU.mission(); showToast('MISSION COMPLETE', MTYPES[m.k].t(m.n)); persist(); }
  }
}

/* ---------------- update ---------------- */
function update(rdt){
  G.rt += rdt;
  const dt = rdt * (G.slowT > 0 ? .5 : 1); if(G.slowT > 0) G.slowT -= rdt;
  G.t += dt;
  const b = G.b, run = G.state === 'run', dying = G.state === 'dying';
  // --- the tide follows your hand ---
  const tmax = tidePow(save.up.tide);
  const want = clamp((G.target - G.surf) * 16, -tmax, tmax);
  const acc = 14000 * dt; G.surfV += clamp(want - G.surfV, -acc, acc);
  G.surf += G.surfV * dt;
  // how fast you've been pulling the sea down lately (a catch counts for a quarter second)
  G.downV = Math.max(G.surfV, (G.downV || 0) - 1600 * dt);
  // how far the sea has travelled upward in this one motion: a real flick is a long, fast stroke
  if(G.surfV < -150){ G.stroke = (G.stroke || 0) - G.surfV * dt; G.peakV = Math.min(G.peakV || 0, G.surfV); }
  else if(G.surfV > -40){ G.stroke = Math.max(0, (G.stroke || 0) - 1200 * dt); if(!G.stroke) G.peakV = 0; }
  if(G.surf < WORLD.SURF_MIN){ G.surf = WORLD.SURF_MIN; G.surfV = Math.max(0, G.surfV); }
  if(G.surf > WORLD.SURF_MAX){ G.surf = WORLD.SURF_MAX; G.surfV = Math.min(0, G.surfV); }
  // --- sailing ---
  if(run || G.state === 'title'){
    const base = run ? 255 + Math.min(265, G.dist * .055) : 45;
    G.speed = lerp(G.speed, base + G.boost, 1 - Math.exp(-dt * 1.4));
    G.boost = Math.max(0, G.boost - dt * 160);
  } else if(dying) G.speed *= Math.exp(-dt * 2);
  G.x += G.speed * dt;
  if(run){ G.dist = (G.x - G.x0) / 10; generate(); }
  // --- the boat ---
  const bed = bedAt(G.x);
  if(!b.air){
    const tv = G.surfV - (b.y - G.surf) * 11;
    b.vy += (tv - b.vy) * Math.min(1, dt * 12);
    // the water stops rising but the boat keeps going: LAUNCH (only after a real flick)
    if(!dying && G.stroke > 150 && G.peakV < -650 && G.surfV > -260 && b.y < G.surf + 30){
      const h = Math.min(G.stroke * 1.05, 440) * (G.ship ? G.ship.lift : 1) * (tidePow(save.up.tide) / tidePow(0));
      b.air = true; b.airT = 0; b.rot = 0; b.spun = false; b.vy = -Math.sqrt(2 * WORLD.G * h); G.stroke = 0; G.peakV = 0;

<script>

const V = { s:1, ox:0, oy:0, camX:0 };

const SX = x => (x - V.camX) * V.s, SY = y => V.oy + y * V.s;

// biome colours blend while you sail from one to the next

const glowC = {};

/* ---------------- background ---------------- */
const CLOUDS = Array.from({ length:9 }, (_, i) => ({ x:i * 420 + Math.random() * 200, y:rnd(-120, 170), s:rnd(.7, 1.5), p:rnd(.08, .22) }));

/* ---------------- terrain ---------------- */

}
function drawCeil(c){

/* ---------------- water ---------------- */
function drawWater(){

<script>

/* ---------------- HUD ---------------- */
const hc = {};

    const own = save.owned[sh.id], sel = save.ship === sh.id, locked = save.rank < sh.rank;
    const d = document.createElement('div'); d.className = 'ship' + (sel ? ' sel' : '');
    d.innerHTML = `<canvas width="280" height="160"></canvas><b>${sh.name}</b><p>${sh.desc}</p><div class="st">❤ ${sh.hearts}${sh.coin > 1 ? ` · 🪙 x${sh.coin}` : ''}${sh.magnet ? ' · 🧲 +' + sh.magnet : ''}${sh.land > 1 ? ' · soft landings' : ''}</div>`;
    const btn = document.createElement('button'); btn.className = 'btn' + (own ? '' : ' primary');
    if(sel){ btn.textContent = 'SAILING'; btn.disabled = true; }
    else if(own) btn.textContent = 'SELECT';
    else if(locked){ btn.textContent = '🔒 ' + rankName(sh.rank); btn.disabled = true; }
    else { btn.textContent = '🪙 ' + fmt(sh.cost); btn.disabled = save.coins < sh.cost; }
    onTap(btn, () => { if(own){ save.ship = sh.id; } else if(save.coins >= sh.cost){ save.coins -= sh.cost; save.owned[sh.id] = 1; save.ship = sh.id; AU.buy(); showToast('NEW SHIP', sh.name + ' is ready to sail!', true); } else { AU.deny(); return; } G.ship = sh; persist(); openShop(); });
    d.appendChild(btn); L.appendChild(d); drawShipPreview(d.querySelector('canvas'), sh);
  }
  const U = $('upList'); U.innerHTML = '';
  for(const u of UPG){
    const l = save.up[u.id], max = l >= u.max, cost = upCost(u, l);
    const d = document.createElement('div'); d.className = 'up';
    d.innerHTML = `<div class="ic">${u.icon}</div><div class="ut"><b>${u.name}</b><span>${u.eff(l)}</span>${max ? '' : `<span class="nx">Next: ${u.eff(l + 1)}</span>`}<div class="pips">${Array.from({ length:u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('')}</div></div>`;
    const btn = document.createElement('button'); btn.className = 'btn primary'; btn.textContent = max ? 'MAX' : '🪙 ' + fmt(cost); btn.disabled = max || save.coins < cost;
    onTap(btn, () => { if(save.coins < cost || max){ AU.deny(); return; } save.coins -= cost; save.up[u.id]++; AU.buy(); persist(); openShop(); });
    d.appendChild(btn); U.appendChild(d);
  }
}
function openMissions(){
  SCREENS.forEach(hide); show('missions');
  $('mRank').textContent = rankName(save.rank) + (save.rank < 30 ? `  ·  reward +${fmt(rankReward(save.rank))} coins` : '');
  $('mList').innerHTML = save.missions.map(m => misRow(m)).join('');
  $('mClaim').classList.toggle('hidden', !save.missions.every(m => m.done));
}
function openLog(){
  SCREENS.forEach(hide); show('log');
  const S = save.stats;
  $('logStats').innerHTML = [['Best voyage', fmt(save.best) + ' m'], ['Rank', rankName(save.rank)], ['Voyages', fmt(S.runs)], ['Sailed', fmt(S.dist) + ' m'], ['Flips', fmt(S.flips)], ['Perfect splashes', fmt(S.perfects)], ['Mines jumped', fmt(S.mines)], ['Krakens escaped', fmt(S.kraken)]].map(([a, b]) => `<div>${a}<b>${b}</b></div>`).join('');
  $('logN').textContent = save.letters.length + ' / ' + LETTERS.length;
  $('logList').innerHTML = LETTERS.map((t, i) => save.letters.includes(i) ? `<div class="letter">${t}</div>` : `<div class="letter locked">Letter ${i + 1}: still somewhere out at sea...</div>`).join('');
}
function openSettings(){
  const back = G.state === 'pause' ? 'pause' : null; SCREENS.forEach(hide); show('settings'); $('settings').dataset.back = back || '';
  document.querySelectorAll('#settings input[data-opt]').forEach(i => i.checked = !!save.opt[i.dataset.opt]);
  document.querySelectorAll('#settings .seg').forEach(s => s.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === save.opt[s.dataset.opt])));
}
function closeScreens(){
  const wasSettings = !$('settings').classList.contains('hidden') && $('settings').dataset.back === 'pause';
  const fromResult = G.state === 'over';
  SCREENS.forEach(hide);
  if(wasSettings){ show('pause'); return; }
  if(fromResult){ show('result'); if(G.result && G.result.allDone && save.missions.some(m => !m.done)) hide('rRankUp'); return; }
}

/* ---------------- input: your hand is the tide ---------------- */
const PTR = { down:false, id:-1, lastY:0 };
function setTarget(py){ G.target = clamp(toWorldY(py), WORLD.SURF_MIN, WORLD.SURF_MAX); }
const keys = {};
function wire(){
  const cvs = $('cv');
  const start = e => {
    AU.init(); AU.resume();
    PTR.down = true; PTR.id = e.pointerId; setTarget(e.clientY);
    if(G.state === 'title'){ sail(); }
  };
  cvs.addEventListener('pointerdown', start);
  $('title').addEventListener('pointerdown', e => { if(e.target.closest('button')) return; start(e); });
  addEventListener('pointermove', e => { if(e.pointerType === 'mouse' ? G.state === 'run' || PTR.down : PTR.down && e.pointerId === PTR.id) setTarget(e.clientY); });
  addEventListener('pointerup', e => { if(e.pointerId === PTR.id) PTR.down = false; });
  addEventListener('pointercancel', () => PTR.down = false);
  addEventListener('keydown', e => {
    AU.init(); AU.resume();
    keys[e.key] = true;
    if(['ArrowUp', 'ArrowDown', ' ', 'w', 's', 'W', 'S'].includes(e.key)){ e.preventDefault(); if(G.state === 'title') sail(); }
    if(e.key === 'Escape' || e.key === 'p' || e.key === 'P'){ if(G.state === 'run') pauseGame(); else if(G.state === 'pause') resumeGame(); }
    if(e.key === 'Enter' && G.state === 'over' && !$('result').classList.contains('hidden')) sail();
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  onTap('pauseBtn', pauseGame); onTap('pResume', resumeGame); onTap('pSet', openSettings); onTap('pHome', () => { G.state = 'run'; G.hearts = 0; G.state = 'dying'; G.dieT = 1.5; SCREENS.forEach(hide); });
  onTap('tShop', openShop); onTap('tMis', openMissions); onTap('tLog', openLog); onTap('tSet', openSettings);
  onTap('rAgain', sail); onTap('rShop', openShop); onTap('rHome', toTitle); onTap('rRankUp', claimRank); onTap('mClaim', () => { claimRank(); openMissions(); });
  document.querySelectorAll('.closeBtn').forEach(b => onTap(b, closeScreens));
  document.querySelectorAll('#shop .tabs button').forEach(b => onTap(b, () => { shopTab = b.dataset.tab; openShop(); }));
  document.querySelectorAll('#settings input[data-opt]').forEach(i => i.addEventListener('change', () => { save.opt[i.dataset.opt] = i.checked; AU.apply(); persist(); }));
  document.querySelectorAll('#settings .seg button').forEach(b => onTap(b, () => { save.opt[b.parentElement.dataset.opt] = b.dataset.v; resize(); persist(); openSettings(); }));
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { AU.setHidden(document.hidden); if(document.hidden){ writeSave(); pauseGame(); } else AU.resume(); });
  SDK.onMute = m => AU.setPortalMute(m);
}

/* ---------------- loop ---------------- */
let last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt = last ? (ts - last) / 1000 : 1 / 60; last = ts;
  if(dt <= 0) return; if(dt > .05) dt = .05;
  try{
    // keyboard moves the tide too
    const up = keys.ArrowUp || keys.w || keys.W || keys[' '], dn = keys.ArrowDown || keys.s || keys.S;
    if(up) G.target = Math.max(WORLD.SURF_MIN, G.target - 1500 * dt);
    if(dn) G.target = Math.min(WORLD.SURF_MAX, G.target + 1100 * dt);
    if(G.state === 'title'){ G.target = 420 + Math.sin(G.rt * 1.2) * 30; }
    if(G.state !== 'pause') update(dt); else G.rt += dt;
    AU.tide(G.surfV, G.surf);
    render(); updateHUD();
  }catch(err){ console.error(err); }
}
addEventListener('error', e => { try{ console.error(e.error || e.message); }catch(_){} });

/* ---------------- boot ---------------- */
(async () => {
  resize();
  await SDK.init();
  SDK.loadingStart();
  loadSave();
  if(!save.owned[save.ship]) save.ship = 'dinghy';
  wire();
  toTitle();
  requestAnimationFrame(frame);
  SDK.loadingStop();
  const b = $('boot'); b.style.opacity = '0'; setTimeout(() => b.remove(), 450);
})();

</script>
</body>
