<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1724">
<meta name="description" content="FLIPPER RAID: pinball meets dungeon crawler. Smash monsters with your pinball, clear rooms, pick power cards and beat the bosses!">
<title>FLIPPER RAID</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230f1724%22/%3E%3Cpath d=%22M2 12L7 14M14 12L9 14%22 stroke=%22%23ffd23a%22 stroke-width=%222.4%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%228%22 cy=%226%22 r=%223%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="hL"><button id="pauseBtn" class="ico" aria-label="Pause">❚❚</button><div class="chip" id="roomTxt">ROOM 1</div><div class="chip" id="ballsTxt">●●●</div></div>
  <div id="hC"><div id="scoreTxt">0</div><div class="chip combo hidden" id="comboTxt">x3</div></div>
  <div id="hR"><div class="chip coin" id="coinTxt">0</div><div id="cardRow"></div></div>
</div>
<div id="touchL" class="tz hidden">◀ FLIP</div><div id="touchR" class="tz hidden">FLIP ▶</div>
<div id="banner" class="hidden"><b></b><small></small></div>
<div id="tip" class="hidden"></div>

<div id="title">
  <div id="tTop"><div class="chip gem" id="tGems">0</div><div class="chip" id="tBest"></div></div>
  <h1 id="logo"><span>FLIPPER</span><span>RAID</span></h1>
  <div class="tag">Pinball meets dungeon crawler. <b>Smash every monster!</b></div>
  <button id="playBtn" class="btn go big">⚔ RAID</button>
  <div class="tBtns">
    <button id="bShop" class="btn"><span>💎</span>UPGRADES<i class="badge hidden" id="shopBadge">!</i></button>
    <button id="bMi" class="btn"><span>🎯</span>MISSIONS<i class="badge hidden" id="miBadge">!</i></button>
    <button id="bSet" class="btn"><span>⚙</span>SETTINGS</button>
  </div>
  <div class="hint2" id="tHint"></div>
</div>

<div id="pick" class="screen hidden"><div class="card wide">
  <div class="ttl" id="pTitle">CHOOSE A POWER</div>
  <div id="pCards"></div>
  <button id="pReroll" class="btn ghost">🎲 REROLL</button>
</div></div>

<div id="over" class="screen hidden"><div class="card">
  <div class="ttl" id="oTitle">GAME OVER</div>
  <div id="oRoom">ROOM 1</div>
  <div id="oBest" class="small"></div>
  <div id="oStats"></div>
  <div id="oGems" class="gem big">+0</div>
  <button id="oRevive" class="btn pink wide hidden">▶ +1 BALL</button>
  <div id="oMiss" class="qmini"></div>
  <div class="btns">
    <button id="oHome" class="btn ghost" aria-label="Home">⌂</button>
    <button id="oShop" class="btn">💎</button>
    <button id="oDouble" class="btn gold hidden">▶ ×2</button>
    <button id="oAgain" class="btn go">RAID AGAIN ▶</button>
  </div>
</div></div>

<div id="shop" class="screen hidden"><div class="card wide">
  <div class="ttl">UPGRADES <small class="gem" id="sGems"></small></div>
  <div class="tabs"><button data-tab="perk" class="on">PERKS</button><button data-tab="ball">BALLS</button></div>
  <div id="sGrid"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="missions" class="screen hidden"><div class="card">
  <div class="ttl">MISSIONS</div>
  <div id="mList" class="list"></div>
  <div class="small" id="mStats"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="settings" class="screen hidden"><div class="card">
  <div class="ttl">SETTINGS</div>
  <div class="list">
    <button class="setRow" data-opt="sfx"><span>Sound effects</span><b></b></button>
    <button class="setRow" data-opt="music"><span>Music</span><b></b></button>
    <button class="setRow" data-opt="shake"><span>Screen shake</span><b></b></button>
  </div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="pause" class="screen hidden"><div class="card">
  <div class="ttl">PAUSED</div>
  <button id="pResume" class="btn go wide">▶ RESUME</button>
  <button id="pSet" class="btn wide">⚙ SETTINGS</button>
  <button id="pQuit" class="btn ghost wide">END RUN</button>
</div></div>

<div id="toasts"></div>
<div id="boot"><div class="bootLogo">FLIPPER RAID</div><div class="bootBar"><i></i></div></div>

<script src="js/sdk.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
