# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
# Hosts the web game and the multiplayer WebSocket at wss://<name>.onrender.com/ws
services:
  - type: web
    name: bokata
    runtime: docker
    rootDir: bokata
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
