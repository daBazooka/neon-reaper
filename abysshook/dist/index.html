<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e88c8">
<meta name="description" content="ABYSS HOOK: drop your hook, dodge the fish on the way down, and catch everything on the way up. How deep will you go?">
<title>ABYSS HOOK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230a2c5c%22/%3E%3Cpath d=%22M9 2v8a2.5 2.5 0 1 1-5 0%22 fill=%22none%22 stroke=%22%23ffd23a%22 stroke-width=%221.8%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
:root{--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ink:#061a3a;--gold:#ffd23a;--aqua:#6af0ff;--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1e88c8;color:#fff;font-family:var(--f);touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f);cursor:pointer;border:0;color:inherit}
.hidden{display:none !important}
.cur{font:900 17px/1 var(--f);color:var(--gold);text-shadow:0 2px 0 var(--ink);padding:6px 10px 6px 30px;border-radius:14px;background:rgba(6,26,58,.5);position:relative;white-space:nowrap}
.cur::before{content:'';position:absolute;left:8px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6b0,#ffd23a 45%,#c8900a)}
.cur.gem{color:#8affff}
.cur.gem::before{border-radius:3px;transform:rotate(45deg) scale(.85);background:linear-gradient(135deg,#dfffff,#4ad8ff 55%,#2a7ad8)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--sat)) 12px 0;display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:10}
#hL{flex:0 0 auto;min-width:110px}
#depth{font:italic 900 32px/1 var(--f);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink)}
#zoneTxt{font:800 11px/1.3 var(--f);letter-spacing:1px;color:#cfefff;text-shadow:0 1px 0 var(--ink);margin-top:3px}
#lineBar{width:110px;height:6px;border-radius:3px;background:rgba(6,26,58,.5);margin-top:4px;overflow:hidden}
#lineBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8affff,#ffffff)}
#hC{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
#catchTxt{font:900 18px/1 var(--f);padding:7px 14px;border-radius:16px;background:rgba(6,26,58,.5);text-shadow:0 2px 0 var(--ink)}
#catchTxt.full{background:rgba(255,160,40,.7)}
#frenzy{font:italic 900 22px/1 var(--f);color:var(--gold);-webkit-text-stroke:1px var(--ink);text-shadow:0 3px 0 var(--ink);animation:fz .3s infinite alternate}
@keyframes fz{to{transform:scale(1.12)}}
#shieldTxt{font:800 12px/1 var(--f);color:#8affff;text-shadow:0 1px 0 var(--ink)}
#hR{display:flex;align-items:center;gap:8px}
.icoBtn{pointer-events:auto;width:42px;height:42px;border-radius:12px;background:rgba(6,26,58,.5);font:900 15px/1 var(--f)}
#zoneBanner{position:fixed;left:0;right:0;top:40%;text-align:center;z-index:11;pointer-events:none;font:italic 900 clamp(28px,6.5vw,60px)/1 var(--f);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink),0 0 40px rgba(106,240,255,.5);animation:bn 2.6s ease-out forwards}
#zoneBanner small{display:block;font-size:.34em;letter-spacing:5px;color:var(--aqua);margin-bottom:8px;-webkit-text-stroke:1px var(--ink)}
@keyframes bn{0%{opacity:0;letter-spacing:20px}15%{opacity:1;letter-spacing:0}80%{opacity:1}100%{opacity:0}}
#hint{position:fixed;left:0;right:0;bottom:calc(14% + env(safe-area-inset-bottom,0px));text-align:center;z-index:12;pointer-events:none;font:italic 900 clamp(20px,4.6vw,38px)/1.15 var(--f);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);padding:0 5vw;animation:hintIn 3.2s ease-out forwards}
@keyframes hintIn{0%{opacity:0;transform:scale(1.3)}10%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
#toasts{position:fixed;left:50%;top:calc(84px + var(--sat));transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(92vw,400px)}
.toast{background:linear-gradient(90deg,#0f4d86,#1e88c8);border:2px solid #8adcff;border-radius:14px;padding:8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:toast 3s ease-out forwards}
.toast b{display:block;font:900 10px/1 var(--f);letter-spacing:2px;color:#cfefff}
.toast span{display:block;font:800 15px/1.25 var(--f);margin-top:3px}
@keyframes toast{0%{opacity:0;transform:translateY(-20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* reel minigame */
#reel{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:15;width:min(90vw,420px);text-align:center;pointer-events:none}
.reelT{font:italic 900 clamp(34px,8vw,58px)/1 var(--f);color:#ffb020;-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink);animation:fz .25s infinite alternate}
#reelName{font:900 16px/1.3 var(--f);letter-spacing:2px;margin:8px 0;text-shadow:0 2px 0 var(--ink)}
#reelBar{height:22px;border-radius:11px;background:rgba(6,26,58,.7);border:3px solid #fff;overflow:hidden}
#reelBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ffe66a);transition:width .08s}
.reelTap{font:italic 900 22px/1 var(--f);margin-top:10px;-webkit-text-stroke:1px var(--ink);text-shadow:0 3px 0 var(--ink);animation:fz .15s infinite alternate}
#reelTime{font:900 14px/1 var(--f);margin-top:8px;color:#ffd0a0}

/* title */
#title{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;padding-top:calc(58px + var(--sat));pointer-events:none;transition:opacity .35s}
#title.gone{opacity:0}
#topBar{position:absolute;top:calc(10px + var(--sat));left:12px;right:12px;display:flex;gap:8px;align-items:center}
#tLvl{margin-left:auto;font:900 13px/1 var(--f);padding:7px 12px;border-radius:14px;background:rgba(6,26,58,.5);text-shadow:0 1px 0 var(--ink)}
#logo{font:italic 900 clamp(50px,12vw,116px)/.9 var(--f);text-align:center;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 8px 0 var(--ink),0 0 40px rgba(255,255,255,.4)}
#logo span{display:block;color:var(--gold)}
.tag{margin-top:12px;font:800 clamp(14px,2.6vw,21px)/1.25 var(--f);text-shadow:0 2px 0 var(--ink);text-align:center;padding:0 16px}
.tag b{color:var(--gold)}
.tapGo{margin-top:auto;font:italic 900 clamp(22px,4vw,34px)/1 var(--f);letter-spacing:3px;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink);animation:tg 1s ease-in-out infinite alternate}
@keyframes tg{to{transform:scale(1.08)}}
.chip{pointer-events:auto;margin-top:10px;padding:8px 14px;border-radius:18px;background:rgba(6,26,58,.6);border:2px solid rgba(255,255,255,.3);font:800 14px/1 var(--f)}
.chip.on{border-color:var(--gold);background:rgba(160,110,10,.6)}
#tInfo{font:800 12px/1.4 var(--f);text-shadow:0 2px 0 var(--ink);margin:8px 0 10px;text-align:center;min-height:14px;color:#dff4ff}
.tBtns{display:flex;gap:8px;justify-content:center;margin-bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:auto;padding:0 10px;width:min(100%,560px)}
.tBtns .btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:12px;position:relative}
.tBtns .btn span{font-size:22px}
.badge{position:absolute;top:-6px;right:-4px;width:22px;height:22px;border-radius:50%;background:#ff3a5a;color:#fff;font:900 14px/22px var(--f);font-style:normal;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:fz .5s infinite alternate}

/* buttons */
.btn{padding:12px 18px;border-radius:14px;background:#fff;color:var(--ink);font:900 15px/1 var(--f);letter-spacing:1px;box-shadow:0 5px 0 rgba(6,26,58,.6),0 8px 16px rgba(0,0,0,.2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(6,26,58,.6)}
.btn.primary{background:linear-gradient(180deg,#ffe066,#ffb81a);color:#4a2a00}
.btn.aqua{background:linear-gradient(180deg,#9af4ff,#3ac8f0);color:#06284a}
.btn.big{padding:16px 22px;font-size:19px}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}

/* tally sheet */
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:20;width:min(100vw,620px);max-height:94vh;overflow:auto;background:linear-gradient(180deg,#1768ac,#0a2c5c);border:3px solid #8adcff;border-bottom:0;border-radius:26px 26px 0 0;padding:14px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;text-align:center;animation:up .35s ease-out}
@keyframes up{from{transform:translate(-50%,100%)}}
#tTitle{font:italic 900 22px/1 var(--f);letter-spacing:2px;color:#cfefff}
#tDepth{font:800 13px/1 var(--f);color:#9adcff}
#tCoinsWon{font:italic 900 46px/1 var(--f);color:var(--gold);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink)}
#tFish{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:190px;overflow:auto;padding:2px}
.fc{width:74px;background:rgba(0,0,0,.22);border:2px solid transparent;border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;animation:fcIn .3s ease-out backwards}
@keyframes fcIn{from{transform:scale(.3);opacity:0}}
.fc canvas{width:64px;height:40px}
.fc b{font:800 9px/1.1 var(--f);min-height:20px;display:flex;align-items:center}
.fc span{font:900 11px/1 var(--f);color:var(--gold)}
.fc .tg{position:absolute;top:-6px;right:-4px;font:900 9px/1 var(--f);padding:3px 5px;border-radius:6px;background:#ff3a5a}
.fc .tg.sh{background:linear-gradient(90deg,#ffb020,#ffe66a);color:#4a2a00;left:-4px;right:auto}
#xpRow{display:flex;align-items:center;gap:8px;font:900 12px/1 var(--f)}
#xpBar{flex:1;height:12px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden}
#xpBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6aff8a,#ffe66a);transition:width .8s ease-out}
#xpTxt{color:#9adcff;min-width:70px;text-align:right}
.qmini{display:flex;flex-direction:column;gap:4px;text-align:left}
.qm{display:flex;align-items:center;gap:8px;font:800 12px/1.2 var(--f);background:rgba(0,0,0,.2);border-radius:10px;padding:6px 10px}
.qm i{flex:0 0 60px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;font-style:normal}
.qm i b{display:block;height:100%;background:#6aff8a}
.qm.done{background:rgba(60,200,100,.3)}
#upRow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
#upRow::-webkit-scrollbar{display:none}
.up{flex:0 0 108px;background:rgba(0,0,0,.2);border:2px solid transparent;border-radius:14px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.up .ic{font-size:20px}
.up b{font:900 11px/1.1 var(--f)}
.up span{font:700 10px/1.2 var(--f);color:#bfe4ff;min-height:24px}
.up .c{font:900 13px/1 var(--f);color:var(--gold)}
.up.can{border-color:var(--gold);background:rgba(255,210,58,.14);cursor:pointer;animation:can 1s ease-in-out infinite alternate}
@keyframes can{to{box-shadow:0 0 14px rgba(255,210,58,.5)}}
.up.max{opacity:.45}
.rBtns{display:flex;gap:8px;margin-top:2px}
.rBtns .big{flex:1}

/* popups */
.screen{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(3,12,30,.6);padding:12px;backdrop-filter:blur(3px)}
#pop{z-index:40}
.popCard{width:min(90vw,360px);background:radial-gradient(circle at 50% 30%,#2a8ad8,#0a2c5c 75%);border:3px solid #8adcff;border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:popIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.3);opacity:0}}
#popTag{font:900 12px/1 var(--f);letter-spacing:3px;color:var(--aqua)}
#popArt{min-height:110px;display:flex;align-items:center;justify-content:center;font-size:84px;line-height:1}
#popArt canvas{width:220px;height:130px}
#popArt.shake{animation:shk .12s 6 alternate}
@keyframes shk{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.08)}}
#popTitle{font:italic 900 28px/1.05 var(--f);-webkit-text-stroke:1px var(--ink);text-shadow:0 3px 0 var(--ink)}
#popText{font:700 14px/1.4 var(--f);color:#dff4ff}
#popText b{color:var(--gold)}
.card{width:min(94vw,440px);max-height:94vh;overflow:auto;background:linear-gradient(180deg,#1768ac,#0a2c5c);border:3px solid #8adcff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:cardIn .3s ease-out}
.card.wide{width:min(96vw,680px)}
@keyframes cardIn{from{transform:translateY(30px) scale(.95);opacity:0}}
h2{font:italic 900 26px/1 var(--f);text-align:center;text-shadow:0 3px 0 var(--ink);display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
h2 small{font-style:normal;font-size:14px}
h2 small:not(.cur){font:800 13px/1 var(--f);color:#9adcff}
.hint2{font:700 13px/1.35 var(--f);color:#bfe4ff;text-align:center}
.hint2 b{color:var(--gold)}
.secT{font:900 12px/1 var(--f);letter-spacing:2px;color:#9adcff;margin-top:4px}
.closeBtn{align-self:center}
.tabs{display:flex;gap:6px;justify-content:center}
.tabs.scroll{overflow-x:auto;justify-content:flex-start;padding-bottom:4px;scrollbar-width:none}
.tabs button{flex:0 0 auto;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.25);font:900 12px/1 var(--f);letter-spacing:1px;position:relative}
.tabs button.on{background:#fff;color:var(--ink)}
.tabs button.mast::after{content:'★';color:var(--gold);margin-left:4px}
#dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.dx{background:rgba(0,0,0,.22);border:2px solid transparent;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.dx canvas{width:90px;height:52px}
.dx b{font:800 11px/1.15 var(--f);min-height:26px;display:flex;align-items:center;text-align:center}
.dx span{font:800 10px/1 var(--f)}
.dx .sh{color:var(--gold)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px;border:2px solid transparent}
.item.sel{border-color:var(--gold)}
.item.done{border-color:#6aff8a;background:rgba(60,200,100,.2)}
.item .ic{font-size:26px;width:36px;text-align:center;flex:0 0 36px}
.item canvas{flex:0 0 80px;width:80px;height:34px}
.item .it{flex:1;min-width:0}
.item b{font:900 15px/1.1 var(--f)}
.item span{display:block;font:700 12px/1.3 var(--f);color:#bfe4ff;margin-top:3px}
.item .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:5px;overflow:hidden}
.item .bar i{display:block;height:100%;background:linear-gradient(90deg,#6aff8a,#ffe66a)}
.item .btn{padding:10px 12px;font-size:13px;min-width:92px}
.pips{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.pips i{width:8px;height:5px;border-radius:2px;background:rgba(255,255,255,.18)}
.pips i.on{background:var(--gold)}
.stars{color:var(--gold);letter-spacing:2px;font-size:13px}
.stars i{color:rgba(255,255,255,.2);font-style:normal}
.setRow{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.2);border-radius:12px;padding:12px 14px;font:800 15px/1 var(--f)}
.setRow input{display:none}
.sw{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative;transition:.2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.setRow input:checked+.sw{background:#2ab8e0}
.setRow input:checked+.sw::after{left:23px}
.seg{display:flex;gap:4px}
.seg button{padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.15);font:900 12px/1 var(--f)}
.seg button.on{background:#fff;color:var(--ink)}
#boot{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#48c8f0,#0a2c5c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
.bootLogo{font:italic 900 42px/1 var(--f);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink)}
.bootBar{width:200px;height:10px;border-radius:5px;background:rgba(6,26,58,.4);overflow:hidden}
.bootBar i{display:block;height:100%;width:30%;background:var(--gold);animation:boot 1s ease-in-out infinite alternate}
@keyframes boot{to{width:100%}}
@media (max-width:520px){#depth{font-size:24px}#hL{min-width:90px}#lineBar{width:90px}#catchTxt{font-size:15px;padding:6px 10px}.cur{font-size:14px;padding:5px 8px 5px 26px}#tCoinsWon{font-size:38px}.fc{width:66px}.fc canvas{width:56px;height:34px}#dexGrid{grid-template-columns:repeat(3,1fr)}.dx canvas{width:76px;height:44px}}
@media (max-height:500px){#title{padding-top:48px}#logo{font-size:58px}.sheet{max-height:98vh;gap:5px;padding-top:8px}#tCoinsWon{font-size:32px}#tFish{max-height:110px}}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="hL"><div id="depth">0 m</div><div id="zoneTxt">Sunlit Shallows</div><div id="lineBar"><i></i></div></div>
  <div id="hC"><div id="catchTxt">🐟 0 / 4</div><div id="frenzy" class="hidden">FRENZY!</div><div id="shieldTxt"></div></div>
  <div id="hR"><div id="coins" class="cur">0</div><button id="pauseBtn" class="icoBtn" aria-label="Pause">❚❚</button></div>
</div>
<div id="zoneBanner" class="hidden"></div>
<div id="hint" class="hidden"></div>
<div id="toasts"></div>

<!-- ============ REEL ============ -->
<div id="reel" class="hidden">
  <div class="reelT">REEL IT IN!</div>
  <div id="reelName"></div>
  <div id="reelBar"><i></i></div>
  <div class="reelTap">TAP! TAP! TAP!</div>
  <div id="reelTime"></div>
</div>

<!-- ============ TITLE ============ -->
<div id="title">
  <div id="topBar"><div class="cur" id="tCoins">0</div><div class="cur gem" id="tGems">0</div><div id="tLvl"></div></div>
  <h1 id="logo">ABYSS<span>HOOK</span></h1>
  <div class="tag">Drop the hook. Dodge the fish. <b>Reel up the deep.</b></div>
  <div class="tapGo">TAP TO CAST</div>
  <button id="baitChip" class="chip">🪱 No bait</button>
  <div id="tInfo"></div>
  <div class="tBtns">
    <button id="tDex" class="btn"><span>📖</span>FISHDEX</button>
    <button id="tShop" class="btn"><span>🛒</span>SHOP</button>
    <button id="tQuest" class="btn"><span>🎯</span>QUESTS<i class="badge hidden" id="qBadge">!</i></button>
    <button id="tSet" class="btn"><span>⚙</span>SETTINGS</button>
  </div>
</div>

<!-- ============ TALLY ============ -->
<div id="tally" class="sheet hidden">
  <div id="tTitle">DIVE COMPLETE</div>
  <div id="tDepth"></div>
  <div id="tCoinsWon">+0</div>
  <div id="tFish"></div>
  <div id="xpRow"><b id="xpLvl">LV 1</b><div id="xpBar"><i></i></div><span id="xpTxt"></span></div>
  <div id="tQuests" class="qmini"></div>
  <div id="upRow"></div>
  <div class="rBtns">
    <button id="tHome" class="btn ghost">⌂</button>
    <button id="tShop2" class="btn">🛒</button>
    <button id="tAgain" class="btn primary big">CAST AGAIN ▶</button>
  </div>
</div>

<!-- ============ POPUP (level up, new fish, chest, achievement, daily, welcome back) ============ -->
<div id="pop" class="screen hidden">
  <div class="popCard">

<script>
'use strict';
/* =====================================================================
   CrazyGames SDK v3 wrapper.
   - Documented order: SDK.init() -> loadingStart() -> (load) -> loadingStop()
   - gameplayStart/Stop are de-duplicated so the portal never sees two
     starts (or two stops) in a row.
   - Every call is wrapped: off-portal (localhost, itch, file://) the game
     runs identically with the SDK absent.
   - ADS_ENABLED stays false during Basic Launch: CrazyGames does not allow
     ads in Basic Launch, so no ad API is touched at all while it's false.
     Flip it to true once the dashboard shows Full Implementation.
   ===================================================================== */
const ADS_ENABLED = false;

const SDK = {
  cg: null, env: 'none', playing: false, lastAd: 0, adBusy: false,
  onMute: null,

  async init(){
    await new Promise(res => {
      let done = false; const fin = () => { if(!done){ done = true; res(); } };
      try{
        const s = document.createElement('script');
        s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
        s.onload = fin; s.onerror = fin;
        document.head.appendChild(s);
      }catch(e){ fin(); }
      setTimeout(fin, 4000);
    });
    try{
      const sdk = window.CrazyGames && window.CrazyGames.SDK;
      if(!sdk) return;
      await Promise.race([sdk.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('sdk timeout')), 5000))]);
      this.env = sdk.environment || 'crazygames';
      if(this.env === 'disabled') return;   // not on a CrazyGames domain
      this.cg = sdk;
      try{
        this.applySettings(sdk.game.settings);
        sdk.game.addSettingsChangeListener(s => this.applySettings(s));
      }catch(e){}
    }catch(e){ this.cg = null; }
  },
  applySettings(s){
    if(!s) return;
    if(this.onMute) this.onMute(!!s.muteAudio);
  },
  data(){ try{ return this.cg && this.cg.data ? this.cg.data : null; }catch(e){ return null; } },

  loadingStart(){ try{ this.cg && this.cg.game.loadingStart(); }catch(e){} },
  loadingStop(){ try{ this.cg && this.cg.game.loadingStop(); }catch(e){} },
  gameplayStart(){ if(this.playing) return; this.playing = true; try{ this.cg && this.cg.game.gameplayStart(); }catch(e){} },
  gameplayStop(){ if(!this.playing) return; this.playing = false; try{ this.cg && this.cg.game.gameplayStop(); }catch(e){} },
  happytime(){ try{ this.cg && this.cg.game.happytime(); }catch(e){} },

  canRewarded(){ return ADS_ENABLED && !!this.cg && !this.adBusy; },

  /* rewarded ad: cb(true) only when the ad finished */
  rewarded(cb){
    if(!this.canRewarded()){ cb(false); return; }
    this._ad('rewarded', cb);
  },
  /* midgame ad at natural breaks, self-limited to one per 3 minutes */
  midgame(cb){
    if(!ADS_ENABLED || !this.cg || this.adBusy || Date.now() - this.lastAd < 180000){ cb(); return; }
    this._ad('midgame', () => cb());
  },
  _ad(type, cb){
    this.adBusy = true; this.gameplayStop();
    let fin = false;
    const end = ok => { if(fin) return; fin = true; this.adBusy = false; this.lastAd = Date.now(); AU.adMute(false); cb(ok); };
    try{
      this.cg.ad.requestAd(type, {
        adStarted: () => AU.adMute(true),
        adFinished: () => end(true),
        adError: () => end(false)
      });
    }catch(e){ end(false); }
  }
};

</script>

<script>
'use strict';
/* =====================================================================
   ABYSS HOOK simulation (world units are metres; y grows downward).
   DOWN: the hook sinks; steer to dodge fish. A bite (or a jellyfish)
         ends the descent early. Reaching the end of the line turns it.
   UP:   every fish the hook touches is caught, until the hooks are full.
   REEL: a legendary on the line has to be reeled in by tapping.
   AIR:  the catch flies out of the water; tap fish to double them.
   ===================================================================== */
const G = {
  state:'title', t:0, rt:0, WW:20, depth:0, hx:10, tx:10, speed:12, maxD:40, deepest:0,
  fish:[], jelly:[], items:[], caught:[], air:[], parts:[], pops:[], rings:[], bubbles:[],
  cap:4, shield:0, genD:0, frenzyT:0, hookTimes:[], legendZones:{}, bait:'', sinkT:0,
  reel:null, runStats:null, result:null, shake:0, flash:0, cam:0, zone:0, snaps:0, combo:0,
};

/* ---------------- dive setup ---------------- */
const rod = () => rodById(save.rod);
function diveStats(){
  const r = rod(), b = G.bait;
  return {
    maxD:lineDepth(save.up.line), cap:hookCap(save.up.hooks) + r.cap,
    R:(catchR(save.up.magnet) + r.mag) * (b === 'wide' ? 2 : 1),
    shield:save.up.shield + r.shield,
    luck:(1 + save.up.luck * .1 + r.luck) * (b === 'glow' ? 3 : 1),
    val:(1 + save.up.value * .12) * r.val * masteryMul() * (b === 'golden' ? 2 : 1),
  };
}
function startDive(){
  const bait = save.equip && save.bait[save.equip] > 0 ? save.equip : '';
  if(bait){ save.bait[bait]--; if(save.bait[bait] <= 0) save.equip = ''; }
  G.bait = bait;
  const S = diveStats();
  Object.assign(G, { state:'down', t:0, depth:0, maxD:S.maxD, cap:S.cap, shield:S.shield, S, fish:[], jelly:[], items:[], caught:[], air:[], parts:[], pops:[], rings:[], genD:4, frenzyT:0, hookTimes:[], legendZones:{}, reel:null, result:null, deepest:0, snaps:0, combo:0, sinkT:bait === 'sinker' ? 1 : 0 });
  G.hx = G.tx = G.WW / 2;
  G.speed = Math.min(24, 10 + G.maxD * .014);
  G.runStats = { chests:[], frenzies:0, stung:0, bites:0 };
  generate(Math.min(G.maxD + 10, 60));
  save.stats.dives++;
  AU.splash(1); splashFx(G.hx, 0, 24);
  persist();
}

/* ---------------- world generation ---------------- */
function pickSpecies(z, luck){
  const list = zoneSpecies(z); let s = 0;
  const w = list.map(sp => { const v = RAR[sp.r].w * (sp.r === 'C' ? 1 : luck); s += v; return v; });
  let r = Math.random() * s; for(let i = 0; i < list.length; i++){ r -= w[i]; if(r <= 0) return list[i]; } return list[0];
}
function mkFish(sp, y){
  const dir = Math.random() < .5 ? -1 : 1, shinyP = 1 / 160 * (G.bait === 'glow' ? 3 : 1) * (1 + save.up.luck * .03);
  G.fish.push({ sp, x:rnd(-1, G.WW + 1), y, dir, v:sp.spd * rnd(.75, 1.25), ph:rnd(0, TAU), shiny:Math.random() < shinyP, hooked:false, gone:false, r:Math.min(1.8, sp.dl * .27), bumped:0 });
}
function generate(to){
  while(G.genD < to){
    const z = zoneAt(G.genD), Z = ZONES[z], per = Z.dens * G.WW / 20;
    G.genD += rnd(.6, 1.4) / per;
    mkFish(pickSpecies(z, G.S.luck), G.genD);
    if(z >= 1 && Math.random() < .06 + z * .01) G.jelly.push({ x:rnd(1, G.WW - 1), y:G.genD + rnd(-1, 1), vx:rnd(-.5, .5), ph:rnd(0, TAU), r:.55, gone:false });
    if(Math.random() < .018) G.items.push({ k:'chest', x:rnd(1.5, G.WW - 1.5), y:G.genD, tier:Math.random() < .08 + z * .02 ? 2 : Math.random() < .3 ? 1 : 0, got:false });
    if(Math.random() < .12){ const x0 = rnd(2, G.WW - 2); for(let i = 0; i < 5; i++) G.items.push({ k:'pearl', x:x0 + Math.sin(i) * .8, y:G.genD + i * .8, got:false }); }

  }
}

/* ---------------- effects ---------------- */
function pop(txt, x, y, c, s, d){ for(const q of G.pops) if(q.t < .5 && Math.abs(q.y - y) < 1 && Math.abs(q.x - x) < 5) y = q.y - 1.1; G.pops.push({ txt, x, y, c, s:s || 18, t:0, d:d || 1 }); if(G.pops.length > 30) G.pops.shift(); }
function burst(x, y, n, cols, sp){ const lim = save.opt.fx === 'low' ? 150 : 400; for(let i = 0; i < n && G.parts.length < lim; i++){ const a = rnd(0, TAU), s = rnd(.3, 1) * (sp || 6); G.parts.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, g:0, l:rnd(.4, .9), c:pick(cols), s:rnd(.06, .16) }); } }
function splashFx(x, y, n){ for(let i = 0; i < n; i++){ const a = -Math.PI / 2 + rnd(-.9, .9), s = rnd(4, 11); G.parts.push({ x:x + rnd(-.5, .5), y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, g:22, l:rnd(.5, 1), c:pick(['#ffffff', '#cfefff', '#9adcff']), s:rnd(.08, .2) }); } }

/* ---------------- value ---------------- */

}
function closeScreens(){
  const toPause = !$('settings').classList.contains('hidden') && $('settings').dataset.back === 'pause';
  SCREENS.forEach(hide);
  if(toPause) show('pause');
  else if(G.state === 'tally'){ show('tally'); buildUpRow(); }
  else if(G.state === 'title') refreshTitle();
}
function cycleBait(){
  const owned = BAITS.filter(b => save.bait[b.id] > 0);
  if(!owned.length){ shopTab = 'bait'; openShop(); return; }
  const i = owned.findIndex(b => b.id === save.equip);
  save.equip = i < 0 ? owned[0].id : i + 1 < owned.length ? owned[i + 1].id : '';
  persist(); refreshTitle();
}

/* ---------------- daily reward and welcome back ---------------- */
function bootRewards(){
  const Q = [];
  // offline aquarium income
  if(save.lastSeen && aquariumRate() > 0){
    const mins = Math.min(480, (Date.now() - save.lastSeen) / 60000);
    const earned = Math.round(aquariumRate() * mins);
    if(mins >= 2 && earned > 0){ save.coins += earned; Q.push({ tag:'WELCOME BACK!', art:'🐠', title:'+' + fmt(earned) + ' coins', text:`Your aquarium kept earning for <b>${mins >= 60 ? (mins / 60).toFixed(1) + ' hours' : Math.round(mins) + ' minutes'}</b>.<br>Catch new species to earn more!`, snd:'claim' }); }
  }
  // daily streak
  const t = today();
  if(save.daily.last !== t){
    save.daily.streak = save.daily.last === yesterday() ? save.daily.streak % 7 + 1 : 1;
    save.daily.last = t;
    const D = DAILY[save.daily.streak - 1], rw = D.t === 'coins' ? { t:'coins', n:Math.round(D.n * (1 + save.lvl * .25)) } : D.t === 'gems' ? { t:'gems', n:D.n } : { t:'bait', id:D.id, n:D.n };
    grant(rw);
    const days = DAILY.map((d, i) => i < save.daily.streak ? '🟡' : '⚪').join(' ');
    Q.push({ tag:'DAILY REWARD · DAY ' + save.daily.streak, art:save.daily.streak === 7 ? '👑' : '🎁', title:rw.t === 'bait' ? rw.n + '× ' + BAITS.find(b => b.id === rw.id).name : '+' + fmt(rw.n) + (rw.t === 'coins' ? ' coins' : ' gems'), text:days + '<br>Come back tomorrow for day ' + (save.daily.streak % 7 + 1) + '!', snd:'claim' });
  }
  persist();
  if(Q.length){ popQueue = Q; setTimeout(nextPop, 600); }
}

/* ---------------- input ---------------- */
function anyScreen(){ return SCREENS.some(id => !$(id).classList.contains('hidden')) || !$('pop').classList.contains('hidden') || !$('tally').classList.contains('hidden'); }
function wire(){
  const pointer = e => { const [wx] = toWorld(e.clientX, e.clientY); G.tx = clamp(wx, .4, G.WW - .4); };
  const down = e => {
    AU.init(); AU.resume();
    if(e.target.closest && e.target.closest('button')) return;
    if(anyScreen()) return;
    if(G.state === 'title'){ cast(); pointer(e); return; }
    if(G.state === 'reel'){ reelTap(); return; }
    if(G.state === 'air'){ const [wx, wy] = toWorld(e.clientX, e.clientY); snapAt(wx, wy); return; }
    pointer(e);
  };
  $('cv').addEventListener('pointerdown', down);
  $('title').addEventListener('pointerdown', down);
  addEventListener('pointermove', e => { if(G.state === 'down' || G.state === 'up') pointer(e); });
  const keys = {};
  addEventListener('keydown', e => {
    AU.init(); AU.resume(); keys[e.key] = true;
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if(!$('pop').classList.contains('hidden')) popAct(); else if(G.state === 'title' && !anyScreen()) cast(); else if(G.state === 'tally' && !SCREENS.some(id => !$(id).classList.contains('hidden'))) cast(); else if(G.state === 'reel') reelTap(); else if(G.state === 'air'){ const a = G.air.find(a => !a.done && a.wait <= 0 && !a.c.snapped); if(a) snapAt(a.x, a.y); } }
    if(e.key === 'Escape' || e.key === 'p' || e.key === 'P'){ if(G.state === 'down' || G.state === 'up') pauseGame(); else if(G.state === 'pause') resumeGame(); }
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  window.keyTick = dt => { const l = keys.ArrowLeft || keys.a || keys.A, r = keys.ArrowRight || keys.d || keys.D; if(l) G.tx = Math.max(.4, G.tx - 16 * dt); if(r) G.tx = Math.min(G.WW - .4, G.tx + 16 * dt); };
  onTap('pauseBtn', pauseGame); onTap('pResume', resumeGame); onTap('pSet', openSettings);
  onTap('tDex', openDex); onTap('tShop', () => { shopTab = 'up'; openShop(); }); onTap('tQuest', openQuests); onTap('tSet', openSettings); onTap('baitChip', cycleBait);
  onTap('tAgain', cast); onTap('tHome', toTitle); onTap('tShop2', () => { hide('tally'); shopTab = 'up'; openShop(); });
  onTap('popOk', () => popAct());
  document.querySelectorAll('.closeBtn').forEach(b => onTap(b, closeScreens));
  document.querySelectorAll('#shop .tabs button').forEach(b => onTap(b, () => { shopTab = b.dataset.tab; openShop(); }));
  document.querySelectorAll('#settings input[data-opt]').forEach(i => i.addEventListener('change', () => { save.opt[i.dataset.opt] = i.checked; AU.apply(); persist(); }));
  document.querySelectorAll('#settings .seg button').forEach(b => onTap(b, () => { save.opt[b.parentElement.dataset.opt] = b.dataset.v; resize(); persist(); openSettings(); }));
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { AU.setHidden(document.hidden); if(document.hidden){ writeSave(); pauseGame(); } else AU.resume(); });
  SDK.onMute = m => AU.setPortalMute(m);
  setInterval(() => { if(G.state === 'title' || G.state === 'tally') writeSave(); }, 30000);
}

/* ---------------- loop ---------------- */
let last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt = last ? (ts - last) / 1000 : 1 / 60; last = ts;
  if(dt <= 0) return; if(dt > .05) dt = .05;
  try{
    if(G.state !== 'pause'){ keyTick(dt); update(dt); } else G.rt += dt;
    if(G.state === 'reel') updateReel();
    phaseHints();
    AU.depthFilter(G.depth);
    render(); updateHUD();
  }catch(err){ console.error(err); }
}
addEventListener('error', e => { try{ console.error(e.error || e.message); }catch(_){} });

/* ---------------- boot ---------------- */
(async () => {
  resize();
  await SDK.init();
  SDK.loadingStart();
  loadSave();
  for(const s of SPECIES){ fishSprite(s, false); }
  wire();
  toTitle();
  requestAnimationFrame(frame);
  SDK.loadingStop();
  const b = $('boot'); b.style.opacity = '0'; setTimeout(() => b.remove(), 450);
  bootRewards();
})();

</script>
</body>
