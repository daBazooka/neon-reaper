<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e88c8">
<meta name="description" content="ABYSS HOOK: drop your hook, dodge the fish on the way down, and catch everything on the way up. How deep will you go?">
<title>ABYSS HOOK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230a2c5c%22/%3E%3Cpath d=%22M9 2v8a2.5 2.5 0 1 1-5 0%22 fill=%22none%22 stroke=%22%23ffd23a%22 stroke-width=%221.8%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="hL"><div id="depth">0 m</div><div id="zoneTxt">Sunlit Shallows</div><div id="lineBar"><i></i></div></div>
  <div id="hC"><div id="catchTxt">🐟 0 / 4</div><div id="frenzy" class="hidden">FRENZY!</div><div id="shieldTxt"></div></div>
  <div id="hR"><div id="coins" class="cur">0</div><button id="pauseBtn" class="icoBtn" aria-label="Pause">❚❚</button></div>
</div>
<div id="zoneBanner" class="hidden"></div>
<div id="hint" class="hidden"></div>
<div id="toasts"></div>

<!-- ============ REEL ============ -->
<div id="reel" class="hidden">
  <div class="reelT">REEL IT IN!</div>
  <div id="reelName"></div>
  <div id="reelBar"><i></i></div>
  <div class="reelTap">TAP! TAP! TAP!</div>
  <div id="reelTime"></div>
</div>

<!-- ============ TITLE ============ -->
<div id="title">
  <div id="topBar"><div class="cur" id="tCoins">0</div><div class="cur gem" id="tGems">0</div><div id="tLvl"></div></div>
  <h1 id="logo">ABYSS<span>HOOK</span></h1>
  <div class="tag">Drop the hook. Dodge the fish. <b>Reel up the deep.</b></div>
  <div class="tapGo">TAP TO CAST</div>
  <button id="baitChip" class="chip">🪱 No bait</button>
  <div id="tInfo"></div>
  <div class="tBtns">
    <button id="tDex" class="btn"><span>📖</span>FISHDEX</button>
    <button id="tShop" class="btn"><span>🛒</span>SHOP</button>
    <button id="tQuest" class="btn"><span>🎯</span>QUESTS<i class="badge hidden" id="qBadge">!</i></button>
    <button id="tSet" class="btn"><span>⚙</span>SETTINGS</button>
  </div>
</div>

<!-- ============ TALLY ============ -->
<div id="tally" class="sheet hidden">
  <div id="tTitle">DIVE COMPLETE</div>
  <div id="tDepth"></div>
  <div id="tCoinsWon">+0</div>
  <div id="tFish"></div>
  <div id="xpRow"><b id="xpLvl">LV 1</b><div id="xpBar"><i></i></div><span id="xpTxt"></span></div>
  <div id="tQuests" class="qmini"></div>
  <div id="upRow"></div>
  <div class="rBtns">
    <button id="tHome" class="btn ghost">⌂</button>
    <button id="tShop2" class="btn">🛒</button>
    <button id="tAgain" class="btn primary big">CAST AGAIN ▶</button>
  </div>
</div>

<!-- ============ POPUP (level up, new fish, chest, achievement, daily, welcome back) ============ -->
<div id="pop" class="screen hidden">
  <div class="popCard">
    <div id="popTag"></div>
    <div id="popArt"></div>
    <div id="popTitle"></div>
    <div id="popText"></div>
    <button id="popOk" class="btn primary big">NICE!</button>
  </div>
</div>

<!-- ============ SCREENS ============ -->
<div id="dex" class="screen hidden"><div class="card wide">
  <h2>FISHDEX <small id="dexN"></small></h2>
  <div id="aqua" class="hint2"></div>
  <div id="dexTabs" class="tabs scroll"></div>
  <div id="dexZone" class="hint2"></div>
  <div id="dexGrid"></div>
  <button class="btn ghost closeBtn">BACK</button>
</div></div>
<div id="shop" class="screen hidden"><div class="card wide">
  <h2>SHOP <small class="cur" id="sCoins"></small><small class="cur gem" id="sGems"></small></h2>
  <div class="tabs"><button data-tab="up" class="on">UPGRADES</button><button data-tab="rods">RODS</button><button data-tab="bait">BAIT</button></div>
  <div id="shopList" class="list"></div>
  <button class="btn ghost closeBtn">BACK</button>
</div></div>
<div id="quests" class="screen hidden"><div class="card wide">
  <h2>QUESTS</h2>
  <div id="qList" class="list"></div>
  <div class="secT">ACHIEVEMENTS</div>
  <div id="aList" class="list"></div>
  <button class="btn ghost closeBtn">BACK</button>
</div></div>
<div id="pause" class="screen hidden"><div class="card"><h2>PAUSED</h2><button id="pResume" class="btn primary big">▶ RESUME</button><button id="pSet" class="btn wide">SETTINGS</button></div></div>
<div id="settings" class="screen hidden"><div class="card"><h2>SETTINGS</h2>
  <div class="list">
    <label class="setRow"><span>Sound effects</span><input type="checkbox" data-opt="sfx"><i class="sw"></i></label>
    <label class="setRow"><span>Music</span><input type="checkbox" data-opt="music"><i class="sw"></i></label>
    <div class="setRow"><span>Effects</span><div class="seg" data-opt="fx"><button data-v="low">LOW</button><button data-v="high">HIGH</button></div></div>
  </div>
  <button class="btn ghost closeBtn">BACK</button></div></div>

<div id="boot"><div class="bootLogo">ABYSS HOOK</div><div class="bootBar"><i></i></div></div>

<script src="js/sdk.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
