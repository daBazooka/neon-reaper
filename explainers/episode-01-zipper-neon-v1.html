<script>
(()=>{
/* ============================== setup ============================== */
const W=1080,H=1920,CY0=930;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const BPM=110,BEAT=60/BPM,BAR=BEAT*4,STEP=BEAT/4,WS=BEAT/2,NBARS=18,LOOP=BAR*NBARS;
const B=(bar,beat=0)=>bar*BAR+beat*BEAT;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeBack=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const inS=(t,a,b)=>t>=a&&t<b;
function kf(t,keys){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){
    if(t<=keys[i][0]){const[t0,v0]=keys[i-1],[t1,v1]=keys[i];return t1-t0<1e-4?v1:lerp(v0,v1,easeIO((t-t0)/(t1-t0)));}
  }
  return keys[keys.length-1][1];
}
const rrp=(g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
const CYAN='#29f3ff',MAG='#ff2fd0',GOLD='#ffe14a',RED='#ff4b5c',GREEN='#5dff9a';

/* ============================== timeline ============================== */
const SLIDER=[[0,300],[B(0,2),-300],[B(1,0),300],[B(1,2),-300],[B(1,3.5),-520],[B(4,2),-520],[B(5,1),300],[B(5,3),300],
  [B(7,0),-300],[B(8,0.5),-300],[B(8,3.5),300],[B(9,0),300],[B(9,2),-700],[B(11,3.5),-700],[B(11,3.5)+.02,900],
  [B(12,0),900],[B(12,3),-400],[B(13,2),400],[B(14,0),-500],[B(14,3),-500],[B(15,1),300],[B(16,0),-300],[B(16,3),300],
  [B(17,2),-300],[B(18,0),300]];
const ZOOM=[[0,1.15],[B(1,3),1.35],[B(2,0),1.5],[B(2,3),5],[B(4,1),5],[B(5,1),2.4],[B(7,0),2.4],[B(7,2),3.8],[B(8,1),3.8],
  [B(8,3),2.4],[B(9,0),2.4],[B(9,2),6.5],[B(11,3),6.8],[B(12,1),1.1],[B(14,0),1.1],[B(14,1),3.2],[B(14,3.5),3.2],[B(15,0),1.15],[B(18,0),1.15]];
const CYB=[[0,0],[B(2,0),0],[B(2,3),160],[B(4,2),220],[B(8,3),120],[B(9,2),80],[B(11,3),80],[B(12,1),0],[B(14,0),0],
  [B(14,1),300],[B(14,3.5),300],[B(15,0),0],[B(18,0),0]];
const FOLLOW=[[0,0],[B(4,2),0],[B(5,1),1],[B(8,3),1],[B(9,2),0],[B(18,0),0]];
const HUE=[[0,300],[B(2,0),185],[B(5,0),48],[B(9,0),350],[B(12,0),150],[B(15,0),280],[B(18,0),300]];
const SCENES=[0,B(2),B(5),B(9),B(12),B(15),LOOP];

const CAP=[
 {w:["YOU'VE ZIPPED","THIS THING","10,000 TIMES"],t0:B(0,1),t1:3.2,y:440,size:112,col:['#fff','#fff',CYAN]},
 {w:["BUT HOW","DOES IT","REALLY WORK?"],t0:B(1,2),t1:B(2,0)-.05,y:440,size:112,col:['#fff','#fff',GOLD]},
 {w:["ZOOM IN"],t0:B(2,0.5),t1:B(3,0),y:440,size:190,col:[CYAN]},
 {w:["TWO ROWS","OF TINY","HOOKS"],t0:B(3,0),t1:B(4,0),y:440,size:112,col:[CYAN,'#fff',MAG]},
 {w:["EACH ONE","OFFSET BY","HALF A STEP"],t0:B(4,0),t1:B(5,0)-.05,y:440,size:108,col:['#fff','#fff',GOLD]},
 {w:["NOW THE","SLIDER"],t0:B(5,0),t1:B(6,0),y:440,size:150,col:['#fff',GOLD]},
 {w:["IT'S A","Y-SHAPED","FUNNEL"],t0:B(6,0),t1:B(7,0),y:440,size:112,col:['#fff',GOLD,'#fff']},
 {w:["A WEDGE","SQUEEZES","THE TEETH","TOGETHER"],t0:B(7,0),t1:B(8,0),y:440,size:92,col:[GOLD,'#fff','#fff',CYAN]},
 {w:["REVERSE IT?","THE WEDGE","PRIES THEM","APART"],t0:B(8,0),t1:B(9,0)-.05,y:440,size:92,col:['#fff',GOLD,'#fff',MAG]},
 {w:["WHY DON'T","THEY JUST","PULL APART?"],t0:B(9,0.5),t1:B(10,0),y:440,size:112,col:['#fff','#fff',RED]},
 {w:["EACH BULB IS","TRAPPED BY","TWO NEIGHBORS"],t0:B(10,0),t1:B(11,0),y:440,size:104,col:['#fff',RED,'#fff']},
 {w:["SIDEWAYS PULL","JUST JAMS IT"],t0:B(11,0),t1:B(12,0)-.05,y:440,size:120,col:['#fff',RED]},
 {w:["THE SLIDER","IS A WEDGE"],t0:B(12,0.5),t1:B(13,0),y:440,size:128,col:['#fff',GOLD]},
 {w:["TINY TUG","HUGE GRIP"],t0:B(13,0),t1:B(14,0),y:440,size:150,col:['#fff',GREEN]},
 {w:["STUCK ZIPPER?","RUB A PENCIL","ON THE TEETH"],t0:B(14,0),t1:B(15,0)-.05,y:440,size:104,col:[GOLD,'#fff',GREEN]},
 {w:["HOOKS."],t0:B(15,0),t1:B(15,2),y:930,size:300,col:[CYAN]},
 {w:["WEDGE."],t0:B(15,2),t1:B(16,0),y:930,size:300,col:[GOLD]},
 {w:["LOCK."],t0:B(16,0),t1:B(16,2),y:930,size:300,col:[MAG]},
 {w:["WATCH AGAIN","AND SPOT","THE WEDGE"],t0:B(16,2),t1:B(18,0)-.05,y:440,size:112,col:['#fff','#fff',GOLD]},
];
CAP.forEach(c=>c._n=0);
const HITS=[[0,12],[B(2),14],[B(5),14],[B(9),14],[B(12),14],[B(15),14],[B(15,2),10],[B(16),10],[B(16,2),8],
  [B(11),6],[B(11,1),6],[B(11,2),6],[B(11,3),6],[B(13),8]];

/* ============================== audio ============================== */
const A={ctx:null,on:false,start:0,idx:0,muted:false};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(off){
  const C=off||new(window.AudioContext||window.webkitAudioContext)();A.ctx=C;
  const comp=C.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.2;
  const master=C.createGain();master.gain.value=.9;A.master=master;master.connect(comp);comp.connect(C.destination);
  const len=C.sampleRate*1.8,ir=C.createBuffer(2,len,C.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  const conv=C.createConvolver();conv.buffer=ir;A.rv=C.createGain();A.rv.gain.value=.5;A.rv.connect(conv);
  const rvOut=C.createGain();rvOut.gain.value=.5;conv.connect(rvOut);rvOut.connect(master);
  const nb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
  A.duck=C.createGain();A.duck.connect(master);A.duck.connect(A.rv);
  A.start=off?0:C.currentTime+.12;A.idx=0;A.on=true;
  if(!off){setInterval(schedule,25);schedule();}
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function nsrc(t,dur){const s=A.ctx.createBufferSource();s.buffer=A.noise;s.loop=true;s.start(t,Math.random()*1.5);s.stop(t+dur);return s;}
function osc(type,f,t,dur){const o=A.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;}
function kick(t,v=.95){const C=A.ctx,o=osc('sine',150,t,.4),g=C.createGain();o.frequency.exponentialRampToValueAtTime(42,t+.13);env(g,t,.002,v,.32);o.connect(g);g.connect(A.master);}
function clap(t,v=.28){const C=A.ctx;for(let i=0;i<3;i++){const tt=t+i*.012,s=nsrc(tt,.15),f=C.createBiquadFilter(),g=C.createGain();f.type='bandpass';f.frequency.value=1700;f.Q.value=.9;env(g,tt,.001,v,i<2?.02:.16);s.connect(f);f.connect(g);g.connect(A.master);g.connect(A.rv);}}
function hat(t,v=.07,d=.04){const C=A.ctx,s=nsrc(t,d+.02),f=C.createBiquadFilter(),g=C.createGain();f.type='highpass';f.frequency.value=7500;env(g,t,.001,v,d);s.connect(f);f.connect(g);g.connect(A.master);}
function bass(t,m,d=.24){const C=A.ctx,f=C.createBiquadFilter(),g=C.createGain();f.type='lowpass';f.frequency.setValueAtTime(700,t);f.frequency.exponentialRampToValueAtTime(140,t+d);
  [['sawtooth',0],['square',-12]].forEach(([ty,off])=>{const o=osc(ty,mtof(m+off),t,d+.05);const og=C.createGain();og.gain.value=ty==='sawtooth'?.5:.7;o.connect(og);og.connect(f);});
  env(g,t,.005,.33,d);f.connect(g);g.connect(A.master);}
function pluck(t,m,v=.1){const C=A.ctx,f=C.createBiquadFilter(),g=C.createGain();f.type='lowpass';f.frequency.setValueAtTime(3800,t);f.frequency.exponentialRampToValueAtTime(500,t+.22);
  [-7,7].forEach(dt=>{const o=osc('sawtooth',mtof(m),t,.3);o.detune.value=dt;o.connect(f);});
  env(g,t,.003,v,.24);f.connect(g);g.connect(A.master);g.connect(A.rv);}
function pad(t,chord,d){const C=A.ctx,f=C.createBiquadFilter(),g=C.createGain();f.type='lowpass';f.frequency.value=1100;
  chord.forEach(m=>{[-6,6].forEach(dt=>{const o=osc('sawtooth',mtof(m),t,d+.6);o.detune.value=dt;const og=C.createGain();og.gain.value=.05;o.connect(og);og.connect(f);});});
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(1,t+.5);g.gain.setValueAtTime(1,t+d-.1);g.gain.linearRampToValueAtTime(.0001,t+d+.5);
  f.connect(g);g.connect(A.duck);}
function riser(t,d){const C=A.ctx,s=nsrc(t,d),f=C.createBiquadFilter(),g=C.createGain();f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(9000,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.32,t+d);g.gain.linearRampToValueAtTime(.0001,t+d+.02);s.connect(f);f.connect(g);g.connect(A.master);g.connect(A.rv);}
function whoosh(t,d){const C=A.ctx,s=nsrc(t,d+.2),f=C.createBiquadFilter(),g=C.createGain();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(6000,t+d);
  env(g,t,d*.9,.3,d*.3);s.connect(f);f.connect(g);g.connect(A.master);g.connect(A.rv);}
function impact(t){const C=A.ctx,o=osc('sine',90,t,1),g=C.createGain();o.frequency.exponentialRampToValueAtTime(30,t+.7);env(g,t,.003,.9,.8);o.connect(g);g.connect(A.master);
  const s=nsrc(t,.5),f=C.createBiquadFilter(),g2=C.createGain();f.type='lowpass';f.frequency.value=3000;env(g2,t,.002,.35,.45);s.connect(f);f.connect(g2);g2.connect(A.master);g2.connect(A.rv);}
const sfx={
  pop(i,at){if(!A.on)return;const t=at??A.ctx.currentTime,o=osc('sine',700+i*90,t,.09),g=A.ctx.createGain();o.frequency.exponentialRampToValueAtTime(1500+i*90,t+.05);env(g,t,.002,.09,.07);o.connect(g);g.connect(A.master);},
  tick(up,at){if(!A.on)return;const C=A.ctx,t=at??C.currentTime,s=nsrc(t,.03),f=C.createBiquadFilter(),g=C.createGain();f.type='bandpass';f.frequency.value=up?4200:3300;f.Q.value=3;env(g,t,.001,.16,.018);s.connect(f);f.connect(g);g.connect(A.master);
    const o=osc('square',up?2100:1700,t,.02),g2=C.createGain();env(g2,t,.001,.02,.012);o.connect(g2);g2.connect(A.master);}
};
const CH=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]],ROOT=[33,29,36,31];
const BASSP=[1,0,0,1,0,0,1,0,1,0,0,1,0,1,0,0],ARP=[0,2,1,2,0,2,1,2,0,2,1,2,0,1,2,1];
function playStep(t,bar,s){
  const ci=bar%4,ch=CH[ci],drums=bar>=2;
  if(s===0){if([0,2,5,9,12,15].includes(bar))impact(t);pad(t,ch,BAR);}
  if(s===12&&[1,4,8,11,14,17].includes(bar))whoosh(t,BEAT);
  if(bar===17&&s===0)riser(t,BAR);
  const stop=bar===17&&s>=8;
  if(drums&&s%4===0&&!stop){kick(t);const d=A.duck.gain;d.cancelScheduledValues(t);d.setValueAtTime(.35,t);d.linearRampToValueAtTime(1,t+.28);}
  if(drums&&s%4===2&&!stop)hat(t,.07,.05);
  if(bar>=5&&s%2===1&&!stop)hat(t,.03,.02);
  if(bar>=5&&(s===4||s===12)&&bar!==17)clap(t);
  if(bar===17&&s>=8)clap(t,.1+(s-8)*.04);
  if(drums&&BASSP[s]&&!stop)bass(t,ROOT[ci]+(s%8>=6?12:0));
  const arpOn=bar<2?s%8===0:bar<5?s%2===0:true;
  if(arpOn&&bar!==17)pluck(t,ch[ARP[s]]+12+(s%8===7?12:0),bar<2?.07:bar<5?.09:.075);
}
function schedule(){
  if(!A.on)return;const C=A.ctx;
  while(A.start+A.idx*STEP<C.currentTime+.2){playStep(A.start+A.idx*STEP,Math.floor(A.idx/16)%NBARS,A.idx%16);A.idx++;}
}

/* ============================== sprites ============================== */
function makeTooth(hi,mid,lo,rim){
  const SS=6,c=document.createElement('canvas');c.width=128*SS;c.height=56*SS;const g=c.getContext('2d');g.scale(SS,SS);g.translate(98,28);
  let gr=g.createLinearGradient(0,-9,0,9);gr.addColorStop(0,hi);gr.addColorStop(.5,mid);gr.addColorStop(1,lo);
  g.fillStyle=gr;rrp(g,-98,-9,98,18,6);g.fill();g.strokeStyle=rim;g.lineWidth=1.2;g.stroke();
  const rg=g.createRadialGradient(-7,-8,2,0,0,24);rg.addColorStop(0,'#fff');rg.addColorStop(.25,hi);rg.addColorStop(.7,mid);rg.addColorStop(1,lo);
  g.fillStyle=rg;g.beginPath();g.arc(0,0,22,0,7);g.fill();g.strokeStyle=rim;g.lineWidth=2;g.stroke();
  g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;g.beginPath();g.arc(0,0,11,Math.PI*.15,Math.PI*.85);g.stroke();
  return c;
}
const TL=makeTooth('#c9fbff','#2fc7e6','#0b5a78','#bff'),TR=makeTooth('#ffd0f3','#ec3fc0','#7a0f66','#fbe');
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
{const g=vig.getContext('2d'),r=g.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.72);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.72)');g.fillStyle=r;g.fillRect(0,0,W,H);}
const grain=[0,1,2].map(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),d=g.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);return c;});

/* ============================== state ============================== */
let cam={z:1.15,cy:0},sy=300,prevSy=300,vel=0,prevT=0,tickCarry=0;
const parts=[];
const w2s=(x,y)=>[W/2+x*cam.z,CY0+(y-cam.cy)*cam.z];
const sideOf=k=>(k&1)?1:-1;
const shiftFrac=(y)=>easeIO(clamp((sy+40-y)/130));
function jamAt(t){if(t<B(11)||t>=B(12))return 0;const ph=((t-B(11))/BEAT)%1;return 2.6*(ph<.3?easeOut(ph/.3):1-easeIO((ph-.3)/.7));}

/* ============================== drawing ============================== */
function drawBG(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0620');g.addColorStop(.5,'#170a37');g.addColorStop(1,'#050310');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const hue=kf(t,HUE);
  let r=ctx.createRadialGradient(W/2,CY0,0,W/2,CY0,900);r.addColorStop(0,`hsla(${hue},100%,55%,.28)`);r.addColorStop(1,'hsla(0,0%,0%,0)');ctx.fillStyle=r;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle=`hsla(${hue+40},100%,65%,.14)`;ctx.lineWidth=2;
  const hz=1250,off=(t*90)%140;
  for(let i=0;i<14;i++){const y=hz+Math.pow((i*140+off)/1900,1.8)*900;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(W/2+i*30,hz);ctx.lineTo(W/2+i*220,H);ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<70;i++){const sd=i*97.13,sp=20+(sd%40),x=(sd*13.7)%W+Math.sin(t*.6+i)*20,y=((sd*7.3-t*sp*(1+Math.abs(vel)*.002))%H+H)%H,s=1.5+(i%4);
    ctx.fillStyle=`hsla(${hue+i*3},100%,70%,${.15+.25*((i*31)%10)/10})`;ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fill();}
  ctx.restore();
}

function drawTape(top,bot){
  for(const side of[-1,1]){
    const edge=y=>side*(72+90*shiftFrac(y));
    ctx.beginPath();ctx.moveTo(side*760,top);
    for(let y=top;y<=bot;y+=8)ctx.lineTo(edge(y),y);
    ctx.lineTo(side*760,bot);ctx.closePath();
    const g=ctx.createLinearGradient(side*72,0,side*500,0);g.addColorStop(0,side<0?'#12285a':'#3a1150');g.addColorStop(1,'#0b0d24');ctx.fillStyle=g;ctx.fill();
