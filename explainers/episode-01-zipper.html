<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CUTAWAY - EP01 How a Zipper Works</title>
<style>
@font-face{font-family:"Inter";src:url("assets/Inter.ttf");font-weight:100 900}
html,body{margin:0;height:100%;background:#05080c;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,sans-serif}
#stage{position:relative;height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16}
canvas{width:100%;height:100%;display:block}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
  background:rgba(8,12,18,.6);backdrop-filter:blur(6px);color:#f4f1ea;cursor:pointer;text-align:center}
#start small{font-weight:700;font-size:clamp(11px,1.7vh,18px);letter-spacing:.3em;color:#f2b84b}
#start h1{margin:0;font-weight:800;font-size:clamp(26px,5.6vh,64px);line-height:1.05;letter-spacing:-.01em}
#start .btn{margin-top:2vh;padding:1.4vh 3.4vh;border-radius:99px;background:#f2b84b;color:#10151c;font-weight:800;font-size:clamp(14px,2.2vh,24px)}
</style>
<script src="vo/timing.js"></script>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="start"><small>CUTAWAY &middot; EP 01</small><h1>How a zipper<br>actually works</h1><div class="btn">Play (music preview)</div></div>
</div>
<script>
(()=>{
/* ============================== setup ============================== */
const W=1080,H=1920,CY0=930;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const BPM=110,BEAT=60/BPM,BAR=BEAT*4,STEP=BEAT/4,NBARS=18,LOOP=BAR*NBARS;
const B=(bar,beat=0)=>bar*BAR+beat*BEAT;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeBack=x=>{x=clamp(x);const c1=1.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const inS=(t,a,b)=>t>=a&&t<b;
function kf(t,keys){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){
    if(t<=keys[i][0]){const[t0,v0]=keys[i-1],[t1,v1]=keys[i];return t1-t0<1e-4?v1:lerp(v0,v1,easeIO((t-t0)/(t1-t0)));}
  }
  return keys[keys.length-1][1];
}
const rrp=(g,x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
/* palette: charcoal blue, one warm accent, materials that look like metal & cloth */
const INK='#f4f1ea',MUTED='#98a6b8',STEEL='#a9bdd2',COPPER='#e0956a',AMBER='#f2b84b',RED='#e4655f',GREEN='#6fcf97';
const FONT='Inter,"Helvetica Neue",Arial,sans-serif';

/* ============================== timeline ============================== */
const SLIDER=[[0,300],[B(0,2),-300],[B(1,0),300],[B(1,2),-300],[B(1,3.5),-520],[B(4,2),-520],[B(5,1),300],[B(5,3),300],
  [B(7,0),-300],[B(8,0.5),-300],[B(8,3.5),300],[B(9,0),300],[B(9,2),-700],[B(11,3.5),-700],[B(11,3.5)+.02,900],
  [B(12,0),900],[B(12,3),-400],[B(13,2),400],[B(14,0),-500],[B(14,3),-500],[B(15,1),300],[B(16,0),-300],[B(16,3),300],
  [B(17,2),-300],[B(18,0),300]];
const ZOOM=[[0,1.15],[B(1,3),1.35],[B(2,0),1.5],[B(2,3),5],[B(4,1),5],[B(5,1),2.4],[B(7,0),2.4],[B(7,2),3.8],[B(8,1),3.8],
  [B(8,3),2.4],[B(9,0),2.4],[B(9,2),6.5],[B(11,3),6.8],[B(12,1),1.1],[B(14,0),1.1],[B(14,1),3.2],[B(14,3.5),3.2],[B(15,0),1.15],[B(18,0),1.15]];
const CYB=[[0,0],[B(2,0),0],[B(2,3),160],[B(4,2),220],[B(8,3),120],[B(9,2),80],[B(11,3),80],[B(12,1),0],[B(14,0),0],
  [B(14,1),300],[B(14,3.5),300],[B(15,0),0],[B(18,0),0]];
const FOLLOW=[[0,0],[B(4,2),0],[B(5,1),1],[B(8,3),1],[B(9,2),0],[B(18,0),0]];
const SCENES=[0,B(2),B(5),B(9),B(12),B(15),LOOP];

/* ---- voice-over timing (from vo/timing.js) drives the subtitles and chapter tags ---- */
const VO=(window.VO||[]).map(l=>{
  const words=l.text.split(/\s+/),wt=words.map(w=>w.length+(/[.,:?!]$/.test(w)?3:0)),tot=wt.reduce((a,b)=>a+b,0);
  let acc=0;const ws=words.map((w,i)=>{const s=l.t+l.d*acc/tot;acc+=wt[i];return{w,s,e:l.t+l.d*acc/tot};});
  return{...l,ws};
});
const CHAPTERS=[];{let n=0,prev='';for(const l of VO){if(l.chapter&&l.chapter!==prev){n++;CHAPTERS.push({n,name:l.chapter,t0:l.t});}prev=l.chapter;}
  CHAPTERS.forEach((c,i)=>c.t1=i+1<CHAPTERS.length?CHAPTERS[i+1].t0:LOOP-.5);}
const wordTime=(lineIdx,wi)=>VO[lineIdx]?VO[lineIdx].ws[wi].s:0;

/* ============================== audio (soft, under the voice) ============================== */
const A={ctx:null,on:false,start:0,idx:0};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(off){
  const C=off||new(window.AudioContext||window.webkitAudioContext)();A.ctx=C;
  const comp=C.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.25;
  const master=C.createGain();master.gain.value=.85;A.master=master;master.connect(comp);comp.connect(C.destination);
  const len=C.sampleRate*2.2,ir=C.createBuffer(2,len,C.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  const conv=C.createConvolver();conv.buffer=ir;A.rv=C.createGain();A.rv.gain.value=.5;A.rv.connect(conv);
  const rvOut=C.createGain();rvOut.gain.value=.45;conv.connect(rvOut);rvOut.connect(master);
  const nb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
  A.duck=C.createGain();A.duck.connect(master);A.duck.connect(A.rv);
  A.start=off?0:C.currentTime+.12;A.idx=0;A.on=true;
  if(!off){setInterval(schedule,25);schedule();}
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function nsrc(t,dur){const s=A.ctx.createBufferSource();s.buffer=A.noise;s.loop=true;s.start(t,Math.random()*1.5);s.stop(t+dur);return s;}
function osc(type,f,t,dur){const o=A.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;}
function kick(t,v=.55){const C=A.ctx,o=osc('sine',120,t,.4),g=C.createGain();o.frequency.exponentialRampToValueAtTime(45,t+.12);env(g,t,.003,v,.3);o.connect(g);g.connect(A.master);}
function shaker(t,v=.025){const C=A.ctx,s=nsrc(t,.07),f=C.createBiquadFilter(),g=C.createGain();f.type='highpass';f.frequency.value=6500;env(g,t,.004,v,.05);s.connect(f);f.connect(g);g.connect(A.master);}
function bass(t,m,d=.5){const C=A.ctx,g=C.createGain(),f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  const o=osc('triangle',mtof(m),t,d+.05);o.connect(f);env(g,t,.02,.3,d);f.connect(g);g.connect(A.master);}
function pluck(t,m,v=.05){const C=A.ctx,f=C.createBiquadFilter(),g=C.createGain();f.type='lowpass';f.frequency.setValueAtTime(2400,t);f.frequency.exponentialRampToValueAtTime(600,t+.3);
  [-5,5].forEach(dt=>{const o=osc('triangle',mtof(m),t,.5);o.detune.value=dt;o.connect(f);});
  env(g,t,.004,v,.4);f.connect(g);g.connect(A.master);g.connect(A.rv);}
function pad(t,chord,d){const C=A.ctx,f=C.createBiquadFilter(),g=C.createGain();f.type='lowpass';f.frequency.value=800;
  chord.forEach(m=>{[-5,5].forEach(dt=>{const o=osc('sawtooth',mtof(m),t,d+.8);o.detune.value=dt;const og=C.createGain();og.gain.value=.028;o.connect(og);og.connect(f);});});
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(1,t+.7);g.gain.setValueAtTime(1,t+d-.2);g.gain.linearRampToValueAtTime(.0001,t+d+.7);
  f.connect(g);g.connect(A.duck);}
function whoosh(t,d){const C=A.ctx,s=nsrc(t,d+.2),f=C.createBiquadFilter(),g=C.createGain();f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(4500,t+d);
  env(g,t,d*.9,.09,d*.3);s.connect(f);f.connect(g);g.connect(A.master);g.connect(A.rv);}
function thud(t){const C=A.ctx,o=osc('sine',80,t,1),g=C.createGain();o.frequency.exponentialRampToValueAtTime(35,t+.6);env(g,t,.005,.4,.7);o.connect(g);g.connect(A.master);}
const sfx={
  tick(up,at){if(!A.on)return;const C=A.ctx,t=at??C.currentTime,s=nsrc(t,.03),f=C.createBiquadFilter(),g=C.createGain();f.type='bandpass';f.frequency.value=up?4200:3300;f.Q.value=3;env(g,t,.001,.11,.016);s.connect(f);f.connect(g);g.connect(A.master);
    const o=osc('square',up?2100:1700,t,.02),g2=C.createGain();env(g2,t,.001,.012,.01);o.connect(g2);g2.connect(A.master);}
};
const CH=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]],ROOT=[33,29,36,31];
const ARP=[0,2,1,2,0,2,1,2,0,2,1,2,0,1,2,1];
function playStep(t,bar,s){
  const ci=bar%4,ch=CH[ci],drums=bar>=2;
  if(s===0){if([0,2,5,9,12,15].includes(bar))thud(t);pad(t,ch,BAR);}
  if(s===12&&[1,4,8,11,14,17].includes(bar))whoosh(t,BEAT);
  const stop=bar===17&&s>=8;
  if(drums&&s%4===0&&!stop){kick(t);const d=A.duck.gain;d.cancelScheduledValues(t);d.setValueAtTime(.55,t);d.linearRampToValueAtTime(1,t+.3);}
  if(drums&&s%4===2&&!stop)shaker(t);
  if(drums&&s%8===0&&!stop)bass(t,ROOT[ci]);
  if(drums&&s===6&&!stop)bass(t,ROOT[ci]+12,.3);
  const arpOn=bar<2?s%8===0:s%2===0;
  if(arpOn&&bar!==17)pluck(t,ch[ARP[s]]+12+(s%8===6?12:0),bar<2?.035:.045);
}
function schedule(){
  if(!A.on)return;const C=A.ctx;
  while(A.start+A.idx*STEP<C.currentTime+.2){playStep(A.start+A.idx*STEP,Math.floor(A.idx/16)%NBARS,A.idx%16);A.idx++;}
}

/* ============================== sprites ============================== */
function makeTooth(hi,mid,lo){
  const SS=6,PW=146,PH=76,OX=106,OY=38,c=document.createElement('canvas');c.width=PW*SS;c.height=PH*SS;const g=c.getContext('2d');g.scale(SS,SS);g.translate(OX,OY);
  g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=7;g.shadowOffsetX=1.5;g.shadowOffsetY=4;
  let gr=g.createLinearGradient(0,-9,0,9);gr.addColorStop(0,hi);gr.addColorStop(.45,mid);gr.addColorStop(1,lo);
  g.fillStyle=gr;rrp(g,-98,-9,98,18,6);g.fill();
  const rg=g.createRadialGradient(-7,-9,1,-2,-2,26);rg.addColorStop(0,'#fff');rg.addColorStop(.2,hi);rg.addColorStop(.65,mid);rg.addColorStop(1,lo);
  g.fillStyle=rg;g.beginPath();g.arc(0,0,22,0,7);g.fill();
  g.shadowColor='transparent';g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.4;g.beginPath();g.arc(0,0,22,0,7);g.stroke();rrp(g,-98,-9,98,18,6);g.stroke();
  g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=2;g.beginPath();g.arc(0,0,11,Math.PI*.15,Math.PI*.85);g.stroke();
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.4;g.beginPath();g.arc(0,0,17,Math.PI*1.1,Math.PI*1.6);g.stroke();
  return c;
}
const TL=makeTooth('#eef3f9','#a7bacf','#4d6178'),TR=makeTooth('#ffe6d0','#dd9569','#7d4626');
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
{const g=vig.getContext('2d'),r=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.74);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=r;g.fillRect(0,0,W,H);}

/* ============================== state ============================== */
let cam={z:1.15,cy:0},sy=300,prevSy=300,vel=0;
const w2s=(x,y)=>[W/2+x*cam.z,CY0+(y-cam.cy)*cam.z];
const sideOf=k=>(k&1)?1:-1;
const shiftFrac=y=>easeIO(clamp((sy+40-y)/130));
function jamAt(t){if(t<B(11)||t>=B(12))return 0;const ph=((t-B(11))/BEAT)%1;return 2.6*(ph<.3?easeOut(ph/.3):1-easeIO((ph-.3)/.7));}
const fade=(t,a,b,f=.25)=>clamp((t-a)/f)*clamp((b-t)/f);

/* ============================== drawing ============================== */
function drawBG(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#141c27');g.addColorStop(.55,'#0f1620');g.addColorStop(1,'#080c12');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const r=ctx.createRadialGradient(W/2,CY0-100,0,W/2,CY0-100,950);r.addColorStop(0,'rgba(130,160,200,.16)');r.addColorStop(1,'rgba(130,160,200,0)');ctx.fillStyle=r;ctx.fillRect(0,0,W,H);
}
function drawTape(top,bot){
  for(const side of[-1,1]){
    const edge=y=>side*(72+90*shiftFrac(y));
    ctx.beginPath();ctx.moveTo(side*760,top);
    for(let y=top;y<=bot;y+=8)ctx.lineTo(edge(y),y);
    ctx.lineTo(side*760,bot);ctx.closePath();
    const g=ctx.createLinearGradient(side*72,0,side*520,0);g.addColorStop(0,'#2c3f58');g.addColorStop(1,'#1c2a3d');ctx.fillStyle=g;ctx.fill();
    /* woven texture */
    ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;ctx.beginPath();
    for(let y=Math.ceil(top/8)*8;y<bot;y+=8){const e=edge(y);ctx.moveTo(e+side*10,y);ctx.lineTo(side*760,y);}ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.14)';ctx.beginPath();
    for(let x=90;x<760;x+=8){ctx.moveTo(side*x,top);ctx.lineTo(side*x,bot);}ctx.stroke();
    /* binding at the inner edge + stitching */
    ctx.strokeStyle='rgba(12,18,28,.75)';ctx.lineWidth=16;ctx.beginPath();
    for(let y=top;y<=bot;y+=8){const e=edge(y)+side*8;y===top?ctx.moveTo(e,y):ctx.lineTo(e,y);}ctx.stroke();
    ctx.setLineDash([12,9]);ctx.lineWidth=2.5;ctx.strokeStyle='rgba(235,228,210,.55)';ctx.beginPath();
    for(let y=top;y<=bot;y+=8){const e=edge(y)+side*30;y===top?ctx.moveTo(e,y):ctx.lineTo(e,y);}ctx.stroke();ctx.setLineDash([]);
  }
}
function drawTeeth(top,bot,jam){
  const k0=Math.floor(top/40),k1=Math.ceil(bot/40);
  for(const pass of[-1,1])for(let k=k0;k<=k1;k++){
    const side=sideOf(k);if(side!==pass)continue;
    const y=k*40,s=shiftFrac(y);
    let x=-side*12+side*90*s+(s<.01?side*jam:0),sc=1,al=1;
    if(side===-1&&s>0&&s<.3){const b=Math.sin(Math.PI*clamp(s/.3));sc=1-.16*b;al=1-.2*b;}
    ctx.save();ctx.translate(x,y);ctx.scale(side===-1?sc:-sc,sc);ctx.globalAlpha=al;ctx.drawImage(side===-1?TL:TR,-106,-38,146,76);ctx.restore();
  }
}
function drawSlider(t){
  const a=clamp(vel*.00028,-.5,.5);
  ctx.save();ctx.translate(0,sy);
  /* pull tab */
  ctx.save();ctx.rotate(a);
  const tg=ctx.createLinearGradient(-34,-260,34,-90);tg.addColorStop(0,'#f1f4f8');tg.addColorStop(.5,'#aab6c4');tg.addColorStop(1,'#69788a');
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;ctx.fillStyle=tg;rrp(ctx,-34,-262,68,180,26);ctx.fill();ctx.shadowColor='transparent';
  ctx.strokeStyle='rgba(20,28,40,.5)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#141c27';rrp(ctx,-14,-238,28,70,14);ctx.fill();ctx.restore();
  /* body: frosted cut-away so the teeth inside stay visible */
  ctx.beginPath();ctx.moveTo(-196,-90);ctx.lineTo(196,-90);ctx.lineTo(196,-40);ctx.lineTo(96,40);ctx.lineTo(66,92);ctx.lineTo(-66,92);ctx.lineTo(-96,40);ctx.lineTo(-196,-40);ctx.closePath();
  const gg=ctx.createLinearGradient(0,-90,0,92);gg.addColorStop(0,'rgba(215,226,240,.20)');gg.addColorStop(1,'rgba(215,226,240,.09)');ctx.fillStyle=gg;
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=22;ctx.shadowOffsetY=10;ctx.fill();ctx.shadowColor='transparent';
  ctx.lineJoin='round';ctx.lineWidth=8;ctx.strokeStyle='#c5d0dd';ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='rgba(20,28,40,.55)';ctx.stroke();
  /* the wedge */
  ctx.beginPath();ctx.moveTo(-30,-72);ctx.lineTo(30,-72);ctx.lineTo(0,40);ctx.closePath();
  const wg=ctx.createLinearGradient(-30,-72,30,40);wg.addColorStop(0,'#ffd98a');wg.addColorStop(1,'#d9962a');ctx.fillStyle=wg;ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(60,36,4,.7)';ctx.stroke();
  ctx.restore();
}
function tickSounds(t,dt){
  const my=sy+40,visible=Math.abs((sy-cam.cy)*cam.z)<1000&&t>0;
  const cross=Math.floor(my/40)-Math.floor((my-vel*dt)/40);
  if(visible&&dt>0&&dt<.1&&cross&&A.on){for(let i=0;i<Math.min(3,Math.abs(cross));i++)sfx.tick(vel<0);}
}
function chip(text,x,y,o={}){
  const{color=AMBER,size=38,align='center',alpha=1,pop=1}=o;if(alpha<=0)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(pop,pop);
  ctx.font=`700 ${size}px ${FONT}`;const w=ctx.measureText(text).width+size*1.5,h=size*1.75,x0=align==='left'?0:align==='right'?-w:-w/2;
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=16;ctx.shadowOffsetY=6;rrp(ctx,x0,-h/2,w,h,h*.3);ctx.fillStyle='rgba(12,18,27,.9)';ctx.fill();ctx.shadowColor='transparent';
  ctx.lineWidth=2.5;ctx.strokeStyle=color;ctx.stroke();
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x0+size*.62,0,size*.13,0,7);ctx.fill();
  ctx.fillStyle=INK;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(text,x0+size*1.0,size*.04);ctx.restore();
}
function leader(x1,y1,x2,y2,color,p=1){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p));ctx.stroke();
  if(p>=1){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x2,y2,8,0,7);ctx.fill();}ctx.restore();
}
const popAge=(t,t0)=>easeBack((t-t0)/.3);

function worldOverlays(t){
  const pulse=.5+.5*Math.sin(t*5);
  if(inS(t,B(2),B(5))){
    const ring=(kk,col)=>{const y=kk*40,x=-sideOf(kk)*12;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(x,y,29+pulse*2,0,7);ctx.stroke();ctx.restore();};
    if(inS(t,B(3),B(4)+.3)){ring(4,STEEL);ring(5,COPPER);}
    if(inS(t,B(3,2),B(5))){
      const p=easeOut((t-B(3,2))/(BEAT*2)),pts=[];for(let kk=2;kk<=9;kk++)pts.push([-sideOf(kk)*12,kk*40]);
      ctx.save();ctx.strokeStyle='rgba(244,241,234,.85)';ctx.lineWidth=1.4;ctx.setLineDash([6,5]);ctx.beginPath();

      const p=clamp((t-B(10,1))/.4);ctx.globalAlpha=p;ctx.lineWidth=1;
      ctx.strokeStyle=COPPER;ctx.beginPath();ctx.moveTo(-52,62);ctx.lineTo(-52,98);ctx.moveTo(-60,62);ctx.lineTo(-44,62);ctx.moveTo(-60,98);ctx.lineTo(-44,98);ctx.stroke();
      ctx.strokeStyle=STEEL;ctx.beginPath();ctx.moveTo(52,58);ctx.lineTo(52,102);ctx.moveTo(44,58);ctx.lineTo(60,58);ctx.moveTo(44,102);ctx.lineTo(60,102);ctx.stroke();
    }
    if(j>0){const a=j/2.6;
      for(const yy of[60,100]){const g=ctx.createRadialGradient(0,yy,0,0,yy,30);g.addColorStop(0,`rgba(228,101,95,${.75*a})`);g.addColorStop(1,'rgba(228,101,95,0)');ctx.globalAlpha=1;ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,yy,30,0,7);ctx.fill();}

    if(trail.length){const[x,y]=trail[trail.length-1];ctx.translate(x,y);ctx.rotate(-.6);
      ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14;ctx.shadowOffsetY=6;

      ctx.fillStyle='#d97a86';ctx.fillRect(222,-14,28,28);ctx.fillStyle='#ecd4a6';ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(-44,0);ctx.lineTo(0,14);ctx.fill();ctx.fillStyle='#2b2f38';ctx.beginPath();ctx.moveTo(-28,-4);ctx.lineTo(-44,0);ctx.lineTo(-28,4);ctx.fill();}

}

function drawArrow(x,y,dir,col,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.translate(x,y);ctx.scale(dir,1);
  ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(34,0);ctx.moveTo(14,-20);ctx.lineTo(34,0);ctx.lineTo(14,20);ctx.stroke();ctx.restore();
}
function screenOverlays(t){
  /* hook counter */
  if(t<B(2)){
    const p=easeOut(t/B(1,2)),n=Math.round(p*10000),a=fade(t,.15,B(2)-.2,.5);
    ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.fillStyle=INK;ctx.font=`800 210px ${FONT}`;ctx.fillText(n.toLocaleString('en-US'),W/2,470);
    ctx.font=`700 30px ${FONT}`;ctx.fillStyle=MUTED;ctx.fillText('TIMES YOU HAVE PULLED A ZIPPER',W/2,530);ctx.restore();
  }
  if(inS(t,B(3),B(4))){
    const a=w2s(12,160),b=w2s(-12,200);

    chip('ROW A',a[0]-320,a[1]-40,{color:STEEL,pop:popAge(t,B(3,.5)),size:40});chip('ROW B',b[0]+320,b[1]+50,{color:COPPER,pop:popAge(t,B(3,1)),size:40});

  if(inS(t,B(6),B(9))){

    if(inS(t,B(7),B(8))){leader(ap[0]+30,ap[1],W-270,ap[1]-150,AMBER,clamp((t-B(7))/.3));chip('THE WEDGE',W-215,ap[1]-150,{color:AMBER,pop:popAge(t,B(7,.5)),size:38});
      const o=Math.sin(t*6)*8;drawArrow(ap[0]-350+o,ap[1]-60,1,AMBER,.9);drawArrow(ap[0]+350-o,ap[1]-60,-1,AMBER,.9);}
    if(inS(t,B(8),B(9))){leader(ap[0]+30,ap[1],W-270,ap[1]-150,AMBER,clamp((t-B(8))/.3));chip('THE WEDGE PRIES THEM APART',W-330,ap[1]-150,{color:AMBER,pop:popAge(t,B(8,.5)),size:32});
      const o=Math.sin(t*6)*8;drawArrow(ap[0]-350-o,ap[1]-60,-1,COPPER,.9);drawArrow(ap[0]+350+o,ap[1]-60,1,COPPER,.9);}
  }
  if(inS(t,B(10,1),B(12))){
    const p=popAge(t,B(10,1));
    chip('GAP  36',260,1130,{color:COPPER,pop:p,size:38});chip('BULB  44',820,1130,{color:STEEL,pop:p,size:38});
    if(t>=B(10,3)&&t<B(11))chip('44 > 36  =  STUCK',W/2,1215,{color:RED,pop:popAge(t,B(10,3)),size:44});
    if(t>=B(11))chip('SIDEWAYS FORCE  =  JAMMED',W/2,1215,{color:RED,pop:1,size:44});
  }
  if(inS(t,B(12),B(14))){
    const n=inS(t,B(12),B(12,3))?Math.max(0,Math.floor((900-sy)/40)):inS(t,B(12,3),B(13,2))?Math.floor(Math.abs(sy+400)/40):Math.floor(Math.abs(sy-400)/40);
    chip('TEETH LOCKED  '+Math.min(n,999),W/2,650,{color:GREEN,size:40,alpha:clamp((t-B(12))*3)});
  }
  if(inS(t,B(13),B(14))){
    const p=easeOut((t-B(13))/(BEAT*2.5)),y=1130;
    ctx.save();ctx.font=`700 30px ${FONT}`;ctx.fillStyle=INK;ctx.textAlign='left';ctx.fillText('YOUR PULL',90,y-44);
    ctx.fillStyle='rgba(255,255,255,.10)';rrp(ctx,90,y-28,900,30,15);ctx.fill();ctx.fillStyle=AMBER;rrp(ctx,90,y-28,60,30,15);ctx.fill();
    ctx.fillStyle=INK;ctx.fillText('GRIP ON THE TEETH',90,y+52);ctx.fillStyle='rgba(255,255,255,.10)';rrp(ctx,90,y+68,900,30,15);ctx.fill();
    ctx.fillStyle=GREEN;rrp(ctx,90,y+68,Math.max(30,900*p),30,15);ctx.fill();ctx.restore();
  }
  if(inS(t,B(14),B(15)))chip('GRAPHITE  =  DRY LUBRICANT',W/2,1130,{color:GREEN,size:34,pop:popAge(t,B(14,1.5))});

    if(t>=t0-.1&&t<B(16,2)+.4){
      ctx.save();ctx.fillStyle='rgba(8,12,18,.5)';ctx.fillRect(0,0,W,H);ctx.restore();
      words.forEach(([w,col],i)=>{const st=VO[9].ws[i]?VO[9].ws[i].s:t0+i*.5,p=easeBack((t-st)/.35);if(t<st)return;
        ctx.save();ctx.translate(W/2,560+i*230);ctx.scale(.9+.1*p,.9+.1*p);ctx.globalAlpha=clamp((t-st)/.15)*clamp((B(16,2)+.4-t)/.3);
        ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;rrp(ctx,-390,-85,780,170,26);ctx.fillStyle='rgba(16,22,31,.95)';ctx.fill();ctx.shadowColor='transparent';
        ctx.fillStyle=col;rrp(ctx,-390,-85,16,170,8);ctx.fill();

        ctx.fillStyle=col;ctx.font=`700 30px ${FONT}`;ctx.textAlign='right';ctx.fillText(['THE ROWS','THE SLIDER','THE GRIP'][i],360,6);ctx.restore();});
    }
  }
  if(t>=B(16,2)+.2){
    const a=fade(t,B(16,2)+.2,LOOP,.4),ang=t*3;
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,640);ctx.strokeStyle=AMBER;ctx.lineWidth=8;ctx.lineCap='round';ctx.rotate(ang);
    ctx.beginPath();ctx.arc(0,0,46,0,Math.PI*1.55);ctx.stroke();ctx.fillStyle=AMBER;ctx.beginPath();ctx.moveTo(46,-6);ctx.lineTo(66,-26);ctx.lineTo(72,4);ctx.fill();ctx.restore();
    chip('SPOT THE WEDGE',W/2,740,{color:AMBER,size:44,alpha:a});
  }
}
function drawSubtitles(t){
  const li=VO.findIndex(l=>t>=l.t-.05&&t<=l.t+l.d+.35);if(li<0||li===9)return;
  const L=VO[li];ctx.save();ctx.font=`800 56px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';
  /* wrap */
  const maxW=880,lines=[[]];let cw=0;const sp=ctx.measureText(' ').width;
  L.ws.forEach((w,i)=>{const ww=ctx.measureText(w.w).width;if(cw+ww>maxW&&lines[lines.length-1].length){lines.push([]);cw=0;}lines[lines.length-1].push({...w,ww,i});cw+=ww+sp;});
  const lh=76,boxH=lines.length*lh+44,y0=1400-boxH;
  const a=clamp((t-L.t+.05)/.2)*clamp((L.t+L.d+.35-t)/.25);
  ctx.globalAlpha=a;rrp(ctx,90,y0,900,boxH,26);ctx.fillStyle='rgba(8,12,18,.88)';ctx.fill();
  lines.forEach((ln,r)=>{const tw=ln.reduce((s,w)=>s+w.ww,0)+sp*(ln.length-1);let x=W/2-tw/2;const y=y0+22+lh*r+lh/2;
    ln.forEach(w=>{const cur=t>=w.s&&t<w.e+.0,past=t>=w.e;ctx.fillStyle=cur?AMBER:past?INK:'rgba(244,241,234,.45)';ctx.fillText(w.w,x,y);x+=w.ww+sp;});});
  ctx.restore();
}
function drawChapter(t){
  const c=CHAPTERS.find(c=>t>=c.t0-.05&&t<c.t1);if(!c)return;
  const a=fade(t,c.t0,c.t1,.35),lab=`${String(c.n).padStart(2,'0')}   ${c.name}`;
  ctx.save();ctx.globalAlpha=a;ctx.textBaseline='middle';ctx.font=`800 34px ${FONT}`;
  if('letterSpacing' in ctx)ctx.letterSpacing='6px';
  const w=ctx.measureText(lab).width;ctx.textAlign='left';const x=W/2-w/2,y=290+(1-easeOut((t-c.t0)/.4))*14;
  ctx.fillStyle=AMBER;ctx.fillText(lab.slice(0,2),x,y);ctx.fillStyle=INK;ctx.fillText(lab.slice(2),x+ctx.measureText(lab.slice(0,2)).width,y);
  ctx.fillStyle=AMBER;ctx.globalAlpha=a*.9;ctx.fillRect(W/2-40,y+34,80,4);ctx.restore();
}
function logoMark(x,y,s){ctx.save();ctx.translate(x+32*s,y+32*s);ctx.scale(s*32/170,s*32/170);
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,170,0,Math.PI*1.5);ctx.closePath();const dg=ctx.createLinearGradient(-170,-170,170,170);dg.addColorStop(0,'#f3f7fb');dg.addColorStop(1,'#5d7089');ctx.fillStyle=dg;ctx.fill();
  ctx.fillStyle='#0c1219';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,170,Math.PI*1.5,Math.PI*2);ctx.closePath();ctx.fill();
  ctx.fillStyle=AMBER;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,105,Math.PI*1.5,Math.PI*2);ctx.closePath();ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,-170);ctx.moveTo(8,0);ctx.lineTo(170,0);ctx.stroke();ctx.restore();}
function drawHUD(t){
  const segW=(W-120-5*8)/6;
  for(let i=0;i<6;i++){const x=60+i*(segW+8),p=clamp((t-SCENES[i])/(SCENES[i+1]-SCENES[i]));
    ctx.fillStyle='rgba(255,255,255,.16)';rrp(ctx,x,92,segW,5,2.5);ctx.fill();if(p>0){ctx.fillStyle=INK;rrp(ctx,x,92,Math.max(5,segW*p),5,2.5);ctx.fill();}}
  logoMark(60,124,.75);
  ctx.save();ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle=INK;ctx.font=`800 26px ${FONT}`;if('letterSpacing' in ctx)ctx.letterSpacing='3px';
  ctx.fillText('CUTAWAY',122,140);ctx.textAlign='right';ctx.fillStyle=MUTED;ctx.font=`700 22px ${FONT}`;ctx.fillText('@cutaway68',W-60,140);ctx.textAlign='left';ctx.fillStyle=INK;ctx.font=`800 26px ${FONT}`;ctx.fillStyle=MUTED;ctx.font=`600 20px ${FONT}`;ctx.fillText('EPISODE 01  ·  THE ZIPPER',122,168);ctx.restore();
}

/* ============================== frame ============================== */
let prevT=0;
function render(t,dt,live){
  prevT=t;
  sy=kf(t,SLIDER);if(dt>0)vel=vel*.6+((sy-prevSy)/dt)*.4;prevSy=sy;
  cam.z=kf(t,ZOOM);cam.cy=lerp(kf(t,CYB),sy*.9+40,kf(t,FOLLOW));
  drawBG(t);
  ctx.save();ctx.translate(W/2,CY0);ctx.scale(cam.z,cam.z);ctx.translate(0,-cam.cy);
  const top=cam.cy-CY0/cam.z-140,bot=cam.cy+(H-CY0)/cam.z+140;
  drawTape(top,bot);drawTeeth(top,bot,jamAt(t));worldOverlays(t);drawSlider(t);
  ctx.restore();
  if(live)tickSounds(t,dt);
  ctx.drawImage(vig,0,0);
  screenOverlays(t);drawChapter(t);drawSubtitles(t);drawHUD(t);
}

/* ============================== run ============================== */
const qp=new URLSearchParams(location.search),fixed=parseFloat(qp.get('t'));
const startEl=document.getElementById('start');
let pStart=performance.now()/1000,last=0;
const clock=()=>A.on?((A.ctx.currentTime-A.start)%LOOP+LOOP)%LOOP:((performance.now()/1000-pStart)%LOOP);
function frame(){const t=isNaN(fixed)?clock():fixed,dt=t>=last?t-last:.016;render(t,dt>.1?.016:dt,isNaN(fixed));last=t;requestAnimationFrame(frame);}
startEl.addEventListener('click',()=>{startEl.style.display='none';try{initAudio();}catch(e){console.warn(e);}});
if(!isNaN(fixed))startEl.style.display='none';
/* --- offline export helpers (used by tools/make-video.js) --- */
window.__frame=(t,dt)=>{A.on=false;render(t,dt,true);return cv.toDataURL('image/jpeg',.95).slice(23);};
window.__audio=async(secs)=>{
  const SR=44100,off=new OfflineAudioContext(2,SR*secs,SR);initAudio(off);
  for(let i=0;i<Math.ceil(secs/STEP);i++)playStep(i*STEP,Math.floor(i/16)%NBARS,i%16);
  let prev=kf(0,SLIDER);
  for(let t=1/60;t<secs;t+=1/60){
    const y=kf(t,SLIDER),z=kf(t,ZOOM),cy=lerp(kf(t,CYB),y*.9+40,kf(t,FOLLOW)),v=(y-prev)*60,my=y+40;
    const cross=Math.floor(my/40)-Math.floor((my-v/60)/40);
    if(Math.abs((y-cy)*z)<1000&&cross)for(let k=0;k<Math.min(3,Math.abs(cross));k++)sfx.tick(v<0,t+k*.004);
    prev=y;
  }
  const buf=await off.startRendering(),L=buf.getChannelData(0),R=buf.getChannelData(1),out=new Int16Array(L.length*2);
  for(let i=0;i<L.length;i++){out[2*i]=Math.max(-1,Math.min(1,L[i]))*32767;out[2*i+1]=Math.max(-1,Math.min(1,R[i]))*32767;}
  let bin='';const u8=new Uint8Array(out.buffer);for(let i=0;i<u8.length;i+=32768)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
  return btoa(bin);
};
document.fonts.load('800 56px Inter').then(()=>requestAnimationFrame(frame));
})();
