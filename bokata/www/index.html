<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff8a3d">
<meta name="description" content="BO KATA: real-time kite fighting on festival rooftops. Cross threads, win the pench and shout BO KATA!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BO KATA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1 14 7 8 14 2 7Z%22 fill=%22%23e23b3b%22 stroke=%22%23fff1d6%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="hTop">
    <button id="pauseBtn" class="round" aria-label="Pause">❚❚</button>
    <div id="hMid"><div id="hTime">3:00</div><div id="hAlive">12 flyers</div></div>
    <div id="hMe"><div id="hKites"></div><div id="hCuts">✂ <b>0</b></div></div>
  </div>
  <div id="feed"></div>
  <div id="pench" class="hidden"><div class="pRow"><span id="pYou">YOU</span><div id="pBar"><i id="pMine"></i><i id="pTheirs"></i><b></b></div><span id="pThem">RIVAL</span></div><small id="pHint">KEEP FLYING FAST!</small></div>
  <div id="count" class="hidden"></div>
  <div id="respawn" class="hidden"></div>
  <div id="tip" class="hidden"></div>
  <div id="ctrlHint">HOLD to pull · LET GO to spin</div>
</div>
<div id="pops"></div>

<!-- ============ HOME ============ -->
<div id="home" class="screen hidden">
  <div class="topBar">
    <button id="profBtn" class="prof"><span id="avatar"></span><span><b id="hName">You</b><small id="hArena">Gully Rooftops</small></span></button>
    <div class="pills"><div class="pill tro">🏆 <b id="hTro">0</b></div><div class="pill coin"><i class="cIco"></i><b id="hCoins">0</b></div></div>
  </div>
  <div class="homeMid">
    <div class="logo"><span class="lb">BO</span><span class="lk">KATA</span></div>
    <div class="tag">Cut the sky.</div>
    <button id="roadBtn" class="roadCard"><div class="rTop"><span>TROPHY ROAD</span><b id="rNext">Next: 30 🏆</b></div><div class="rBar"><i id="rFill"></i></div><i class="dot hidden" id="roadDot"></i></button>
  </div>
  <div class="homeBot">
    <div class="modes"><button class="mode on" data-mode="battle"><b>SKY BATTLE</b><small>12 flyers · 3 kites</small></button><button class="mode" data-mode="duel"><b>DUEL</b><small>1 vs 1</small></button></div>
    <button id="playBtn" class="btn play">FLY!</button>
    <nav id="nav">
      <button data-p="kites"><i>◆</i><span>KITES</span><em class="dot hidden" id="kDot"></em></button>
      <button data-p="thread"><i>🧵</i><span>THREAD</span></button>
      <button data-p="quests"><i>★</i><span>QUESTS</span><em class="dot hidden" id="qDot"></em></button>
      <button data-p="settings"><i>⚙</i><span>SETTINGS</span></button>
    </nav>
  </div>
</div>

<!-- ============ PANELS ============ -->
<div id="panel" class="screen hidden">
  <div class="pHead"><button id="pBack" class="round">‹</button><h2 id="pTitle">KITES</h2><div class="pill coin"><i class="cIco"></i><b id="pCoins">0</b></div></div>
  <div id="pBody"></div>
</div>

<!-- ============ NAME ============ -->
<div id="nameScr" class="screen hidden">
  <div class="card">
    <div class="logo small"><span class="lb">BO</span><span class="lk">KATA</span></div>
    <h2>What do your friends call you?</h2>
    <input id="nameIn" maxlength="12" placeholder="Your name" autocomplete="off">
    <div class="shirts" id="shirts"></div>
    <button id="nameGo" class="btn play">LET'S FLY!</button>
  </div>
</div>

<!-- ============ PAUSE ============ -->
<div id="pause" class="screen dim hidden">
  <div class="card"><h2>PAUSED</h2>
    <button id="resumeBtn" class="btn play">RESUME</button>
    <button id="quitBtn" class="btn ghost">LEAVE MATCH</button>
  </div>
</div>

<!-- ============ RESULTS ============ -->
<div id="results" class="screen dim hidden">
  <div class="card res">
    <div id="rPlace">#1</div>
    <div id="rTitle">SKY CHAMPION!</div>
    <div class="rStats"><div><small>CUTS</small><b id="rCuts">0</b></div><div><small>LOOTED</small><b id="rLoots">0</b></div><div><small>TROPHIES</small><b id="rTro">+0</b></div></div>
    <div id="rCoins" class="rCoins"><i class="cIco"></i><b>+0</b></div>
    <div id="rNew"></div>
    <div class="row"><button id="againBtn" class="btn play">FLY AGAIN</button><button id="homeBtn" class="btn ghost">HOME</button></div>
  </div>
</div>

<div id="modal" class="screen dim hidden"><div class="card" id="mCard"></div></div>
<div id="toasts"></div>

<div id="boot"><div class="logo"><span class="lb">BO</span><span class="lk">KATA</span></div><div class="bootKite"></div></div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/sim.js"></script>
<script src="js/bots.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
