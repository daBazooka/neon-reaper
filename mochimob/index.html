<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fdc6a">
<meta name="description" content="MOCHI MOB: lead a squishy swarm of hundreds of mochi. Hatch eggs, eat everything, carry giant treasures home and pop the gobblers together!">
<title>MOCHI MOB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%238fdc6a%22/%3E%3Cpath d=%22M2.5 12C2 6 5 3.5 8 3.5S14 6 13.5 12Q8 14 2.5 12Z%22 fill=%22%23fff6f2%22 stroke=%22%235a2846%22/%3E%3Ccircle cx=%226.3%22 cy=%228.5%22 r=%22.9%22 fill=%22%232b1a22%22/%3E%3Ccircle cx=%229.7%22 cy=%228.5%22 r=%22.9%22 fill=%22%232b1a22%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="hL"><button id="pauseBtn" class="ico" aria-label="Pause">❚❚</button><div id="timer" class="chip">⏱ 1:30</div></div>
  <div id="hC">
    <div id="meter"><i></i><span id="meterTxt">NEST 0%</span></div>
    <div id="dayTxt">DAY 1</div>
  </div>
  <div id="hR"><div id="mobTxt" class="chip big">🍡 12</div><div id="coinTxt" class="chip coin">0</div></div>
</div>
<button id="sqBtn" class="hidden">SQUISH</button>
<div id="banner" class="hidden"><b></b><small></small></div>
<div id="tip" class="hidden"></div>

<!-- ============ TITLE ============ -->
<div id="title">
  <div id="tTop"><div class="chip coin" id="tCoins">0</div><div class="chip" id="tBest"></div></div>
  <h1 id="logo"><span>MOCHI</span><span>MOB</span></h1>
  <div class="tag">Lead the squishiest swarm in the world!</div>
  <button id="playBtn" class="btn go big">▶ PLAY <small id="playDay">DAY 1</small></button>
  <div class="tBtns">
    <button id="bUp" class="btn"><span>⬆</span>UPGRADES<i class="badge hidden" id="upBadge">!</i></button>
    <button id="bFl" class="btn"><span>🎨</span>FLAVORS</button>
    <button id="bMi" class="btn"><span>🎯</span>MISSIONS<i class="badge hidden" id="miBadge">!</i></button>
    <button id="bSet" class="btn"><span>⚙</span>SETTINGS</button>
  </div>
  <div class="hint2" id="tHint">Move to lead · Hold to squish</div>
</div>

<!-- ============ RESULTS ============ -->
<div id="results" class="screen hidden"><div class="card">
  <div class="ttl" id="rTitle">DAY COMPLETE!</div>
  <div id="rStars"><i></i><i></i><i></i></div>
  <div id="rStarTxt" class="small"></div>
  <div id="rStats"></div>
  <div id="rCoins" class="coin big">+0</div>
  <div id="rMiss" class="qmini"></div>
  <div class="btns">
    <button id="rHome" class="btn ghost" aria-label="Home">⌂</button>
    <button id="rUp" class="btn">⬆</button>
    <button id="rDouble" class="btn gold hidden">▶ ×2</button>
    <button id="rNext" class="btn go">NEXT DAY ▶</button>
  </div>
</div></div>

<!-- ============ SCREENS ============ -->
<div id="upgrades" class="screen hidden"><div class="card wide">
  <div class="ttl">UPGRADES <small class="coin" id="uCoins"></small></div>
  <div id="uList" class="list"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="flavors" class="screen hidden"><div class="card wide">
  <div class="ttl">FLAVORS <small class="coin" id="fCoins"></small></div>
  <div id="fGrid"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="missions" class="screen hidden"><div class="card">
  <div class="ttl">MISSIONS</div>
  <div id="mList" class="list"></div>
  <div class="small" id="mStats"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="settings" class="screen hidden"><div class="card">
  <div class="ttl">SETTINGS</div>
  <div class="list">
    <button class="setRow" data-opt="sfx"><span>Sound effects</span><b></b></button>
    <button class="setRow" data-opt="music"><span>Music</span><b></b></button>
    <button class="setRow" data-opt="shake"><span>Screen shake</span><b></b></button>
    <button class="setRow" data-opt="fx"><span>Graphics</span><b></b></button>
  </div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="pause" class="screen hidden"><div class="card">
  <div class="ttl">PAUSED</div>
  <button id="pResume" class="btn go wide">▶ RESUME</button>
  <button id="pSet" class="btn wide">⚙ SETTINGS</button>
  <button id="pQuit" class="btn ghost wide">END DAY</button>
</div></div>

<div id="toasts"></div>
<div id="boot"><div class="bootLogo">MOCHI MOB</div><div class="bootBar"><i></i></div></div>

<script src="js/sdk.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
