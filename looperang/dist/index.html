<script>
'use strict';
/* =====================================================================
   Poki SDK v2 wrapper.
   - PokiSDK.init() -> (load) -> gameLoadingFinished()
   - gameplayStart() on the first player input of a level, gameplayStop()
     whenever play is interrupted (menus, level-complete panel, pause).
     Both are de-duplicated so Poki never sees the same event twice in a row.
   - commercialBreak() only at natural breaks (next level, restarting from
     the menu), rewardedBreak() only when the player taps an opt-in button.
   - During any ad: audio is suspended and all input (pointer + keyboard)
     is ignored (SDK.adBusy), gameplay stays stopped.
   - If the SDK cannot load (offline, ad blocker, other host) every call
     falls through and the game plays normally.
   ===================================================================== */
const SDK = {
  p: null, playing: false, adBusy: false, loaded: false, wantLoaded: false,

  init(){
    return new Promise(res => {
      let done = false;
      const fin = () => { if(!done){ done = true; res(); } };
      const ready = () => {
        this.p = window.PokiSDK;
        if(this.wantLoaded && !this.loaded) this.loadingFinished();
        fin();
      };
      const start = () => {
        try{
          // init() rejects when an ad blocker is on; Poki asks games to continue normally
          window.PokiSDK.init().then(ready).catch(ready);
        }catch(e){ fin(); }
      };
      // the SDK <script> tag in index.html loads async so it never delays the first frame
      if(window.PokiSDK) start();
      else{
        const tag = document.getElementById('pokiSdk');
        if(tag){ tag.addEventListener('load', start); tag.addEventListener('error', fin); }
        else fin();
      }
      setTimeout(fin, 3000);
    });
  },
  loadingFinished(){
    this.wantLoaded = true;
    if(!this.p || this.loaded) return;
    this.loaded = true;
    try{ this.p.gameLoadingFinished(); }catch(e){}
  },
  gameplayStart(){
    if(this.playing || this.adBusy) return;
    this.playing = true;
    try{ this.p && this.p.gameplayStart(); }catch(e){}
  },
  gameplayStop(){
    if(!this.playing) return;
    this.playing = false;
    try{ this.p && this.p.gameplayStop(); }catch(e){}
  },
  /* interstitial at a natural break; Poki decides whether an ad actually shows */
  commercial(cb){
    if(!this.p || this.adBusy){ cb(); return; }
    this.gameplayStop();
    this.adBusy = true;
    let fin = false;
    const end = () => { if(fin) return; fin = true; this.adBusy = false; AU.adMute(false); cb(); };
    try{ this.p.commercialBreak(() => AU.adMute(true)).then(end, end); }catch(e){ end(); }
  },
  /* opt-in rewarded ad; cb(true) only if the player earned the reward */
  rewarded(size, cb){
    if(this.adBusy){ cb(false); return; }
    if(!this.p){ cb(true); return; }   // off Poki there is no ad to watch, just give the reward
    this.gameplayStop();
    this.adBusy = true;
    let fin = false;
    const end = ok => { if(fin) return; fin = true; this.adBusy = false; AU.adMute(false); cb(!!ok); };
    try{ this.p.rewardedBreak({ size, onStart: () => AU.adMute(true) }).then(end, () => end(false)); }catch(e){ end(false); }
  },
  error(err){ try{ this.p && this.p.captureError && this.p.captureError(err); }catch(e){} }
};
window.addEventListener('error', e => SDK.error(e.error || e.message));

</script>
<script>
'use strict';
/* =====================================================================
   LOOPERANG: data, save, flight simulation and level generator.
   stepRang() is the only physics in the game. The level generator runs
   the exact same function with a recorded throw, so every level ships
   with a throw that is proven to clear it (it also powers the hint).
   ===================================================================== */
const LW = 1600, LH = 900, DT = 1 / 120, TAU = Math.PI * 2;
const P = {
  rr: 20, gemR: 38, starR: 36, catchR: 86, handDY: -56,
  om: 2.25, omHold: 5.4, turnBack: Math.PI * 1.75, tOut: 3.6,
  homeRate: 7.5, spdRet: 1250, ghostAfter: 2.2, tMax: 11,
  spMin: 640, spMax: 1280, bumpMul: 1.18, spCap: 1750, wallT: 13, portR: 54
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function angDiff(a, b){ let d = (b - a) % TAU; if(d > Math.PI) d -= TAU; if(d < -Math.PI) d += TAU; return d; }
function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function segDist(px, py, s){
  const dx = s.bx - s.ax, dy = s.by - s.ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - s.ax) * dx + (py - s.ay) * dy) / l2, 0, 1);
  const qx = s.ax + dx * t, qy = s.ay + dy * t;
  return { d: Math.hypot(px - qx, py - qy), qx, qy };
}

/* ---------------- worlds ---------------- */
const WORLDS = [
  { name: 'Sunny Meadow',  sky: ['#48b8ff', '#c9f1ff'], hill: ['#8fdc62', '#5fbf4a'], island: '#6fcf52', gem: '#ff4f8b', feat: [], tip: 'Loop through every gem, then catch it!' },
  { name: 'Rocky Canyon',  sky: ['#ff9d5c', '#ffe0b0'], hill: ['#e0955a', '#bd6c3c'], island: '#d98a4e', gem: '#3ad8ff', feat: ['walls'], tip: 'Rocks bounce your boomerang. Use them!' },
  { name: 'Bouncy Castle', sky: ['#b58bff', '#ffd3f1'], hill: ['#ff9fd6', '#d879c9'], island: '#ffa6dc', gem: '#4dffb0', feat: ['bumpers'], tip: 'Jelly bumpers bounce it back even faster!' },
  { name: 'Windy Peaks',   sky: ['#77b9ff', '#eef7ff'], hill: ['#d7e8f7', '#a9c4e0'], island: '#e9f3fb', gem: '#ff7a3a', feat: ['wind'], tip: 'Wind pushes your boomerang. Ride the breeze!' },
  { name: 'Warp Woods',    sky: ['#1f5f55', '#8fe0b4'], hill: ['#2f8a5c', '#1d6645'], island: '#3ea56c', gem: '#ffe14d', feat: ['portals'], tip: 'Fly into a portal, pop out of its twin!' },
  { name: 'Saw Mill',      sky: ['#5b7899', '#cddded'], hill: ['#8aa0b8', '#62798f'], island: '#9bb0c4', gem: '#ff5ad0', feat: ['saws'], tip: 'Saws move. Time your throw!' },
  { name: 'Candy Cosmos',  sky: ['#ff7fc1', '#ffe6a3'], hill: ['#ffb870', '#ff8fa8'], island: '#fff0f7', gem: '#5a8cff', feat: ['walls', 'bumpers', 'wind'], tip: 'Everything at once. Sweet chaos!' },
  { name: 'Starry Summit', sky: ['#141a46', '#5b3a95'], hill: ['#2c2f6e', '#1c1d4d'], island: '#6b6fd8', gem: '#7dffea', feat: ['walls', 'bumpers', 'wind', 'portals', 'saws'], tip: 'The final climb. Show them your best loops!' }
];
const LEVELS_PER_WORLD = 10, MAIN_LEVELS = WORLDS.length * LEVELS_PER_WORLD;
function worldOf(n){ return Math.min(WORLDS.length - 1, Math.floor((n - 1) / LEVELS_PER_WORLD)); }

/* ---------------- cosmetics ---------------- */
const RANGS = [
  { id: 'wood',    name: 'Classic',  price: 0,    c1: '#e3a15a', c2: '#a8642c', trail: ['#ffd36b', '#ff9a3c'] },
  { id: 'candy',   name: 'Candy',    price: 150,  c1: '#ff7fbf', c2: '#ffffff', trail: ['#ff7fbf', '#fff0f8'] },
  { id: 'leaf',    name: 'Leafy',    price: 300,  c1: '#6fdc52', c2: '#2f9a3a', trail: ['#b6ff7a', '#4fd06a'] },

  { id: 'galaxy',  name: 'Galaxy',   price: 2500, c1: '#2a1b6e', c2: '#ffe14d', trail: ['#b98cff', '#3a2a9e'] }

/* ---------------- save ---------------- */
const SAVE_KEY = 'looperang_save_v1';
function defSave(){

      const comp = this.ctx.createDynamicsCompressor(); comp.connect(this.master);
      this.sfxG = this.ctx.createGain(); this.sfxG.connect(comp);
      this.musG = this.ctx.createGain(); this.musG.connect(comp);
      this.apply();
    }catch(e){ this.ctx = null; }
  },
  unlock(){
    this.init();
    if(!this.ctx) return;
    if(this.ctx.state === 'suspended' && !this.adMuted) this.ctx.resume().catch(() => {});
    if(!this.started){ this.started = true; this.startMusic(); }
  },
  apply(){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.adMuted || this.hidden ? 0 : 1, t, 0.02);
    this.sfxG.gain.setTargetAtTime(S.sfx ? 0.9 : 0, t, 0.02);
    this.musG.gain.setTargetAtTime(S.music ? 0.28 : 0, t, 0.05);
  },
  adMute(on){
    this.adMuted = on; this.apply();
    if(!this.ctx) return;
    if(on) this.ctx.suspend().catch(() => {});
    else if(!this.hidden) this.ctx.resume().catch(() => {});
  },
  setHidden(h){
    this.hidden = h; this.apply();
    if(!this.ctx) return;
    if(h) this.ctx.suspend().catch(() => {});
    else if(!this.adMuted) this.ctx.resume().catch(() => {});
  },

  tone(f, dur, type = 'sine', vol = 0.3, delay = 0, slide = 0, dest){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, f0, f1, q = 1, delay = 0, type = 'bandpass', dest){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + delay, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = this.ctx.createBufferSource(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = buf; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(dest || this.sfxG); s.start(t);
  },

  PENTA: [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24],
  note(semi){ return 523.25 * Math.pow(2, semi / 12); },

  throw(pow){ this.noise(0.28, 0.5, 600, 2400 + pow * 1500, 2); this.tone(260, 0.18, 'triangle', 0.12, 0, 520); },
  gem(k){
    const f = this.note(this.PENTA[Math.min(this.PENTA.length - 1, k)]);
    this.tone(f, 0.35, 'triangle', 0.3); this.tone(f * 2, 0.25, 'sine', 0.12, 0.03); this.tone(f * 1.5, 0.3, 'sine', 0.08, 0.06);
  },
  last(){ [0, 4, 7, 12].forEach((s, i) => this.tone(this.note(s + 12), 0.5, 'triangle', 0.22, i * 0.06)); this.noise(0.6, 0.2, 3000, 9000, 0.7, 0, 'highpass'); },
  star(){ [12, 16, 19, 24].forEach((s, i) => this.tone(this.note(s), 0.4, 'sine', 0.25, i * 0.05)); },
  edge(){ this.tone(180, 0.1, 'square', 0.1, 0, 120); this.noise(0.06, 0.25, 1500, 600, 1.5); },
  wall(){ this.tone(140, 0.14, 'triangle', 0.35, 0, 90); this.noise(0.08, 0.35, 900, 300, 1); },
  bump(){ this.tone(220, 0.3, 'sine', 0.4, 0, 660); this.tone(330, 0.2, 'triangle', 0.1, 0.02, 880); },
  warp(){ this.tone(900, 0.35, 'sine', 0.25, 0, 180); this.tone(300, 0.35, 'sine', 0.2, 0.12, 1200); },
  near(){ this.noise(0.2, 0.25, 4000, 1200, 3); },
  die(){ this.noise(0.45, 0.6, 2400, 200, 0.8); this.tone(300, 0.4, 'sawtooth', 0.12, 0, 60); },
  miss(){ this.tone(440, 0.18, 'triangle', 0.18, 0, 330); this.tone(330, 0.25, 'triangle', 0.18, 0.15, 247); },
  catch(){ this.tone(120, 0.12, 'sine', 0.5, 0, 60); this.noise(0.06, 0.4, 2500, 800, 1); },
  clear(){ [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => this.tone(this.note(s), 0.5, 'triangle', 0.2, i * 0.07)); },
  starPop(i){ this.tone(this.note(12 + i * 4), 0.3, 'sine', 0.3); this.tone(this.note(24 + i * 4), 0.2, 'triangle', 0.1, 0.02); },
  coin(){ this.tone(1318, 0.08, 'square', 0.08); this.tone(1760, 0.16, 'square', 0.08, 0.06); },
  click(){ this.tone(660, 0.06, 'triangle', 0.18, 0, 880); },
  buy(){ [0, 7, 12].forEach((s, i) => this.tone(this.note(s), 0.25, 'triangle', 0.22, i * 0.05)); },
  aimTick(p){ this.tone(300 + p * 500, 0.03, 'sine', 0.05); },

  /* the spinning "whirr" while the boomerang flies */
  whirrStart(){
    if(!this.ctx || this.whirr) return;
    const o = this.ctx.createOscillator(), lfo = this.ctx.createOscillator(), lg = this.ctx.createGain(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 90;
    lfo.frequency.value = 16; lg.gain.value = 0.05;
    f.type = 'lowpass'; f.frequency.value = 700;
    g.gain.value = 0.05;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(f); f.connect(g); g.connect(this.sfxG);
    o.start(); lfo.start();
    this.whirr = { o, lfo, g, f };
  },
  whirrSet(speed, hold){
    if(!this.whirr) return;
    const t = this.ctx.currentTime;
    this.whirr.lfo.frequency.setTargetAtTime(10 + speed / 70, t, 0.05);
    this.whirr.o.frequency.setTargetAtTime(hold ? 130 : 90, t, 0.05);
    this.whirr.f.frequency.setTargetAtTime(hold ? 1300 : 700, t, 0.05);
  },
  whirrStop(){
    if(!this.whirr) return;
    const w = this.whirr; this.whirr = null;
    try{ w.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.03); w.o.stop(this.ctx.currentTime + 0.2); w.lfo.stop(this.ctx.currentTime + 0.2); }catch(e){}
  },

  /* a small bouncy song, one key per world */
  KEYS: [0, -3, 2, -5, -2, -4, 3, -1],
  PROG: [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]],
  setWorld(w){ this.world = w; },
  startMusic(){
    if(!this.ctx) return;
    this.nextT = this.ctx.currentTime + 0.1;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.sched(), 60);
  },
  sched(){
    if(!this.ctx || this.ctx.state !== 'running') return;
    const spb = 60 / 112 / 2;
    while(this.nextT < this.ctx.currentTime + 0.2){
      const st = this.step % 64, bar = Math.floor(st / 16), k = this.KEYS[this.world] || 0, ch = this.PROG[bar];
      const t = this.nextT - this.ctx.currentTime, beat = st % 16;
      if(beat % 4 === 0) this.tone(this.note(ch[0] + k - 24), spb * 1.8, 'triangle', 0.35, t, 0, this.musG);
      if(beat === 6 || beat === 14) this.tone(this.note(ch[0] + k - 17), spb * 0.9, 'triangle', 0.2, t, 0, this.musG);
      if(beat % 2 === 0){
        const arp = [0, 1, 2, 1, 2, 0, 1, 2][(beat / 2) % 8];
        this.tone(this.note(ch[arp] + k), spb * 0.9, 'sine', 0.12, t, 0, this.musG);
      }
      if(beat % 4 === 2) this.noise(0.05, 0.05, 7000, 9000, 1, t, 'highpass', this.musG);
      if((st === 12 || st === 44) && Math.random() < 0.7){
        const m = [7, 9, 12, 14][Math.floor(Math.random() * 4)];
        this.tone(this.note(m + k + 12), spb * 3, 'sine', 0.07, t, 0, this.musG);
      }
      this.nextT += spb; this.step++;
    }
  }
};

</script>
<script>
'use strict';
/* =====================================================================
   Game state, input and flow.
   intro -> aim -> fly -> (clear | reset -> aim)
   ===================================================================== */
const G = {
  st: 'intro', L: null, n: 1, daily: false,
  b: null, holding: false, acc: 0, gt: 0, rt: 0, ts: 1, slowT: 0,
  aim: null, kAim: null, fails: 0, hint: false, trail: [],
  parts: [], texts: [], shake: 0, flash: 0, flashC: '#fff',
  introT: 0, iris: 1, irisDir: 0, irisCb: null,
  roo: { pose: 'idle', t: 0 }, spawnT: 0, resetT: 0,
  combo: 0, lastGemT: -9, tricks: 0, bumpAnim: new Map(), warpFx: [],
  paused: false, tutT: 0, clearInfo: null
};

/* ---------------- level flow ---------------- */
function startLevel(n, opts = {}){
  G.daily = !!opts.daily;
  G.n = n;
  G.L = G.daily ? dailyLevel() : getLevel(n);
  G.fails = 0; G.hint = false; G.spawnT = 0;
  G.bumpAnim.clear();
  if(!G.daily){ S.cur = n; persist(); }
  AU.setWorld(G.L.w);
  toAim();
  UI.hud();
  const w = G.L.w;
  if(!G.daily && n <= MAIN_LEVELS && (n - 1) % LEVELS_PER_WORLD === 0 && S.seenWorld < w + 1){
    S.seenWorld = w + 1; persist();
    if(w > 0) UI.banner('WORLD ' + (w + 1), WORLDS[w].name, WORLDS[w].tip);
  }else if(G.daily){
    UI.banner('DAILY', 'Challenge', 'One level a day. Keep your streak!');
  }else if(G.L.spec.grand){
    UI.banner('LEVEL ' + n, 'Grand finale', 'Clear it to open a treasure chest!');
  }else if(G.L.spec.treasure){
    UI.banner('LEVEL ' + n, 'Treasure level', 'Golden gems: triple coins!');
  }
}
function toAim(){
  G.st = 'aim'; G.b = null; G.trail = []; G.aim = null; G.holding = false;
  G.roo.pose = 'idle'; G.tutT = 0;
  AU.whirrStop();
  UI.hud();
}
function throwRang(ang, pow){
  G.b = makeRang(G.L, ang, pow);
  G.st = 'fly'; G.acc = 0; G.trail = []; G.combo = 0; G.lastGemT = -9; G.tricks = 0;
  G.roo.pose = 'throw'; G.roo.t = 0;
  G.aim = null;
  S.st.throws++;
  AU.throw(pow); AU.whirrStart();
  SDK.gameplayStart();
  UI.tutorialThrown();
}
function onEvent(type, a, b, c, d){
  const L = G.L, bm = G.b;
  switch(type){
    case 'edge': AU.edge(); burst(a, b, 6, '#ffffff', 160, 3); G.shake = Math.max(G.shake, 3); break;
    case 'wall': AU.wall(); burst(a, b, 10, '#fff2d0', 220, 4); G.shake = Math.max(G.shake, 5); trick('RICOCHET!', a, b, '#ffd24a'); break;
    case 'bump': AU.bump(); G.bumpAnim.set(c, G.gt); burst(a, b, 14, '#ff9fe0', 320, 5); G.shake = Math.max(G.shake, 6); trick('BOING!', a, b, '#ff7ad8'); break;
    case 'warp': AU.warp(); burst(a, b, 16, '#b690ff', 260, 4); burst(c, d, 16, '#6ee7ff', 260, 4); trick('WARP!', c, d, '#8cf2ff'); break;
    case 'near': AU.near(); trick('CLOSE CALL!', bm.x, bm.y - 30, '#ff8a5c'); G.slowT = Math.max(G.slowT, 0.12); break;
    case 'gem': {
      const g = L.gems[a];
      G.combo = G.gt - G.lastGemT < 0.45 ? G.combo + 1 : 0; G.lastGemT = G.gt;
      const lastOne = bm.got === L.gems.length;
      AU.gem(bm.got - 1 + G.combo);
      burst(b, c, 22, L.spec.treasure ? '#ffd24a' : WORLDS[L.w].gem, 380, 6);
      ring(b, c, L.spec.treasure ? '#ffd24a' : '#ffffff');
      if(G.combo) trick('DOUBLE!', b, c - 40, '#7dffea');
      S.st.gems++;
      if(lastOne){
        AU.last(); G.slowT = 0.55; G.flash = 0.5; G.flashC = '#ffffff';
        floatText('ALL GEMS!', b, c - 50, '#ffffff', 1.4);
        G.shake = 10;
      }
      UI.pips();
      break;
    }
    case 'star': AU.star(); burst(a, b, 26, '#ffe14d', 420, 7); ring(a, b, '#ffe14d'); floatText('★ BONUS STAR', a, b - 44, '#ffe14d', 1.1); break;
    case 'die': AU.die(); AU.whirrStop(); shatter(a, b); G.shake = 14; break;
    case 'lost': AU.miss(); AU.whirrStop(); break;
    case 'ghost': break;
    case 'catch': AU.catch(); AU.whirrStop(); G.roo.pose = 'catch'; G.roo.t = 0; break;
  }
}
function trick(txt, x, y, col){
  G.tricks++; S.st.tricks++;
  floatText(txt, x, y - 36, col, 0.9);
}
function flightEnded(){
  const b = G.b, L = G.L;
  if(b.caught && b.got === L.gems.length){ levelClear(); return; }
  G.fails++;
  let msg;
  if(b.dead && !b.caught){ msg = b.t > P.tMax ? 'LOST IT!' : 'OUCH!'; }
  else{ const left = L.gems.length - b.got; msg = left === 1 ? '1 GEM LEFT!' : left + ' GEMS LEFT'; AU.miss(); }
  const h = handOf(L);
  floatText(msg, h.x + 120, h.y - 70, '#ffffff', 1);
  G.st = 'reset'; G.resetT = b.caught ? 0.45 : 0.7;
  UI.failCount();
}
function levelClear(){
  const b = G.b, L = G.L, n = G.n;
  G.st = 'clear';
  const stars = 1 + (b.star ? 1 : 0) + (b.t <= L.par ? 1 : 0);
  let coins = 20 + stars * 10 + G.tricks * 3;
  if(L.spec.treasure) coins *= 3;
  if(G.daily) coins += 100;
  const first = !G.daily && !S.stars[n];
  const prev = G.daily ? 0 : (S.stars[n] || 0);
  if(!G.daily){
    S.stars[n] = Math.max(prev, stars);
    if(stars === 3 && prev < 3) S.st.stars3++;
    if(n >= S.lvl) S.lvl = n + 1;
    S.cur = n + 1;
  }else{
    const d = dayNum();
    if(S.daily.day !== d){
      S.daily.streak = S.daily.day === d - 1 ? S.daily.streak + 1 : 1;
      S.daily.day = d; S.daily.done = 1;
      coins += Math.min(10, S.daily.streak) * 20;
    }
  }
  S.coins += coins; S.st.clears++;
  let chest = null;
  if(!G.daily && L.spec.grand && first && !S.chests[n]){
    S.chests[n] = 1;
    chest = grantChest();
  }
  persist();
  G.clearInfo = { stars, coins, star: b.star, fast: b.t <= L.par, time: b.t, par: L.par, tricks: G.tricks, chest, prevStars: prev };
  AU.clear();
  confetti();
  setTimeout(() => { SDK.gameplayStop(); UI.showClear(G.clearInfo); }, 900);
  if(!G.daily) setTimeout(() => getLevel(n + 1), 1300);
}
/* a free cosmetic the player doesn't own yet (cheapest first) */
function grantChest(){
  const pool = [...RANGS.map(r => ({ kind: 'rang', it: r })), ...HATS.map(h => ({ kind: 'hat', it: h }))]
    .filter(o => !S.own[o.it.id]).sort((a, b) => a.it.price - b.it.price);
  if(!pool.length){ S.coins += 500; return { kind: 'coins', amount: 500 }; }
  const pick = pool[0];
  S.own[pick.it.id] = 1;
  if(pick.kind === 'rang') S.rang = pick.it.id; else S.hat = pick.it.id;
  return pick;
}
function nextLevel(){
  const target = G.daily ? Math.min(S.cur || 1, S.lvl) : G.n + 1;
  const go = () => startLevel(target);
  irisOut(() => SDK.commercial(() => { go(); irisIn(); }));
}
function restartLevel(){ if(G.st === 'fly' || G.st === 'reset' || G.st === 'aim'){ G.fails++; toAim(); UI.failCount(); } }

/* ---------------- iris transitions ---------------- */
function irisOut(cb){ G.irisDir = -1; G.irisCb = cb; }
function irisIn(){ G.irisDir = 1; G.iris = 0; }

/* ---------------- effects ---------------- */
function burst(x, y, n, col, sp, sz){
  if(UI.lowFx) n = Math.ceil(n / 2);
  for(let i = 0; i < n; i++){
    const a = Math.random() * TAU, v = sp * (0.3 + Math.random() * 0.7);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.4 + Math.random() * 0.4, c: col, sz: sz * (0.6 + Math.random() * 0.8), k: 0 });
  }
}
function ring(x, y, col){ G.parts.push({ x, y, vx: 0, vy: 0, life: 0, max: 0.45, c: col, sz: 10, k: 1 }); }
function shatter(x, y){
  const sk = RANGS.find(r => r.id === S.rang) || RANGS[0];
  for(let i = 0; i < 14; i++){
    const a = Math.random() * TAU, v = 150 + Math.random() * 350;
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.8, c: i % 2 ? sk.c1 : sk.c2, sz: 8, k: 2, rot: Math.random() * TAU });
  }
  burst(x, y, 20, '#ffffff', 300, 4);
}
function confetti(){
  const cols = ['#ff4f8b', '#ffd24a', '#4dffb0', '#5a8cff', '#ff8a3a', '#b98cff'];
  const h = handOf(G.L);
  for(let i = 0; i < (UI.lowFx ? 40 : 90); i++){
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 400 + Math.random() * 700;
    G.parts.push({ x: h.x, y: h.y, vx: Math.cos(a) * v + 200, vy: Math.sin(a) * v, life: 0, max: 1.6 + Math.random(), c: cols[i % cols.length], sz: 7, k: 3, rot: Math.random() * TAU, g: 700 });
  }
}
function floatText(txt, x, y, col, size){ G.texts.push({ txt, x, y, col, size: size || 1, life: 0, max: 1.1 }); }

/* ---------------- update ---------------- */
function update(rdt){
  G.rt += rdt;
  if(G.irisDir){
    G.iris = clamp(G.iris + G.irisDir * rdt * 2.6, 0, 1);
    if(G.irisDir < 0 && G.iris <= 0){ G.irisDir = 0; const cb = G.irisCb; G.irisCb = null; cb && cb(); }
    else if(G.irisDir > 0 && G.iris >= 1) G.irisDir = 0;
  }
  if(G.st === 'intro'){ G.introT += rdt; if(G.introT > 2.4 && !G.irisDir && G.iris > 0.99) endIntro(); return; }
  if(G.paused || SDK.adBusy) return;
  if(G.slowT > 0){ G.slowT -= rdt; G.ts = lerp(G.ts, 0.22, Math.min(1, rdt * 20)); }
  else G.ts = lerp(G.ts, 1, Math.min(1, rdt * 6));
  const dt = rdt * G.ts;
  G.gt += dt; G.spawnT += rdt; G.roo.t += dt; G.tutT += rdt;
  G.shake = Math.max(0, G.shake - rdt * 40);
  G.flash = Math.max(0, G.flash - rdt * 2.5);

  if(G.st === 'fly'){
    G.acc += dt;
    let steps = 0;
    while(G.acc >= DT && G.st === 'fly' && steps < 12){
      G.acc -= DT; steps++;
      stepRang(G.L, G.b, G.holding && G.b.ph === 0, G.gt, onEvent);
      G.trail.push({ x: G.b.x, y: G.b.y, h: G.holding && G.b.ph === 0 });
      if(G.trail.length > 70) G.trail.shift();
      if(G.b.caught || G.b.dead) flightEnded();
    }
    if(G.b) AU.whirrSet(G.b.s, G.holding && G.b.ph === 0);
  }else if(G.st === 'reset'){
    G.resetT -= rdt;
    if(G.trail.length) G.trail.shift();
    if(G.resetT <= 0) toAim();
  }else if(G.st === 'clear'){
    if(G.trail.length) G.trail.shift();
  }
  if(G.st === 'aim' && G.kAim){ keyAimUpdate(rdt); }

  for(let i = G.parts.length - 1; i >= 0; i--){
    const p = G.parts[i];
    p.life += dt;
    if(p.life >= p.max){ G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.g) p.vy += p.g * dt;
    const drag = p.k === 3 ? 0.985 : 0.93;
    p.vx *= drag; p.vy *= p.k === 3 ? 1 : drag;
    if(p.rot != null) p.rot += dt * 8;
  }
  for(let i = G.texts.length - 1; i >= 0; i--){
    const t = G.texts[i]; t.life += rdt; t.y -= rdt * 40;
    if(t.life > t.max) G.texts.splice(i, 1);
  }
}

/* ---------------- intro: the thumbnail comes alive ---------------- */
function endIntro(){
  if(G.st !== 'intro') return;
  irisOut(() => {
    G.st = 'aim';
    startLevel(Math.min(S.cur || 1, S.lvl));
    irisIn();
    UI.showHud(true);
    UI.tutorialStart();
  });
}

/* ---------------- input ---------------- */
function aimFromDrag(a){
  const dx = a.x0 - a.x, dy = a.y0 - a.y;
  const len = Math.hypot(dx, dy);
  const w = R.vecToWorld(dx, dy);
  const range = Math.min(R.W, R.H) * 0.32;
  return { ang: Math.atan2(w.y, w.x), pow: clamp((len - 14) / range, 0, 1), len };
}
function pointerDown(e){
  AU.unlock();
  if(SDK.adBusy || G.paused || UI.modalOpen()) return;
  if(G.st === 'intro'){ if(G.introT > 0.6) G.introT = 99; return; }
  if(G.irisDir) return;
  if(G.st === 'aim'){
    G.aim = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId };
    G.kAim = null;
    SDK.gameplayStart();
  }else if(G.st === 'fly'){ G.holding = true; }
}
function pointerMove(e){
  if(!G.aim || e.pointerId !== G.aim.id) return;
  const before = aimFromDrag(G.aim).pow;
  G.aim.x = e.clientX; G.aim.y = e.clientY;
  const p = aimFromDrag(G.aim).pow;
  if(Math.floor(p * 8) !== Math.floor(before * 8)) AU.aimTick(p);
}
function pointerUp(e){
  G.holding = false;
  if(SDK.adBusy || !G.aim || e.pointerId !== G.aim.id) return;
  const a = aimFromDrag(G.aim);
  G.aim = null;
  if(G.st === 'aim' && a.len > 22 && a.pow > 0.02) throwRang(a.ang, 0.12 + a.pow * 0.88);
}
/* keyboard: arrows aim, space throws, hold space to curve tighter */
function keyAimUpdate(rdt){
  const k = G.kAim;
  if(K.ArrowLeft || K.KeyA) k.ang -= rdt * 1.6;
  if(K.ArrowRight || K.KeyD) k.ang += rdt * 1.6;
  if(K.ArrowUp || K.KeyW) k.pow = clamp(k.pow + rdt * 0.8, 0.05, 1);
  if(K.ArrowDown || K.KeyS) k.pow = clamp(k.pow - rdt * 0.8, 0.05, 1);
}
const K = {};
function keyDown(e){
  const c = e.code;
  if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  if(SDK.adBusy) return;
  AU.unlock();
  if(c === 'Escape' || c === 'KeyP'){ UI.togglePause(); return; }
  if(G.paused || UI.modalOpen()){ if(c === 'Enter' || c === 'Space') UI.primaryAction(); return; }
  if(G.st === 'intro'){ if(G.introT > 0.6) G.introT = 99; return; }
  if(K[c]) return;
  K[c] = true;
  if(G.st === 'aim' && /^Arrow|Key[WASD]$/.test(c) && !G.kAim){ G.kAim = { ang: -0.4, pow: 0.6 }; SDK.gameplayStart(); }
  if(c === 'Space' || c === 'Enter'){
    if(G.st === 'aim'){
      if(!G.kAim) G.kAim = { ang: -0.4, pow: 0.6 };
      else{ const k = G.kAim; G.kAim = null; throwRang(k.ang, 0.12 + k.pow * 0.88); }
      SDK.gameplayStart();
    }else if(G.st === 'fly') G.holding = true;
  }
  if(c === 'KeyR') restartLevel();
}
function keyUp(e){
  K[e.code] = false;
  if(e.code === 'Space' || e.code === 'Enter') G.holding = false;
}

/* ---------------- boot ---------------- */
function loop(now){
  const rdt = Math.min(0.05, (now - loop.last) / 1000 || 0);
  loop.last = now;
  try{ update(rdt); R.draw(); }catch(e){ SDK.error(e); console.error(e); }
  requestAnimationFrame(loop);
}
function boot(){
  R.init();
  UI.init();
  R.draw();                                  // first frame = the Poki thumbnail
  const cv = R.cv;
  cv.addEventListener('pointerdown', e => { try{ cv.setPointerCapture(e.pointerId); }catch(_){} pointerDown(e); });
  cv.addEventListener('pointermove', pointerMove);
  cv.addEventListener('pointerup', pointerUp);
  cv.addEventListener('pointercancel', pointerUp);
  window.addEventListener('keydown', keyDown);
  window.addEventListener('keyup', keyUp);
  window.addEventListener('blur', () => { for(const k in K) K[k] = false; G.holding = false; G.aim = null; });
  document.addEventListener('visibilitychange', () => AU.setHidden(document.hidden));
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('wheel', e => { if(e.ctrlKey) e.preventDefault(); }, { passive: false });
  requestAnimationFrame(t => { loop.last = t; loop(t); });
  SDK.init().then(() => SDK.loadingFinished());
}

</script>
<script>
'use strict';
/* =====================================================================
   Canvas renderer. The level lives in a 1600x900 world. On a portrait
   screen the world is rotated 90 degrees (physics doesn't care), and
   sprites are drawn upright so it reads naturally both ways.
   ===================================================================== */
const R = {
  cv: null, c: null, W: 0, H: 0, dpr: 1, V: { s: 1, ox: 0, oy: 0, port: false },
  bgCache: null, bgKey: '',

  init(){
    this.cv = document.getElementById('cv');
    this.c = this.cv.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },
  resize(){
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.W = window.innerWidth; this.H = window.innerHeight;
    this.cv.width = Math.round(this.W * this.dpr); this.cv.height = Math.round(this.H * this.dpr);
    const port = this.H > this.W * 1.05, pad = 26;
    const top = port ? 118 : 64, bot = port ? 40 : 14, side = port ? 10 : 14;
    const aw = this.W - side * 2, ah = this.H - top - bot;
    const ww = (port ? LH : LW) + pad * 2, wh = (port ? LW : LH) + pad * 2;
    const s = Math.min(aw / ww, ah / wh);
    const V = this.V;
    V.s = s; V.port = port;
    V.ox = (this.W - (port ? LH : LW) * s) / 2;
    V.oy = top + (ah - (port ? LW : LH) * s) / 2;
    this.bgKey = '';
    if(typeof G !== 'undefined' && G.st === 'intro') this.draw();
  },
  worldTf(c){
    const V = this.V, d = this.dpr, s = V.s * d;
    if(V.port) c.setTransform(0, -s, s, 0, V.ox * d, (V.oy + LW * V.s) * d);
    else c.setTransform(s, 0, 0, s, V.ox * d, V.oy * d);
  },
  toScreen(x, y){
    const V = this.V;
    return V.port ? { x: V.ox + y * V.s, y: V.oy + (LW - x) * V.s } : { x: V.ox + x * V.s, y: V.oy + y * V.s };
  },
  vecToWorld(dx, dy){ return this.V.port ? { x: -dy, y: dx } : { x: dx, y: dy }; },
  upright(c){ if(this.V.port) c.rotate(Math.PI / 2); },
  /* direction from world into screen angle (for things drawn upright) */
  scrAng(a){ return this.V.port ? a - Math.PI / 2 : a; },

  /* ------------------------------------------------------------ */
  draw(){
    const c = this.c;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if(G.st === 'intro'){
      drawThumb(c, this.W, this.H, Math.max(0, G.introT - 0.9));
      this.irisMask(c, this.W * 0.27, this.H * 0.62);
      return;
    }
    const L = G.L;
    if(!L) return;
    this.background(c, L);
    c.save();
    const sh = G.shake;
    this.worldTf(c);
    if(sh > 0) c.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
    this.arena(c, L);
    this.winds(c, L);
    this.walls(c, L);
    this.portals(c, L);
    this.bumpers(c, L);
    this.gems(c, L);
    this.spikes(c, L);
    if(G.hint && (G.st === 'aim')) this.hintPath(c, L);
    this.island(c, L);
    this.trail(c);
    this.roo(c, L);
    if(G.st === 'aim') this.aimPreview(c, L);
    if(G.b && G.st === 'fly') this.rang(c, G.b);
    this.particles(c);
    this.texts(c);
    c.restore();
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if(G.flash > 0){ c.globalAlpha = G.flash * 0.6; c.fillStyle = G.flashC; c.fillRect(0, 0, this.W, this.H); c.globalAlpha = 1; }
    if(G.st === 'aim' && S.lvl <= 1 && !S.tut && !G.aim) this.tutHand(c, L);
    const h = handOf(L), hs = this.toScreen(h.x, h.y);
    this.irisMask(c, hs.x, hs.y);
  },
  irisMask(c, x, y){
    if(G.iris >= 1) return;
    const e = G.iris * G.iris * (3 - 2 * G.iris);
    const r = e * Math.hypot(this.W, this.H);
    c.fillStyle = '#1b1440';
    c.beginPath(); c.rect(0, 0, this.W, this.H); c.arc(x, y, Math.max(0.1, r), 0, TAU, true); c.fill('evenodd');
  },

  /* ---------- backdrop (cached per world + size) ---------- */
  background(c, L){
    const key = L.w + ':' + (L.spec.treasure ? 1 : 0) + ':' + this.W + 'x' + this.H;
    if(this.bgKey !== key){
      this.bgKey = key;
      const cv = this.bgCache || (this.bgCache = document.createElement('canvas'));
      cv.width = this.cv.width; cv.height = this.cv.height;
      const b = cv.getContext('2d'); b.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      paintSky(b, this.W, this.H, WORLDS[L.w], L.spec.treasure, L.w * 17 + 3);
    }
    c.drawImage(this.bgCache, 0, 0, this.W, this.H);
    // drifting clouds
    const t = G.rt, wd = WORLDS[L.w];
    c.fillStyle = L.w === 7 ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.55)';
    for(let i = 0; i < 5; i++){
      const sc = 0.6 + (i % 3) * 0.3, x = ((i * 397 + t * (10 + i * 4)) % (this.W + 300)) - 150, y = 40 + ((i * 131) % Math.max(60, this.H * 0.45));
      cloud(c, x, y, 60 * sc);
    }
    if(wd && L.w === 7){
      for(let i = 0; i < 40; i++){
        const x = (i * 211) % this.W, y = (i * 97) % (this.H * 0.8), tw = 0.5 + 0.5 * Math.sin(t * 2 + i);
        c.fillStyle = `rgba(255,255,255,${0.3 + tw * 0.6})`; c.fillRect(x, y, 2, 2);
      }
    }
  },
  arena(c, L){
    c.fillStyle = 'rgba(255,255,255,0.13)';
    rrect(c, 0, 0, LW, LH, 36); c.fill();
    c.lineWidth = 6; c.strokeStyle = 'rgba(255,255,255,0.55)';
    c.setLineDash([22, 16]); c.lineDashOffset = -G.rt * 20;
    rrect(c, -3, -3, LW + 6, LH + 6, 38); c.stroke();
    c.setLineDash([]);
  },
  island(c, L){
    const x = L.roo.x, y = L.roo.y, col = WORLDS[L.w].island;
    c.fillStyle = 'rgba(0,0,0,0.15)';
    c.beginPath(); c.ellipse(x, y + 26, 92, 18, 0, 0, TAU); c.fill();
    c.fillStyle = shade(col, -0.35);
    c.save(); c.translate(x, y); this.upright(c); c.scale(1.35, 1.35);
    c.beginPath(); c.moveTo(-86, 6); c.quadraticCurveTo(-40, 70, 0, 78); c.quadraticCurveTo(40, 70, 86, 6); c.closePath(); c.fill();
    c.fillStyle = col;
    c.beginPath(); c.ellipse(0, 6, 88, 18, 0, 0, TAU); c.fill();
    c.fillStyle = shade(col, 0.25);
    c.beginPath(); c.ellipse(-10, 2, 60, 8, 0, 0, TAU); c.fill();
    c.restore();
  },
  roo(c, L){
    const x = L.roo.x, y = L.roo.y;
    let look = 0, arm = 0.9, holding = G.st === 'aim' || G.st === 'reset' && G.resetT < 0.2;
    const h = handOf(L);
    if(G.b && G.st === 'fly'){ look = Math.atan2(G.b.y - h.y, G.b.x - h.x); }
    let aimA = null;
    if(G.st === 'aim'){
      if(G.aim){ const a = aimFromDrag(G.aim); if(a.len > 10){ aimA = a.ang; } }
      else if(G.kAim) aimA = G.kAim.ang;
    }
    const pose = G.roo.pose, pt = G.roo.t;
    if(aimA != null){ arm = aimA + Math.PI * 0.85; look = aimA; }
    else if(pose === 'throw' && pt < 0.25){ arm = lerp(-2.2, -0.2, pt / 0.25); }
    else if(pose === 'catch' && pt < 0.4){ arm = -1.2; }
    else if(G.st === 'fly'){ arm = look - 0.3; }
    c.save(); c.translate(x, y); this.upright(c);
    const sa = this.scrAng(arm), sl = this.scrAng(look);
    let sq = 1;
    if(pose === 'catch' && pt < 0.3) sq = 1 - Math.sin(pt / 0.3 * Math.PI) * 0.12;
    if(pose === 'throw' && pt < 0.2) sq = 1 + Math.sin(pt / 0.2 * Math.PI) * 0.08;
    c.scale(1.4 * (2 - sq), 1.4 * sq);
    drawRoo(c, G.rt, S.hat, sl, sa, holding ? S.rang : null, G.st === 'clear');
    c.restore();
  },
  aimPreview(c, L){
    let ang, pow;
    if(G.aim){ const a = aimFromDrag(G.aim); if(a.len <= 22) return; ang = a.ang; pow = 0.12 + a.pow * 0.88; }
    else if(G.kAim){ ang = G.kAim.ang; pow = 0.12 + G.kAim.pow * 0.88; }
    else return;
    const b = makeRang(L, ang, pow), n = Math.round(L.spec.preview / DT);
    c.fillStyle = '#ffffff';
    for(let i = 0; i < n && !b.dead; i++){
      stepRang(L, b, false, G.gt, null);
      if(i % 7 === 0){ const k = 1 - i / n; c.globalAlpha = 0.25 + k * 0.75; c.beginPath(); c.arc(b.x, b.y, 6 + k * 8, 0, TAU); c.fill(); }
      if(b.caught) break;
    }
    c.globalAlpha = 1;
    // power ring around Roo
    const h = handOf(L);
    c.lineWidth = 11; c.lineCap = 'round';
    c.strokeStyle = 'rgba(0,0,0,0.15)'; c.beginPath(); c.arc(h.x, h.y, 95, 0, TAU); c.stroke();
    c.strokeStyle = pow > 0.85 ? '#ff5a7a' : pow > 0.5 ? '#ffd24a' : '#7dffb0';
    c.beginPath(); c.arc(h.x, h.y, 95, ang - pow * Math.PI, ang + pow * Math.PI); c.stroke();
  },
  hintPath(c, L){
    if(!L.solPath) return;
    const p = L.solPath;
    c.lineCap = 'round';
    for(let i = 1; i < p.length; i += 3){
      const a = p[i - 1], b = p[i];
      c.strokeStyle = b.h ? 'rgba(255,90,160,0.8)' : 'rgba(255,225,77,0.75)';
      c.lineWidth = b.h ? 12 : 7;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    }
    const h = handOf(L), ang = L.sol.ang, len = 90 + L.sol.pow * 120;
    c.strokeStyle = '#ffe14d'; c.lineWidth = 10;
    c.beginPath(); c.moveTo(h.x, h.y); c.lineTo(h.x + Math.cos(ang) * len, h.y + Math.sin(ang) * len); c.stroke();
    c.save(); c.translate(h.x + Math.cos(ang) * len, h.y + Math.sin(ang) * len); c.rotate(ang);
    c.fillStyle = '#ffe14d'; c.beginPath(); c.moveTo(18, 0); c.lineTo(-10, -16); c.lineTo(-10, 16); c.fill(); c.restore();
  },
  gems(c, L){
    const b = G.b, col = L.spec.treasure ? '#ffc93a' : WORLDS[L.w].gem, t = G.rt;
    for(let i = 0; i < L.gems.length; i++){
      if(b && b.gm[i] && G.st !== 'reset') continue;
      const g = L.gems[i];
      const pop = clamp((G.spawnT - i * 0.08) * 4, 0, 1), sc = pop < 1 ? easeBack(pop) : 1;
      c.save(); c.translate(g.x, g.y + Math.sin(t * 3 + i) * 4); this.upright(c); c.scale(sc * 1.3, sc * 1.3);
      drawGem(c, col, t + i);
      c.restore();
    }
    if(L.star && !(b && b.star && G.st !== 'reset')){
      c.save(); c.translate(L.star.x, L.star.y); this.upright(c); c.rotate(Math.sin(t * 2) * 0.2);
      const sc = clamp((G.spawnT - 0.3) * 4, 0, 1);
      c.scale(sc, sc);
      drawStar(c, 32, t);
      c.restore();
    }
  },
  spikes(c, L){
    for(const z of L.spikes){
      const p = sawPos(z, G.gt);
      if(z.saw){
        c.strokeStyle = 'rgba(40,30,60,0.25)'; c.lineWidth = 6; c.setLineDash([6, 12]);
        c.beginPath(); c.moveTo(z.x - z.mx, z.y - z.my); c.lineTo(z.x + z.mx, z.y + z.my); c.stroke(); c.setLineDash([]);
        c.save(); c.translate(p.x, p.y); c.rotate(G.gt * 9); drawSaw(c, z.r); c.restore();
      }else{
        c.save(); c.translate(p.x, p.y); this.upright(c); drawSpiky(c, z.r, G.rt); c.restore();
      }
    }
  },
  walls(c, L){
    const w = L.w;
    const dark = ['#5e4a3a', '#7a3f22', '#6d3d8a', '#5c7ea3', '#3b4a3a', '#4a5563', '#b35c8a', '#2a2560'][w];
    const mid = ['#a7937b', '#c46d3c', '#b889e6', '#c8dcf0', '#6f7f63', '#8793a3', '#ffc2e0', '#6b63c9'][w];
    c.lineCap = 'round';
    for(const s of L.walls){
      c.strokeStyle = dark; c.lineWidth = P.wallT * 2 + 8;
      c.beginPath(); c.moveTo(s.ax, s.ay); c.lineTo(s.bx, s.by); c.stroke();
      c.strokeStyle = mid; c.lineWidth = P.wallT * 2;
      c.beginPath(); c.moveTo(s.ax, s.ay); c.lineTo(s.bx, s.by); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(s.ax, s.ay - 4); c.lineTo(s.bx, s.by - 4); c.stroke();
    }
  },
  bumpers(c, L){
    for(const u of L.bumpers){
      const ht = G.bumpAnim.get(u), k = ht != null ? Math.max(0, 1 - (G.gt - ht) * 3) : 0;
      const sq = 1 + Math.sin((G.gt - (ht || 0)) * 30) * 0.18 * k;
      c.save(); c.translate(u.x, u.y); this.upright(c); c.scale(sq, 2 - sq);
      drawBumper(c, u.r, k);
      c.restore();
    }
  },
  portals(c, L){
    for(const p of L.portals){
      drawPortal(c, p.ax, p.ay, '#b690ff', G.rt);
      drawPortal(c, p.bx, p.by, '#6ee7ff', -G.rt);
    }
  },
  winds(c, L){
    for(const z of L.winds){
      c.fillStyle = 'rgba(255,255,255,0.12)';
      rrect(c, z.x, z.y, z.w, z.h, 26); c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 3; c.setLineDash([10, 10]);
      rrect(c, z.x, z.y, z.w, z.h, 26); c.stroke(); c.setLineDash([]);
      const a = Math.atan2(z.ay, z.ax), ux = Math.cos(a), uy = Math.sin(a);
      c.save(); rrect(c, z.x, z.y, z.w, z.h, 26); c.clip();
      c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 4; c.lineCap = 'round';
      const span = Math.hypot(z.w, z.h);
      for(let i = 0; i < 9; i++){
        const o = ((i * 0.37) % 1 - 0.5) * span, d = ((G.rt * 260 + i * 97) % (span + 120)) - span / 2 - 60;
        const cx = z.x + z.w / 2 + ux * d - uy * o, cy = z.y + z.h / 2 + uy * d + ux * o;
        c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx - ux * 50, cy - uy * 50); c.stroke();
      }
      c.restore();
      // arrow
      c.save(); c.translate(z.x + z.w / 2, z.y + z.h / 2); c.rotate(a);
      c.fillStyle = 'rgba(255,255,255,0.7)';
      for(let k = -1; k <= 1; k++){
        const o = k * 28 + ((G.rt * 40) % 28);
        c.beginPath(); c.moveTo(o + 12, 0); c.lineTo(o - 6, -14); c.lineTo(o - 1, 0); c.lineTo(o - 6, 14); c.fill();
      }
      c.restore();
    }
  },
  trail(c){
    const tr = G.trail;
    if(tr.length < 2) return;
    const sk = RANGS.find(r => r.id === S.rang) || RANGS[0];
    c.lineCap = 'round';
    for(let i = 1; i < tr.length; i++){
      const k = i / tr.length, a = tr[i - 1], b = tr[i];
      c.strokeStyle = sk.trail === 'rainbow' ? `hsl(${(i * 9 + G.rt * 300) % 360},95%,62%)` : (i % 2 ? sk.trail[0] : sk.trail[1]);
      c.globalAlpha = k * 0.85;
      c.lineWidth = 4 + k * (b.h ? 30 : 20);
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    }
    c.globalAlpha = 1;
  },
  rang(c, b){
    const sk = RANGS.find(r => r.id === S.rang) || RANGS[0];
    if(b.ghost){ c.globalAlpha = 0.55; }
    c.save(); c.translate(b.x, b.y); c.rotate(b.spin * 3);
    drawRang(c, sk, 1.7);
    c.restore();
    c.globalAlpha = 1;
    if(G.holding && b.ph === 0){
      c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 3;
      c.beginPath(); c.arc(b.x, b.y, 40 + Math.sin(G.rt * 30) * 3, 0, TAU); c.stroke();
    }
  },
  particles(c){
    for(const p of G.parts){
      const k = 1 - p.life / p.max;
      c.globalAlpha = Math.min(1, k * 1.5);
      c.fillStyle = p.c;
      if(p.k === 1){
        c.strokeStyle = p.c; c.lineWidth = 6 * k;
        c.beginPath(); c.arc(p.x, p.y, 20 + (1 - k) * 70, 0, TAU); c.stroke();
      }else if(p.k === 2 || p.k === 3){
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillRect(-p.sz, -p.sz / 2, p.sz * 2, p.sz);
        c.restore();
      }else{
        c.beginPath(); c.arc(p.x, p.y, p.sz * k, 0, TAU); c.fill();
      }
    }
    c.globalAlpha = 1;
  },
  texts(c){
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for(const t of G.texts){
      const k = t.life / t.max, pop = Math.min(1, t.life * 8), sc = t.size * (0.6 + easeBack(pop) * 0.4);
      c.save(); c.translate(t.x, t.y); this.upright(c); c.scale(sc, sc);
      c.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      c.font = '900 50px ' + FONT;
      c.lineWidth = 9; c.strokeStyle = 'rgba(40,20,70,0.85)'; c.lineJoin = 'round';
      c.strokeText(t.txt, 0, 0);
      c.fillStyle = t.col; c.fillText(t.txt, 0, 0);
      c.restore();
    }
    c.globalAlpha = 1;
  },
  tutHand(c, L){
    const h = handOf(L), hs = this.toScreen(h.x, h.y);
    const t = (G.tutT % 2.2) / 2.2;
    const dir = this.V.port ? { x: -0.35, y: 1 } : { x: -1, y: 0.45 };
    const l = Math.hypot(dir.x, dir.y), d = Math.min(this.W, this.H) * 0.22 * clamp((t - 0.15) / 0.5, 0, 1);
    const x = hs.x + 30 + dir.x / l * d, y = hs.y + 40 + dir.y / l * d;
    const a = t > 0.8 ? 1 - (t - 0.8) / 0.2 : Math.min(1, t * 6);
    c.globalAlpha = a;
    c.fillStyle = '#ffffff'; c.strokeStyle = '#2b1d55'; c.lineWidth = 4;
    c.beginPath(); c.arc(x, y, t > 0.12 && t < 0.72 ? 16 : 22, 0, TAU); c.fill(); c.stroke();
    if(t > 0.15 && t < 0.72){
      c.setLineDash([6, 8]); c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(hs.x + 30, hs.y + 40); c.lineTo(x, y); c.stroke(); c.setLineDash([]);
    }
    c.globalAlpha = 1;
  }
};

/* ============ shared drawing helpers (also used by the thumbnail) ============ */
const FONT = '"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';
function easeBack(t){ const s = 1.9; t -= 1; return t * t * ((s + 1) * t + s) + 1; }
function rrect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if(k < 0){ r *= 1 + k; g *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function cloud(c, x, y, s){
  c.beginPath();
  c.ellipse(x, y, s, s * 0.45, 0, 0, TAU);
  c.ellipse(x - s * 0.5, y + s * 0.08, s * 0.5, s * 0.35, 0, 0, TAU);
  c.ellipse(x + s * 0.45, y + s * 0.05, s * 0.55, s * 0.38, 0, 0, TAU);
  c.ellipse(x - s * 0.1, y - s * 0.25, s * 0.5, s * 0.42, 0, 0, TAU);
  c.fill();
}
function paintSky(b, W, H, wd, gold, seed){
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, gold ? '#ffb13a' : wd.sky[0]); g.addColorStop(1, gold ? '#fff1b8' : wd.sky[1]);
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  const sun = b.createRadialGradient(W * 0.82, H * 0.16, 0, W * 0.82, H * 0.16, Math.max(W, H) * 0.45);
  sun.addColorStop(0, 'rgba(255,255,230,0.75)'); sun.addColorStop(1, 'rgba(255,255,230,0)');
  b.fillStyle = sun; b.fillRect(0, 0, W, H);
  const hills = (base, amp, col, f, ph) => {
    b.fillStyle = col; b.beginPath(); b.moveTo(0, H);
    for(let x = 0; x <= W + 20; x += 20) b.lineTo(x, base + Math.sin(x * f + ph) * amp + Math.sin(x * f * 2.3 + ph * 2) * amp * 0.4);
    b.lineTo(W, H); b.fill();
  };
  hills(H * 0.74, H * 0.05, wd.hill[0], 0.006, seed);
  hills(H * 0.86, H * 0.035, wd.hill[1], 0.009, seed * 2);
}
function drawRoo(c, t, hat, look, arm, heldRang, cheer){
  const bob = Math.sin(t * 3) * 2 + (cheer ? -Math.abs(Math.sin(t * 9)) * 16 : 0);
  // tail
  c.fillStyle = '#d97c3b';
  c.beginPath(); c.moveTo(-18, -22 + bob); c.quadraticCurveTo(-70, -16, -84, 0); c.quadraticCurveTo(-58, 2, -14, -6 + bob); c.closePath(); c.fill();
  // feet
  c.fillStyle = '#b8622c';
  c.beginPath(); c.ellipse(-4, -5, 28, 9, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(20, -4, 22, 8, 0, 0, TAU); c.fill();
  // haunch + body
  c.fillStyle = '#e58a45';
  c.beginPath(); c.ellipse(-6, -28 + bob * 0.5, 25, 23, 0, 0, TAU); c.fill();
  c.fillStyle = '#f39c52';
  c.beginPath(); c.ellipse(4, -56 + bob, 29, 36, 0.08, 0, TAU); c.fill();
  c.fillStyle = '#ffe2b8';
  c.beginPath(); c.ellipse(12, -50 + bob, 16, 25, 0.1, 0, TAU); c.fill();
  // head
  const hx = 12, hy = -104 + bob;
  const ear = (x, y, r, rot) => {
    c.save(); c.translate(x, y); c.rotate(rot + Math.sin(t * 2.3 + x) * 0.05);
    c.fillStyle = '#e58a45'; c.beginPath(); c.ellipse(0, 0, 9, 24, 0, 0, TAU); c.fill();
    c.fillStyle = '#ffb3a3'; c.beginPath(); c.ellipse(0, 3, 4.5, 16, 0, 0, TAU); c.fill();
    c.restore();
  };
  ear(hx - 14, hy - 30, 9, -0.35);
  ear(hx + 4, hy - 34, 9, 0.12);
  c.fillStyle = '#f39c52'; c.beginPath(); c.arc(hx, hy, 27, 0, TAU); c.fill();
  c.fillStyle = '#ffe2b8'; c.beginPath(); c.ellipse(hx + 19, hy + 9, 17, 12, 0, 0, TAU); c.fill();
  c.fillStyle = '#4a2a1a'; c.beginPath(); c.ellipse(hx + 33, hy + 4, 6.5, 5, 0, 0, TAU); c.fill();
  c.strokeStyle = '#4a2a1a'; c.lineWidth = 2.5; c.lineCap = 'round';
  c.beginPath(); c.arc(hx + 24, hy + 13, 7, 0.2, cheer ? 2.6 : 1.9); c.stroke();
  const lx = Math.cos(look) * 3, ly = Math.sin(look) * 3;
  const blink = (t % 3.7) > 3.55;
  for(const [ex, ey, rx, ry] of [[hx + 4, hy - 7, 8, 10], [hx + 20, hy - 8, 7, 9]]){
    c.fillStyle = '#ffffff';
    c.beginPath(); c.ellipse(ex, ey, rx, blink ? 1.5 : ry, 0, 0, TAU); c.fill();
    if(!blink){
      c.fillStyle = '#2a1a12'; c.beginPath(); c.arc(ex + lx, ey + ly, 4.6, 0, TAU); c.fill();
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(ex + lx + 1.5, ey + ly - 1.8, 1.6, 0, TAU); c.fill();
    }
  }
  c.fillStyle = 'rgba(255,100,120,0.45)'; c.beginPath(); c.ellipse(hx + 6, hy + 11, 6, 3.6, 0, 0, TAU); c.fill();
  drawHat(c, hat, hx, hy, t);
  // arm
  const sx = 8, sy = -70 + bob, ex = sx + Math.cos(arm) * 32, ey = sy + Math.sin(arm) * 32;
  c.strokeStyle = '#e07f3c'; c.lineWidth = 12; c.lineCap = 'round';
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
  if(heldRang){
    c.save(); c.translate(ex, ey); c.rotate(arm + 1.2);
    drawRang(c, RANGS.find(r => r.id === heldRang) || RANGS[0], 1);
    c.restore();
  }
  c.fillStyle = '#f39c52'; c.beginPath(); c.arc(ex, ey, 7.5, 0, TAU); c.fill();
}
function drawHat(c, hat, hx, hy, t){
  c.save(); c.translate(hx, hy - 22);
  switch(hat){
    case 'cap':
      c.fillStyle = '#e8413a'; c.beginPath(); c.arc(0, 4, 22, Math.PI, 0); c.fill();
      c.fillRect(0, 0, 36, 7); c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -16, 4, 0, TAU); c.fill(); break;
    case 'flower':
      for(let i = 0; i < 6; i++){ c.fillStyle = '#ff7fbf'; c.beginPath(); c.arc(Math.cos(i) * 9 - 12, Math.sin(i) * 9 - 2, 7, 0, TAU); c.fill(); }
      c.fillStyle = '#ffe14d'; c.beginPath(); c.arc(-12, -2, 6, 0, TAU); c.fill(); break;
    case 'phones':
      c.strokeStyle = '#2b2b3a'; c.lineWidth = 6; c.beginPath(); c.arc(0, 18, 30, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.fillStyle = '#ff4f8b'; c.beginPath(); c.ellipse(-27, 16, 8, 12, 0, 0, TAU); c.fill(); c.beginPath(); c.ellipse(27, 16, 8, 12, 0, 0, TAU); c.fill(); break;
    case 'pirate':
      c.fillStyle = '#23233a'; c.beginPath(); c.moveTo(-32, 6); c.quadraticCurveTo(0, -40, 32, 6); c.quadraticCurveTo(0, -4, -32, 6); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -8, 5, 0, TAU); c.fill(); break;
    case 'wizard':
      c.fillStyle = '#5a3fd8'; c.beginPath(); c.moveTo(-26, 6); c.lineTo(8, -54); c.lineTo(26, 6); c.closePath(); c.fill();
      c.fillStyle = '#ffe14d'; c.beginPath(); c.arc(4, -20, 4, 0, TAU); c.arc(-8, -2, 3, 0, TAU); c.fill(); break;
    case 'crown':
      c.fillStyle = '#ffd23a'; c.beginPath(); c.moveTo(-20, 6); c.lineTo(-22, -18); c.lineTo(-10, -6); c.lineTo(0, -24); c.lineTo(10, -6); c.lineTo(22, -18); c.lineTo(20, 6); c.closePath(); c.fill();
      c.fillStyle = '#ff4f8b'; c.beginPath(); c.arc(0, -2, 4, 0, TAU); c.fill(); break;
    case 'halo':
      c.strokeStyle = '#ffe98a'; c.lineWidth = 5; c.beginPath(); c.ellipse(0, -18 + Math.sin(t * 3) * 3, 22, 7, 0, 0, TAU); c.stroke(); break;
  }
  c.restore();
}
function drawRang(c, sk, s){
  c.save(); c.scale(s, s);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const path = () => { c.beginPath(); c.moveTo(24, 5); c.lineTo(0, 0); c.lineTo(-8, 23); };
  c.strokeStyle = '#2f1d4a'; c.lineWidth = 15; path(); c.stroke();
  c.strokeStyle = sk.c1; c.lineWidth = 10; path(); c.stroke();
  c.strokeStyle = sk.c2; c.lineWidth = 3; path(); c.stroke();
  c.restore();
}
function drawGem(c, col, t){
  c.globalAlpha = 0.28; c.fillStyle = col;
  c.beginPath(); c.arc(0, 0, 34 + Math.sin(t * 4) * 3, 0, TAU); c.fill();
  c.globalAlpha = 1;
  const pts = [[-17, -8], [-8, -19], [8, -19], [17, -8], [0, 21]];
  c.fillStyle = col; c.strokeStyle = '#2f1d4a'; c.lineWidth = 4; c.lineJoin = 'round';
  c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); c.fill(); c.stroke();

  c.beginPath(); c.moveTo(-8, -19); c.lineTo(8, -19); c.lineTo(4, -8); c.lineTo(-4, -8); c.closePath(); c.fill();
  c.fillStyle = 'rgba(0,0,0,0.18)';
  c.beginPath(); c.moveTo(4, -8); c.lineTo(17, -8); c.lineTo(0, 21); c.closePath(); c.fill();
  const tw = Math.max(0, Math.sin(t * 2.2)) ;
  if(tw > 0.6){
    c.fillStyle = '#fff'; c.save(); c.translate(-9, -12); c.scale(tw, tw);
    c.beginPath(); c.moveTo(0, -8); c.lineTo(2, -2); c.lineTo(8, 0); c.lineTo(2, 2); c.lineTo(0, 8); c.lineTo(-2, 2); c.lineTo(-8, 0); c.lineTo(-2, -2); c.fill();
    c.restore();
  }
}
function drawStar(c, r, t){
  c.globalAlpha = 0.3; c.fillStyle = '#ffe14d';

  c.beginPath();
  for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.48 : r; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#2f1d4a';
  c.beginPath(); c.arc(-6, -2, 2.6, 0, TAU); c.arc(6, -2, 2.6, 0, TAU); c.fill();
}
function drawSpiky(c, r, t){

  for(let i = 0; i < n * 2; i++){ const a = i * Math.PI / n + t * 0.8, rr = i % 2 ? r * 0.82 : r * 1.3; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fill();
  c.fillStyle = '#8a4dff'; c.beginPath(); c.arc(0, 0, r * 0.86, 0, TAU); c.fill();
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(-r * 0.3, -r * 0.08, r * 0.2, r * 0.24, 0, 0, TAU); c.ellipse(r * 0.3, -r * 0.08, r * 0.2, r * 0.24, 0, 0, TAU); c.fill();
  c.fillStyle = '#1b0f33';
  c.beginPath(); c.arc(-r * 0.27, -r * 0.02, r * 0.1, 0, TAU); c.arc(r * 0.27, -r * 0.02, r * 0.1, 0, TAU); c.fill();
  c.strokeStyle = '#1b0f33'; c.lineWidth = Math.max(2, r * 0.1); c.lineCap = 'round';
  c.beginPath(); c.moveTo(-r * 0.5, -r * 0.4); c.lineTo(-r * 0.12, -r * 0.26); c.moveTo(r * 0.5, -r * 0.4); c.lineTo(r * 0.12, -r * 0.26); c.stroke();

function drawSaw(c, r){
  c.fillStyle = '#c9d3de'; c.strokeStyle = '#3a4250'; c.lineWidth = 3;
  c.beginPath();
  for(let i = 0; i < 24; i++){ const a = i * TAU / 24, rr = i % 2 ? r * 0.9 : r * 1.22; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#8994a3'; c.beginPath(); c.arc(0, 0, r * 0.55, 0, TAU); c.fill();
  c.fillStyle = '#ff4f5a'; c.beginPath(); c.arc(0, 0, r * 0.22, 0, TAU); c.fill();
}
function drawBumper(c, r, k){
  const g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#ffd6f4'); g.addColorStop(1, k > 0.3 ? '#ff4fb8' : '#ff7ad0');
  c.fillStyle = g; c.strokeStyle = '#a2317c'; c.lineWidth = 5;
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.ellipse(-r * 0.35, -r * 0.4, r * 0.25, r * 0.14, -0.6, 0, TAU); c.fill();
  c.strokeStyle = '#5a1646'; c.lineWidth = 4; c.lineCap = 'round';
  if(k > 0.3){ c.beginPath(); c.moveTo(-r * 0.4, -r * 0.1); c.lineTo(-r * 0.15, 0); c.moveTo(r * 0.4, -r * 0.1); c.lineTo(r * 0.15, 0); c.stroke(); }
  else{ c.beginPath(); c.arc(-r * 0.27, 0, r * 0.12, Math.PI, 0); c.moveTo(r * 0.39, 0); c.arc(r * 0.27, 0, r * 0.12, 0, Math.PI, true); c.stroke(); }
  c.beginPath(); c.arc(0, r * 0.22, r * 0.18, 0.1, Math.PI - 0.1); c.stroke();
}
function drawPortal(c, x, y, col, t){
  c.save(); c.translate(x, y);
  const g = c.createRadialGradient(0, 0, 4, 0, 0, P.portR);
  g.addColorStop(0, '#140a30'); g.addColorStop(0.7, '#2a1660'); g.addColorStop(1, col);

/* ============ THE THUMBNAIL SCENE ============
   Drawn by the game itself so Poki's thumbnail, the animated thumbnail and
   the first frame of the game are the same picture. t=0 is the still.
   The animation loops seamlessly every 5 seconds. */
const THUMB_T = 5;
function drawThumb(c, W, H, t){
  const u = Math.min(W, H) / 1000, ox = (W - 1000 * u) / 2, oy = (H - 1000 * u) / 2;
  const w = TAU / THUMB_T;
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2aa9ff'); g.addColorStop(0.7, '#9fe4ff'); g.addColorStop(1, '#d9f7ff');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.translate(ox, oy); c.scale(u, u);
  const L0 = -ox / u, R0 = (W - ox) / u, B0 = (H - oy) / u, T0 = -oy / u;
  // glow behind the loop
  const cx = 560, cy = 420, R = 292;
  const gl = c.createRadialGradient(cx, cy, 40, cx, cy, 520);
  gl.addColorStop(0, 'rgba(255,255,220,0.95)'); gl.addColorStop(0.45, 'rgba(255,245,200,0.35)'); gl.addColorStop(1, 'rgba(255,245,200,0)');
  c.fillStyle = gl; c.fillRect(L0, T0, R0 - L0, B0 - T0);
  // sun rays
  c.save(); c.translate(cx, cy); c.rotate(t * w * 0.25);
  c.fillStyle = 'rgba(255,255,255,0.16)';
  for(let i = 0; i < 12; i++){ c.rotate(TAU / 12); c.beginPath(); c.moveTo(0, 0); c.lineTo(900, -70); c.lineTo(900, 70); c.fill(); }
  c.restore();
  // clouds
  c.fillStyle = 'rgba(255,255,255,0.9)';
  cloud(c, 130 + Math.sin(t * w) * 8, 150, 80);
  cloud(c, 900 + Math.sin(t * w + 2) * 10, 110, 60);
  cloud(c, L0 + 60, 330, 70); cloud(c, R0 - 40, 380, 90);
  // hills
  const hills = (base, amp, col, f, ph) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(L0, B0 + 10);
    for(let x = L0; x <= R0 + 20; x += 20) c.lineTo(x, base + Math.sin(x * f + ph) * amp);
    c.lineTo(R0 + 20, B0 + 10); c.closePath(); c.fill();
  };
  hills(800, 30, '#8fdc62', 0.008, 1);
  hills(890, 22, '#5fbf4a', 0.012, 3);
  // spiky danger
  c.save(); c.translate(870, 170 + Math.sin(t * w * 2) * 10); drawSpiky(c, 44, t * w); c.restore();
  // Roo's island + Roo
  const rx = 265, ry = 830;
  c.save(); c.translate(rx, ry);
  c.fillStyle = '#3f9a38'; c.beginPath(); c.moveTo(-170, 10); c.quadraticCurveTo(-80, 150, 0, 160); c.quadraticCurveTo(80, 150, 170, 10); c.closePath(); c.fill();
  c.fillStyle = '#6fcf52'; c.beginPath(); c.ellipse(0, 10, 175, 34, 0, 0, TAU); c.fill();
  c.fillStyle = '#a5ec7c'; c.beginPath(); c.ellipse(-20, 2, 120, 14, 0, 0, TAU); c.fill();
  c.restore();
  // the loop
  const th0 = 5.62, hand = 2.48;                      // rang angle at t=0, angle where the loop meets Roo's paw
  const ph = th0 + t * w * 2;                         // two loops per 5 s
  const at = a => ({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R });
  // rainbow ribbon trail
  c.lineCap = 'round';
  const N = 46, span = 2.9;
  for(let i = 1; i <= N; i++){
    const k = i / N, a0 = ph - span * (1 - (i - 1) / N), a1 = ph - span * (1 - k);
    const p0 = at(a0), p1 = at(a1);
    c.strokeStyle = `hsl(${(i * 8 + 330) % 360},95%,60%)`; c.globalAlpha = 0.25 + k * 0.75;
    c.lineWidth = 8 + k * 34;
    c.beginPath(); c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y); c.stroke();
  }
  c.globalAlpha = 1;
  // gems around the loop: collected as the rang passes, pop back in behind it
  const gemA = [0.3, 0.95, 1.55, 3.55, 4.25, 4.95], cols = ['#ff4f8b', '#3ad8ff', '#4dffb0', '#ffe14d', '#b98cff', '#ff8a3a'];
  gemA.forEach((ga, i) => {
    const since = ((ph - ga) % TAU + TAU) % TAU;
    const p = at(ga);
    if(since < 0.35){
      // just collected: sparkle burst
      const k = since / 0.35;
      c.strokeStyle = '#fff'; c.lineWidth = 8 * (1 - k); c.globalAlpha = 1 - k;
      c.beginPath(); c.arc(p.x, p.y, 20 + k * 70, 0, TAU); c.stroke(); c.globalAlpha = 1;
      return;
    }
    const sc = since < 1.6 ? 0 : since < 2.0 ? easeBack((since - 1.6) / 0.4) : 1;
    if(sc <= 0) return;
    c.save(); c.translate(p.x, p.y + Math.sin(t * w * 3 + i) * 5); c.scale(1.7 * sc, 1.7 * sc); drawGem(c, cols[i], t * w * 2 + i); c.restore();
  });
  // bonus star inside the loop
  c.save(); c.translate(560, 430 + Math.sin(t * w * 2) * 8); c.rotate(Math.sin(t * w * 2) * 0.15); drawStar(c, 52, t * w * 2); c.restore();
  // Roo (looks at the rang, flicks the paw when it passes)
  const r = at(ph), pass = Math.abs(angDiff(ph % TAU, hand));
  const look = Math.atan2(r.y - (ry - 260), r.x - rx);
  const arm = pass < 0.5 ? lerp(-2.4, -0.3, pass / 0.5) : look - 0.2;
  c.save(); c.translate(rx, ry); c.scale(2.75, 2.75);
  drawRoo(c, t * w * 2, 'none', look, arm, null, false);
  c.restore();
  // the boomerang itself, big, with speed lines
  c.save(); c.translate(r.x, r.y);
  c.globalAlpha = 0.6; c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(0, 0, 70, 0, TAU); c.fill(); c.globalAlpha = 1;
  c.rotate(t * w * 20); drawRang(c, RANGS[6], 3.3); c.restore();
  // sparkles
  for(let i = 0; i < 9; i++){
    const a = i * 0.7 + t * w, x = 180 + ((i * 263) % 700), y = 90 + ((i * 181) % 600), k = Math.max(0, Math.sin(a * 2));
    c.fillStyle = '#ffffff'; c.save(); c.translate(x, y); c.scale(k * 1.6, k * 1.6);
    c.beginPath(); c.moveTo(0, -10); c.lineTo(2.5, -2.5); c.lineTo(10, 0); c.lineTo(2.5, 2.5); c.lineTo(0, 10); c.lineTo(-2.5, 2.5); c.lineTo(-10, 0); c.lineTo(-2.5, -2.5); c.fill();
    c.restore();
  }
  c.restore();
}

</script>
<script>
'use strict';
/* DOM overlays: HUD, level clear, menu, level select, customize. */
const $ = id => document.getElementById(id);
const UI = {
  lowFx: false, tipTimer: 0, lvTab: 0, shTab: 'rang',

  init(){
    this.lowFx = (navigator.hardwareConcurrency || 4) <= 2;
    const tap = (id, fn) => $(id).addEventListener('click', e => { if(SDK.adBusy) return; AU.unlock(); AU.click(); fn(e); });
    tap('menuBtn', () => this.togglePause());
    tap('restartBtn', () => restartLevel());
    tap('hintBtn', () => this.askHint());
    tap('skipBtn', () => this.askSkip());
    tap('clNext', () => this.closeClear(() => nextLevel()));
    tap('clReplay', () => this.closeClear(() => { const n = G.daily ? null : G.n; irisOut(() => SDK.commercial(() => { n ? startLevel(n) : startLevel(0, { daily: true }); irisIn(); })); }));
    tap('clDouble', () => this.doubleCoins());
    tap('mResume', () => this.togglePause());
    tap('mLevels', () => this.openLevels());
    tap('mShop', () => this.openShop());
    tap('mDaily', () => this.playDaily());
    tap('tSfx', () => { S.sfx = S.sfx ? 0 : 1; persist(); AU.apply(); this.syncToggles(); });
    tap('tMus', () => { S.music = S.music ? 0 : 1; persist(); AU.apply(); this.syncToggles(); });
    document.querySelectorAll('.back').forEach(b => b.addEventListener('click', () => { AU.click(); this.hide(b.closest('.screen').id); this.show('menu'); }));
    document.querySelectorAll('#shop .tabs button').forEach(b => b.addEventListener('click', () => {
      AU.click(); this.shTab = b.dataset.tab;
      document.querySelectorAll('#shop .tabs button').forEach(x => x.classList.toggle('on', x === b));
      this.renderShop();
    }));
    // clicks on overlays never leak into the game
    document.querySelectorAll('.screen, #hud button').forEach(el => el.addEventListener('pointerdown', e => e.stopPropagation()));
    setTimeout(() => { if(G.st === 'intro') $('logo').classList.remove('hidden'); }, 1000);
    this.syncToggles();
  },
  show(id){ $(id).classList.remove('hidden'); },
  hide(id){ $(id).classList.add('hidden'); },
  modalOpen(){ return ['clear', 'menu', 'levels', 'shop'].some(id => !$(id).classList.contains('hidden')); },
  showHud(on){ $('hud').classList.toggle('hidden', !on); if(on) this.hide('logo'); },
  toast(txt){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = txt; $('toasts').appendChild(d); setTimeout(() => d.remove(), 1900); },

  hud(){
    if(!G.L) return;
    $('lvlTxt').textContent = G.daily ? 'DAILY' : 'LEVEL ' + G.n;
    $('coinTxt').textContent = S.coins;
    this.pips();
    this.failCount();
  },
  pips(){
    const L = G.L, got = G.b && G.st !== 'reset' ? G.b.got : 0;
    let h = '';
    for(let i = 0; i < L.gems.length; i++) h += `<i class="${i < got ? 'on' : ''}"></i>`;
    $('pips').innerHTML = h;
  },
  failCount(){
    $('hintBtn').classList.toggle('pulse', G.fails >= 3 && !G.hint);
    $('skipBtn').classList.toggle('hidden', G.fails < 5 || G.daily);
    $('hintBtn').classList.toggle('hidden', G.hint);
    const free = !G.daily && G.n <= 3;
    $('hintBtn').querySelector('.ad').classList.toggle('hidden', free);
  },
  banner(a, b, c){
    const el = $('banner');
    el.querySelector('b').textContent = a; el.querySelector('span').textContent = b; el.querySelector('small').textContent = c;
    el.classList.add('hidden'); void el.offsetWidth; el.classList.remove('hidden');
    clearTimeout(this.banT); this.banT = setTimeout(() => el.classList.add('hidden'), 2700);
  },
  tip(txt, ms){
    const el = $('tip');
    el.textContent = txt; el.classList.add('hidden'); void el.offsetWidth; el.classList.remove('hidden');
    clearTimeout(this.tipTimer);
    if(ms) this.tipTimer = setTimeout(() => el.classList.add('hidden'), ms);
  },
  tutorialStart(){
    if(!S.tut && G.n === 1) this.tip('Drag back & let go to throw!');
    else if(G.n === 6 && !S.holdTut) this.tip('New! HOLD the screen while it flies to curve tighter', 6000);
  },
  tutorialThrown(){
    if(!S.tut){ S.tut = 1; persist(); this.tip('Loop through every gem, then catch it!', 3500); }
    else if(G.n >= 6 && !S.holdTut){ S.holdTut = 1; persist(); this.tip('Hold = tighter curve!', 2500); }
    else $('tip').classList.add('hidden');
  },

  /* ---------- ads (always opt-in) ---------- */
  askHint(){
    const give = () => { G.hint = true; this.failCount(); this.toast('Follow the golden path!'); if(G.st !== 'aim') toAim(); };
    if(!G.daily && G.n <= 3){ give(); return; }
    SDK.rewarded('small', ok => ok ? give() : this.toast('No hint this time'));
  },
  askSkip(){
    SDK.rewarded('medium', ok => {
      if(!ok){ this.toast('Could not skip right now'); return; }
      if(G.n >= S.lvl) S.lvl = G.n + 1;
      persist();
      irisOut(() => { startLevel(G.n + 1); irisIn(); });
    });
  },
  doubleCoins(){
    const info = G.clearInfo;
    if(!info || info.doubled) return;
    SDK.rewarded('small', ok => {
      if(!ok) return;
      info.doubled = true; S.coins += info.coins; persist();
      $('clCoins').textContent = '+' + info.coins * 2;
      $('clDouble').classList.add('hidden');
      AU.coin(); this.hud();
    });
  },

  /* ---------- level clear ---------- */
  showClear(info){
    this.show('clear');
    $('clTitle').textContent = G.daily ? 'DAILY CLEARED!' : ['NICE!', 'GREAT!', 'PERFECT!'][info.stars - 1];
    const st = $('clStars').children;
    [...st].forEach(s => s.classList.remove('on'));
    for(let i = 0; i < info.stars; i++) setTimeout(() => { st[i].classList.add('on'); AU.starPop(i); }, 250 + i * 280);
    $('clR1').classList.add('on');
    $('clR2').classList.toggle('on', info.star);
    $('clR3').classList.toggle('on', info.fast);
    $('clR3').textContent = `⚡ Fast catch: ${info.time.toFixed(1)}s (goal ${G.L.par}s)`;
    $('clCoins').textContent = '+' + info.coins;
    $('clDouble').classList.remove('hidden');
    const ch = $('clChest');
    if(info.chest){
      ch.classList.remove('hidden');
      if(info.chest.kind === 'coins') ch.innerHTML = '🎁 Treasure chest: +500 coins!';
      else{
        ch.innerHTML = '';
        ch.appendChild(this.preview(info.chest.kind, info.chest.it.id));
        const s = document.createElement('span'); s.textContent = `🎁 Chest unlocked: ${info.chest.it.name}!`; ch.appendChild(s);
      }
    }else ch.classList.add('hidden');
    this.hud();
  },
  closeClear(fn){ this.hide('clear'); fn(); },

  /* ---------- menu ---------- */
  togglePause(){
    if(G.st === 'intro' || !$('clear').classList.contains('hidden')) return;
    const open = !$('menu').classList.contains('hidden') || !$('levels').classList.contains('hidden') || !$('shop').classList.contains('hidden');
    if(open){
      ['menu', 'levels', 'shop'].forEach(id => this.hide(id));
      G.paused = false;
    }else{
      G.paused = true; G.aim = null; G.holding = false;
      SDK.gameplayStop();
      const d = S.daily.day === dayNum() && S.daily.done;
      $('mDaily').textContent = d ? `📅 DAILY DONE · 🔥${S.daily.streak}` : `📅 DAILY CHALLENGE${S.daily.streak ? ' · 🔥' + S.daily.streak : ''}`;
      this.show('menu');
    }
  },
  syncToggles(){ $('tSfx').classList.toggle('off', !S.sfx); $('tMus').classList.toggle('off', !S.music); },
  primaryAction(){
    if(!$('clear').classList.contains('hidden')) $('clNext').click();
    else if(!$('menu').classList.contains('hidden')) $('mResume').click();
  },
  resumeInto(fn){
    ['menu', 'levels', 'shop'].forEach(id => this.hide(id));
    G.paused = false;
    irisOut(() => SDK.commercial(() => { fn(); irisIn(); }));
  },
  playDaily(){
    if(S.daily.day === dayNum() && S.daily.done){ this.toast('Come back tomorrow for a new one!'); }
    this.resumeInto(() => startLevel(0, { daily: true }));
  },

  /* ---------- level select ---------- */
  openLevels(){
    this.hide('menu'); this.show('levels');
    this.lvTab = Math.min(Math.floor((G.daily ? S.cur - 1 : G.n - 1) / LEVELS_PER_WORLD), this.maxTab());
    this.renderLevels();
  },
  maxTab(){ return Math.floor((S.lvl - 1) / LEVELS_PER_WORLD); },
  renderLevels(){
    $('lvStars').textContent = '★ ' + totalStars();
    const tabs = $('lvTabs'); tabs.innerHTML = '';
    const nt = Math.max(WORLDS.length, this.maxTab() + 1);
    for(let i = 0; i < nt; i++){
      const b = document.createElement('button');
      b.textContent = i < WORLDS.length ? String(i + 1) : '★' + (i - WORLDS.length + 1);
      b.className = (i === this.lvTab ? 'on' : '') + (i > this.maxTab() ? ' lock' : '');
      b.onclick = () => { if(i > this.maxTab()) { this.toast('Clear the world before it first!'); return; } AU.click(); this.lvTab = i; this.renderLevels(); };
      tabs.appendChild(b);
    }
    $('lvName').textContent = this.lvTab < WORLDS.length ? WORLDS[this.lvTab].name : 'Bonus levels';
    const g = $('lvGrid'); g.innerHTML = '';
    for(let k = 0; k < LEVELS_PER_WORLD; k++){
      const n = this.lvTab * LEVELS_PER_WORLD + k + 1, b = document.createElement('button');
      const st = S.stars[n] || 0, lock = n > S.lvl;
      b.className = lock ? 'lock' : n === S.lvl ? 'cur' : '';
      b.innerHTML = lock ? '🔒' : `${n}<small>${'★'.repeat(st)}${'☆'.repeat(3 - st)}</small>`;
      b.onclick = () => { if(lock) return; AU.click(); this.resumeInto(() => startLevel(n)); };
      g.appendChild(b);
    }
  },

  /* ---------- customize ---------- */
  openShop(){ this.hide('menu'); this.show('shop'); this.renderShop(); },
  preview(kind, id){
    const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
    const c = cv.getContext('2d');
    if(kind === 'rang'){ c.translate(58, 50); c.rotate(-0.3); drawRang(c, RANGS.find(r => r.id === id), 2.2); }
    else{ c.translate(50, 212); c.scale(1.15, 1.15); drawRoo(c, 1, id, 0, 0.9, null, false); }
    return cv;
  },
  renderShop(){
    $('shCoins').textContent = S.coins;
    const g = $('shGrid'); g.innerHTML = '';
    const list = this.shTab === 'rang' ? RANGS : HATS;
    for(const it of list){
      const own = !!S.own[it.id], eq = (this.shTab === 'rang' ? S.rang : S.hat) === it.id;
      const b = document.createElement('button');
      b.className = (eq ? 'eq' : '') + (!own && S.coins < it.price ? ' cant' : '');
      b.appendChild(this.preview(this.shTab, it.id));
      const nm = document.createElement('div'); nm.textContent = it.name; b.appendChild(nm);
      const pr = document.createElement('div'); pr.className = own ? '' : 'price coin';
      pr.textContent = eq ? 'EQUIPPED' : own ? 'OWNED' : it.price; b.appendChild(pr);
      b.onclick = () => {
        if(!own){
          if(S.coins < it.price){ AU.miss(); this.toast('Need more coins: clear levels!'); return; }
          S.coins -= it.price; S.own[it.id] = 1; AU.buy();
        }else AU.click();
        if(this.shTab === 'rang') S.rang = it.id; else S.hat = it.id;
        persist(); this.renderShop(); this.hud();
      };
      g.appendChild(b);
    }
  }
};

boot();

</script>
