<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2aa9ff">
<meta name="description" content="LOOPERANG: throw a magic boomerang, loop it through every gem and catch it on the way back. 80 levels, 8 worlds, endless bonus levels.">
<title>LOOPERANG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232aa9ff%22/%3E%3Cpath d=%22M12 5L7 7L5 12%22 fill=%22none%22 stroke=%22%23ffd23a%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script id="pokiSdk" src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js" async></script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="logo" class="hidden"><span>LOOP</span><span>ERANG</span><small>tap to play</small></div>

<!-- ============ HUD (top-center kept free for the Poki pill) ============ -->
<div id="hud" class="hidden">
  <div id="hL">
    <div class="row"><button id="menuBtn" class="ico" aria-label="Menu">≡</button><button id="restartBtn" class="ico" aria-label="Restart">↻</button></div>
    <div id="lvlTxt">LEVEL 1</div>
    <div id="pips"></div>
  </div>
  <div id="hR">
    <div id="coinTxt" class="coin">0</div>
    <div class="row">
      <button id="skipBtn" class="pill hidden"><i class="ad">▶</i>SKIP</button>
      <button id="hintBtn" class="pill"><i class="ad">▶</i>💡 HINT</button>
    </div>
  </div>
</div>
<div id="banner" class="hidden"><b></b><span></span><small></small></div>
<div id="tip" class="hidden"></div>

<!-- ============ LEVEL CLEAR ============ -->
<div id="clear" class="screen hidden"><div class="card">
  <div class="ttl" id="clTitle">LEVEL CLEAR!</div>
  <div id="clStars"><i></i><i></i><i></i></div>
  <div id="clRows">
    <div class="clRow" id="clR1">✔ Caught it with every gem</div>
    <div class="clRow" id="clR2">★ Bonus star</div>
    <div class="clRow" id="clR3">⚡ Fast catch</div>
  </div>
  <div id="clChest" class="hidden"></div>
  <div id="clCoins" class="coin big">+0</div>
  <div class="btns">
    <button id="clReplay" class="btn ghost" aria-label="Replay">↻</button>
    <button id="clDouble" class="btn gold"><i class="ad">▶</i>×2 COINS</button>
    <button id="clNext" class="btn go">NEXT ▶</button>
  </div>
</div></div>

<!-- ============ MENU ============ -->
<div id="menu" class="screen hidden"><div class="card">
  <div class="ttl">PAUSED</div>
  <button id="mResume" class="btn go wide">▶ RESUME</button>
  <button id="mLevels" class="btn wide">🗺 LEVELS</button>
  <button id="mShop" class="btn wide">🎨 CUSTOMIZE</button>
  <button id="mDaily" class="btn wide">📅 DAILY CHALLENGE</button>
  <div class="tog"><button id="tSfx" class="btn small">🔊 SOUND</button><button id="tMus" class="btn small">🎵 MUSIC</button></div>
</div></div>

<div id="levels" class="screen hidden"><div class="card wide">
  <div class="ttl">LEVELS <small id="lvStars"></small></div>
  <div id="lvTabs" class="tabs"></div>
  <div id="lvName"></div>
  <div id="lvGrid"></div>
  <button class="btn ghost back">BACK</button>
</div></div>

<div id="shop" class="screen hidden"><div class="card wide">
  <div class="ttl">CUSTOMIZE <small class="coin" id="shCoins"></small></div>
  <div class="tabs"><button data-tab="rang" class="on">BOOMERANGS</button><button data-tab="hat">HATS</button></div>
  <div id="shGrid"></div>
  <button class="btn ghost back">BACK</button>
</div></div>

<div id="toasts"></div>

<script src="js/sdk.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
