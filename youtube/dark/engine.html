<!doctype html><meta charset="utf-8"><title>BHA tape engine</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="out"></canvas>
<script>
/* =========================================================================
   BUREAU OF HOUSEHOLD ATTENTION — "Bulletin 01: THE GLOW"
   Procedural 2D scenes -> one-pass VHS degradation (wobble, chroma bleed,
   scanlines, grain, tracking band, head-switch noise) -> bloom + vignette.
   Every frame is a pure function of time t.
   ========================================================================= */
const out=document.getElementById('out'), oc=out.getContext('2d');
const sc=document.createElement('canvas'); let c=sc.getContext('2d',{willReadFrequently:true}); const mainCtx=c;
const lcv=document.createElement('canvas'); const lctx=lcv.getContext('2d'); let U=1;
const PI=Math.PI, cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={lin:x=>x,io:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,out:x=>1-Math.pow(1-x,3),in:x=>x*x};
function kf(t,p,e='io'){if(t<=p[0][0])return p[0][1];for(let i=0;i<p.length-1;i++){const[a,v0]=p[i],[b,v1]=p[i+1];if(t<b)return v0+(v1-v0)*E[e](cl((t-a)/(b-a)))}return p[p.length-1][1]}
const rnd=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
let META={date:'AUG 14 1994',sub:'HOME SAFETY BULLETIN 01  —  "THE GLOW"',ghost:'look up'};
let LAND=true,SW=1440,SH=1080,OW=1920,OH=1080,FOCUS=720,KZ=1,LW=1440;
const GL='110,180,255';

/* ---------- drawing helpers (logical space 1440x1080) ---------- */
function rr(x,y,w,h,r,f,s,lw=3){c.beginPath();c.roundRect(x,y,w,h,r);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw;c.stroke()}}
function lg(x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function rg(x,y,r0,r1,stops){const g=c.createRadialGradient(x,y,r0,x,y,r1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function glowFill(fn,blur=18,col=`rgba(${GL},.6)`){c.save();c.shadowColor=col;c.shadowBlur=blur;fn();c.restore()}

/* ---------- people (faceless silhouettes, seen from behind) ---------- */
function person(x,y,o={}){
  const d=Object.assign({s:1,lean:0,rot:0,stand:false,turn:0,rim:.6,armUp:0,armReach:0,rimCol:GL},o);
  c.save();c.translate(x,y);c.scale(d.s,d.s);c.rotate(d.rot*PI/180);
  const body=()=>{
    c.beginPath();
    c.moveTo(-118,14);c.bezierCurveTo(-110,-30,-70,-52,-30,-56);c.lineTo(30,-56);c.bezierCurveTo(70,-52,110,-30,118,14);
    c.lineTo(126,d.stand?520:300);c.lineTo(-126,d.stand?520:300);c.closePath();
  };
  // shadowed body
  c.fillStyle='#04060b';body();c.fill();
  // neck + head (turn shifts head sideways slightly)
  c.beginPath();c.ellipse(d.turn*14,-108,40,50,0,0,PI*2);c.fillStyle='#04060b';c.fill();
  c.fillRect(-16+d.turn*8,-70,32,26);
  // hair cap
  c.beginPath();c.ellipse(d.turn*14,-120,42,44,0,PI,0);c.fillStyle='#02030a';c.fill();
  // rim light from the screen (top edges)
  c.save();c.globalCompositeOperation='lighter';c.lineWidth=5;c.strokeStyle=`rgba(${d.rimCol},${.55*d.rim})`;c.shadowColor=`rgba(${d.rimCol},.8)`;c.shadowBlur=14;
  c.beginPath();c.moveTo(-118,14);c.bezierCurveTo(-110,-30,-70,-52,-30,-56);c.stroke();
  c.beginPath();c.moveTo(30,-56);c.bezierCurveTo(70,-52,110,-30,118,14);c.stroke();
  c.beginPath();c.ellipse(d.turn*14,-108,40,50,0,PI*1.1,PI*1.9);c.stroke();
  c.restore();
  c.restore();
}
function reachArm(x,y,prog,s=1){ // partner's hand reaching toward a shoulder
  c.save();c.translate(x,y);c.scale(s,s);
  const ex=-40+ (1-prog)*90, ey=120+(1-prog)*120;
  c.strokeStyle='#04060b';c.lineWidth=34;c.lineCap='round';c.beginPath();c.moveTo(70,-20);c.quadraticCurveTo(80,60,ex+30,ey-40);c.lineTo(ex,ey);c.stroke();
  c.beginPath();c.ellipse(ex-8,ey+8,20,26,-.4,0,PI*2);c.fillStyle='#04060b';c.fill();
  c.save();c.globalCompositeOperation='lighter';c.strokeStyle=`rgba(${GL},.35)`;c.lineWidth=4;c.beginPath();c.ellipse(ex-8,ey+8,20,26,-.4,PI*1.1,PI*1.8);c.stroke();c.restore();
  c.restore();
}

/* ---------- the room ---------- */
function screenNoise(x,y,w,h,t,amt=1){
  c.save();c.beginPath();c.roundRect(x,y,w,h,22);c.clip();
  c.fillStyle=lg(x,y,x,y+h,[[0,'#cfe6ff'],[1,'#7fb0e8']]);c.fillRect(x,y,w,h);
  for(let i=0;i<60;i++){const r=rnd(i*3.1+Math.floor(t*12));c.fillStyle=`rgba(255,255,255,${.05+.1*rnd(i+7+Math.floor(t*12))})`;c.fillRect(x+rnd(i+1)*w,y+rnd(i*2.3+Math.floor(t*12))*h,w*.3*r,4+r*8)}
  const by=y+((t*60)%(h+80))-40;c.fillStyle='rgba(20,40,80,.18)';c.fillRect(x,by,w,36);
  c.fillStyle=`rgba(10,20,40,${.25*(1-amt)})`;c.fillRect(x,y,w,h);
  c.restore();
}
function clockFace(x,y,r,t,o={}){
  const d=Object.assign({speed:1,eyeHint:false,ghost:false},o);
  c.save();c.translate(x,y);
  c.beginPath();c.arc(0,0,r,0,PI*2);c.fillStyle='#d9d3c1';c.fill();c.lineWidth=r*.09;c.strokeStyle='#1a1410';c.stroke();
  c.fillStyle='#1a1410';c.font=`700 ${r*.22}px Georgia,serif`;c.textAlign='center';c.textBaseline='middle';
  for(let i=1;i<=12;i++){const a=i/12*PI*2-PI/2;c.fillText(String(i),Math.cos(a)*r*.76,Math.sin(a)*r*.76)}
  const h=t*d.speed;
  const hand=(a,l,w)=>{c.strokeStyle='#1a1410';c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.lineTo(Math.sin(a)*l,-Math.cos(a)*l);c.stroke()};
  hand(h*.02,r*.5,r*.07);hand(h*.24,r*.75,r*.045);c.strokeStyle='#8a1c1c';hand(h*1.4+Math.sin(h*.7)*.6,r*.82,r*.02);
  c.beginPath();c.arc(0,0,r*.05,0,PI*2);c.fillStyle='#1a1410';c.fill();
  c.restore();
}
function room(t,o={}){
  const d=Object.assign({glow:.7,tv:1,clock:true,clockSpeed:1,window:true,sky:0,dim:0,people:null},o);
  // wall + floor
  c.fillStyle=lg(0,0,0,640,[[0,'#101b26'],[1,'#0a131b']]);c.fillRect(0,0,1440,640);
  c.globalAlpha=.055;c.fillStyle='#a8c8e8';for(let x=0;x<1440;x+=64)c.fillRect(x,0,3,640);c.globalAlpha=1;
  c.fillStyle=lg(0,640,0,1080,[[0,'#0a1218'],[1,'#04070b']]);c.fillRect(0,640,1440,440);
  c.fillStyle='#070c11';c.fillRect(0,624,1440,18);
  // window (left) with a tired night sky
  if(d.window){
    const sk=d.sky; const top=`rgb(${Math.round(8+70*sk)},${Math.round(14+90*sk)},${Math.round(34+110*sk)})`;
    rr(70,150,250,330,6,lg(0,150,0,480,[[0,top],[1,'#101a2c']]),'#03060a',10);
    c.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<14;i++)c.fillRect(90+rnd(i)*210,340+rnd(i+9)*120,4+rnd(i+3)*6,4+rnd(i+5)*4);
    c.fillStyle='#03060a';c.fillRect(190,150,10,330);c.fillRect(70,310,250,10);
    c.fillStyle='rgba(120,180,255,.09)';c.fillRect(70,150,250,330);
  }
  // pictures on the wall
  rr(1010,180,150,190,4,'#0c1218','#05090d',8);rr(1030,200,110,150,2,'#15222e');
  rr(1200,230,110,80,4,'#0c1218','#05090d',8);rr(1214,244,82,52,2,'#14202b');
  if(d.clock)clockFace(1140,520,58,t,{speed:d.clockSpeed});
  // TV cabinet + set
  rr(440,614,560,130,8,'#080c11','#04070a',4);
  rr(560,330,320,270,20,'#16191e','#05070a',6);
  if(d.tv)screenNoise(585,356,270,212,t,1);else rr(585,356,270,212,22,'#04070b');
  c.fillStyle='#0b0e12';c.fillRect(600,598,240,10);
  // screen glow, floor spill (additive)
  c.save();c.globalCompositeOperation='lighter';
  const flick=1+.05*Math.sin(t*5.3)+.03*Math.sin(t*11.7);
  const gl=d.glow*d.tv*flick;
  c.fillStyle=rg(720,462,20,980,[[0,`rgba(${GL},${.62*gl})`],[.3,`rgba(50,110,190,${.24*gl})`],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,1440,1080);
  c.beginPath();c.moveTo(590,744);c.lineTo(850,744);c.lineTo(1340,1080);c.lineTo(100,1080);c.closePath();
  c.fillStyle=lg(0,744,0,1080,[[0,`rgba(90,160,240,${.24*gl})`],[1,`rgba(90,160,240,${.05*gl})`]]);c.fill();
  c.restore();
  if(d.people)d.people();
  // sofa back (in front of people)
  rr(200,806,1040,330,70,'#070a10');
  c.save();c.globalCompositeOperation='lighter';c.strokeStyle=`rgba(${GL},${.18*gl})`;c.lineWidth=4;c.beginPath();c.moveTo(250,812);c.lineTo(1190,812);c.stroke();c.restore();
  rr(150,850,90,290,36,'#06090e');rr(1200,850,90,290,36,'#06090e');
  if(d.dim){c.fillStyle=`rgba(0,0,0,${d.dim})`;c.fillRect(0,0,1440,1080)}
}

/* ---------- other scene types ---------- */
function facade(t,o={}){
  const d=Object.assign({zoom:1,fk:1,stand:[2,4],cols:9,rows:9,sync:1,standProb:0,offProb:0,bubbleFrac:1,loneText:null,focus:null},o);
  const cols=d.cols,rows=d.rows,ww=90,wh=100,gx=44,gy=42,gw=cols*(ww+gx)-gx,gh=rows*(wh+gy)-gy,ox=720-gw/2,oy=540-gh/2;
  const fw=d.focus||d.stand;const wx=ox+fw[1]*(ww+gx)+ww/2,wy=oy+fw[0]*(wh+gy)+wh/2;
  const cx=wx+(720-wx)*d.fk,cy=wy+(540-wy)*d.fk;
  c.fillStyle=lg(0,0,0,1080,[[0,'#05080f'],[1,'#0b1220']]);c.fillRect(0,0,1440,1080);
  c.save();c.translate(720,540);c.scale(d.zoom,d.zoom);c.translate(-cx,-cy);
  c.fillStyle='#070b13';c.fillRect(ox-80,oy-70,gw+160,gh+140);
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    const x=ox+k*(ww+gx),y=oy+r*(wh+gy),id=r*cols+k;
    const breathe=.72+.28*Math.sin(t*.9+(d.sync?0:id))+.05*Math.sin(t*4.1+id*2.7);
    const lit=rnd(id*1.7)>.06&&!(d.offProb>0&&rnd(id*6.1)<d.offProb); const isStand=(r===d.stand[0]&&k===d.stand[1])||(d.standProb>0&&rnd(id*5.3)<d.standProb); const isPair=!isStand&&d.pairProb>0&&rnd(id*8.7)<d.pairProb;
    if(!lit){rr(x,y,ww,wh,4,'#04060b');continue}
    rr(x,y,ww,wh,4,((isStand&&d.warm)||isPair)?lg(x,y,x,y+wh,[[0,'rgba(255,225,170,.95)'],[1,'rgba(255,150,70,.9)']]):lg(x,y,x,y+wh,[[0,`rgba(150,205,255,${.85*breathe})`],[1,`rgba(70,130,210,${.7*breathe})`]]),'#02040a',5);
    c.fillStyle='#03050a';
    if(isPair){[-.2,.2].forEach(o=>{const sx=x+ww/2+o*ww;c.beginPath();c.ellipse(sx,y+wh-wh*.36,ww*.12,wh*.14,0,0,PI*2);c.fill();c.beginPath();c.moveTo(sx-ww*.26,y+wh);c.quadraticCurveTo(sx-ww*.22,y+wh-wh*.24,sx,y+wh-wh*.24);c.quadraticCurveTo(sx+ww*.22,y+wh-wh*.24,sx+ww*.26,y+wh);c.fill()})}
    else if(isStand){c.beginPath();c.ellipse(x+ww/2,y+30,15,18,0,0,PI*2);c.fill();c.fillRect(x+ww/2-24,y+46,48,wh)}
    else{const sx=x+ww/2+(rnd(id+3)-.5)*22;c.beginPath();c.ellipse(sx,y+wh-38,13,15,0,0,PI*2);c.fill();c.beginPath();c.moveTo(sx-30,y+wh);c.quadraticCurveTo(sx-26,y+wh-24,sx,y+wh-24);c.quadraticCurveTo(sx+26,y+wh-24,sx+30,y+wh);c.fill()}
    if(d.bubble&&!isStand&&!isPair&&(rnd(id*3.3)<d.bubbleFrac||(d.lone&&r===d.lone[0]&&k===d.lone[1]))){const lone=d.lone&&r===d.lone[0]&&k===d.lone[1]&&!d.joined;const glyph=lone?'?':d.bubble;if(d.loneText&&d.lone&&r===d.lone[0]&&k===d.lone[1]){c.save();c.globalAlpha=.95;rr(x-ww*.15,y-wh*.42,ww*1.3,wh*.5,12,'#ffd27a','#02040a',3);c.fillStyle='#02040a';c.font=`800 ${Math.round(ww*.34)}px "DejaVu Sans Mono",monospace`;c.textAlign='center';c.textBaseline='middle';c.fillText(d.loneText,x+ww*.5,y-wh*.17);c.restore()}const al=lone?.4:(.4+.5*(.5+.5*Math.sin(t*2.2)));
      c.save();c.globalAlpha=al;rr(x+ww*.5,y+wh*.06,ww*.44,wh*.26,8,'#ffb84a','#02040a',2);c.fillStyle='#02040a';c.font=`800 ${Math.round(ww*.2)}px "DejaVu Sans Mono",monospace`;c.textAlign='center';c.textBaseline='middle';c.fillText(glyph,x+ww*.72,y+wh*.2);c.restore()}
    c.fillStyle='#02040a';c.fillRect(x+ww/2-2,y,4,wh);
  }
  c.restore();
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(720,540,50,900,[[0,`rgba(${GL},.10)`],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,1440,1080);c.restore();
}
function tvClose(t,o={}){
  const d=Object.assign({dialog:true,presses:0,cursor:null,cnt:0},o);
  c.fillStyle='#020306';c.fillRect(0,0,1440,1080);
  rr(60,50,1320,980,70,'#0a0d12','#010203',14);
  // screen
  c.save();c.beginPath();c.roundRect(110,95,1220,890,90);c.clip();
  c.fillStyle=lg(0,95,0,985,[[0,'#7fa9dc'],[1,'#3f70b0']]);c.fillRect(0,0,1440,1080);
  for(let i=0;i<120;i++){const r=rnd(i*3.1+Math.floor(t*12));c.fillStyle=`rgba(255,255,255,${.04+.08*rnd(i+7+Math.floor(t*12))})`;c.fillRect(110+rnd(i+1)*1220,95+rnd(i*2.3+Math.floor(t*12))*890,300*r,6+r*14)}
  c.fillStyle='rgba(20,40,80,.25)';c.fillRect(0,95+((t*50)%1000)-40,1440,60);
  if(d.dialog){
    const bx=380,by=300,bw=680,bh=380;
    c.fillStyle='rgba(6,10,20,.92)';c.fillRect(bx,by,bw,bh);c.strokeStyle='#dbe9ff';c.lineWidth=4;c.strokeRect(bx,by,bw,bh);
    c.fillStyle='#dbe9ff';c.font='800 44px "DejaVu Sans Mono",monospace';c.textAlign='center';c.fillText('ARE YOU STILL',720,by+95);c.fillText('WATCHING?',720,by+150);
    // YES bright, NO nearly invisible
    const yesHot=d.presses%1>.5&&d.cursor;
    c.fillStyle=yesHot?'#fff':'#9fe0ff';c.fillRect(470,by+225,220,80);c.fillStyle='#04121f';c.font='800 46px "DejaVu Sans Mono",monospace';c.fillText('YES',580,by+267);
    c.strokeStyle='rgba(120,150,190,.22)';c.lineWidth=3;c.strokeRect(750,by+225,220,80);c.fillStyle='rgba(120,150,190,.16)';c.fillText('NO',860,by+267);
    c.font='600 22px "DejaVu Sans Mono",monospace';c.fillStyle='rgba(120,150,190,.13)';c.fillText('(please)',860,by+330);
    if(d.cursor){const [cx,cy]=d.cursor;c.fillStyle='#fff';c.strokeStyle='#000';c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx,cy+46);c.lineTo(cx+13,cy+35);c.lineTo(cx+26,cy+58);c.lineTo(cx+36,cy+52);c.lineTo(cx+22,cy+31);c.lineTo(cx+40,cy+30);c.closePath();c.fill();c.stroke()}
    c.font='700 34px "DejaVu Sans Mono",monospace';c.fillStyle='rgba(219,233,255,.75)';c.textAlign='left';c.fillText('x'+d.cnt,bx+bw-130,by+bh-22);
  }
  c.restore();
  // vignette bezel glow
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(720,540,300,900,[[0,'rgba(0,0,0,0)'],[1,`rgba(${GL},.16)`]]);c.fillRect(0,0,1440,1080);c.restore();
}
function ceiling(t,o={}){
  const p=o.tilt||0; // 0 looking ahead .. 1 looking up
  c.fillStyle='#04070b';c.fillRect(0,0,1440,1080);
  // ceiling plane
  c.fillStyle=lg(0,0,0,1080,[[0,'#020306'],[1,'#0b1520']]);c.fillRect(0,0,1440,1080);
  // faint rectangle that looks exactly like a screen, glowing very slightly
  const a=.05+.05*Math.sin(t*1.3);
  c.fillStyle=`rgba(${GL},${a+.05})`;c.beginPath();c.roundRect(500,240,440,300,26);c.fill();
  c.strokeStyle=`rgba(${GL},${a+.08})`;c.lineWidth=6;c.stroke();
  // ghost text (hidden layer)
  c.save();c.textAlign='center';c.font='800 58px "DejaVu Sans Mono",monospace';c.fillStyle=`rgba(${GL},.075)`;c.fillText('WHO IS WATCHING',720,350);c.fillText('WHO?',720,430);c.restore();
  for(let i=0;i<7;i++){c.strokeStyle='rgba(120,170,220,.05)';c.lineWidth=3;c.beginPath();c.moveTo(0,1080);c.lineTo(230*i,0);c.stroke()}
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(720,390,20,700,[[0,`rgba(${GL},.09)`],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,1440,1080);c.restore();
}
function blackCard(t,o={}){c.fillStyle='#000';c.fillRect(0,0,1440,1080)}
function logoCard(t){
  c.fillStyle=lg(0,0,0,1080,[[0,'#0c1a2c'],[1,'#050a14']]);c.fillRect(0,0,1440,1080);
  // emblem: house with a screen for a doorway, eye above
  const s=kf(t,[[0,.6],[1.6,1]],'out');c.save();c.translate(720,420);c.scale(s,s);
  c.strokeStyle='#dbe9ff';c.lineWidth=14;c.lineJoin='round';
  c.beginPath();c.moveTo(-190,90);c.lineTo(-190,-30);c.lineTo(0,-170);c.lineTo(190,-30);c.lineTo(190,90);c.closePath();c.stroke();
  rr(-80,-10,160,100,10,`rgba(${GL},.85)`,'#dbe9ff',8);
  c.beginPath();c.ellipse(0,-92,58,28,0,0,PI*2);c.fillStyle='#050a14';c.fill();c.stroke();
  c.beginPath();c.arc(0,-92,17,0,PI*2);c.fillStyle='#dbe9ff';c.fill();
  rr(-9,-101,18,12,3,`rgba(${GL},1)`); // the pupil is a tiny screen
  c.restore();
  c.textAlign='center';c.fillStyle='#dbe9ff';c.font='800 62px Georgia,serif';c.fillText('BUREAU OF HOUSEHOLD ATTENTION',720,700);
  c.font='600 34px "DejaVu Sans Mono",monospace';c.fillStyle='rgba(219,233,255,.8)';c.fillText(META.sub,720,776);
  c.fillStyle=`rgba(219,233,255,${.45+.4*Math.sin(t*2)})`;c.font='700 30px "DejaVu Sans Mono",monospace';c.fillText('PLEASE STAY TUNED',720,880);
  if(META.season){c.font='800 44px Georgia,serif';c.fillStyle='#ffb870';c.fillText(META.season,720,150)}
}
function endCard(t){
  // clean card: YouTube's own end-screen elements are placed over the empty lower area
  c.fillStyle='#03060b';c.fillRect(0,0,1440,1080);
  c.textAlign='center';c.fillStyle='#dbe9ff';c.font='800 70px Georgia,serif';c.fillText('THIS TAPE HAS ENDED.',720,260);
  c.font='700 40px "DejaVu Sans Mono",monospace';c.fillStyle=`rgba(${GL},.9)`;c.fillText('PLEASE STAY TUNED.',720,340);
}

/* ---------- scenes ---------- */
const SC={};
const clockSweep=(t)=>t;
SC.adv=(t)=>{blackCard(t)};
SC.logo=(t)=>{logoCard(t)};
SC.intro=(t)=>{
  const dolly=kf(t,[[0,1],[30,1.06]],'lin');
  c.save();c.translate(720,540);c.scale(dolly,dolly);c.translate(-720,-540);
  room(t,{glow:kf(t,[[0,.15],[3,.7]],'io'),sky:0,clockSpeed:1,people:()=>{person(560,700,{s:1,lean:0});person(880,706,{s:1.02,turn:0})}});
  c.restore();
};
SC.r1=(t)=>{ // sit closer

function layer(fn,blurPx=4,alpha=1){

}
function dust(t,x,y,w,h,n=40,seed=1,a=.5){
  c.save();c.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const sp=8+rnd(i*3.1+seed)*26,px=x+mod(rnd(i+seed)*w+t*sp*.6+Math.sin(t*.4+i)*14,w),py=y+mod(rnd(i*7.7+seed)*h-t*sp*.5,h);
    const tw=.35+.65*(.5+.5*Math.sin(t*.9+i*1.7)),r=1.2+rnd(i*2.3+seed)*2.4;
    c.fillStyle=`rgba(190,225,255,${a*tw*.55})`;c.beginPath();c.arc(px,py,r,0,PI*2);c.fill();
  }
  c.restore();
}
function rays(x,y,dirAng,spread,len,a,count=9,t=0,col='110,180,255'){
  c.save();c.globalCompositeOperation='lighter';

    const a0=dirAng+off-w,a1=dirAng+off+w,g=c.createLinearGradient(x,y,x+Math.cos(dirAng+off)*len,y+Math.sin(dirAng+off)*len);
    g.addColorStop(0,`rgba(${col},${a*(.5+.5*rnd(i))})`);g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a0)*len,y+Math.sin(a0)*len);c.lineTo(x+Math.cos(a1)*len,y+Math.sin(a1)*len);c.closePath();c.fill();
  }

    const [a,b,text,kind,n]=cd;if(t<a||t>b+.6||!text)continue;
    const chars=text.length,cps=Math.min(30,Math.max(9,chars/((b-a)*.55)));
    const shown=Math.min(chars,Math.floor((t-a)*cps));
    const alpha=cl((t-a)/.15)*(t>b?1-(t-b)/.6:1);
    const lines=text.substring(0,shown).split('\n');
    c.save();c.globalAlpha=alpha;c.textAlign='center';c.textBaseline='middle';
    let size=kind==='adv'?38:kind==='rule'?46:kind==='short'?(port?58:46):kind==='small'?(port?36:30):kind==='ghost'?70:52;
    if(port&&kind==='rule')size=50;
    const family='"DejaVu Sans Mono","Courier New",monospace';
    c.font=`800 ${size}px ${family}`;
    let y0=kind==='adv'?H0*.5-40:(port?H0*.74:H0-190);
    if(kind==='ghost'){c.font=`800 ${size}px ${family}`;c.fillStyle='rgba(120,180,255,.10)';lines.forEach((l,i)=>c.fillText(l,W0/2,H0*.32+i*size*1.2));c.restore();continue}
    if(kind==='rule'){
      c.font=`800 ${size*.66}px ${family}`;c.fillStyle='rgba(120,190,255,.95)';c.fillText('RULE '+n,W0/2,y0-lines.length*size*.62-size*.55);
      c.font=`800 ${size}px ${family}`;
    }
    c.shadowColor='rgba(0,0,0,.95)';c.shadowBlur=10;
    lines.forEach((l,i)=>{c.strokeStyle='rgba(0,0,0,.85)';c.lineWidth=size*.16;c.lineJoin='round';c.strokeText(l,W0/2,y0+i*size*1.25-(lines.length-1)*size*.62);c.fillStyle=kind==='small'?'rgba(219,233,255,.8)':'#e8f2ff';c.fillText(l,W0/2,y0+i*size*1.25-(lines.length-1)*size*.62)});
    c.restore();
  }
  c.restore();
}
function drawOSD(seg,t,T,gt){
  if(META.smooth)return drawOSDSmooth(seg,t);
  const W0=SW/U,H0=SH/U;c.save();c.scale(U,U);
  const fam='"DejaVu Sans Mono","Courier New",monospace';
  c.save();c.textBaseline='top';c.font=`800 ${LAND?34:32}px ${fam}`;c.fillStyle='rgba(235,245,255,.92)';c.shadowColor='rgba(0,0,0,.9)';c.shadowBlur=6;
  const m=LAND?70:50,my=LAND?60:110;
  c.textAlign='left';c.fillText((Math.floor(T*2)%2?'▶ ':'  ')+'PLAY  SP',m,my);
  const tot=Math.floor(gt);const tc=`${String(Math.floor(tot/3600)).padStart(2,'0')}:${String(Math.floor(tot/60)%60).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;
  c.textAlign='right';c.fillText(META.date,W0-m,my);
  c.textAlign='left';c.fillText(tc,m,H0-(LAND?100:150));
  if(seg.ref&&t>1.5&&t<Math.max(20,seg.dur-3)){c.textAlign='right';c.font=`800 ${LAND?32:30}px ${fam}`;c.fillStyle='rgba(150,205,255,.78)';c.fillText('REF '+seg.ref,W0-m,H0-(LAND?100:150))}
  c.restore();
  c.restore();
}

/* ---------- frame ---------- */
function frame(T,fn){
  T=Math.min(T,TOTAL-.001);
  let seg=TL[0];for(const s of TL)if(T>=s.t0)seg=s;
  const t=T-seg.t0,ts=t+seg.off;
  c.setTransform(1,0,0,1,0,0);c.filter='none';c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.fillStyle='#000';c.fillRect(0,0,SW,SH);
  // logical -> scene canvas transform
  c.save();
  if(LAND){c.scale(U,U)}else{const k=KZ,fx=Math.min(LW-304,Math.max(304,seg.fx||LW/2));c.translate(540-fx*k,0);c.scale(k,k)}
  {let z=1,shx=0;(seg.punch||[]).forEach(([tp,st])=>{if(t>=tp){const dd=t-tp;z+=st*Math.exp(-dd*5);shx+=st*Math.exp(-dd*9)*Math.sin(dd*60)*6}});if(z!==1||shx){c.translate(720+shx,540);c.scale(z,z);c.translate(-720,-540)}}
  window.__collapse=1;
  let xfA=0;
  if(META.smooth&&seg.xf!==0&&t<.8){
    const pi=TL.indexOf(seg)-1;
    if(pi>=0){
      const ps=TL[pi];
      if(!window.__xfc){window.__xfc=document.createElement('canvas')}
      const xfc=window.__xfc;if(xfc.width!==SW||xfc.height!==SH){xfc.width=SW;xfc.height=SH}
      c.save();SC[ps.id](T-ps.t0+ps.off);c.restore();
      const xc=xfc.getContext('2d');xc.setTransform(1,0,0,1,0,0);xc.drawImage(sc,0,0);
      c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,SW,SH);c.restore();
      xfA=1-E.io(cl(t/.8));
    }
  }
  c.save();
  if(META.smooth){
    const e=E.io(cl(t/.8)),xk=seg.xfk||'fade',cx=LW/2;
    if(xfA>0&&xk==='zoom'){c.translate(cx,540);c.scale(1.14-.14*e,1.14-.14*e);c.translate(-cx,-540)}
    if(xfA>0&&xk==='slide'){c.translate((1-e)*180,0)}
    if(!seg.nodrift){const z=1+.022*(t/(seg.dur||20));c.translate(cx,540);c.scale(z,z);c.translate(-cx,-540)}
  }
  if(seg.mb){
    const n=seg.mb,dt=.5/30;
    if(!window.__acc){window.__acc=document.createElement('canvas')}
    const acc=window.__acc;if(acc.width!==SW||acc.height!==SH){acc.width=SW;acc.height=SH}
    const a2=acc.getContext('2d');a2.setTransform(1,0,0,1,0,0);a2.clearRect(0,0,SW,SH);
    const base=c.getTransform();
    for(let k=0;k<n;k++){
      c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,SW,SH);c.restore();
      c.save();SC[seg.id](ts-k*dt*1.0);c.restore();
      c.save();c.setTransform(1,0,0,1,0,0);a2.globalAlpha=1/(k+1);a2.drawImage(sc,0,0);c.restore();
    }
    c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,SW,SH);c.drawImage(acc,0,0);c.setTransform(base);
  } else {
    SC[seg.id](ts);
  }
  c.restore();
  if(xfA>0){c.save();c.setTransform(1,0,0,1,0,0);c.globalAlpha=xfA;c.drawImage(window.__xfc,0,0);c.restore()}
  c.restore();
  // CRT collapse (fin scene)
  if((seg.id==='fin'||seg.id==='fin5'||seg.id==='fin6')&&window.__collapse<1){const k=window.__collapse;const img=c.getImageData(0,0,SW,SH);c.fillStyle='#000';c.fillRect(0,0,SW,SH);const bh=Math.max(2,SH*k);const tmp=document.createElement('canvas');tmp.width=SW;tmp.height=SH;tmp.getContext('2d').putImageData(img,0,0);c.drawImage(tmp,0,SH/2-bh/2,SW,bh);c.fillStyle=`rgba(200,225,255,${1-k})`;c.fillRect(SW/2-SW*.25*(k+.1),SH/2-2,SW*.5*(k+.1),4)}
  drawCards(seg,t,T);
  if(seg.id!=='adv'&&seg.id!=='end')drawOSD(seg,t,T,T);
  const dg=(seg.dg||.4)*(seg.id==='adv'||seg.id==='end'?.5:1);
  if(seg.id!=='adv')vhs(dg,T,Math.floor(T*30)+1);
  // fade in/out at tape edges
  let fade=1;if(T<.4)fade=T/.4;if(T>TOTAL-.5)fade=(TOTAL-T)/.5;
  oc.fillStyle='#000';oc.fillRect(0,0,OW,OH);oc.globalAlpha=fade;
  if(LAND)oc.drawImage(sc,(OW-SW)/2,0);else oc.drawImage(sc,0,0);
  oc.globalAlpha=1;
}

/* ---------- events for the audio synth ---------- */
function events(){
  const ev={dur:TOTAL,amb:[],crowd:[],hum:[],nature:[],pulse:[],keys:[],music:[],snd:[],clicks:[],ticks:[],typ:[],spec:[],scenes:[]};
  TL.forEach(s=>{
    ev.amb.push([s.t0,s.amb||0],[s.t0+s.dur-.01,s.amb||0]);
    if(META.smooth&&s.xf!==0&&s.t0>0)ev.snd.push([s.t0-.05,'whoosh']);
    (s.snd||[]).forEach(([t,n])=>ev.snd.push([s.t0+t,n]));
    (s.clicks||[]).forEach(t=>ev.clicks.push(s.t0+t));
    if(s.ticks)ev.ticks.push([s.t0+s.ticks[0],s.t0+s.ticks[1]]);
    if(s.spec)ev.spec.push([s.t0+s.spec[0],s.t0+s.spec[1],s.specText||'LOOK UP']);
    if(Array.isArray(s.crowd))ev.crowd.push([s.t0,s.crowd[0]],[s.t0+s.dur-.01,s.crowd[1]]);else ev.crowd.push([s.t0,s.crowd||0],[s.t0+s.dur-.01,s.crowd||0]);
    (s.keys||[]).forEach(k=>ev.keys.push([s.t0+k[0],s.t0+k[1],k[2]||14]));
    if(s.mus)(Array.isArray(s.mus[0])?s.mus:[s.mus]).forEach(m=>ev.music.push([s.t0,s.t0+s.dur,m[0],m[1]]));
    if(s.pulse)ev.pulse.push([s.t0,s.t0+s.dur,s.pulse[0],s.pulse[1],s.pulse[2]]);
    ev.nature.push([s.t0,s.nature||0],[s.t0+s.dur-.01,s.nature||0]);
    ev.hum.push([s.t0,s.hum||0],[s.t0+s.dur-.01,s.hum||0]);
    s.cards.forEach(([a,b,text,kind])=>{if(text)ev.typ.push([s.t0+a,Math.min(text.length,text.length),Math.min(30,Math.max(9,text.length/((b-a)*.55))),kind])});
  });
  return ev;
}
window.setup=setup;window.frame=frame;window.events=events;
</script>
