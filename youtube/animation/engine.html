<!doctype html><meta charset="utf-8"><title>Rex engine</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="cv"></canvas>
<script>
/* =====================================================================
   REX TRIES — tiny 2D animation engine + skits.  Everything is a pure
   function of time t, so frames can be rendered in any order / in parallel.
   ===================================================================== */
const cv=document.getElementById('cv'), c=cv.getContext('2d');
const PI=Math.PI, D2R=PI/180;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const a=1.70158,b=a+1;return 1+b*Math.pow(x-1,3)+a*Math.pow(x-1,2)},
  bounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}};
function kf(t,p,e='io'){ if(t<=p[0][0])return p[0][1]; for(let i=0;i<p.length-1;i++){const[a,v0]=p[i],[b,v1]=p[i+1]; if(t<b){return v0+(v1-v0)*E[e](cl((t-a)/(b-a)))}} return p[p.length-1][1]; }
const rnd=(s)=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const G='#2ee59d',R='#ff4d5e',A='#ffb020',B='#4cc9ff',INK='#1b1b26';

/* ---------- primitives ---------- */
function rr(x,y,w,h,r,fill,stroke,lw=6){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}
function ci(x,y,r,fill,stroke,lw=6){c.beginPath();c.arc(x,y,r,0,PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}
function ln(x1,y1,x2,y2,col,lw){c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function tx(s,x,y,size,col='#fff',align='center',stroke=null,font='system-ui,Segoe UI,Arial,sans-serif'){c.font=`900 ${size}px ${font}`;c.textAlign=align;c.textBaseline='middle';if(stroke){c.lineJoin='round';c.strokeStyle=stroke;c.lineWidth=size*.22;c.strokeText(s,x,y)}c.fillStyle=col;c.fillText(s,x,y)}

/* ---------- characters ---------- */
function mouth(m,talk,x,y,w=1){
  c.save();c.translate(x,y);c.scale(w,w);c.strokeStyle=INK;c.lineWidth=7;c.lineCap='round';
  if(talk>0&&(m==='smile'||m==='open'))m='talk';
  if(m==='smile'){c.beginPath();c.arc(0,-8,22,.15*PI,.85*PI);c.stroke()}
  else if(m==='frown'){c.beginPath();c.arc(0,22,20,1.15*PI,1.85*PI);c.stroke()}
  else if(m==='flat'){ln(-16,0,16,0,INK,7)}
  else if(m==='o'){ci(0,4,10,INK)}
  else if(m==='yell'){c.beginPath();c.ellipse(0,8,22,30,0,0,PI*2);c.fillStyle=INK;c.fill();c.beginPath();c.ellipse(0,20,13,10,0,0,PI*2);c.fillStyle='#ff7a8a';c.fill()}
  else if(m==='grit'){rr(-24,-10,48,22,6,'#fff',INK,5);for(let i=-16;i<=16;i+=8)ln(i,-10,i,12,INK,3)}
  else if(m==='talk'){const h=6+talk*28;c.beginPath();c.ellipse(0,4,16+talk*4,h/2+2,0,0,PI*2);c.fillStyle=INK;c.fill();if(talk>.4){c.beginPath();c.ellipse(0,h/2-2,9,4,0,0,PI*2);c.fillStyle='#ff7a8a';c.fill()}}
  else if(m==='grin'){c.beginPath();c.arc(0,-6,26,.05*PI,.95*PI);c.closePath();c.fillStyle='#fff';c.fill();c.stroke()}
  c.restore();
}
function rex(o){
  const d=Object.assign({x:540,y:880,s:1,rot:0,sx:1,sy:1,lx:0,ly:0,open:1,wide:0,mouth:'smile',aL:15,aR:15,walk:0,talk:0,flip:1,sweat:0,brow:0,tint:null,holdL:null,holdR:null,shadow:1,z:0},o);
  c.save();c.translate(d.x,d.y);
  if(d.shadow){c.save();c.scale(1,.25);ci(0,0,90*d.s,'rgba(0,0,0,.25)');c.restore()}
  c.scale(d.s*d.flip,d.s);c.rotate(d.rot*D2R);c.scale(d.sx,d.sy);
  const sw=Math.sin(d.walk)*30;
  [[-32,sw],[32,-sw]].forEach(([lx,a])=>{ln(lx,-70,lx+a*.6,-Math.abs(a)*.12,INK,13);c.beginPath();c.ellipse(lx+a*.6+8,-Math.abs(a)*.12,20,11,0,0,PI*2);c.fillStyle=INK;c.fill()});
  // body (receipt)
  c.beginPath();c.moveTo(-70,-330);c.lineTo(70,-330);c.lineTo(70,-70);
  for(let k=0;k<=7;k++){const x=70-k*20;c.lineTo(x,(k%2)?-70:-46)}
  c.closePath();c.fillStyle=d.tint||'#fdfdf5';c.fill();c.strokeStyle=INK;c.lineWidth=7;c.lineJoin='round';c.stroke();
  [[-150,90],[-128,60],[-106,80]].forEach(([y,w])=>ln(-w/2,y,w/2,y,'#b9b9c8',7));
  tx('$',0,-90,22,'#b9b9c8');
  // arms
  [[-1,d.aL,d.holdL],[1,d.aR,d.holdR]].forEach(([s,a,hold])=>{
    const sx=s*70,sy=-225,ex=sx+s*Math.sin(a*D2R)*100,ey=sy+Math.cos(a*D2R)*100;
    ln(sx,sy,ex,ey,INK,12);
    if(hold){c.save();c.translate(ex,ey);c.rotate((s*a*.0)*D2R);hold();c.restore()}
    ci(ex,ey,14,'#fff',INK,5);
  });
  // eyes
  const ew=1+d.wide*.28;
  [[-34,-268],[34,-268]].forEach(([ex,ey])=>{
    const oh=Math.max(.06,d.open);c.save();c.beginPath();c.ellipse(ex,ey,31*ew,31*ew*oh,0,0,PI*2);c.fillStyle='#fff';c.fill();c.strokeStyle=INK;c.lineWidth=5;c.stroke();c.clip();
    ci(ex+d.lx*11,ey+d.ly*11,13*(d.wide>0?.75:1),INK);ci(ex+d.lx*11+4,ey+d.ly*11-4,4,'#fff');c.restore();
  });
  if(d.brow){ln(-58,-312-d.brow*6,-14,-312+d.brow*10,INK,8);ln(58,-312-d.brow*6,14,-312+d.brow*10,INK,8)}
  mouth(d.mouth,d.talk,0,-208);
  if(d.sweat){for(let i=0;i<3;i++){const p=(d.z*2+i/3)%1;const dx=(i-1)*8;c.save();c.globalAlpha=1-p;ci(80+dx+i*10,-300+p*60,8,'#7fd8ff');c.restore()}}
  c.restore();
}
function greg(o){
  const d=Object.assign({x:540,y:880,s:1,rot:0,sx:1,sy:1,talk:0,aL:20,aR:20,mouth:'grin',flip:1,walk:0,dollar:0,shadow:1,holdL:null,holdR:null},o);
  c.save();c.translate(d.x,d.y);
  if(d.shadow){c.save();c.scale(1,.25);ci(0,0,110*d.s,'rgba(0,0,0,.25)');c.restore()}
  c.scale(d.s*d.flip,d.s);c.rotate(d.rot*D2R);c.scale(d.sx,d.sy);
  const sw=Math.sin(d.walk)*26;
  [[-38,sw],[38,-sw]].forEach(([lx,a])=>{ln(lx,-90,lx+a*.6,-Math.abs(a)*.1,'#2a2a44',24);c.beginPath();c.ellipse(lx+a*.6+10,-Math.abs(a)*.1,28,13,0,0,PI*2);c.fillStyle='#fff';c.fill();c.strokeStyle=INK;c.lineWidth=5;c.stroke()});
  c.beginPath();c.ellipse(0,-200,105,125,0,0,PI*2);c.fillStyle='#6b3fd4';c.fill();c.strokeStyle=INK;c.lineWidth=7;c.stroke();
  // shirt v + chain
  c.beginPath();c.moveTo(-40,-315);c.lineTo(0,-230);c.lineTo(40,-315);c.fillStyle='#f5c9a0';c.fill();
  c.beginPath();c.arc(0,-290,52,.1*PI,.9*PI);c.strokeStyle='#ffd23c';c.lineWidth=9;c.stroke();ci(0,-236,22,'#ffd23c',INK,4);tx('$',0,-236,26,INK);
  [[-1,d.aL,d.holdL],[1,d.aR,d.holdR]].forEach(([s,a,hold])=>{
    const sx=s*98,sy=-250,ex=sx+s*Math.sin(a*D2R)*115,ey=sy+Math.cos(a*D2R)*115;
    ln(sx,sy,ex,ey,'#6b3fd4',30);ln(sx,sy,ex,ey,INK,3);
    if(hold){c.save();c.translate(ex,ey);hold();c.restore()}
    ci(ex,ey,20,'#f5c9a0',INK,5);
  });
  // head
  ci(0,-380,78,'#f5c9a0',INK,7);
  c.beginPath();c.moveTo(-78,-395);c.quadraticCurveTo(-30,-490,70,-420);c.quadraticCurveTo(20,-440,-40,-410);c.closePath();c.fillStyle='#1b1418';c.fill();
  // shades
  rr(-66,-408,54,34,10,'#0b0b12');rr(12,-408,54,34,10,'#0b0b12');ln(-12,-396,12,-396,'#0b0b12',7);
  ln(-56,-400,-40,-400,'rgba(255,255,255,.7)',5);ln(22,-400,38,-400,'rgba(255,255,255,.7)',5);
  if(d.dollar){tx('$',-39,-391,32,G);tx('$',39,-391,32,G)}
  mouth(d.mouth,d.talk,0,-338,1.15);
  c.restore();
}
function bot(o){
  const d=Object.assign({x:540,y:600,s:1,mood:'happy',t:0,typing:0},o);
  c.save();c.translate(d.x,d.y+Math.sin(d.t*4)*8);c.scale(d.s,d.s);
  ln(0,-100,0,-135,INK,6);ci(0,-140,10,d.typing?R:G,INK,4);
  rr(-70,-100,140,110,24,'#cfd6e6',INK,7);rr(-52,-84,104,66,14,'#0d1b2a',INK,4);
  if(d.mood==='happy'){ci(-20,-56,9,G);ci(20,-56,9,G);c.strokeStyle=G;c.lineWidth=5;c.beginPath();c.arc(0,-48,16,.15*PI,.85*PI);c.stroke()}
  else if(d.mood==='busy'){tx('...',0,-52,42,G)}
  else{tx('x  x',0,-56,34,R)}
  rr(-70,10,140,26,10,'#8b95ad',INK,6);
  if(d.typing){for(let i=0;i<2;i++){const k=Math.sin(d.t*40+i*3)*7;ln(-40+i*80,36,-40+i*80,50+k,INK,9)}}
  c.restore();
}

/* ---------- props / sets ---------- */
function room(o){
  const d=Object.assign({top:'#1f2a52',bot:'#101733',floor:'#3b2a24',fy:880,pat:1},o);
  const g=c.createLinearGradient(0,0,0,d.fy);g.addColorStop(0,d.top);g.addColorStop(1,d.bot);c.fillStyle=g;c.fillRect(-300,-300,1680,d.fy+300);
  if(d.pat){c.globalAlpha=.07;for(let x=-300;x<1400;x+=90)ln(x,-300,x,d.fy,'#fff',3);c.globalAlpha=1}
  c.fillStyle=d.floor;c.fillRect(-300,d.fy,1680,600);ln(-300,d.fy,1400,d.fy,'rgba(0,0,0,.35)',8);
}
function clock(x,y,r,label,shake=0,col='#fff'){
  c.save();c.translate(x+Math.sin(shake*90)*shake*6,y);
  ci(-r*.62,-r*.9,r*.28,'#ff5d6c',INK,5);ci(r*.62,-r*.9,r*.28,'#ff5d6c',INK,5);ci(0,0,r,col,INK,8);
  tx(label,0,2,r*.5,INK,'center',null,'ui-monospace,Menlo,Consolas,monospace');c.restore();
}
function winSky(x,y,w,h,k){ // k: 0 night .. 1 day
  const f=(a,b)=>Math.round(a+(b-a)*k);
  rr(x,y,w,h,10,`rgb(${f(12,120)},${f(16,200)},${f(48,255)})`,INK,8);
  const sy=y+h*.7-k*h*.45,sx=x+w*.5;
  if(k<.5){ci(sx,y+h*.3,20,'#fdf6c8');ci(sx+8,y+h*.3-6,17,`rgb(${f(12,120)},${f(16,200)},${f(48,255)})`)}
  else ci(sx,sy,26,'#ffe25a');
  ln(x+w/2,y,x+w/2,y+h,INK,6);ln(x,y+h/2,x+w,y+h/2,INK,6);
}
function bucket(x,y,w,h,ice,t){
  c.save();c.translate(x,y);
  c.beginPath();c.moveTo(-w/2,-h);c.lineTo(w/2,-h);c.lineTo(w/2-16,0);c.lineTo(-w/2+16,0);c.closePath();c.fillStyle='#8fa1bd';c.fill();c.strokeStyle=INK;c.lineWidth=7;c.stroke();
  c.beginPath();c.ellipse(0,-h,w/2,14,0,0,PI*2);c.fillStyle='#5fc8ff';c.fill();c.stroke();
  if(ice)for(let i=0;i<4;i++){rr(-w/2+30+i*36,-h-14+Math.sin(t*3+i)*4,26,26,6,'#dff6ff',INK,4)}
  c.restore();
}
function laptop(x,y,txt){
  rr(x-130,y-150,260,170,12,'#2b3245',INK,6);rr(x-114,y-136,228,138,6,'#0e1726');
  tx(txt,x,y-68,34,G,'center',null,'ui-monospace,Menlo,Consolas,monospace');
  c.beginPath();c.moveTo(x-160,y+20);c.lineTo(x+160,y+20);c.lineTo(x+130,y+4);c.lineTo(x-130,y+4);c.closePath();c.fillStyle='#9aa4bd';c.fill();c.strokeStyle=INK;c.lineWidth=6;c.stroke();
}
function paper(x,y,w,h,lines,rot=0,col='#fffef2'){
  c.save();c.translate(x,y);c.rotate(rot*D2R);rr(-w/2,-h/2,w,h,10,col,INK,7);
  let yy=-h/2+70;lines.forEach(l=>{tx(l[0],0,yy,l[1]||48,l[3]||INK);yy+=(l[2]||64)});c.restore();
}
function stampFx(label,color,t,y=520,rot=-7,size=150){
  if(t<0)return;const sc=t<.14?3-2*(t/.14):1,sh=t>.14&&t<.45?Math.sin(t*95)*(.45-t)*34:0;
  c.save();c.translate(540+sh,y);c.rotate(rot*D2R);c.scale(sc,sc);c.globalAlpha=Math.min(1,t/.06);
  c.font=`900 ${size}px system-ui,Arial,sans-serif`;const w=c.measureText(label).width+90;
  rr(-w/2,-size*.75,w,size*1.5,26,'rgba(10,12,20,.82)',color,20);tx(label,0,4,size,color);c.restore();
}
function bubble(txt,x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);c.font='900 44px system-ui';const w=c.measureText(txt).width+56;rr(-w/2,-42,w,84,42,'#fff',INK,6);tx(txt,0,3,44,INK);c.restore()}
function confetti(t0,t,n=60,seed=1){const p=t-t0;if(p<0||p>3)return;for(let i=0;i<n;i++){const a=rnd(i+seed)*PI*2,v=250+rnd(i*3+seed)*500;const x=540+Math.cos(a)*v*p,y=420+Math.sin(a)*v*p*.7+700*p*p;c.fillStyle=['#ff4d5e','#ffb020','#2ee59d','#4cc9ff','#ff6bd6'][i%5];c.save();c.translate(x,y);c.rotate(p*(4+i%5));c.fillRect(-9,-5,18,10);c.restore()}}
function zzz(x,y,t){for(let i=0;i<3;i++){const p=((t*.6)+i/3)%1;c.save();c.globalAlpha=1-p;tx('Z',x+p*50,y-p*120,40+i*14+p*20,'#cfe4ff','center',INK);c.restore()}}
function speedLines(t,n=26){c.save();c.globalAlpha=.5;for(let i=0;i<n;i++){const a=i/n*PI*2+t*.2,r0=380+rnd(i+Math.floor(t*20))*80;ln(540+Math.cos(a)*r0,540+Math.sin(a)*r0,540+Math.cos(a)*(r0+380),540+Math.sin(a)*(r0+380),'#fff',5)}c.restore()}
function moths(t,x,y){for(let i=0;i<5;i++){const a=t*3+i*1.3;c.save();c.translate(x+Math.cos(a+i)*120+i*20,y-Math.abs(Math.sin(a*.7))*140-i*18);const f=Math.sin(t*30+i)*.6;c.scale(1,1);c.fillStyle='#c9b78a';c.beginPath();c.ellipse(-10,0,12,7*(1+f),0,0,PI*2);c.ellipse(10,0,12,7*(1-f),0,0,PI*2);c.fill();c.restore()}}
function dollars(t,n=22){for(let i=0;i<n;i++){const x=(rnd(i)*1080),sp=180+rnd(i+9)*260,y=((t*sp+rnd(i+4)*1500)%1500)-200;c.save();c.translate(x,y);c.rotate(Math.sin(t*2+i)*.6);rr(-34,-18,68,36,5,'#5fd08a',INK,3);tx('$',0,2,24,INK);c.restore()}}

/* ---------- skits: each is {dur,title,verdict,vT,music,cap,sfx,punch,draw(t)} ---------- */
const SK={};
const walkPh=t=>t*13;
const talkAt=(t,caps,who)=>{for(const k of caps){if(k[2]===who&&t>=k[0]&&t<k[1]-.15)return .5+.5*Math.sin(t*22)}return 0};

/* A — the 4 AM routine */
SK.A={title:'THE 4 AM ROUTINE',dur:32,verdict:['BUSTED',R],vT:25.4,
 music:[[0,'suspense'],[2.5,'chase'],[14,'lofi'],[19.5,'suspense'],[25.4,'sad'],[28.6,'upbeat']],
 cap:[[.2,2.3,'nar','POV: YOU TRIED THE VIRAL 4 AM ROUTINE'],[2.7,5,'rex',"I'M A NEW MAN!!"],[6.3,8.7,'rex',"IT'S FINE. I'M FINE."],[9.7,13.3,'rex','GRATITUDE: 1. BED.'],[14.3,16.6,'rex','hmmmmmm...'],[17.7,19.5,'rex','...IS IT TUESDAY?'],[19.9,23,'nar','PRODUCTIVITY GAINED: ONE WORD.'],[23.3,25.2,'rex','"HELLO." NAILED IT.'],[28.6,32,'nar','COMMENT THE NEXT HACK TO TEST']],
 sfx:[...Array(5).fill(0).map((_,i)=>[.3+i*.45,'alarm']),[2.45,'boing'],[5.05,'thud'],[6.2,'splash'],[6.25,'boom'],[6.5,'freeze'],[9.6,'pop'],[10.5,'type'],[11.5,'type'],[15.2,'snore'],[16.5,'snore'],[17.4,'pop'],[17.55,'scratch'],[21.4,'type'],[22,'crickets'],[25.4,'stamp'],[25.5,'sad'],[19.5,'whoosh']],
 punch:[[2.45,.12],[6.2,.2],[17.55,.15],[25.4,.22]],
 draw(t){
  const sky=kf(t,[[0,0],[14,0],[16.5,.05],[17.6,1]]);
  const clk=t<14?'4:00':t<17.5?'4:11':t<19.9?'11:00':t<23?'4:47PM':'4:47PM';
  room({top:t<17.5?'#1f2a52':'#5b6fb8',bot:t<17.5?'#101733':'#3b4a86',floor:'#4a3527'});
  winSky(700,150,260,300,t<17.5?0:1);
  if(t<5){ // bed + alarm
    rr(60,800,470,80,14,'#7a4a6b',INK,7);rr(40,860,30,100,6,'#5a3550',INK,6);rr(470,860,30,100,6,'#5a3550',INK,6);rr(80,770,120,50,25,'#e9e3ff',INK,6);
    clock(830,760,70,'4:00',t<2.4?1:0,'#ffe9e9');
    if(t>=0.3&&t<2.4){for(let i=0;i<2;i++)tx('!',830+(i?92:-92),640,60,R)}
  }
  let R0={};
  if(t<2.4){R0={x:210,y:762,rot:90,open:.08,mouth:'flat',aL:60,aR:60,sy:1+Math.sin(t*3)*.02,shadow:0};zzz(300,720,t)}
  else if(t<5){const p=(t-2.4)/.6;R0={x:kf(t,[[2.4,210],[3,360],[5,420]],'out'),y:kf(t,[[2.4,762],[2.8,880],[5,880]],'out'),rot:kf(t,[[2.4,90],[2.75,0]],'back'),sy:1+.12*Math.sin(t*14)*(t<3.6?1:.2),aL:kf(t,[[2.6,20],[3,175],[5,175]]),aR:kf(t,[[2.6,20],[3,175],[5,175]]),mouth:'open',talk:talkAt(t,this.cap,'rex'),wide:1,lx:0}}
  if(t<5){rex(R0)}
  else if(t<9){ // cold plunge
    const bx=kf(t,[[4.9,700]]),by=kf(t,[[4.9,-100],[5.3,880]],'bounce');bucket(bx,by,190,180,true,t);
    const walk=t<6.2;const x=kf(t,[[5,420],[6.1,610]],'io');
    const shiv=t>=6.2?Math.sin(t*70)*7:0;
    rex({x:x+shiv,y:880-(t>=6.1?kf(t,[[6.1,0],[6.2,-40]],'out'):0)*(t<6.2?1:0),walk:walk?walkPh(t):0,aL:40,aR:40,mouth:t>=6.2?'grit':'smile',wide:t>=6.2?1:0,tint:t>=6.2?'#cfefff':null,sweat:0,talk:talkAt(t,this.cap,'rex')});
    if(t>=6.2){tx('BRRR!!',x-60,470,90,'#9fe3ff','center',INK)}
    if(t>=6.2&&t<6.6){c.fillStyle=`rgba(255,255,255,${.6*(1-(t-6.2)/.4)})`;c.fillRect(-300,-300,1700,1700)}
  } else if(t<14){ // gratitude journal

    [[tv.V,G,'V'],[tv.B,R,'B'],[tv.C,A,'C']].forEach(([v,col,l],i)=>tx(l+' '+v,WW-330+i*100,54,44,col,'center',INK));
    captionDraw(sk,t,WW/2,HH-130,66);
  }
  // transition flash at start of each segment (after first)
  if(seg.t0>0&&t<.18){c.fillStyle=`rgba(255,255,255,${(1-t/.18)*.9})`;c.fillRect(0,0,WW,HH)}
}
window.setup=setup;window.frame=frame;window.events=events;
</script>
