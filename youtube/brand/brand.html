<!doctype html><meta charset="utf-8"><title>BHA brand</title>
<style>html,body{margin:0;background:#000}</style><canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv'),c=cv.getContext('2d'),PI=Math.PI,GL='110,180,255';
const rnd=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function lg(x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,k])=>g.addColorStop(o,k));return g}
function rg(x,y,r0,r1,st){const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach(([o,k])=>g.addColorStop(o,k));return g}
function rr(x,y,w,h,r,f,s,lw=3){c.beginPath();c.roundRect(x,y,w,h,r);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw;c.stroke()}}
function emblem(cx,cy,s,glow=true){
  c.save();c.translate(cx,cy);c.scale(s,s);
  if(glow){c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(0,0,20,330,[[0,`rgba(${GL},.35)`],[1,'rgba(0,0,0,0)']]);c.fillRect(-400,-400,800,800);c.restore()}
  c.strokeStyle='#dbe9ff';c.lineWidth=15;c.lineJoin='round';c.shadowColor=`rgba(${GL},.9)`;c.shadowBlur=glow?26:0;
  c.beginPath();c.moveTo(-190,110);c.lineTo(-190,-20);c.lineTo(0,-170);c.lineTo(190,-20);c.lineTo(190,110);c.closePath();c.stroke();
  c.shadowBlur=0;rr(-82,-4,164,114,10,`rgba(${GL},.9)`,'#dbe9ff',9);
  c.beginPath();c.ellipse(0,-92,62,30,0,0,PI*2);c.fillStyle='#050a14';c.fill();c.strokeStyle='#dbe9ff';c.lineWidth=12;c.stroke();
  c.beginPath();c.arc(0,-92,19,0,PI*2);c.fillStyle='#dbe9ff';c.fill();rr(-10,-102,20,14,3,`rgb(${GL})`);
  c.restore();
}
function grid(W,H,ox,oy,cols,rows,ww,wh,gx,gy,stand,seed,t=0){
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    const x=ox+k*(ww+gx),y=oy+r*(wh+gy),id=r*cols+k,br=.75+.25*Math.sin(id*1.3);
    if(rnd(id*1.7+seed)<.07){rr(x,y,ww,wh,4,'#04060b');continue}
    rr(x,y,ww,wh,4,lg(x,y,x,y+wh,[[0,`rgba(150,205,255,${.85*br})`],[1,`rgba(70,130,210,${.7*br})`]]),'#02040a',4);
    c.fillStyle='#03050a';
    if(stand&&stand[0]===r&&stand[1]===k){c.beginPath();c.ellipse(x+ww/2,y+wh*.3,ww*.17,wh*.18,0,0,PI*2);c.fill();c.fillRect(x+ww/2-ww*.27,y+wh*.46,ww*.54,wh)}
    else{const sx=x+ww/2+(rnd(id+3+seed)-.5)*ww*.24;c.beginPath();c.ellipse(sx,y+wh-wh*.38,ww*.14,wh*.15,0,0,PI*2);c.fill();c.beginPath();c.moveTo(sx-ww*.33,y+wh);c.quadraticCurveTo(sx-ww*.28,y+wh-wh*.24,sx,y+wh-wh*.24);c.quadraticCurveTo(sx+ww*.28,y+wh-wh*.24,sx+ww*.33,y+wh);c.fill()}
    c.fillStyle='#02040a';c.fillRect(x+ww/2-2,y,4,wh);
  }
}
function analog(W,H,amt=1,grain=14){
  // gentle VHS treatment: scanlines, mild colour bleed, grain, vignette, bloom
  const img=c.getImageData(0,0,W,H),d=img.data;let s=12345;const r=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296};
  const out=new Uint8ClampedArray(d.length);
  for(let y=0;y<H;y++){const wob=Math.round(Math.sin(y*.013)*amt*1.2),scan=(y&1)?.9:1,rowBase=y*W;
    for(let x=0;x<W;x++){const xr=Math.min(W-1,Math.max(0,x+wob+2)),xb=Math.min(W-1,Math.max(0,x+wob-2)),xg=Math.min(W-1,Math.max(0,x+wob));
      const n=(r()-.5)*grain,i=(rowBase+x)*4;
      out[i]=d[(rowBase+xr)*4]*scan+n;out[i+1]=d[(rowBase+xg)*4+1]*scan+n;out[i+2]=d[(rowBase+xb)*4+2]*scan+n+4;out[i+3]=255}}
  c.putImageData(new ImageData(out,W,H),0,0);
  c.save();c.filter='blur(10px)';c.globalCompositeOperation='screen';c.globalAlpha=.3;c.drawImage(cv,0,0);c.restore();
}
function vignette(W,H,k=.7){c.fillStyle=rg(W/2,H/2,Math.min(W,H)*.3,Math.max(W,H)*.75,[[0,'rgba(0,0,0,0)'],[1,`rgba(0,0,0,${k})`]]);c.fillRect(0,0,W,H)}

window.make=(kind)=>{
  if(kind==='logo'){ // 800x800 profile picture (YouTube crops to a circle)
    cv.width=800;cv.height=800;
    c.fillStyle=rg(400,400,40,620,[[0,'#123056'],[.6,'#08162b'],[1,'#03070f']]);c.fillRect(0,0,800,800);
    emblem(400,400,1.05);
    analog(800,800,.6,10);vignette(800,800,.55);
  } else if(kind==='logo-transparent'){
    cv.width=1024;cv.height=1024;c.clearRect(0,0,1024,1024);emblem(512,540,1.35,false);
  } else if(kind==='banner'){ // 2560x1440; safe area for all devices = central 1546x423
    const W=2560,H=1440;cv.width=W;cv.height=H;
    c.fillStyle=lg(0,0,0,H,[[0,'#050912'],[1,'#0b1424']]);c.fillRect(0,0,W,H);
    const ww=92,wh=104,gx=42,gy=40,cols=Math.ceil(W/(ww+gx))+1,rows=Math.ceil(H/(wh+gy))+1;
    grid(W,H,-30,-20,cols,rows,ww,wh,gx,gy,[3,17],5);
    // darken the middle so the title reads; keep edges alive
    c.fillStyle=rg(W/2,H/2,150,1250,[[0,'rgba(3,6,12,.94)'],[.5,'rgba(3,6,12,.78)'],[1,'rgba(3,6,12,.15)']]);c.fillRect(0,0,W,H);
    c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(W/2,H/2,20,900,[[0,`rgba(${GL},.14)`],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,W,H);c.restore();
    // content inside the safe area (1546x423)
    emblem(W/2-560,H/2-8,.82);
    c.textAlign='left';c.textBaseline='middle';
    c.fillStyle='#dbe9ff';c.font='800 78px Georgia,serif';c.fillText('BUREAU OF',W/2-380,H/2-92);c.fillText('HOUSEHOLD ATTENTION',W/2-380,H/2-8);
    c.font='700 34px "DejaVu Sans Mono",monospace';c.fillStyle=`rgba(${GL},.95)`;c.fillText('HOME SAFETY BULLETINS  //  PLEASE STAY TUNED',W/2-380,H/2+84);
    c.font='600 22px "DejaVu Sans Mono",monospace';c.fillStyle='rgba(219,233,255,.5)';c.fillText('NEW BULLETIN EVERY FRIDAY  ·  FICTION',W/2-380,H/2+134);
    analog(W,H,.9,12);vignette(W,H,.6);
  } else if(kind==='watermark'){
    cv.width=150;cv.height=150;c.clearRect(0,0,150,150);emblem(75,80,.2,false);
  }
  return cv.toDataURL('image/png');
};
</script>
