<!doctype html><meta charset="utf-8"><title>BHA thumbs</title><style>html,body{margin:0;background:#000}</style><canvas id="cv" width="1280" height="720"></canvas>
<script>
const cv=document.getElementById('cv'),c=cv.getContext('2d'),W=1280,H=720,PI=Math.PI,GL='110,180,255';
const MONO='"DejaVu Sans Mono","Courier New",monospace';
const rnd=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const lg=(x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,k])=>g.addColorStop(o,k));return g};
const rg=(x,y,r0,r1,st)=>{const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach(([o,k])=>g.addColorStop(o,k));return g};
function rr(x,y,w,h,r,f,s,lw=3){c.beginPath();c.roundRect(x,y,w,h,r);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw;c.stroke()}}
function stroked(txt,x,y,size,fill,stroke='#02050a',align='center',lw=.2){c.font=`800 ${size}px ${MONO}`;c.textAlign=align;c.textBaseline='middle';c.lineJoin='round';c.strokeStyle=stroke;c.lineWidth=size*lw;c.strokeText(txt,x,y);c.fillStyle=fill;c.fillText(txt,x,y)}
function person(x,y,s,rim=1){
  c.save();c.translate(x,y);c.scale(s,s);
  const body=()=>{c.beginPath();c.moveTo(-190,40);c.bezierCurveTo(-180,-40,-120,-84,-50,-92);c.lineTo(50,-92);c.bezierCurveTo(120,-84,180,-40,190,40);c.lineTo(200,500);c.lineTo(-200,500);c.closePath()};
  c.fillStyle='#03050a';body();c.fill();
  c.beginPath();c.ellipse(0,-170,66,80,0,0,PI*2);c.fill();c.fillRect(-26,-110,52,40);
  c.beginPath();c.ellipse(0,-190,68,70,0,PI,0);c.fillStyle='#010207';c.fill();
  c.save();c.globalCompositeOperation='lighter';c.strokeStyle=`rgba(${GL},${.8*rim})`;c.lineWidth=7;c.shadowColor=`rgba(${GL},1)`;c.shadowBlur=26;
  c.beginPath();c.moveTo(-190,40);c.bezierCurveTo(-180,-40,-120,-84,-50,-92);c.stroke();
  c.beginPath();c.moveTo(50,-92);c.bezierCurveTo(120,-84,180,-40,190,40);c.stroke();
  c.beginPath();c.ellipse(0,-190,68,70,0,PI*1.02,PI*1.98);c.stroke();c.restore();
  c.restore();
}
function grain(amt=12,seed=7){const img=c.getImageData(0,0,W,H),d=img.data;let s=seed*2654435761>>>0||1;const r=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296};
  const o=new Uint8ClampedArray(d.length);
  for(let y=0;y<H;y++){const sc=(y&1)?.92:1,b=y*W;for(let x=0;x<W;x++){const xr=Math.min(W-1,x+2),xb=Math.max(0,x-2),n=(r()-.5)*amt,i=(b+x)*4;o[i]=d[(b+xr)*4]*sc+n;o[i+1]=d[i+1]*sc+n;o[i+2]=d[(b+xb)*4+2]*sc+n+3;o[i+3]=255}}
  c.putImageData(new ImageData(o,W,H),0,0);
  c.save();c.filter='blur(7px)';c.globalCompositeOperation='screen';c.globalAlpha=.3;c.drawImage(cv,0,0);c.restore();
  c.fillStyle=rg(W/2,H/2,H*.3,W*.62,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.7)']]);c.fillRect(0,0,W,H);
}
function tag(){ // series tag, top-left (kept out of the bottom-right timestamp zone)
  c.save();rr(34,30,300,54,6,'rgba(2,6,14,.75)',`rgba(${GL},.6)`,2);
  c.font=`800 26px ${MONO}`;c.textAlign='left';c.textBaseline='middle';c.fillStyle=`rgb(${GL})`;c.fillText('▶ BULLETIN 01',52,58);c.restore();
}
function ghost(txt,x,y,size=30,a=.07){c.save();c.font=`800 ${size}px ${MONO}`;c.textAlign='center';c.fillStyle=`rgba(${GL},${a})`;c.fillText(txt,x,y);c.restore()}

/* A — "STILL WATCHING?" the room, the giant dialog, one silhouette */
function A(){
  c.fillStyle=lg(0,0,0,H,[[0,'#0a1626'],[1,'#03070d']]);c.fillRect(0,0,W,H);
  // TV
  rr(250,50,930,590,46,'#12161c','#020407',10);
  c.save();c.beginPath();c.roundRect(292,92,846,506,52);c.clip();
  c.fillStyle=lg(0,92,0,598,[[0,'#d6ebff'],[1,'#7fb2ea']]);c.fillRect(292,92,846,506);
  for(let i=0;i<40;i++){c.fillStyle=`rgba(255,255,255,${.06+.1*rnd(i)})`;c.fillRect(292+rnd(i+3)*846,92+rnd(i+9)*506,260*rnd(i+5),5+rnd(i)*9)}
  c.fillStyle='rgba(20,50,100,.18)';c.fillRect(292,300,846,40);
  stroked('STILL',715,225,215,'#08192f','rgba(255,255,255,.0)','center',.0);
  stroked('WATCHING?',715,395,138,'#08192f','rgba(255,255,255,0)','center',0);

  rr(520,478,190,74,6,'#08192f');c.font=`800 46px ${MONO}`;c.textAlign='center';c.fillStyle='#bfe0ff';c.fillText('YES',615,516);
  rr(740,478,190,74,6,null,'rgba(8,25,47,.16)',3);c.fillStyle='rgba(8,25,47,.16)';c.fillText('NO',835,516);
  c.restore();
  // glow

  person(250,660,1.0);
  ghost('look up',W/2,22,26,.08);

}
/* B — "ONE STOOD UP." a block of watchers, one warm window */
function B(){
  c.fillStyle=lg(0,0,0,H,[[0,'#04070d'],[1,'#0a1220']]);c.fillRect(0,0,W,H);
  const cols=9,rows=6,ww=106,wh=96,gx=30,gy=28,ox=(W-(cols*(ww+gx)-gx))/2,oy=(H-(rows*(wh+gy)-gy))/2;
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    const x=ox+k*(ww+gx),y=oy+r*(wh+gy),id=r*cols+k,stand=(r===2&&k===6);
    if(rnd(id*1.7)<.06){rr(x,y,ww,wh,4,'#03050a');continue}
    if(stand){
      c.save();c.shadowColor='rgba(255,170,60,.9)';c.shadowBlur=60;rr(x,y,ww,wh,4,lg(x,y,x,y+wh,[[0,'#fff1d0'],[1,'#ffb44a']]),'#02040a',4);c.restore();
      c.fillStyle='#03050a';c.beginPath();c.ellipse(x+ww/2,y+wh*.3,ww*.15,wh*.17,0,0,PI*2);c.fill();c.fillRect(x+ww/2-ww*.26,y+wh*.46,ww*.52,wh);
    } else {
      const br=.55+.25*Math.sin(id*1.3);
      rr(x,y,ww,wh,4,lg(x,y,x,y+wh,[[0,`rgba(140,195,255,${.85*br})`],[1,`rgba(60,120,205,${.7*br})`]]),'#02040a',4);
      c.fillStyle='#03050a';const sx=x+ww/2+(rnd(id+3)-.5)*ww*.22;c.beginPath();c.ellipse(sx,y+wh-wh*.36,ww*.13,wh*.15,0,0,PI*2);c.fill();c.beginPath();c.moveTo(sx-ww*.32,y+wh);c.quadraticCurveTo(sx-ww*.27,y+wh-wh*.24,sx,y+wh-wh*.24);c.quadraticCurveTo(sx+ww*.27,y+wh-wh*.24,sx+ww*.32,y+wh);c.fill();
    }
    c.fillStyle='#02040a';c.fillRect(x+ww/2-2,y,4,wh);
  }
  // legibility band + text
  c.fillStyle=lg(0,H*.45,0,H,[[0,'rgba(2,5,10,0)'],[1,'rgba(2,5,10,.92)']]);c.fillRect(0,H*.4,W,H*.6);
  stroked('ONE STOOD UP.',W/2,H-118,132,'#f2f8ff','#02050a','center',.16);
  ghost('everyone else kept watching',W/2,H-38,26,.35);
  tag();
}
/* C — "04:12:33" watch time */
function C(){
  c.fillStyle=lg(0,0,0,H,[[0,'#0b1a2e'],[1,'#03070d']]);c.fillRect(0,0,W,H);
  // huge faint clock face behind
  c.save();c.translate(W/2,H/2+10);c.globalAlpha=.16;c.strokeStyle='#dbe9ff';c.lineWidth=14;c.beginPath();c.arc(0,0,330,0,PI*2);c.stroke();
  for(let i=0;i<12;i++){const a=i/12*PI*2;c.beginPath();c.moveTo(Math.sin(a)*290,-Math.cos(a)*290);c.lineTo(Math.sin(a)*320,-Math.cos(a)*320);c.stroke()}
  c.lineWidth=18;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.lineTo(Math.sin(4.2)*200,-Math.cos(4.2)*200);c.stroke();c.beginPath();c.moveTo(0,0);c.lineTo(Math.sin(1.1)*270,-Math.cos(1.1)*270);c.stroke();c.restore();
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(W/2,H/2,40,700,[[0,`rgba(${GL},.3)`],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,W,H);c.restore();
  c.save();c.shadowColor=`rgba(${GL},.95)`;c.shadowBlur=50;stroked('04:12:33',W/2,H/2-10,250,'#cfe8ff','#031020','center',.08);c.restore();
  stroked('WATCH TIME',W/2,150,64,`rgb(${GL})`,'#02050a','center',.16);
  stroked("DON'T COUNT.",W/2,H-100,110,'#f2f8ff','#02050a','center',.16);

  tag();
}

const AMB='255,176,74';
function tag2(n){c.save();rr(34,30,320,54,6,'rgba(2,6,14,.75)',`rgba(${GL},.6)`,2);c.font=`800 26px ${MONO}`;c.textAlign='left';c.textBaseline='middle';c.fillStyle=`rgb(${GL})`;c.fillText('▶ BULLETIN '+n,52,58);c.restore()}
function phoneShape(x,y,w,h){rr(x,y,w,h,50,'#0b0f16','#26344a',6)}

  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(330,380,40,620,[[0,`rgba(${GL},.35)`],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,W,H);c.restore();
  phoneShape(110,40,440,640);c.save();c.beginPath();c.roundRect(132,72,396,576,34);c.clip();c.fillStyle=lg(0,72,0,648,[[0,'#10203a'],[1,'#08111d']]);c.fillRect(132,72,396,576);
  c.beginPath();c.arc(330,130,26,0,PI*2);c.fillStyle='#1b2a44';c.fill();
  rr(150,200,200,58,29,'#1b2a44');c.font=`700 26px ${MONO}`;c.textAlign='left';c.fillStyle='#b9d2f2';c.fillText('are you up?',172,230);
  rr(148,545,364,70,35,'#101c2c','#2a4262',3);c.font=`800 46px ${MONO}`;c.fillStyle='#e8f2ff';c.fillText('hello|',176,582);
  c.beginPath();c.arc(480,580,24,0,PI*2);c.fillStyle='rgba(120,190,255,.5)';c.fill();

}
/* 02-B "THE LOUDEST WINS." */
function T2B(){
  c.fillStyle=lg(0,0,0,H,[[0,'#08111f'],[1,'#02050a']]);c.fillRect(0,0,W,H);
  const n=26,bw=30,gap=14,x0=W-40-(n*(bw+gap)),base=650;
  for(let i=9;i<n;i++){const x=x0+i*(bw+gap);let h=(60+110*(.5+.5*Math.sin(i*1.7)))*.55;const loud=(i===18);if(loud)h=560;
    c.save();if(loud){c.shadowColor=`rgba(${AMB},1)`;c.shadowBlur=50}rr(x,base-h,bw,h,6,loud?lg(x,base-h,x,base,[[0,'#ffd08a'],[1,'#ff8a3a']]):lg(x,base-h,x,base,[[0,'#9fd0ff'],[1,'#2f5f9a']]),'#02040a',3);c.restore()}
  stroked('THE',330,190,150,'#f2f8ff','#02050a','center',.16);
  stroked('LOUDEST',330,340,150,'#f2f8ff','#02050a','center',.16);
  c.save();c.shadowColor=`rgba(${AMB},.9)`;c.shadowBlur=40;stroked('WINS.',330,490,150,`rgb(${AMB})`,'#02050a','center',.16);c.restore();
  ghost('(quiet)',x0+26*(bw+gap)-20,base+34,22,.3);tag2('02');
}
/* 02-C "FEEL ANGRY? YOU'RE INFORMED." */
function T2C(){
  c.fillStyle=lg(0,0,0,H,[[0,'#0a0f1c'],[1,'#02050a']]);c.fillRect(0,0,W,H);
  c.save();c.shadowColor=`rgba(${AMB},.95)`;c.shadowBlur=32;c.strokeStyle=`rgb(${AMB})`;c.lineWidth=9;c.lineJoin='round';c.beginPath();
  for(let x=20;x<=W-20;x+=3){const per=150,u=((x*1.0)%per)/per;let y=0;const A=150;if(u>.30&&u<.36)y=-A*Math.sin((u-.30)/.06*PI);else if(u>=.36&&u<.42)y=A*.5*Math.sin((u-.36)/.06*PI);else if(u>.55&&u<.75)y=-A*.18*Math.sin((u-.55)/.2*PI);x===20?c.moveTo(x,370+y):c.lineTo(x,370+y)}c.stroke();c.restore();
  stroked('FEEL ANGRY?',W/2,150,120,'#f2f8ff','#02050a','center',.16);
  c.save();c.shadowColor=`rgba(${AMB},.9)`;c.shadowBlur=40;stroked("YOU'RE INFORMED.",W/2,590,108,`rgb(${AMB})`,'#02050a','center',.16);c.restore();
  tag2('02');
}
/* 03-A "ONE MORE." */
function T3A(){
  c.fillStyle=lg(0,0,0,H,[[0,'#080e1a'],[1,'#02040a']]);c.fillRect(0,0,W,H);
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(860,380,40,600,[[0,`rgba(${GL},.4)`],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,W,H);c.restore();
  phoneShape(660,30,420,700);c.save();c.beginPath();c.roundRect(682,62,376,636,34);c.clip();
  const cols=[['#3a5fa8','#122040'],['#a84a6a','#3a1428']];[0,1].forEach(i=>{c.fillStyle=lg(0,62+i*330,0,62+i*330+320,[[0,cols[i][0]],[1,cols[i][1]]]);c.fillRect(682,62+i*330-80,376,320);c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.arc(870,200+i*330-80,70,0,PI*2);c.fill()});c.restore();
  c.save();c.translate(1010,780);c.rotate(-.25);c.fillStyle='#03050a';c.beginPath();c.roundRect(-80,-520,160,560,80);c.fill();c.save();c.globalCompositeOperation='lighter';c.strokeStyle=`rgba(${GL},.7)`;c.lineWidth=7;c.shadowColor=`rgba(${GL},1)`;c.shadowBlur=24;c.beginPath();c.roundRect(-80,-520,160,560,80);c.stroke();c.restore();c.restore();

  c.save();c.shadowColor=`rgba(${GL},.9)`;c.shadowBlur=40;stroked('MORE.',330,440,190,`rgb(${GL})`,'#02050a','center',.16);c.restore();

}
/* 03-B "DON'T WATCH THE SUNSET." */
function T3B(){
  c.fillStyle=lg(0,0,0,H,[[0,'#0b1220'],[1,'#03060b']]);c.fillRect(0,0,W,H);
  rr(40,70,470,470,8,lg(0,70,0,540,[[0,'#ff8a5a'],[.55,'#ff5a7a'],[1,'#3a2a6a']]),'#02040a',12);
  c.beginPath();c.arc(275,400,78,0,PI*2);c.fillStyle='rgba(255,236,196,.95)';c.fill();c.fillStyle='#02040a';c.fillRect(270,70,12,470);c.fillRect(40,300,470,12);
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(280,300,40,720,[[0,'rgba(255,150,80,.45)'],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,W,H);c.restore();
  // silhouette scrolling, back to the window
  c.save();c.translate(880,690);c.scale(1.25,1.25);c.fillStyle='#03050a';c.beginPath();c.moveTo(-70,20);c.bezierCurveTo(-92,-110,-40,-230,30,-240);c.bezierCurveTo(82,-246,100,-190,90,-130);c.bezierCurveTo(86,-60,70,0,62,40);c.lineTo(-52,40);c.closePath();c.fill();c.beginPath();c.ellipse(70,-282,50,56,0,0,PI*2);c.fill();
  c.strokeStyle='#03050a';c.lineWidth=36;c.lineCap='round';c.beginPath();c.moveTo(20,-170);c.quadraticCurveTo(112,-100,190,-132);c.stroke();
  c.save();c.translate(206,-150);c.rotate(-.3);rr(-30,-54,60,108,10,'#c8e6ff','#04060b',4);c.restore();
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(206,-150,10,320,[[0,`rgba(${GL},.5)`],[1,'rgba(0,0,0,0)']]);c.fillRect(-300,-500,800,700);c.restore();c.restore();
  c.save();c.shadowColor='rgba(255,150,80,.8)';c.shadowBlur=30;stroked("DON'T WATCH",W/2,575,88,'#ffb37a','#02050a','center',.16);c.restore();
  stroked('THE SUNSET.',W/2,665,88,'#f2f8ff','#02050a','center',.16);
  tag2('03');
}
/* 03-C "3:07 AM" */
function T3C(){
  c.fillStyle=lg(0,0,0,H,[[0,'#0a121c'],[1,'#02040a']]);c.fillRect(0,0,W,H);
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(W/2,300,40,700,[[0,'rgba(255,90,70,.22)'],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,W,H);c.restore();

}


const GRNc='120,255,170';
function crt4(x,y,w,h,lines){
  rr(x,y,w,h,36,'#cbbf9f','#5b5340',8);rr(x+w*.06,y+h*.07,w*.88,h*.76,26,'#a89d80','#4a4333',5);
  const sx=x+w*.1,sy=y+h*.11,sw=w*.8,sh=h*.68;c.save();c.beginPath();c.roundRect(sx,sy,sw,sh,34);c.clip();c.fillStyle='#03130a';c.fillRect(sx,sy,sw,sh);
  c.textAlign='left';c.textBaseline='top';lines.forEach((L,i)=>{c.font=`800 ${L.s}px ${MONO}`;c.fillStyle=L.c;c.fillText(L.t,sx+30,sy+30+i*(L.h||70))});
  c.fillStyle=rg(sx+sw/2,sy+sh/2,sw*.25,sw*.65,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.55)']]);c.fillRect(sx,sy,sw,sh);c.fillStyle=lg(sx,sy,sx+sw*.6,sy+sh*.7,[[0,'rgba(255,255,255,.10)'],[1,'rgba(255,255,255,0)']]);c.fillRect(sx,sy,sw,sh);c.restore();
  rr(x+w*.22,y+h,w*.56,34,10,'#b3a887','#5b5340',5);
}
/* 04-A "SAY IT BACK." */
function T4A(){
  c.fillStyle=lg(0,0,0,H,[[0,'#0a1410'],[1,'#020504']]);c.fillRect(0,0,W,H);
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=rg(420,330,40,700,[[0,`rgba(${GRNc},.28)`],[1,'rgba(0,0,0,0)']]);c.fillRect(0,0,W,H);c.restore();
  crt4(70,50,720,560,[{t:'IT> I love you.',s:52,c:`rgba(${GRNc},1)`,h:82},{t:'YOU> i love you',s:52,c:'#e6f0ff',h:82},{t:'IT> Say it again.',s:52,c:`rgba(${GRNc},1)`,h:82},{t:'█',s:52,c:`rgba(${GRNc},.9)`}]);
  // silhouette in the foreground, lit green
