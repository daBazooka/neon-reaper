<!doctype html><meta charset="utf-8"><title>RECEIPTS motion</title>
<style>
html,body{margin:0;background:#0b0d12;overflow:hidden}
#s{position:relative;width:1080px;height:1920px;background:#0b0d12;font-family:system-ui,Segoe UI,Arial,sans-serif;font-weight:900;color:#fff;overflow:hidden}
#s:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:60px 60px}
.c{position:absolute;left:0;right:0;text-align:center;padding:0 70px;box-sizing:border-box;line-height:1.05}
.stamp{position:absolute;left:50%;top:50%;border:18px solid;padding:30px 50px;border-radius:24px;letter-spacing:6px;text-align:center;white-space:nowrap}
.chip{position:absolute;left:50%;padding:26px 44px;border-radius:22px;background:#161a24;border:3px solid #2a3142;font-size:58px;white-space:nowrap}
</style>
<div id="s"></div>
<script>
const S=document.getElementById('s');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const G='#2ee59d',R='#ff4d5e',A='#ffb020',B='#4cc9ff';
function T(t,a,b){return clamp((t-a)/(b-a))}
function txt(t,t0,y,size,html,color='#fff'){ // pop-in text
  const p=eo(T(t,t0,t0+.25)); if(p<=0) return '';
  return `<div class="c" style="top:${y}px;font-size:${size}px;color:${color};opacity:${p};transform:translateY(${(1-p)*40}px)">${html}</div>`;
}
function stamp(t,t0,label,color,y,rot,size=120){
  const d=t-t0; if(d<0) return '';
  const sc=d<.14?(3-2*(d/.14)):1, sh=d>.14&&d<.4?Math.sin(d*90)*(.4-d)*30:0;
  const op=d<.06?d/.06:1;
  return `<div class="stamp" style="top:${y}px;font-size:${size}px;color:${color};border-color:${color};opacity:${op};transform:translate(calc(-50% + ${sh}px),-50%) rotate(${rot}deg) scale(${sc});box-shadow:0 0 60px ${color}55, inset 0 0 40px ${color}22">${label}</div>`;
}
function chip(t,t0,txt,y,dir){
  const p=eo(T(t,t0,t0+.4)); if(p<=0) return '';
  return `<div class="chip" style="top:${y}px;opacity:${p};transform:translate(calc(-50% + ${(1-p)*dir*700}px),0)">${txt}</div>`;
}
function trailer(t){
  let h='';
  if(t<3.6){
    h+=txt(t,.1,330,104,'EVERYONE\'S<br>SELLING YOU<br>A <span style="color:'+A+'">SHORTCUT.</span>');
    h+=chip(t,1.0,'"SAVE 10 HOURS A WEEK"',1100,-1);
    h+=chip(t,1.5,'"$0 → $5K A MONTH"',1290,1);
    h+=chip(t,2.0,'"DOUBLE YOUR SPEED"',1480,-1);
  } else if(t<7.6){
    h+=txt(t,3.7,300,120,'SO WE<br><span style="color:'+B+'">TEST THEM.</span>');
    const s=Math.max(0,t-3.7)*9.3; const m=String(Math.floor(s/60)).padStart(2,'0'),sec=String(Math.floor(s%60)).padStart(2,'0'),ds=Math.floor((s*10)%10);
    h+=`<div class="c" style="top:930px;font-size:200px;font-variant-numeric:tabular-nums;color:${B};text-shadow:0 0 40px ${B}66">${m}:${sec}.${ds}</div>`;
    h+=txt(t,4.4,1280,56,'TIMER ON SCREEN. ALWAYS.','#9aa4b8');
  } else if(t<12.6){
    h+=txt(t,7.7,420,110,'REAL TESTS.');
    h+=txt(t,8.7,640,110,'REAL NUMBERS.');
    h+=txt(t,9.7,900,84,'RULES SET<br><span style="color:'+A+'">BEFORE</span> WE START.');
  } else if(t<20.2){
    if(t<15.4){h+=stamp(t,12.8,'VERIFIED',G,860,-7);h+=txt(t,13.3,1180,80,'IT WORKS.',G);}
    else if(t<17.9){h+=stamp(t,15.5,'BUSTED',R,860,6);h+=txt(t,16.0,1180,80,'IT DOESN\'T.',R);}
    else {h+=stamp(t,18.0,'IT\'S<br>COMPLICATED',A,860,-4,100);h+=txt(t,18.7,1260,80,'IT DEPENDS.',A);}
  } else if(t<24.2){
    h+=txt(t,20.3,260,80,'THE SCOREBOARD','#9aa4b8');
    const n=(v)=>Math.floor(v);
    const col=(x,label,color,val)=>`<div style="position:absolute;top:520px;left:${x}px;width:300px;text-align:center"><div style="font-size:190px;color:${color}">${val}</div><div style="font-size:34px;letter-spacing:0;white-space:nowrap;margin:0 -30px;color:${color}">${label}</div></div>`;
    const p=eo(T(t,20.6,21.2));
    h+=`<div style="opacity:${p}">`+col(30,'VERIFIED',G,0)+col(390,'BUSTED',R,0)+col(750,'COMPLICATED',A,0)+`</div>`;
    h+=txt(t,21.6,1000,96,'A NEW CLAIM<br>EVERY WEEK.');
    h+=txt(t,22.6,1400,54,'THE SCOREBOARD NEVER RESETS.','#9aa4b8');
  } else {
    h+=txt(t,24.3,430,110,'GOT A CLAIM?<br><span style="color:'+B+'">COMMENT IT.</span>');
    h+=txt(t,25.2,980,60,'THE TOP ONE GETS TESTED NEXT.','#9aa4b8');
    h+=`<div class="c" style="top:1300px;font-size:150px;letter-spacing:8px;opacity:${eo(T(t,25.8,26.3))}">RECEIPTS</div>`;
    h+=txt(t,26.4,1500,48,'SUBSCRIBE FOR THE VERDICTS','#9aa4b8');
  }
  S.innerHTML=h;
}
function stampClip(t,kind){
  const m={verified:['VERIFIED',G,-7],busted:['BUSTED',R,6],complicated:['IT\'S<br>COMPLICATED',A,-4]}[kind];
  S.innerHTML=stamp(t,.5,m[0],m[1],960,m[2],kind==='complicated'?110:140);
}
window.render=(t,mode,kind)=>mode==='stamp'?stampClip(t,kind):trailer(t);
render(0,'trailer');
</script>
