<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d22">
<meta name="description" content="WITCHLIGHT: a little witch with a lantern banishes the shadows. Fuse elemental spells, survive until dawn, and turn the dark world into a glowing garden.">
<title>WITCHLIGHT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230b0d22%22/%3E%3Cpath d=%22M3 11L8 1L13 11Z%22 fill=%22%236a3ad8%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%222.5%22 fill=%22%23ffe9a8%22/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060c;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#fff;font-weight:900}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.hidden{display:none!important}
.coin::before{content:"";display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 55%,#d98a00);box-shadow:0 0 0 2px #7a4200;margin-right:6px;vertical-align:-.1em}
.chip{background:rgba(43,42,74,.8);padding:6px 12px;border-radius:14px;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.25);white-space:nowrap}
.chip.big{font-size:24px}
.small{font-size:14px;opacity:.9}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hL,#hR{position:absolute;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
#hL{left:calc(10px + env(safe-area-inset-left))}
#hR{right:calc(10px + env(safe-area-inset-right));flex-direction:column;align-items:flex-end;gap:6px}
#hC{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(46vw,380px)}
#hud button{pointer-events:auto}
.ico{width:44px;height:44px;border-radius:14px;background:rgba(43,42,74,.8);font-size:18px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
#timer.low{background:#e8413a;animation:pulse .5s infinite}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes pulse{50%{transform:scale(1.1)}}

#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;width:94%;animation:ban 2.4s ease both}
#banner b{display:block;font-size:clamp(34px,7vw,66px);-webkit-text-stroke:3px #3a1d4a;paint-order:stroke fill;text-shadow:0 6px 0 #3a1d4a}
#banner small{display:block;font-size:clamp(16px,2.6vw,22px);margin-top:4px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}18%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
#tip{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;pointer-events:none;background:rgba(60,30,70,.78);padding:10px 20px;border-radius:18px;font-size:clamp(15px,2.4vw,21px);text-align:center;max-width:min(92%,640px);animation:tipIn .35s ease both}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,16px)}}

/* title */
#title{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;padding:16px}
#title>*{pointer-events:auto}
#title .tag,#title h1,#tHint{pointer-events:none}
#tTop{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;display:flex;gap:8px}
#logo{display:flex;gap:.2em;font-size:clamp(40px,11.5vw,120px);line-height:1;letter-spacing:2px;animation:logo 2.4s ease-in-out infinite}
#logo span{color:#ffe9a8;-webkit-text-stroke:4px #1a0a30;paint-order:stroke fill;text-shadow:0 8px 0 #1a0a30,0 0 34px rgba(255,233,168,.7);display:inline-block}
#logo span+span{color:#c58bff;text-shadow:0 8px 0 #1a0a30,0 0 34px rgba(197,139,255,.8)}
@keyframes logo{50%{transform:translateY(-6px) scale(1.02,.98)}}
.tag{font-size:clamp(16px,2.6vw,22px);color:#fff;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:12px}.tag b{color:#ffd23a}
.tBtns{display:grid;grid-template-columns:repeat(4,auto);gap:10px}
.tBtns .btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;padding:10px 14px;position:relative}
.tBtns .btn span{font-size:22px}
.badge{position:absolute;top:-6px;right:-6px;background:#ff3f5a;border-radius:50%;width:22px;height:22px;font-style:normal;font-size:14px;line-height:22px}
.hint2{font-size:14px;color:#fff;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:10px}
@media (max-width:560px){.tBtns{grid-template-columns:repeat(2,auto)}}

/* screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(40,20,50,.5);padding:12px;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.card{background:linear-gradient(#2a1f5a,#130f30);border:2px solid #6a4ad8;border-radius:28px;padding:20px;width:min(430px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 #0a0c1e,0 18px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;animation:popIn .35s cubic-bezier(.3,1.6,.5,1) both}
.card.wide{width:min(620px,100%)}
@keyframes popIn{from{transform:scale(.7);opacity:0}}
.ttl{font-size:32px;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.ttl small{font-size:18px;margin-left:8px}
.btn{padding:13px 18px;border-radius:18px;font-size:19px;background:#8a5ae8;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 0 rgba(0,0,0,.22)}
.btn.go{background:linear-gradient(#6dff9a,#1fc760);color:#123d22}
.btn.gold{background:linear-gradient(#ffd24a,#ff9a1a);color:#4a2400}
.btn.ghost{background:rgba(255,255,255,.2)}
.btn.big{font-size:30px;padding:16px 44px;border-radius:24px}
.btn.big small{display:block;font-size:14px;opacity:.8}
.btn.wide{width:100%}
.btn:active,.ico:active{transform:scale(.94)}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.btns .btn.ghost,#rUp{flex:0 0 58px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.14);border-radius:16px;padding:10px 12px;text-align:left}
.row .ic{font-size:28px;width:40px;text-align:center}
.row .tx{flex:1;font-size:16px}
.row .tx small{display:block;font-size:12px;opacity:.85;font-weight:700}
.row .lv{display:flex;gap:2px;margin-top:4px}
.row .lv i{width:8px;height:8px;border-radius:2px;background:rgba(0,0,0,.2)}
.row .lv i.on{background:#ffe14d}
.row button{padding:8px 12px;border-radius:12px;background:linear-gradient(#6dff9a,#1fc760);color:#123d22;font-size:15px;min-width:86px}
.row button:disabled{background:rgba(0,0,0,.2);color:rgba(255,255,255,.6)}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffe14d}
#sGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#sGrid button{border-radius:16px;background:rgba(0,0,0,.14);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
#sGrid canvas{width:64px;height:64px}
#sGrid button.eq{box-shadow:0 0 0 3px #6dff9a inset;background:rgba(109,255,154,.25)}
#sGrid .price{color:#ffe14d}
@media (max-width:480px){#sGrid{grid-template-columns:repeat(3,1fr)}}
.setRow{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.14);border-radius:14px;padding:12px 14px;font-size:17px}
.setRow b{background:#1fc760;border-radius:10px;padding:3px 10px;font-size:14px}
.setRow b.off{background:rgba(0,0,0,.3)}
#rStars{display:flex;justify-content:center;gap:10px;height:72px;align-items:center}
#rStars i{width:60px;height:60px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(0,0,0,.25)}
#rStars i:nth-child(2){width:76px;height:76px}
#rStars i.on{background:linear-gradient(#fff3a0,#ffc21a);animation:star .45s cubic-bezier(.3,1.8,.5,1) both}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
#rStats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#rStats div{background:rgba(0,0,0,.14);border-radius:12px;padding:6px 8px;font-size:14px}
#rStats b{display:block;font-size:20px}
.coin.big{font-size:34px;color:#ffe14d;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.qmini{display:flex;flex-direction:column;gap:4px;font-size:13px}
.qmini div{background:rgba(0,0,0,.12);border-radius:10px;padding:5px 8px;text-align:left}
.qmini div.done{background:rgba(109,255,154,.3)}

#toasts{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:20;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:rgba(60,30,70,.88);padding:10px 18px;border-radius:14px;font-size:18px;animation:toast 1.8s ease both;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#boot{position:fixed;inset:0;z-index:50;background:#0b0d22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
.bootLogo{font-size:44px;color:#ffe9a8;-webkit-text-stroke:3px #1a0a30;paint-order:stroke fill;text-shadow:0 6px 0 #1a0a30,0 0 30px rgba(255,233,168,.6)}
.bootBar{width:200px;height:12px;border-radius:6px;background:rgba(0,0,0,.2);overflow:hidden}
.bootBar i{display:block;height:100%;width:40%;background:#c58bff;border-radius:6px;animation:boot 1s ease-in-out infinite alternate}
@keyframes boot{to{transform:translateX(150%)}}
@media (max-height:520px){.card{padding:12px;gap:8px}.ttl{font-size:24px}#rStars{height:52px}#rStars i{width:44px;height:44px}#rStars i:nth-child(2){width:56px;height:56px}.btn.big{font-size:24px;padding:12px 32px}#logo{font-size:64px}}

body.touch #tip{bottom:calc(150px + env(safe-area-inset-bottom))}

#hC{width:auto}
#powers{display:flex;gap:6px;margin-top:4px}
#powers span{background:rgba(43,42,74,.8);border-radius:12px;padding:3px 8px;font-size:15px}
.chip.combo{background:#12b89a;animation:pulse .6s infinite}
.btn.pink{background:linear-gradient(#ff9ec2,#ff5a8a)}
#oStats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#oStats div{background:rgba(0,0,0,.14);border-radius:12px;padding:6px 8px;font-size:14px}
#oStats b{display:block;font-size:20px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.15);font-size:15px}
.tabs button.on{background:#ffe9a8;color:#2a1050}
#sGrid .row{grid-column:1/-1}
#banner b{-webkit-text-stroke:3px #2b2a4a;text-shadow:0 6px 0 #2b2a4a}
#tip{background:rgba(30,20,70,.85)}
#tip{bottom:calc(46px + env(safe-area-inset-bottom))}
#banner small{text-shadow:0 2px 0 #2b2a4a,0 0 8px #2b2a4a,0 0 3px #2b2a4a}

#sGrid .row{grid-column:1/-1}
#banner b{-webkit-text-stroke:3px #000;text-shadow:0 6px 0 #000,0 0 24px currentColor}
#banner small{text-shadow:0 2px 0 #000,0 0 6px #000}
.moon::before{content:"🌙";margin-right:6px}
.moon.big{font-size:34px;color:#e0c8ff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
#xpBar{position:fixed;left:0;right:0;top:0;height:14px;background:rgba(0,0,0,.55);z-index:5}
#xpBar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7df0ff,#c58bff);box-shadow:0 0 12px #7df0ff}
#xpBar span{position:absolute;right:8px;top:0;font-size:11px;line-height:14px;letter-spacing:1px}
#hL,#hR{top:calc(22px + env(safe-area-inset-top))!important}
#hC{top:calc(20px + env(safe-area-inset-top))!important;width:auto!important}
#hpBar{position:relative;width:min(36vw,200px);height:22px;border-radius:11px;background:rgba(0,0,0,.6);overflow:hidden;border:2px solid rgba(255,255,255,.2)}
#hpBar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#ff8ab0,#e0457a)}
#hpBar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px}
#timeTxt{font-size:clamp(26px,4.5vw,40px);color:#ffe9a8;-webkit-text-stroke:2px #1a0a30;paint-order:stroke fill;text-shadow:0 3px 0 #1a0a30,0 0 16px rgba(255,233,168,.5);line-height:1}
#dawnTxt{font-size:11px;letter-spacing:2px;opacity:.8}
#bossBar{margin-top:6px;width:min(60vw,360px);text-align:center}
#bossBar b{font-size:13px;color:#ff9ef0;letter-spacing:2px}
#bossBar div{height:10px;border-radius:5px;background:rgba(0,0,0,.6);overflow:hidden;margin-top:2px}
#bossBar i{display:block;height:100%;background:linear-gradient(90deg,#ff5aa0,#c58bff)}
#spellRow{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;z-index:5;pointer-events:none}
#spellRow span{background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.15);border-radius:10px;padding:2px 6px;font-size:16px;white-space:nowrap}
#spellRow span small{font-size:10px;margin-left:2px;color:#ffe9a8}
#spellRow span.fu{border-color:#ffd23a;box-shadow:0 0 10px rgba(255,210,58,.6)}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,233,168,.5)}
#lvCards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#lvCards button{border-radius:18px;padding:14px 8px;background:linear-gradient(#352a6e,#1c1640);border:3px solid #6a4ad8;display:flex;flex-direction:column;align-items:center;gap:6px;animation:popIn .35s cubic-bezier(.3,1.6,.5,1) both}
#lvCards button:nth-child(2){animation-delay:.07s}#lvCards button:nth-child(3){animation-delay:.14s}
#lvCards button:hover{transform:translateY(-4px)}
#lvCards .fus{border-color:#ffd23a;background:linear-gradient(#5a3a1a,#2a1640);box-shadow:0 0 26px rgba(255,210,58,.6);animation:popIn .35s cubic-bezier(.3,1.6,.5,1) both,glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 40px rgba(255,210,58,.9)}}
#lvCards .ci{font-size:40px}#lvCards .cn{font-size:16px}#lvCards .cd{font-size:12px;opacity:.9;font-weight:700}
#lvCards .lv{font-size:11px;color:#7df0ff;letter-spacing:1px}
#oTime{font-size:54px;color:#ffe9a8;-webkit-text-stroke:2px #1a0a30;paint-order:stroke fill;line-height:1}
#banner b{-webkit-text-stroke:3px #1a0a30;text-shadow:0 6px 0 #1a0a30,0 0 26px currentColor}
#banner small{text-shadow:0 2px 0 #000,0 0 6px #000}
@media (max-width:620px){#lvCards{grid-template-columns:1fr}#lvCards button{flex-direction:row;text-align:left;padding:10px}#lvCards .ci{font-size:32px}#hR{flex-direction:column;align-items:flex-end}#spellRow span{font-size:13px;padding:2px 4px}}
@media (max-width:640px){
  #hC{top:calc(70px + env(safe-area-inset-top))!important}
  #hpBar{width:min(34vw,160px)}
  #hR .chip{font-size:14px;padding:4px 8px}
}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="xpBar"><i></i><span id="lvTxt">LV 1</span></div>
  <div id="hL"><button id="pauseBtn" class="ico" aria-label="Pause">❚❚</button><div id="hpBar"><i></i><span id="hpTxt">100</span></div></div>
  <div id="hC"><div id="timeTxt">8:00</div><div class="small" id="dawnTxt">until dawn</div><div id="bossBar" class="hidden"><b id="bossName"></b><div><i></i></div></div></div>
  <div id="hR"><div class="chip" id="killTxt">👻 0</div><div class="chip" id="flowerTxt">🌸 0</div></div>
  <div id="spellRow"></div>
</div>
<div id="stick" class="hidden"><i></i></div>
<div id="banner" class="hidden"><b></b><small></small></div>
<div id="tip" class="hidden"></div>

<div id="title">
  <div id="tTop"><div class="chip moon" id="tStones">0</div><div class="chip" id="tBest"></div></div>
  <h1 id="logo"><span>WITCH</span><span>LIGHT</span></h1>
  <div class="tag">Banish the shadows. Fuse the elements. <b>Survive until dawn.</b></div>
  <button id="playBtn" class="btn go big">🏮 PLAY</button>
  <div class="tBtns">
    <button id="bShop" class="btn"><span>🌙</span>UPGRADES<i class="badge hidden" id="shopBadge">!</i></button>
    <button id="bBook" class="btn"><span>📖</span>SPELLBOOK</button>
    <button id="bMi" class="btn"><span>🎯</span>MISSIONS<i class="badge hidden" id="miBadge">!</i></button>
    <button id="bSet" class="btn"><span>⚙</span>SETTINGS</button>
  </div>
  <div class="hint2" id="tHint"></div>
</div>

<div id="level" class="screen hidden"><div class="card wide">
  <div class="ttl" id="lvTitle">LEVEL UP!</div>
  <div id="lvCards"></div>
  <button id="lvReroll" class="btn ghost">🎲 REROLL</button>
</div></div>

<div id="over" class="screen hidden"><div class="card">
  <div class="ttl" id="oTitle">THE SHADOWS WON</div>
  <div id="oTime">0:00</div>
  <div id="oBest" class="small"></div>
  <div id="oStats"></div>
  <div id="oStones" class="moon big">+0</div>
  <button id="oRevive" class="btn pink wide hidden">▶ REVIVE</button>
  <div id="oMiss" class="qmini"></div>
  <div class="btns">
    <button id="oHome" class="btn ghost" aria-label="Home">⌂</button>
    <button id="oShop" class="btn">🌙</button>
    <button id="oDouble" class="btn gold hidden">▶ ×2</button>
    <button id="oAgain" class="btn go">PLAY AGAIN ▶</button>
  </div>
</div></div>

<div id="shop" class="screen hidden"><div class="card wide">
  <div class="ttl">UPGRADES <small class="moon" id="sStones"></small></div>
  <div class="tabs"><button data-tab="perk" class="on">MAGIC</button><button data-tab="hat">HATS</button></div>
  <div id="sGrid"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="book" class="screen hidden"><div class="card wide">
  <div class="ttl">SPELLBOOK</div>
  <div class="small">Raise two elements to level 3 to unlock a fusion.</div>
  <div id="bkList" class="list"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="missions" class="screen hidden"><div class="card">
  <div class="ttl">MISSIONS</div>
  <div id="mList" class="list"></div>
  <div class="small" id="mStats"></div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="settings" class="screen hidden"><div class="card">
  <div class="ttl">SETTINGS</div>
  <div class="list">
    <button class="setRow" data-opt="sfx"><span>Sound effects</span><b></b></button>
    <button class="setRow" data-opt="music"><span>Music</span><b></b></button>
    <button class="setRow" data-opt="shake"><span>Screen shake</span><b></b></button>
  </div>
  <button class="btn ghost back">BACK</button>
</div></div>
<div id="pause" class="screen hidden"><div class="card">
  <div class="ttl">PAUSED</div>
  <button id="pResume" class="btn go wide">▶ RESUME</button>
  <button id="pSet" class="btn wide">⚙ SETTINGS</button>
  <button id="pQuit" class="btn ghost wide">END RUN</button>
</div></div>

<div id="toasts"></div>
<div id="boot"><div class="bootLogo">WITCHLIGHT</div><div class="bootBar"><i></i></div></div>

<script>
'use strict';
/* =====================================================================
   CrazyGames SDK v3 wrapper.
   - Documented order: SDK.init() -> loadingStart() -> (load) -> loadingStop()
   - gameplayStart/Stop are de-duplicated so the portal never sees two
     starts (or two stops) in a row.
   - Every call is wrapped: off-portal (localhost, itch, file://) the game
     runs identically with the SDK absent.
   - ADS_ENABLED stays false during Basic Launch: CrazyGames does not allow
     ads in Basic Launch, so no ad API is touched at all while it's false.
     Flip it to true once the dashboard shows Full Implementation.
   ===================================================================== */
const ADS_ENABLED = false;

const SDK = {
  cg: null, env: 'none', playing: false, lastAd: 0, adBusy: false,
  onMute: null,

  async init(){
    await new Promise(res => {
      let done = false; const fin = () => { if(!done){ done = true; res(); } };
      try{
        const s = document.createElement('script');
        s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
        s.onload = fin; s.onerror = fin;
        document.head.appendChild(s);
      }catch(e){ fin(); }
      setTimeout(fin, 4000);
    });
    try{
      const sdk = window.CrazyGames && window.CrazyGames.SDK;
      if(!sdk) return;
      await Promise.race([sdk.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('sdk timeout')), 5000))]);
      this.env = sdk.environment || 'crazygames';
      if(this.env === 'disabled') return;   // not on a CrazyGames domain
      this.cg = sdk;
      try{
        this.applySettings(sdk.game.settings);
        sdk.game.addSettingsChangeListener(s => this.applySettings(s));
      }catch(e){}
    }catch(e){ this.cg = null; }
  },
  applySettings(s){
    if(!s) return;
    if(this.onMute) this.onMute(!!s.muteAudio);
  },
  data(){ try{ return this.cg && this.cg.data ? this.cg.data : null; }catch(e){ return null; } },

  loadingStart(){ try{ this.cg && this.cg.game.loadingStart(); }catch(e){} },
  loadingStop(){ try{ this.cg && this.cg.game.loadingStop(); }catch(e){} },
  gameplayStart(){ if(this.playing) return; this.playing = true; try{ this.cg && this.cg.game.gameplayStart(); }catch(e){} },
  gameplayStop(){ if(!this.playing) return; this.playing = false; try{ this.cg && this.cg.game.gameplayStop(); }catch(e){} },
  happytime(){ try{ this.cg && this.cg.game.happytime(); }catch(e){} },

  canRewarded(){ return ADS_ENABLED && !!this.cg && !this.adBusy; },

  /* rewarded ad: cb(true) only when the ad finished */
  rewarded(cb){
    if(!this.canRewarded()){ cb(false); return; }
    this._ad('rewarded', cb);
  },
  /* midgame ad at natural breaks, self-limited to one per 3 minutes */
  midgame(cb){
    if(!ADS_ENABLED || !this.cg || this.adBusy || Date.now() - this.lastAd < 180000){ cb(); return; }
    this._ad('midgame', () => cb());
  },
  _ad(type, cb){
    this.adBusy = true; this.gameplayStop();
    let fin = false;
    const end = ok => { if(fin) return; fin = true; this.adBusy = false; this.lastAd = Date.now(); AU.adMute(false); cb(ok); };
    try{
      this.cg.ad.requestAd(type, {
        adStarted: () => AU.adMute(true),
        adFinished: () => end(true),
        adError: () => end(false)
      });
    }catch(e){ end(false); }
  }
};

function mergeInto(base, src){
  if(!src || typeof src !== 'object') return base;
  for(const k in src){
    const b = base[k], v = src[k];
    if(b && typeof b === 'object' && !Array.isArray(b) && v && typeof v === 'object' && !Array.isArray(v)) mergeInto(b, v);
    else if(b === undefined || typeof b === typeof v) base[k] = v;
  }
  return base;
}

  save.missions = save.missions.filter(m => !m.claimed);

  while(save.missions.length < 3){
    const p = pick(MISSION_POOL.filter(m => !have.has(m.id))); have.add(p.id);

  for(const m of save.missions){

    else m.prog = (save.stats[m.id] || 0) - m.at;
    if(m.prog >= m.n){ m.prog = m.n; m.done = true; }
  }
}

<script>
'use strict';
/* All sound is synthesized: no audio files. Muted while an ad plays, while the
   tab is hidden, and when CrazyGames asks the game to mute. */
const AU = {
  ctx: null, master: null, sfxG: null, musG: null, started: false,
  portalMute: false, adMuted: false, hidden: false,
  step: 0, nextT: 0, timer: 0, fast: false, style: 'title',

  init(){
    if(this.ctx){ this.resume(); return; }
    try{
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.connect(this.master);
      this.sfxG = this.ctx.createGain(); this.sfxG.connect(comp);
      this.musG = this.ctx.createGain(); this.musG.connect(comp);
      this.apply();
      this.startMusic();
    }catch(e){ this.ctx = null; }
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended' && !this.adMuted && !this.hidden) this.ctx.resume().catch(() => {}); },
  apply(){
    if(!this.ctx) return;
    const t = this.ctx.currentTime, on = !this.portalMute && !this.adMuted && !this.hidden;
    this.master.gain.setTargetAtTime(on ? 1 : 0, t, 0.02);
    this.sfxG.gain.setTargetAtTime(save.opt.sfx ? 0.85 : 0, t, 0.02);
    this.musG.gain.setTargetAtTime(save.opt.music ? 0.26 : 0, t, 0.05);
  },
  setPortalMute(m){ this.portalMute = m; this.apply(); },
  adMute(m){ this.adMuted = m; this.apply(); },
  setHidden(h){ this.hidden = h; this.apply(); },

  tone(f, dur, type = 'sine', vol = 0.3, delay = 0, slide = 0, dest){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, f0, f1, q = 1, delay = 0, type = 'bandpass', dest){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + delay, n = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = this.ctx.createBufferSource(), fl = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = buf; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(dest || this.sfxG); s.start(t);
  },
  PENTA: [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28],
  note(s){ return 523.25 * Math.pow(2, s / 12); },
  // many sounds fire dozens of times per second; a tiny per-sound limiter keeps it musical
  lim: {},
  ok(k, gap){ const t = this.ctx ? this.ctx.currentTime : 0; if(t - (this.lim[k] || 0) < gap) return false; this.lim[k] = t; return true; },
  cast(el){
    if(!this.ctx || !this.ok('c' + el, 0.09)) return;
    if(el === 'fire'){ this.noise(0.25, 0.18, 400, 1400, 1); this.tone(180, 0.2, 'sawtooth', 0.05, 0, 90); }
    else if(el === 'storm'){ this.noise(0.18, 0.22, 6000, 900, 3); this.tone(1400, 0.12, 'square', 0.04, 0, 300); }
    else if(el === 'arcane'){ this.tone(880, 0.12, 'sine', 0.06, 0, 1320); }
    else if(el === 'nature'){ this.noise(0.3, 0.12, 300, 900, 1); this.tone(220, 0.25, 'triangle', 0.08, 0, 330); }
    else if(el === 'frost'){ this.tone(1760, 0.1, 'sine', 0.05, 0, 2400); }
    else if(el === 'meteor'){ this.noise(0.6, 0.45, 1200, 80, 0.7); this.tone(90, 0.5, 'sine', 0.3, 0, 40); }
    else if(el === 'steam'){ this.noise(0.5, 0.25, 2500, 600, 0.6); }
    else if(el === 'plasma'){ this.noise(0.4, 0.4, 8000, 400, 2); this.tone(60, 0.4, 'sawtooth', 0.15, 0, 30); }
    else this.tone(660, 0.1, 'sine', 0.05, 0, 990);
  },
  pop(){ if(!this.ok('pop', 0.035)) return; const f = 400 + Math.random() * 500; this.tone(f, 0.08, 'sine', 0.08, 0, f * 1.8); },
  mote(k){ if(!this.ok('mote', 0.04)) return; const f = this.note(this.PENTA[k % this.PENTA.length] + 12); this.tone(f, 0.07, 'sine', 0.06); },
  hurt(){ if(!this.ok('hurt', 0.2)) return; this.tone(200, 0.2, 'square', 0.12, 0, 90); this.noise(0.15, 0.25, 1200, 300, 1); },
  heal(){ [12, 16, 19].forEach((s, i) => this.tone(this.note(s), 0.2, 'sine', 0.12, i * 0.05)); },
  level(){ [0, 4, 7, 12, 16].forEach((s, i) => this.tone(this.note(s + 7), 0.25, 'triangle', 0.16, i * 0.05)); this.noise(0.5, 0.15, 5000, 9000, 0.7, 0.1, 'highpass'); },
  pickCard(){ [0, 7, 12].forEach((s, i) => this.tone(this.note(s + 12), 0.2, 'sine', 0.15, i * 0.04)); },
  fusion(){ [0, 4, 7, 11, 14, 19, 24, 28].forEach((s, i) => this.tone(this.note(s), 0.6, 'triangle', 0.14, i * 0.07)); this.noise(1.2, 0.25, 2000, 9000, 0.6, 0, 'highpass'); this.tone(65, 1.2, 'sine', 0.3, 0, 130); },
  chest(){ [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => this.tone(this.note(s + 5), 0.3, 'square', 0.07, i * 0.06)); },
  bossIn(){ this.tone(49, 1.6, 'sawtooth', 0.25, 0, 36); this.tone(73, 1.6, 'sawtooth', 0.18, 0.15, 55); this.noise(1.5, 0.3, 300, 60, 0.8); },
  bossDie(){ this.noise(1.2, 0.6, 2000, 60, 0.6); [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => this.tone(this.note(s), 0.4, 'triangle', 0.17, 0.2 + i * 0.07)); },
  bomb(){ this.noise(1, 0.6, 3000, 100, 0.6); this.tone(110, 0.8, 'sine', 0.3, 0, 40); },
  dawn(){ [0, 4, 7, 12, 7, 12, 16, 19, 24, 28].forEach((s, i) => this.tone(this.note(s), 0.5, 'triangle', 0.16, i * 0.12)); },
  over(){ [7, 3, 0, -5, -9].forEach((s, i) => this.tone(this.note(s), 0.4, 'triangle', 0.17, i * 0.15)); },
  click(){ this.tone(700, 0.05, 'triangle', 0.15, 0, 900); },
  buy(){ [0, 7, 12, 19].forEach((s, i) => this.tone(this.note(s), 0.2, 'triangle', 0.2, i * 0.05)); },
  lose1(){ this.tone(300, 0.15, 'triangle', 0.12, 0, 200); },
  coin(){ this.tone(1318, 0.06, 'square', 0.05); this.tone(1760, 0.12, 'square', 0.05, 0.05); },

  /* bouncy song; faster and brighter during Sugar Rush */
  PROG: [[-3, 0, 4, 7], [-7, -3, 0, 4], [-4, 0, 3, 7], [-5, -1, 2, 5]],
  setStyle(s){ this.style = s; },
  startMusic(){
    if(!this.ctx) return;
    this.nextT = this.ctx.currentTime + 0.1;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.sched(), 50);
  },
  sched(){
    if(!this.ctx || this.ctx.state !== 'running') return;
    const bpm = this.fast ? 132 : this.style === 'title' ? 80 : 112, spb = 60 / bpm / 2;
    while(this.nextT < this.ctx.currentTime + 0.2){
      const st = this.step % 64, bar = Math.floor(st / 16), ch = this.PROG[bar], beat = st % 16;
      const t = this.nextT - this.ctx.currentTime, M = this.musG, k = this.fast ? 5 : 0;
      if(beat % 4 === 0) this.tone(this.note(ch[0] + k - 24), spb * 1.6, 'triangle', 0.4, t, 0, M);
      if(beat % 4 === 2) this.tone(this.note(ch[0] + k - 12), spb * 0.6, 'triangle', 0.18, t, 0, M);
      if(this.style !== 'title' && beat % 4 === 0) this.tone(90, 0.12, 'sine', 0.35, t, 45, M);
      if(this.style !== 'title' && beat % 4 === 2) this.noise(0.06, 0.12, 3000, 6000, 1, t, 'bandpass', M);
      if(beat % 2 === 1) this.noise(0.03, 0.05, 8000, 9000, 1, t, 'highpass', M);
      const arp = [0, 1, 2, 3][beat % 4];
      if(beat % 2 === 0 || this.fast) this.tone(this.note(ch[arp] + k + (beat >= 8 ? 12 : 0)), spb * 0.8, 'sine', 0.1, t, 0, M);
      if(st % 16 === 12 && Math.random() < 0.6) this.tone(this.note(pick([12, 14, 16, 19]) + k + 12), spb * 3, 'triangle', 0.06, t, 0, M);
      this.nextT += spb; this.step++;
    }
  }
};

  parts: [], texts: [], rings: [], bolts: [],
  spawnAcc: 0, nextElite: 45, nextSwarm: 60, bossIdx: 0, boss: null, pendingLv: 0, choices: [],

const grid = { cell: 64, map: new Map() };
function gk(x, y){ return ((x / 64) | 0) * 1000 + ((y / 64) | 0); }

  for(const a of grid.map.values()) a.length = 0;

}
function foesNear(x, y, r, fn){

/* ---------------- run ---------------- */

  Object.assign(G, { t: 0, ts: 1, slowT: 0, spells: {}, fus: {}, pas: {}, cd: {}, foes: [], shots: [], ebul: [], motes: [], drops: [], flowers: [], pools: [], plants: [], geysers: [], meteors: [],
    parts: [], texts: [], rings: [], bolts: [], spawnAcc: 0, nextElite: 45, nextSwarm: 60, bossIdx: 0, boss: null, pendingLv: 0, beamA: 0, beamT: 0, prismT: 0, blizT: 0, moteN: 0, revived: false, dawnT: 0 });

function xpNeed(l){ return Math.round(2 + l * 2.5 + Math.pow(l, 1.5)); }

function cdMul(){ return 1 - (G.pas.focus || 0) * 0.08; }
function spdMul(){ return (1 + (G.pas.boots || 0) * 0.1) * (1 + (G.demo ? 0 : save.perk.spd) * 0.04); }
function pickR(){ return 115 * (1 + (G.pas.lantern || 0) * 0.25) * (1 + (G.demo ? 0 : save.perk.magnet) * 0.15); }
function lightR(){ return 230 + (G.pas.lantern || 0) * 40; }

/* ---------------- level-up choices ---------------- */
function startChoices(){
  return Object.keys(ELEMENTS).sort(() => Math.random() - 0.5).slice(0, 3).map(id => ({ kind: 'el', id }));
}
function rollChoices(){
  const opts = [], fusOk = [];
  for(const id in FUSIONS){ const f = FUSIONS[id]; if(!G.fus[id] && (G.spells[f.a] || 0) >= 3 && (G.spells[f.b] || 0) >= 3) fusOk.push({ kind: 'fus', id }); }
  const nSpells = Object.keys(G.spells).length;
  for(const id in ELEMENTS){ const l = G.spells[id] || 0; if(l ? l < MAX_SPELL : nSpells < 4) opts.push({ kind: 'el', id }); }
  for(const id in PASSIVES){ if((G.pas[id] || 0) < PASSIVES[id].max) opts.push({ kind: 'pas', id }); }
  const out = [];
  if(fusOk.length) out.push(pick(fusOk));
  // upgrades of spells you already own come up more often
  const w = opts.map(o => o.kind === 'el' && G.spells[o.id] ? 3 : o.kind === 'el' ? 1.6 : 1);
  while(out.length < 3 && opts.length){
    let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
    while(r > w[i]){ r -= w[i]; i++; }
    out.push(opts[i]); opts.splice(i, 1); w.splice(i, 1);
  }
  if(!out.length) out.push({ kind: 'heal' });
  return out;
}
function choose(c){
  if(c.kind === 'el'){ G.spells[c.id] = (G.spells[c.id] || 0) + 1; }
  else if(c.kind === 'pas'){ G.pas[c.id] = (G.pas[c.id] || 0) + 1; if(c.id === 'heart'){ G.P.max += 25; G.P.hp = Math.min(G.P.max, G.P.hp + 25); } }
  else if(c.kind === 'fus'){
    G.fus[c.id] = true; G.run.fusions++; if(!G.demo){ save.stats.fusions++; save.seen[c.id] = 1; }
    G.slowT = 1.2; G.flash = 0.8; G.flashC = FUSIONS[c.id].col;
    if(!G.demo){ AU.fusion(); UI.banner('✨ FUSION! ' + FUSIONS[c.id].icon + ' ' + FUSIONS[c.id].name.toUpperCase(), FUSIONS[c.id].desc, FUSIONS[c.id].col); SDK.happytime(); }
    ring(G.P.x, G.P.y, FUSIONS[c.id].col, 400); burst(G.P.x, G.P.y, 60, FUSIONS[c.id].col, 600, 6);
  }else if(c.kind === 'heal'){ G.P.hp = G.P.max; }
  if(!G.demo) AU.pickCard();
  G.pendingLv = Math.max(0, G.pendingLv - 1);
  if(G.pendingLv > 0){ G.choices = rollChoices(); if(!G.demo) UI.showLevel(); }
  else{ G.state = G.demo ? 'title' : 'play'; if(!G.demo) UI.hideLevel(); }
}
function gainXp(v){
  const P = G.P;
  P.xp += v;
  while(P.xp >= P.need){
    P.xp -= P.need; P.lvl++; P.need = xpNeed(P.lvl); G.run.level = P.lvl;
    G.pendingLv++;
    if(!G.demo){ AU.level(); }
    ring(P.x, P.y, '#ffe9a8', 160);
  }
  if(G.pendingLv > 0 && G.state === 'play'){ G.state = 'level'; G.choices = rollChoices(); UI.showLevel(); }
  if(G.pendingLv > 0 && G.state === 'title'){ while(G.pendingLv > 0) choose(autoChoice(rollChoices())); }
}
function autoChoice(cs){ return cs.find(c => c.kind === 'fus') || (Object.keys(G.spells).length < 3 && cs.find(c => c.kind === 'el' && !G.spells[c.id])) || cs.find(c => c.kind === 'el' && G.spells[c.id]) || cs.find(c => c.kind === 'el') || cs[0]; }

/* ---------------- spawning ---------------- */
function spawnFoe(kind, x, y, hpMul){

}

function spawning(dt){

/* ---------------- update ---------------- */
function update(rdt){
  G.rt += rdt;
  if(G.state === 'dawn'){ G.dawnT += rdt; G.shake = Math.max(0, G.shake - rdt * 30); G.flash = Math.max(0, G.flash - rdt * 1.6); updateFx(rdt); return; }
  if(G.state !== 'play' && G.state !== 'title') return;
  if(G.slowT > 0){ G.slowT -= rdt; G.ts = lerp(G.ts, 0.25, Math.min(1, rdt * 12)); } else G.ts = lerp(G.ts, 1, Math.min(1, rdt * 5));
  const dt = rdt * G.ts;
  G.t += dt; G.run.time = G.t;
  G.shake = Math.max(0, G.shake - rdt * 30); G.flash = Math.max(0, G.flash - rdt * 1.6);
  if(G.demo) autopilot(dt);
  movePlayer(dt);
  spawning(dt);
  buildGrid();
  castSpells(dt);
  updateShots(dt);
  updateFoes(dt);
  updatePickups(dt);
  updateFx(dt);
  const P = G.P;
  if((G.pas.regen || 0) > 0) P.hp = Math.min(P.max, P.hp + G.pas.regen * dt);
  if(P.hp <= 0 && G.state === 'play') playerDown();
}
function movePlayer(dt){
  const P = G.P;
  let ix = G.inX, iy = G.inY; const l = Math.hypot(ix, iy); if(l > 1){ ix /= l; iy /= l; }
  const sp = 210 * spdMul();
  P.vx = lerp(P.vx, ix * sp, Math.min(1, dt * 12)); P.vy = lerp(P.vy, iy * sp, Math.min(1, dt * 12));
  P.x += P.vx * dt; P.y += P.vy * dt;
  if(Math.abs(P.vx) > 10) P.face = P.vx > 0 ? 1 : -1;
  P.walk += Math.hypot(P.vx, P.vy) * dt * 0.05;
  if(P.inv > 0) P.inv -= dt;
}

/* ---------------- spells ---------------- */
function cool(id, base, dt){ G.cd[id] = (G.cd[id] || 0) - dt; if(G.cd[id] > 0) return false; G.cd[id] = base * cdMul(); return true; }

    if(ts.length && !G.demo) AU.cast('fire');

      foesNear(x, y, 14, f => { if(f.frostT > 0) return; f.frostT = 0.35; f.slow = 1.2; damage(f, (10 + 4 * L) * dm, 'frost'); }); }
  }

    if(first){ const pts = [{ x: P.x, y: P.y - 20 }], hit = new Set(); let cur = first;
      for(let j = 0; j < 2 + L && cur; j++){ hit.add(cur); pts.push({ x: cur.x, y: cur.y }); damage(cur, (13 + 6 * L) * dm, 'storm');

  if(S.arcane){ const L = S.arcane; if(cool('arcane', Math.max(0.35, 1.0 - 0.07 * L), dt)){

    if(ts.length && !G.demo) AU.cast('arcane');
  } }

    if(G.beamT <= 0){ G.beamT = 0.18; beamHit(G.beamA, 210 + 22 * L, (5 + 3 * L) * dm, 'light'); } }
  // fusions
  const F = G.fus;
  if(F.plasma && cool('plasma', 2.4, dt)){
    const vis = G.foes.filter(f => !f.dead && Math.abs(f.x - P.x) < 600 && Math.abs(f.y - P.y) < 420);
    for(let i = 0; i < 5 && vis.length; i++){ const f = vis.splice(Math.floor(Math.random() * vis.length), 1)[0];
      G.bolts.push({ pts: [{ x: f.x + rnd(-30, 30), y: f.y - 500 }, { x: f.x + rnd(-20, 20), y: f.y - 250 }, { x: f.x, y: f.y }], life: 0, max: 0.35, col: '#ff9ef0', w: 7 });
      damage(f, 90 * dm, 'plasma'); G.pools.push({ x: f.x, y: f.y, r: 60, life: 2.5, t: 0, col: '#ff6a3a' }); }

function beamHit(a, len, dmg, el){

    const dx = f.x - P.x, dy = f.y - P.y, along = dx * ux + dy * uy, perp = Math.abs(dx * -uy + dy * ux);

function updateShots(dt){

/* ---------------- foes ---------------- */
function updateFoes(dt){
  const P = G.P;

    if(d < f.r + P.r && P.inv <= 0 && !G.demo){ hurtPlayer(f.dmg); const a = Math.atan2(-dy, -dx); f.kx = Math.cos(a) * 200; f.ky = Math.sin(a) * 200; }

<script>
'use strict';
/* Input, HUD, menus and boot. */
let playing = false;

  tab: 'perk',

/* ---------------- shop / book / missions / settings ---------------- */

  if(UI.tab === 'perk'){
    g.style.display = 'flex'; g.style.flexDirection = 'column'; g.style.gap = '8px';
    for(const p of PERKS){
      const l = save.perk[p.id], max = l >= p.max, cost = perkCost(p, l);
      const d = document.createElement('div'); d.className = 'row';
      d.innerHTML = `<div class="ic">${p.icon}</div><div class="tx">${p.name} <small>${p.desc} · level ${l}/${p.max}</small></div><button>${max ? 'MAX' : '🌙 ' + cost}</button>`;
      const b = d.querySelector('button'); b.disabled = max || save.stones < cost;
      b.onclick = () => { if(max || save.stones < cost) return; save.stones -= cost; save.perk[p.id]++; persist(); AU.buy(); buildShop(); refreshTitle(); };
      g.appendChild(d);
    }
    return;
  }
  g.style.display = ''; g.style.flexDirection = ''; g.style.gap = '';
  for(const it of HATS){
    const own = !!save.own[it.id], eq = save.hat === it.id;
    const b = document.createElement('button'); b.className = eq ? 'eq' : '';
    const cv = document.createElement('canvas'); cv.width = cv.height = 128; const c = cv.getContext('2d');
    const saved = save.hat; save.hat = it.id;
    c.translate(60, 90); c.scale(2, 2);
    try{ drawWitch(c, { x: 0, y: 0, face: 1, walk: 0, inv: 0, vx: 0, vy: 0, r: 15 }, 0, true); }catch(e){}
    save.hat = saved;
    b.appendChild(cv);
    const n = document.createElement('div'); n.textContent = it.name; b.appendChild(n);
    const p = document.createElement('div'); p.className = own ? '' : 'price'; p.textContent = eq ? 'WEARING' : own ? 'OWNED' : '🌙 ' + it.price; b.appendChild(p);
    b.onclick = () => {
      if(!own){ if(save.stones < it.price){ AU.click(); UI.toast('Need more moonstones!'); return; } save.stones -= it.price; save.own[it.id] = 1; AU.buy(); }
      else AU.click();
      save.hat = it.id; persist(); buildShop(); refreshTitle();
    };
    g.appendChild(b);
  }
}
function buildBook(){
  const l = $('bkList'); l.innerHTML = '';
  const row = (icon, name, desc, extra) => { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = `<div class="ic">${icon}</div><div class="tx">${name} <small>${desc}</small></div>${extra || ''}`; l.appendChild(d); };
  for(const id in ELEMENTS){ const e = ELEMENTS[id]; row(e.icon, `<span style="color:${e.col}">${e.name}</span>`, e.desc); }
  for(const id in FUSIONS){
    const f = FUSIONS[id], seen = save.seen[id];
    row(seen ? f.icon : '❔', seen ? `<span style="color:${f.col}">${f.name}</span>` : '???', (seen ? f.desc + ' · ' : 'Undiscovered fusion · ') + ELEMENTS[f.a].icon + ' + ' + ELEMENTS[f.b].icon);
  }
}
function buildMissions(){
  const l = $('mList'); l.innerHTML = '';
  for(const m of save.missions){
    const p = MISSION_POOL.find(x => x.id === m.id);
    const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = `<div class="ic">🎯</div><div class="tx">${p.txt(m.n)}<div class="bar"><i style="width:${Math.min(100, m.prog / m.n * 100)}%"></i></div><small>${Math.min(m.prog, m.n)} / ${m.n}</small></div><button>${m.done ? 'CLAIM' : '🌙 ' + m.rw}</button>`;
    const b = d.querySelector('button'); b.disabled = !m.done;
    b.onclick = () => { if(!m.done) return; m.claimed = true; save.stones += m.rw; AU.buy(); UI.toast('Mission complete! 🌙 ' + m.rw); fillMissions(); persist(); buildMissions(); refreshTitle(); };
    l.appendChild(d);
  }
  $('mStats').textContent = `Best: ${fmtT(save.best)} · Shadows: ${save.stats.kills} · Bosses: ${save.stats.bosses} · Dawns: ${save.stats.dawns}`;
}
function buildSettings(){ document.querySelectorAll('.setRow').forEach(r => { const v = save.opt[r.dataset.opt], b = r.querySelector('b'); b.textContent = v ? 'ON' : 'OFF'; b.classList.toggle('off', !v); }); }

/* ---------------- pause ---------------- */
function pauseGame(){ if(G.state !== 'play') return; G.state = 'pause'; clearInput(); endPlay(); openScreen('pause'); }
function resumeGame(){ closeScreens(); if(G.state === 'pause'){ G.state = 'play'; beginPlay(); } }

/* ---------------- input ---------------- */
const K = {};
const stick = { id: null, x: 0, y: 0, dx: 0, dy: 0 };
function clearInput(){ for(const k in K) K[k] = false; stick.id = null; stick.dx = stick.dy = 0; G.inX = G.inY = 0; hide('stick'); }
function syncInput(){
  if(G.demo) return;
  let x = (K.ArrowRight || K.KeyD ? 1 : 0) - (K.ArrowLeft || K.KeyA ? 1 : 0);
  let y = (K.ArrowDown || K.KeyS ? 1 : 0) - (K.ArrowUp || K.KeyW ? 1 : 0);
  if(stick.id !== null){ x = stick.dx; y = stick.dy; }
  const l = Math.hypot(x, y); if(l > 1){ x /= l; y /= l; }
  G.inX = x; G.inY = y;
}
function wire(){
  const cv = R.cv;
  cv.addEventListener('pointerdown', e => {
    AU.init();
    if(SDK.adBusy || anyScreen() || G.state !== 'play' || stick.id !== null) return;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    stick.id = e.pointerId; stick.x = e.clientX; stick.y = e.clientY; stick.dx = stick.dy = 0;
    const s = $('stick'); s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px'; s.firstElementChild.style.transform = ''; show('stick');
    syncInput();
  });
  cv.addEventListener('pointermove', e => {
    if(e.pointerId !== stick.id) return;
    let dx = e.clientX - stick.x, dy = e.clientY - stick.y; const l = Math.hypot(dx, dy), m = 50;
    if(l > m){ dx *= m / l; dy *= m / l; }
    stick.dx = l > 6 ? dx / m : 0; stick.dy = l > 6 ? dy / m : 0;
    $('stick').firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
    syncInput();
  });
  const up = e => { if(e.pointerId !== stick.id) return; stick.id = null; stick.dx = stick.dy = 0; hide('stick'); syncInput(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  addEventListener('keydown', e => {
    if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if(SDK.adBusy) return;
    AU.init();
    if(e.repeat) return;
    if(e.code === 'Escape' || e.code === 'KeyP'){ if(G.state === 'pause') resumeGame(); else if(G.state === 'play') pauseGame(); else if(anyScreen() && G.state === 'title') closeScreens(); return; }
    if(G.state === 'title' && !anyScreen() && (e.code === 'Space' || e.code === 'Enter')){ play(); return; }
    if(!$('over').classList.contains('hidden') && (e.code === 'Space' || e.code === 'Enter')){ $('oAgain').click(); return; }
    if(!$('level').classList.contains('hidden') && /^Digit[123]$/.test(e.code)){ const b = $('lvCards').children[+e.code.slice(5) - 1]; if(b) b.click(); return; }
    K[e.code] = true; syncInput();
  });
  addEventListener('keyup', e => { K[e.code] = false; syncInput(); });
  addEventListener('blur', clearInput);
  document.addEventListener('contextmenu', e => e.preventDefault());

  const tap = (id, fn) => $(id).addEventListener('click', e => { if(SDK.adBusy) return; AU.init(); AU.click(); fn(e); });
  tap('playBtn', play);
  tap('bShop', () => { buildShop(); openScreen('shop'); });
  tap('bBook', () => { buildBook(); openScreen('book'); });
  tap('bMi', () => { buildMissions(); openScreen('missions'); });
  tap('bSet', () => { buildSettings(); openScreen('settings'); });
  tap('pauseBtn', pauseGame);
  tap('pResume', resumeGame);
  tap('pSet', () => { buildSettings(); openScreen('settings', 'pause'); });
  tap('pQuit', () => { closeScreens(); G.state = 'over'; gameOver(false); });
  tap('lvReroll', () => { if(G.rerolls <= 0) return; G.rerolls--; G.choices = rollChoices(); UI.showLevel(); });
  tap('oHome', toTitle);
  tap('oShop', () => { buildShop(); openScreen('shop', 'over'); });
  tap('oAgain', play);
  tap('oRevive', () => SDK.rewarded(ok => {
    if(!ok) return;
    save.stones -= G.lastStones; save.runs--; persist();
    G.adRevived = true; G.P.hp = G.P.max; G.P.inv = 3; G.state = 'play'; closeScreens();
    moonBurst(); beginPlay();
  }));
  tap('oDouble', () => { $('oDouble').disabled = true; SDK.rewarded(ok => { if(!ok){ $('oDouble').disabled = false; return; } save.stones += G.lastStones; persist(); $('oStones').textContent = '+' + G.lastStones * 2; $('oDouble').classList.add('hidden'); AU.coin(); }); });
  document.querySelectorAll('#shop .tabs button').forEach(b => b.addEventListener('click', () => { AU.click(); UI.tab = b.dataset.tab; buildShop(); }));
  document.querySelectorAll('.back').forEach(b => b.addEventListener('click', () => { AU.click(); hide(b.closest('.screen').id); if(backTo){ show(backTo); backTo = null; } else refreshTitle(); }));
  document.querySelectorAll('.setRow').forEach(r => r.addEventListener('click', () => { const k = r.dataset.opt; save.opt[k] = !save.opt[k]; persist(); AU.apply(); AU.click(); buildSettings(); }));
  document.querySelectorAll('.screen, #hud button, #title button').forEach(el => el.addEventListener('pointerdown', e => e.stopPropagation()));
  document.addEventListener('visibilitychange', () => { AU.setHidden(document.hidden); if(document.hidden){ persist(); pauseGame(); } else AU.resume(); });
  SDK.onMute = m => AU.setPortalMute(m);
}

/* ---------------- HUD ---------------- */
function renderSpells(){
  const h = [];
  for(const id in G.fus) h.push(`<span class="fu">${FUSIONS[id].icon}</span>`);
  for(const id in G.spells) h.push(`<span>${ELEMENTS[id].icon}<small>${G.spells[id]}</small></span>`);
  for(const id in G.pas) h.push(`<span>${PASSIVES[id].icon}<small>${G.pas[id]}</small></span>`);
  $('spellRow').innerHTML = h.join('');
}
let hudK = '';
function updateHUD(){
  if(G.state === 'title' || !G.P) return;
  const P = G.P, left = RUN_TIME - G.t;
  const k = [Math.ceil(P.hp), P.max, P.lvl, Math.floor(P.xp), Math.ceil(left), G.state, G.run.kills, G.run.flowers, G.boss && !G.boss.dead ? Math.ceil(G.boss.hp) : -1].join();
  if(k === hudK) return; hudK = k;
  $('hpBar').firstElementChild.style.width = clamp(P.hp / P.max * 100, 0, 100) + '%';
  $('hpTxt').textContent = Math.max(0, Math.ceil(P.hp)) + ' / ' + P.max;
  $('xpBar').firstElementChild.style.width = clamp(P.xp / P.need * 100, 0, 100) + '%';
  $('lvTxt').textContent = 'LV ' + P.lvl;
  const fin = G.bossIdx >= BOSSES.length && G.boss && !G.boss.dead && G.boss.final;
  const dn = G.state === 'dawn';
  $('timeTxt').textContent = dn ? '🌅' : fin ? '🌑' : fmtT(left);
  $('dawnTxt').textContent = dn ? 'dawn has come' : fin ? 'banish him for dawn' : 'until dawn';
  $('killTxt').textContent = '👻 ' + G.run.kills;
  $('flowerTxt').textContent = '🌸 ' + G.run.flowers;
  const b = G.boss && !G.boss.dead ? G.boss : null;
  $('bossBar').classList.toggle('hidden', !b);
  if(b){ $('bossName').textContent = '👑 ' + b.name; $('bossBar').querySelector('i').style.width = clamp(b.hp / b.max * 100, 0, 100) + '%'; }
}

/* ---------------- loop + boot ---------------- */
let last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt = last ? (ts - last) / 1000 : 1 / 60; last = ts;
  if(dt <= 0) return; if(dt > 0.05) dt = 0.05;
  try{ update(dt); R.draw(); updateHUD(); }catch(err){ console.error(err); }
}
(async () => {
  R.init();
  await SDK.init();
  SDK.loadingStart();
  loadSave();
  wire();
  toTitle();
  requestAnimationFrame(frame);
  SDK.loadingStop();
  const b = $('boot'); b.style.opacity = '0'; setTimeout(() => b.remove(), 450);
})();

</script>
