<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1640">
<meta name="description" content="FIREFLY LASSO: draw a loop, catch the light. Every firefly in a loop multiplies the others.">
<title>FIREFLY LASSO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230b1640%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22none%22 stroke=%22%23fff0a8%22 stroke-width=%221.4%22/%3E%3Ccircle cx=%227%22 cy=%228%22 r=%221.6%22 fill=%22%23ffe25a%22/%3E%3Ccircle cx=%2210%22 cy=%227%22 r=%221%22 fill=%22%237dff9a%22/%3E%3C/svg%3E">
<style>
:root{--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--gold:#ffe25a;--warm:#fff0a8;--ink:#050618;--dim:#9aa6d8;--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1640;color:#fff;font-family:var(--f);touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
button{font-family:var(--f);cursor:pointer;border:0;color:inherit}
.hidden{display:none !important}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;height:62px;padding:calc(8px + var(--sat)) 10px 0;display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:10}
#hL{display:flex;flex-direction:column;flex:0 0 auto;max-width:26%}
#nTxt{font:900 16px/1.1 var(--f);letter-spacing:2px;white-space:nowrap}
#pTxt{font:700 11px/1.3 var(--f);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hC{flex:1;max-width:440px;margin:0 auto}
#lightRow{display:flex;align-items:baseline;gap:6px;font:900 14px/1 var(--f)}
#lightTxt{font-size:20px;color:var(--warm);text-shadow:0 0 12px rgba(255,240,168,.6)}
#goalTxt{color:var(--dim);flex:1}
#timeTxt{font-size:18px;min-width:34px;text-align:right}
#timeTxt.low{color:#ff8a8a;animation:tp .5s infinite alternate}
@keyframes tp{to{transform:scale(1.15)}}
#bar,#lanternBar{position:relative;margin-top:6px;height:10px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}
#bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffe25a,#fff6c0);box-shadow:0 0 14px rgba(255,226,90,.7);transition:width .15s}
#bar .st{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:17px;color:rgba(255,255,255,.25);text-shadow:0 0 4px #000}
#bar .st.on{color:var(--gold);text-shadow:0 0 10px var(--gold)}
#lanternBar i{display:block;height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#ff7a3a,#ffe25a)}
#lanternBar span{position:absolute;right:4px;top:13px;font:900 9px/1 var(--f);letter-spacing:2px;color:#ffc88a}
#hR{display:flex;align-items:center;gap:8px;flex:0 0 auto}
#chain{font:900 11px/1 var(--f);letter-spacing:1px;color:#9af0ff;text-shadow:0 0 10px #4ad0ff;animation:cp .3s}
#chain b{font-size:17px;display:block}
@keyframes cp{from{transform:scale(1.5)}}
#jar{width:30px;height:40px;border:2px solid rgba(255,240,168,.8);border-top-width:5px;box-shadow:0 0 10px rgba(255,226,90,.25);border-radius:6px 6px 10px 10px;position:relative;overflow:hidden;background:rgba(255,255,255,.06)}
#jar::after{content:'';position:absolute;left:4px;top:4px;width:4px;height:14px;border-radius:2px;background:rgba(255,255,255,.35)}
#jar i{position:absolute;left:0;right:0;bottom:0;height:6%;background:linear-gradient(0deg,#ffe25a,#fff6c0);box-shadow:0 0 18px #ffe25a;transition:height .2s}
#jar.bump{animation:jb .3s}
@keyframes jb{50%{transform:scale(1.25)}}
.icoBtn{pointer-events:auto;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:18px}
#bottleBtn{background:rgba(160,130,255,.3);border-color:#c8a8ff;animation:bt 1.2s infinite alternate}
@keyframes bt{to{box-shadow:0 0 16px #c8a8ff}}

#tip{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;max-width:min(92vw,560px);padding:10px 16px;border-radius:14px;background:rgba(10,12,40,.82);border:1px solid rgba(255,255,255,.18);font:700 15px/1.35 var(--f);text-align:center;pointer-events:none}
#tip b{color:var(--gold)}
#toasts{position:fixed;left:50%;top:calc(76px + var(--sat));transform:translateX(-50%);z-index:13;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(92vw,400px)}
.toast{background:linear-gradient(90deg,#2a1a5a,#4a2a8a);border:2px solid #c8a8ff;border-radius:14px;padding:9px 14px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:toast 3.4s ease-out forwards}
.toast b{display:block;font:900 11px/1 var(--f);letter-spacing:2px;color:#e0d0ff}
.toast span{display:block;font:800 15px/1.25 var(--f);margin-top:3px}
@keyframes toast{0%{opacity:0;transform:translateY(-20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* title */
#title{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity .5s,transform .5s}
#title.gone{opacity:0;transform:scale(1.1)}
#logo{font:italic 900 clamp(46px,11vw,108px)/.9 var(--f);text-align:center;color:#fff;text-shadow:0 0 30px rgba(255,240,168,.8),0 6px 0 rgba(5,6,24,.8)}
#logo span{display:block;color:var(--gold);text-shadow:0 0 40px rgba(255,226,90,.9),0 6px 0 rgba(5,6,24,.8)}
.tag{margin-top:12px;font:800 clamp(15px,2.8vw,24px)/1.2 var(--f);color:#dfe4ff;text-shadow:0 2px 6px #000}
.tag b{color:var(--warm)}
.drag{margin-top:34px;font:900 clamp(12px,2.2vw,16px)/1 var(--f);letter-spacing:2px;color:var(--warm);display:flex;align-items:center;gap:10px;animation:pulse 1.6s ease-in-out infinite}
.hand{font-size:1.8em;display:inline-block;animation:circ 1.6s linear infinite}
@keyframes circ{0%{transform:translate(10px,0)}25%{transform:translate(0,10px)}50%{transform:translate(-10px,0)}75%{transform:translate(0,-10px)}100%{transform:translate(10px,0)}}
@keyframes pulse{50%{opacity:.6}}
#tInfo{margin-top:12px;font:700 13px/1 var(--f);color:var(--dim)}

/* buttons */
.btn{padding:12px 18px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font:900 15px/1 var(--f);letter-spacing:1px;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#fff0a8,#ffc83a);color:#3a2400;border:0;box-shadow:0 0 24px rgba(255,210,80,.45)}
.btn.special{background:linear-gradient(90deg,#ff7a3a,#c84a8a);border:0}
.btn.big{padding:16px 22px;font-size:18px}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn small{font-size:10px;opacity:.85;margin-left:4px}

/* sheets and screens */
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:20;width:min(100vw,640px);max-height:88vh;overflow:auto;background:linear-gradient(180deg,rgba(16,20,60,.97),rgba(8,10,34,.99));border:1px solid rgba(255,255,255,.14);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;align-items:center;animation:up .35s ease-out}
@keyframes up{from{transform:translate(-50%,100%)}}
#rTitle{font:italic 900 26px/1 var(--f);color:var(--gold);text-shadow:0 0 20px rgba(255,226,90,.5)}
#rTitle.fail{color:#ff9a9a;text-shadow:none}
#rStars{font-size:40px;letter-spacing:6px}
#rStars i{font-style:normal;color:rgba(255,255,255,.18);display:inline-block}
#rStars i.on{color:var(--gold);text-shadow:0 0 18px var(--gold);animation:star .4s ease-out backwards}
@keyframes star{from{transform:scale(2.2) rotate(-40deg);opacity:0}}
#rLight{font:900 32px/1 var(--f);color:var(--warm);text-shadow:0 0 16px rgba(255,240,168,.6)}
#rStat{font:700 13px/1.4 var(--f);color:var(--dim);text-align:center}
#rStat b{color:#fff}
#rNew{font:800 13px/1.3 var(--f);color:#e0d0ff;background:rgba(160,120,255,.18);border:1px solid rgba(200,168,255,.5);border-radius:10px;padding:8px 12px;text-align:center}
#upRow{display:flex;gap:8px;overflow-x:auto;width:100%;padding:2px 2px 6px;scrollbar-width:none}
#upRow::-webkit-scrollbar{display:none}
.up{flex:0 0 116px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.up .ic{font-size:21px}
.up b{font:900 12px/1.1 var(--f)}
.up span{font:700 10px/1.25 var(--f);color:var(--dim);min-height:25px}
.up .c{font:900 13px/1 var(--f);color:var(--gold)}
.up.can{border-color:var(--gold);background:rgba(255,226,90,.1);cursor:pointer;animation:can 1.2s ease-in-out infinite alternate}
@keyframes can{to{box-shadow:0 0 14px rgba(255,226,90,.4)}}
.up.max{opacity:.45}
.rBtns{display:flex;gap:8px;width:100%}
.rBtns .big{flex:1}
.screen{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,6,24,.84);backdrop-filter:blur(3px);padding:18px}
.screen h2{font:italic 900 26px/1 var(--f);letter-spacing:1px;display:flex;align-items:center;gap:10px}
.screen h2 small{font:800 13px/1 var(--f);color:var(--dim);font-style:normal}
.money{color:var(--gold) !important}
.menuGrid{display:flex;flex-direction:column;gap:10px;width:min(90vw,360px)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.hint{font:700 13px/1.4 var(--f);color:var(--dim);text-align:center;max-width:360px}
.hint b{color:#fff}
.list{display:flex;flex-direction:column;gap:8px;width:min(92vw,480px);max-height:66vh;overflow:auto}
.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.item canvas{flex:0 0 46px;width:46px;height:46px}
.item .it{flex:1}
.item b{font:900 15px/1.1 var(--f)}
.item span{display:block;font:600 12px/1.35 var(--f);color:var(--dim);margin-top:3px}
.item .n{font:900 13px/1 var(--f);color:var(--warm)}
.item.locked{opacity:.6}
.item .btn{padding:9px 12px;font-size:13px;min-width:84px}
.pips{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.pips i{width:8px;height:5px;border-radius:2px;background:rgba(255,255,255,.15)}
.pips i.on{background:var(--gold)}
#nGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;width:min(94vw,520px);max-height:66vh;overflow:auto;padding:4px}
.nB{aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nB b{font:900 15px/1 var(--f)}
.nB span{font-size:8px;color:var(--gold);letter-spacing:1px}
.nB span i{color:rgba(255,255,255,.2);font-style:normal}
.nB.boss{border-color:#ffd6a0;background:rgba(255,214,160,.1)}
.nB.cur{border-color:var(--gold);box-shadow:0 0 12px rgba(255,226,90,.5)}
.setRow{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;font:800 15px/1 var(--f)}
.setRow input{display:none}
.sw{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative;transition:.2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.setRow input:checked+.sw{background:#c8a83a}
.setRow input:checked+.sw::after{left:23px}
.seg{display:flex;gap:4px}
.seg button{padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.15);font:900 12px/1 var(--f)}
.seg button.on{background:#fff;color:var(--ink)}
.closeBtn{margin-top:4px}
#boot{position:fixed;inset:0;z-index:50;background:#0b1640;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
.bootLogo{font:italic 900 40px/1 var(--f);color:var(--warm);text-shadow:0 0 30px rgba(255,240,168,.7)}
.bootBar{width:200px;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.bootBar i{display:block;height:100%;width:30%;background:var(--gold);animation:boot 1s ease-in-out infinite alternate}
@keyframes boot{to{width:100%}}
@media (max-width:520px){#nTxt{font-size:13px}#pTxt{display:none}#lightTxt{font-size:16px}#timeTxt{font-size:15px}#nGrid{grid-template-columns:repeat(5,1fr)}#rStars{font-size:34px}#chain{display:none}}
@media (max-height:480px){.sheet{max-height:96vh;gap:6px;padding-top:10px}#rStars{font-size:28px}#rLight{font-size:24px}}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="hL"><b id="nTxt">NIGHT 1</b><span id="pTxt">Moonlit Meadow</span></div>
  <div id="hC">
    <div id="lightRow"><span id="lightTxt">0</span><span id="goalTxt">/ 100</span><span id="timeTxt">45</span></div>
    <div id="bar"><i></i><em class="st s1">★</em><em class="st s2">★</em><em class="st s3">★</em></div>

  <div class="drag"><span class="hand">☝</span> DRAW A CIRCLE AROUND THE FIREFLIES</div>

</div>

<!-- ============ RESULT ============ -->
<div id="result" class="sheet hidden">
  <div id="rTitle">NIGHT COMPLETE</div>

  <div class="rBtns">
    <button id="rMenu" class="btn ghost">☰</button>
    <button id="rRetry" class="btn">↻ RETRY</button>
    <button id="rNext" class="btn primary big">NEXT NIGHT ▶</button>
  </div>
</div>

<!-- ============ MENU ============ -->
<div id="menu" class="screen hidden">
  <h2>FIREFLY LASSO</h2>
  <div class="menuGrid">
    <button id="mPlay" class="btn primary big">▶ CONTINUE</button>
    <button id="mNights" class="btn wide">🌙 NIGHTS</button>
    <button id="mHunt" class="btn wide special">🏮 MIDNIGHT HUNT <small id="hLock"></small></button>
    <div class="row2"><button id="mCodex" class="btn">📖 CODEX</button><button id="mShop" class="btn">✨ UPGRADES</button></div>
    <button id="mSet" class="btn ghost wide">SETTINGS</button>
  </div>
  <div id="mStats" class="hint"></div>
  <button class="btn ghost closeBtn">CLOSE</button>
</div>
<div id="nights" class="screen hidden"><h2>NIGHTS</h2><div id="nGrid"></div><button class="btn ghost closeBtn">BACK</button></div>
<div id="codex" class="screen hidden"><h2>FIREFLY CODEX <small id="cxN"></small></h2><div id="cxList" class="list"></div><button class="btn ghost closeBtn">BACK</button></div>
<div id="shop" class="screen hidden"><h2>UPGRADES <small id="sGlow" class="money"></small></h2><div id="shopList" class="list"></div><button class="btn ghost closeBtn">BACK</button></div>

  <h2>SETTINGS</h2>
  <div class="list">
    <label class="setRow"><span>Sound effects</span><input type="checkbox" data-opt="sfx"><i class="sw"></i></label>
    <label class="setRow"><span>Music</span><input type="checkbox" data-opt="music"><i class="sw"></i></label>
    <div class="setRow"><span>Effects</span><div class="seg" data-opt="fx"><button data-v="low">LOW</button><button data-v="high">HIGH</button></div></div>
  </div>
  <button class="btn ghost closeBtn">BACK</button>
</div>

<div id="boot"><div class="bootLogo">FIREFLY LASSO</div><div class="bootBar"><i></i></div></div>

<script>
'use strict';
/* =====================================================================
   CrazyGames SDK v3 wrapper.
   - Documented order: SDK.init() -> loadingStart() -> (load) -> loadingStop()
   - gameplayStart/Stop are de-duplicated so the portal never sees two
     starts (or two stops) in a row.
   - Every call is wrapped: off-portal (localhost, itch, file://) the game
     runs identically with the SDK absent.
   - ADS_ENABLED stays false during Basic Launch: CrazyGames does not allow
     ads in Basic Launch, so no ad API is touched at all while it's false.
     Flip it to true once the dashboard shows Full Implementation.
   ===================================================================== */
const ADS_ENABLED = false;

const SDK = {
  cg: null, env: 'none', playing: false, lastAd: 0, adBusy: false,
  onMute: null,

  async init(){
    await new Promise(res => {
      let done = false; const fin = () => { if(!done){ done = true; res(); } };
      try{
        const s = document.createElement('script');
        s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
        s.onload = fin; s.onerror = fin;
        document.head.appendChild(s);
      }catch(e){ fin(); }
      setTimeout(fin, 4000);
    });
    try{
      const sdk = window.CrazyGames && window.CrazyGames.SDK;
      if(!sdk) return;
      await Promise.race([sdk.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('sdk timeout')), 5000))]);
      this.env = sdk.environment || 'crazygames';
      if(this.env === 'disabled') return;   // not on a CrazyGames domain
      this.cg = sdk;
      try{
        this.applySettings(sdk.game.settings);
        sdk.game.addSettingsChangeListener(s => this.applySettings(s));
      }catch(e){}
    }catch(e){ this.cg = null; }
  },
  applySettings(s){
    if(!s) return;
    if(this.onMute) this.onMute(!!s.muteAudio);
  },
  data(){ try{ return this.cg && this.cg.data ? this.cg.data : null; }catch(e){ return null; } },

  loadingStart(){ try{ this.cg && this.cg.game.loadingStart(); }catch(e){} },
  loadingStop(){ try{ this.cg && this.cg.game.loadingStop(); }catch(e){} },
  gameplayStart(){ if(this.playing) return; this.playing = true; try{ this.cg && this.cg.game.gameplayStart(); }catch(e){} },
  gameplayStop(){ if(!this.playing) return; this.playing = false; try{ this.cg && this.cg.game.gameplayStop(); }catch(e){} },
  happytime(){ try{ this.cg && this.cg.game.happytime(); }catch(e){} },

  canRewarded(){ return ADS_ENABLED && !!this.cg && !this.adBusy; },

  /* rewarded ad: cb(true) only when the ad finished */
  rewarded(cb){
    if(!this.canRewarded()){ cb(false); return; }
    this._ad('rewarded', cb);
  },
  /* midgame ad at natural breaks, self-limited to one per 3 minutes */
  midgame(cb){
    if(!ADS_ENABLED || !this.cg || this.adBusy || Date.now() - this.lastAd < 180000){ cb(); return; }
    this._ad('midgame', () => cb());
  },
  _ad(type, cb){
    this.adBusy = true; this.gameplayStop();
    let fin = false;
    const end = ok => { if(fin) return; fin = true; this.adBusy = false; this.lastAd = Date.now(); AU.adMute(false); cb(ok); };
    try{
      this.cg.ad.requestAd(type, {
        adStarted: () => AU.adMute(true),
        adFinished: () => end(true),
        adError: () => end(false)
      });
    }catch(e){ end(false); }
  }
};

</script>
<script>
'use strict';
/* =====================================================================
   FIREFLY LASSO core: utilities, species, places, nights, upgrades, save.
   Draw a loop. Catch the light.
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const $ = id => document.getElementById(id);
function fmt(n){
  n = Math.floor(n);
  if(n < 10000) return n.toLocaleString('en-US');
  const u = ['K', 'M', 'B', 'T', 'Qa']; let i = -1;
  while(n >= 1000 && i < u.length - 1){ n /= 1000; i++; }

  for(const k in src){

<script>
'use strict';
/* =====================================================================
   FIREFLY LASSO simulation.
   Your finger leaves a glowing rope. When the rope crosses itself it
   closes a loop, and every firefly inside is caught. Each firefly in a
   loop multiplies the others, so bigger loops are worth far more.
   ===================================================================== */
const G = {
  state:'title', mode:'night', spec:null, W:960, H:600, t:0, rt:0, time:45, timeLeft:45,
  light:0, shown:0, flies:[], wasps:[], bats:[], webs:[], trail:[], trailLen:0, drawing:false,
  snapT:0, streak:0, streakT:0, bestLoop:0, loops:0, caughtN:0, pops:[], parts:[], rings:[], fx:[], shards:[],
  slowT:0, bottleUsed:false, swarmT:6, batT:5, gust:0, windPh:0, lantern:1, queen:null, queenDone:false,
  newSpecies:[], result:null, mothDone:false, shadowDone:false, catches:0,
};
const PTR = { x:0, y:0, wx:0, wy:0, down:false, id:-1, in:false };

/* ---------------- spawning ---------------- */
function pickSpecies(){
  const sp = G.spec, luck = 1 + save.up.luck * .2;
  const w = sp.pool.map(k => [k, k === 'gold' ? .05 * luck : k === 'star' ? .035 * luck : k === 'glow' ? 1.2 : k === 'mint' ? .7 : k === 'rose' ? .35 : .45]);
  let s = 0; for(const [, v] of w) s += v; let r = Math.random() * s;
  for(const [k, v] of w){ r -= v; if(r <= 0) return k; } return 'glow';
}
function mkFly(k, x, y){
  const S = SPECIES[k], a = rnd(0, TAU);
  const f = { sp:k, x, y, vx:Math.cos(a) * S.spd, vy:Math.sin(a) * S.spd, wa:a, ph:rnd(0, TAU), fade:0, alive:true, vis:1, age:0 };
  G.flies.push(f); return f;
}
function spawnFly(near){
  const k = pickSpecies(); let x, y, g = 0;
  do { x = rnd(40, G.W - 40); y = rnd(40, G.H - 40); g++; } while(g < 12 && (Math.hypot(x - PTR.wx, y - PTR.wy) < 160 || G.webs.some(w => Math.hypot(x - w.x, y - w.y) < w.r + 20)));

  for(const r of G.rings){ const k = r.t / .6, rr = lerp(r.r, r.R, r.inward ? k : 1 - Math.pow(1 - k, 3)) * V.s; cx.strokeStyle = rgba(r.col || '#ffffff', .5 * (1 - k)); cx.lineWidth = 2; cx.beginPath(); cx.arc(SX(r.x), SY(r.y), rr, 0, TAU); cx.stroke(); }
  cx.globalCompositeOperation = 'source-over';
  // tutorial: a ghost finger draws a loop around the nearest group
  if(G.ghost){ const g = G.ghost, k = (G.rt % 2.4) / 2.4; if(k < .8){ const a = k / .8 * TAU * 1.08, x = SX(g.x + Math.cos(a) * g.r), y = SY(g.y + Math.sin(a) * g.r); cx.strokeStyle = rgba('#ffffff', .35); cx.lineWidth = 4; cx.setLineDash([2, 10]); cx.beginPath(); for(let i = 0; i <= 40; i++){ const aa = i / 40 * a; const px = SX(g.x + Math.cos(aa) * g.r), py = SY(g.y + Math.sin(aa) * g.r); if(i === 0) cx.moveTo(px, py); else cx.lineTo(px, py); } cx.stroke(); cx.setLineDash([]); cx.font = `${Math.round(34 * V.s)}px system-ui,sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('☝', x + 6, y + 18); } }
  // floating words
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for(const p of G.pops){ const k = p.t / p.d, sc = k < .12 ? .5 + k / .12 * .6 : 1.1 - (k - .12) * .1; cx.globalAlpha = k > .7 ? (1 - k) / .3 : 1; const sz = Math.round(p.s * Math.max(.85, V.s) * sc); cx.font = `italic 900 ${sz}px system-ui,sans-serif`; cx.lineWidth = Math.max(3, sz * .16); cx.strokeStyle = 'rgba(5,6,24,.85)'; cx.strokeText(p.txt, SX(p.x), SY(p.y)); cx.fillStyle = p.c; cx.fillText(p.txt, SX(p.x), SY(p.y)); }
  cx.globalAlpha = 1;
  cx.restore();
  drawCaught();
  drawGrass();
  drawWeather();
  if(G.slowT > 0){ cx.fillStyle = `rgba(140,120,255,${Math.min(.16, G.slowT * .1)})`; cx.fillRect(0, 0, W, H); }
  if(G.flash > 0){ cx.fillStyle = `rgba(255,248,220,${G.flash * .5})`; cx.fillRect(0, 0, W, H); }
  if(G.mode === 'hunt' && G.state === 'play' && G.lantern < .3){ const g = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,10,${(.3 - G.lantern) * 2.4})`); cx.fillStyle = g; cx.fillRect(0, 0, W, H); }
}

</script>
<script>
'use strict';
/* =====================================================================
   FIREFLY LASSO UI: HUD, flow, screens, input, boot.
   ===================================================================== */
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const SCREENS = ['menu', 'nights', 'codex', 'shop', 'settings'];
function onTap(el, fn){ el = typeof el === 'string' ? $(el) : el; el.addEventListener('click', e => { e.stopPropagation(); AU.init(); AU.resume(); AU.ui(); fn(e); }); }
function showToast(head, txt){ const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<b>${head}</b><span>${txt}</span>`; $('toasts').appendChild(t); setTimeout(() => t.remove(), 3500); }
let tipT = 0;
function tip(html, ms){ const t = $('tip'); clearTimeout(tipT); if(!html){ hide('tip'); return; } t.innerHTML = html; show('tip'); if(ms) tipT = setTimeout(() => hide('tip'), ms); }

/* ---------------- HUD ---------------- */
const hc = {};
function setH(k, v, fn){ if(hc[k] === v) return; hc[k] = v; fn(v); }
function updateHUD(){
  if(G.state !== 'play' && G.state !== 'done') return;
  const hunt = G.mode === 'hunt', sp = G.spec;
  setH('n', G.mode + sp.n, () => { $('nTxt').textContent = hunt ? 'MIDNIGHT HUNT' : (sp.boss ? '👑 NIGHT ' : 'NIGHT ') + sp.n; $('pTxt').textContent = hunt ? 'Keep your lantern lit' : PLACES[sp.place].name; $('bar').classList.toggle('hidden', hunt); $('lanternBar').classList.toggle('hidden', !hunt); $('goalTxt').textContent = hunt ? 'light' : '/ ' + fmt(sp.goal); });
  setH('l', Math.round(G.shown), v => { $('lightTxt').textContent = fmt(v); });
  if(!hunt){
    const g = sp.goal, max = g * 3, p = Math.min(1, G.shown / max);
    setH('b', Math.round(p * 400), () => { $('bar').firstElementChild.style.width = p * 100 + '%'; const st = starsFor(G.shown, g); document.querySelectorAll('#bar .st').forEach((e, i) => { e.style.left = ([1 / 3, .6, 1][i] * 100) + '%'; e.classList.toggle('on', st > i); }); });
    setH('j', Math.round(Math.min(1, G.shown / g) * 50), v => { $('jar').firstElementChild.style.height = v * 2 + '%'; });
    setH('t', Math.ceil(G.timeLeft), v => { const e = $('timeTxt'); e.textContent = v; e.classList.toggle('low', v <= 5); });
  } else {
    setH('lt', Math.round(G.lantern * 200), () => { $('lanternBar').firstElementChild.style.width = G.lantern * 100 + '%'; });
    setH('t', Math.floor(G.t), v => { $('timeTxt').textContent = v + 's'; $('timeTxt').classList.remove('low'); });
    setH('j', Math.round(G.lantern * 50), v => { $('jar').firstElementChild.style.height = v * 2 + '%'; });
  }
  setH('c', G.streak > 1 ? G.streak : 0, v => { const c = $('chain'); if(!v) c.classList.add('hidden'); else { c.classList.remove('hidden'); c.querySelector('b').textContent = 'x' + Math.min(3, 1 + (v - 1) * .25).toFixed(2).replace(/\.?0+$/, ''); c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; } });
  setH('bo', save.up.bottle > 0 && !G.bottleUsed && G.state === 'play', v => $('bottleBtn').classList.toggle('hidden', !v));
  setH('cf', G.caughtFx.length ? G.catches : -1, v => { if(v >= 0){ const j = $('jar'); j.classList.remove('bump'); void j.offsetWidth; j.classList.add('bump'); } });
}

/* ---------------- flow ---------------- */
let playing = false, firstTouch = true;
function beginPlay(){ if(!playing){ playing = true; SDK.gameplayStart(); } }
function endPlay(){ if(playing){ playing = false; SDK.gameplayStop(); } }
function titleScene(){
  // the title floats over a live meadow; the first stroke starts the night
  resetRound(); G.mode = 'night'; G.spec = nightSpec(save.night); G.state = 'title';
  for(let i = 0; i < 26; i++) spawnFly();
  bgCache = null; AU.setPlace(G.spec.place);
  $('tInfo').textContent = save.maxNight > 1 ? `Night ${save.night}  ·  ${Object.keys(save.codex).length} / ${SP_IDS.length} fireflies found` : '';
}
function goNight(n){
  hide('result'); SCREENS.forEach(hide); for(const k in hc) delete hc[k];
  startNight(n); bgCache = null; AU.setPlace(G.spec.place);
  show('hud'); beginPlay();
  const t = save.tut;
  if(n === 1 && t < 1) tip('Draw a <b>circle</b> around the fireflies to catch them!');
  else if(n === 2 && t < 2){ tip(TIPS[0], 5000); save.tut = 2; }
  else if(n === 3 && t < 3){ tip(TIPS[1], 5000); save.tut = 3; }
  else if(n === 4 && t < 4){ tip(TIPS[3], 5500); save.tut = 4; }
  else if(G.spec.boss) tip('👑 <b>The Firefly Queen</b> visits tonight. Loop her before she flies away!', 5000);
  else if(G.spec.place === 1 && n === 11) tip('<b>Bats</b> swoop through the woods. Watch for the <b>!</b> warning.', 5000);
  else if(G.spec.place === 2 && n === 21) tip('<b>Spider webs</b> tangle your lasso. Draw around them.', 5000);
  else if(G.spec.place === 3 && n === 31) tip('Wind blows through the <b>Starfall Peaks</b>. Fireflies drift with it.', 5000);
  else tip(null);
}
function goHunt(){ hide('result'); SCREENS.forEach(hide); for(const k in hc) delete hc[k]; startHunt(); bgCache = null; AU.setPlace(0); show('hud'); beginPlay(); tip('Your lantern fades. <b>Catch light to keep it burning!</b>', 4000); }

/* ---------------- result ---------------- */
function showResult(){
  endPlay(); tip(null);
  const r = G.result; if(!r) return;
  show('result'); G.state = 'result';
  const stars = $('rStars').children;
  if(r.mode === 'hunt'){
    $('rTitle').textContent = r.best ? 'NEW BEST HUNT!' : 'THE LANTERN WENT OUT'; $('rTitle').className = r.best ? '' : 'fail';
    for(const s of stars) s.style.display = 'none';
    countUp($('rLight'), r.score, ' light');
    $('rStat').innerHTML = `Lasted <b>${r.t}s</b> · Best loop <b>${r.bestLoop}</b> · +<b>${fmt(r.glow)}</b> glow`;
    $('rNext').textContent = 'HUNT AGAIN ▶'; $('rRetry').classList.add('hidden');
  } else {
    $('rTitle').textContent = r.win ? (r.st === 3 ? 'PERFECT NIGHT!' : 'NIGHT COMPLETE') : 'NOT ENOUGH LIGHT'; $('rTitle').className = r.win ? '' : 'fail';
    [...stars].forEach((s, i) => { s.style.display = ''; s.classList.toggle('on', i < r.st); s.style.animationDelay = (.3 + i * .25) + 's'; if(i < r.st) setTimeout(() => AU.star(i), 300 + i * 250); });
    countUp($('rLight'), r.light, ' light');
    $('rStat').innerHTML = `Goal <b>${fmt(r.goal)}</b> · Caught <b>${r.caught}</b> in <b>${r.loops}</b> loops · Best loop <b>${r.bestLoop}</b>${r.queen ? ' · 👑 <b>Queen caught!</b>' : ''}<br>Your glow: <b>${fmt(save.glow)}</b>`;
    $('rNext').textContent = r.win ? 'NEXT NIGHT ▶' : 'TRY AGAIN ▶'; $('rRetry').classList.toggle('hidden', !r.win);
  }
  if(r.newSpecies.length){ $('rNew').innerHTML = '📖 New in your Codex: <b>' + r.newSpecies.map(k => SPECIES[k].name).join(', ') + '</b>'; show('rNew'); } else hide('rNew');
  buildUpRow();
}
function countUp(el, v, suffix){ const t0 = performance.now(); const f = () => { const k = Math.min(1, (performance.now() - t0) / 900); el.textContent = '+' + fmt(Math.round(v * (1 - Math.pow(1 - k, 3)))) + suffix; if(k < 1){ AU.count(); requestAnimationFrame(f); } }; f(); }
function buildUpRow(){
  const row = $('upRow'); row.innerHTML = '';
  for(const u of UPG){
    const l = save.up[u.id], max = l >= u.max, c = upCost(u, l), can = !max && save.glow >= c;
    const d = document.createElement('div'); d.className = 'up' + (can ? ' can' : '') + (max ? ' max' : '');
    d.innerHTML = `<div class="ic">${u.icon}</div><b>${u.name}</b><span>${u.eff(l)}</span><div class="c">${max ? 'MAX' : '✦ ' + fmt(c)}</div>`;
    d.addEventListener('click', e => { e.stopPropagation(); AU.init(); if(!can){ AU.deny(); return; } save.glow -= c; save.up[u.id]++; AU.buy(); persist(); buildUpRow(); if($('rStat')) $('rStat').innerHTML = $('rStat').innerHTML.replace(/Your glow: <b>[^<]*<\/b>/, `Your glow: <b>${fmt(save.glow)}</b>`); });
    row.appendChild(d);
  }
}
function nextFromResult(){ const r = G.result; if(!r) return; if(r.mode === 'hunt') goHunt(); else goNight(r.win ? save.night : r.n); }

/* ---------------- menus ---------------- */
function openMenu(){
  if(G.state === 'play'){ G.prevState = 'play'; G.state = 'pause'; }
  endPlay(); SCREENS.forEach(hide);
  $('hLock').textContent = save.maxNight >= 5 ? (save.best.hunt ? '· BEST ' + fmt(save.best.hunt) : '') : '· NIGHT 5';
  $('mHunt').disabled = save.maxNight < 5;
  $('mStats').innerHTML = `Night <b>${save.night}</b> · Glow <b>${fmt(save.glow)}</b> · Fireflies caught <b>${fmt(save.stats.caught)}</b> · Biggest loop <b>${save.best.loop}</b>`;
  show('menu');
}
function closeMenus(){
  SCREENS.forEach(hide);
  if(G.state === 'pause'){ G.state = 'play'; beginPlay(); }
  if(G.state === 'result') show('result');
}
function openNights(){
  SCREENS.forEach(hide); const g = $('nGrid'); g.innerHTML = '';
  for(let n = 1; n <= save.maxNight; n++){
    const st = save.stars[n] || 0, boss = n % 10 === 0, b = document.createElement('button');
    b.className = 'nB' + (boss ? ' boss' : '') + (n === save.night ? ' cur' : '');
    b.innerHTML = `<b>${boss ? '👑' : n}</b><span>${'★'.repeat(st)}<i>${'★'.repeat(3 - st)}</i></span>`;
    onTap(b, () => { hideTitle(); goNight(n); });
    g.appendChild(b);
  }
  show('nights');
}
function iconCanvas(k, found){
  const c = document.createElement('canvas'); c.width = c.height = 92; const g = c.getContext('2d'), S = SPECIES[k];
  const gr = g.createRadialGradient(46, 46, 0, 46, 46, 44); gr.addColorStop(0, rgba(found ? S.col : '#445', .9)); gr.addColorStop(.3, rgba(found ? S.col : '#445', .35)); gr.addColorStop(1, rgba('#000000', 0));
  g.fillStyle = gr; g.fillRect(0, 0, 92, 92); g.fillStyle = found ? '#fff' : '#667'; g.beginPath(); g.arc(46, 46, S.boss ? 12 : 7, 0, TAU); g.fill();
  if(!found){ g.fillStyle = '#aab'; g.font = '900 26px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', 46, 48); }
  return c;
}
function openCodex(){
  SCREENS.forEach(hide); const L = $('cxList'); L.innerHTML = '';
  let n = 0;
  for(const k of SP_IDS){
    const S = SPECIES[k], cnt = save.codex[k] || 0; if(cnt) n++;
    const d = document.createElement('div'); d.className = 'item' + (cnt ? '' : ' locked');
    const hint = S.secret ? 'Secret: ' + S.secret : S.boss ? 'Appears on every tenth night.' : `First seen around night ${S.from}.`;
    d.appendChild(iconCanvas(k, cnt));
    d.insertAdjacentHTML('beforeend', `<div class="it"><b>${cnt ? S.name : '???'}</b><span>${cnt ? S.desc + ' · worth ' + S.val : hint}</span></div><div class="n">${cnt ? '×' + fmt(cnt) : ''}</div>`);
    L.appendChild(d);
  }
  $('cxN').textContent = n + ' / ' + SP_IDS.length;
  show('codex');
}
function openShop(){
  SCREENS.forEach(hide); const L = $('shopList'); L.innerHTML = ''; $('sGlow').textContent = '✦ ' + fmt(save.glow);
  for(const u of UPG){
    const l = save.up[u.id], max = l >= u.max, c = upCost(u, l);
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<div style="font-size:26px;width:40px;text-align:center">${u.icon}</div><div class="it"><b>${u.name}</b><span>${u.eff(l)}${max ? '' : ' → ' + u.eff(l + 1)}</span><div class="pips">${Array.from({ length:u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('')}</div></div>`;
    const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = max ? 'MAX' : '✦ ' + fmt(c); b.disabled = max || save.glow < c;
    onTap(b, () => { if(save.glow < c || max){ AU.deny(); return; } save.glow -= c; save.up[u.id]++; AU.buy(); persist(); openShop(); });
    d.appendChild(b); L.appendChild(d);
  }
  show('shop');
}
function openSettings(){
  SCREENS.forEach(hide); show('settings');
  document.querySelectorAll('#settings input[data-opt]').forEach(i => i.checked = !!save.opt[i.dataset.opt]);
  document.querySelectorAll('#settings .seg').forEach(s => s.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === save.opt[s.dataset.opt])));
}
function hideTitle(){ if(!firstTouch) return; firstTouch = false; $('title').classList.add('gone'); setTimeout(() => hide('title'), 500); }

/* ---------------- input ---------------- */
function inArena(px, py){ return py > V.TOP * .6; }
function wire(){
  const c = $('cv');
  const down = e => {
    AU.init(); AU.resume();
    if(!SCREENS.every(id => $(id).classList.contains('hidden'))) return;
    if(G.state === 'result') return;
    PTR.down = true; PTR.id = e.pointerId; PTR.x = e.clientX; PTR.y = e.clientY; [PTR.wx, PTR.wy] = toWorld(PTR.x, PTR.y);
    if(G.state === 'title'){ hideTitle(); goNight(save.night); }
    G.trail = []; G.trailLen = 0; trailAdd(PTR.wx, PTR.wy);
  };
  c.addEventListener('pointerdown', down);
  $('title').addEventListener('pointerdown', down);
  addEventListener('pointermove', e => {
    if(!PTR.down || e.pointerId !== PTR.id) return;
    let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null; if(!evs || !evs.length) evs = [e];
    for(const ev of evs){ PTR.x = ev.clientX; PTR.y = ev.clientY; [PTR.wx, PTR.wy] = toWorld(PTR.x, PTR.y); trailAdd(PTR.wx, PTR.wy); }
  });
  const up = e => { if(e.pointerId === PTR.id) PTR.down = false; };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  addEventListener('keydown', e => {
    AU.init(); AU.resume();
    if(e.key === 'Escape'){ if(!$('menu').classList.contains('hidden')) closeMenus(); else if(G.state === 'play') openMenu(); }
    else if((e.key === 'Enter' || e.key === ' ') && G.state === 'result'){ e.preventDefault(); nextFromResult(); }
    else if((e.key === 'b' || e.key === 'B') && G.state === 'play') useBottle();
  });
  onTap('menuBtn', openMenu); onTap('bottleBtn', useBottle);
  onTap('mPlay', () => { if(G.state === 'pause' || G.state === 'result') closeMenus(); else { hideTitle(); goNight(save.night); } });
  onTap('mNights', openNights); onTap('mCodex', openCodex); onTap('mShop', openShop); onTap('mSet', openSettings);
  onTap('mHunt', () => { hideTitle(); goHunt(); });
  onTap('rNext', nextFromResult); onTap('rRetry', () => goNight(G.result.n)); onTap('rMenu', () => { hide('result'); openMenu(); });
  document.querySelectorAll('.closeBtn').forEach(b => onTap(b, () => { const inSub = !$('menu').classList.contains('hidden') ? false : ['nights', 'codex', 'shop', 'settings'].some(id => !$(id).classList.contains('hidden')); if(inSub && G.state !== 'title') openMenu(); else closeMenus(); }));
  document.querySelectorAll('#settings input[data-opt]').forEach(i => i.addEventListener('change', () => { save.opt[i.dataset.opt] = i.checked; AU.apply(); persist(); }));
  document.querySelectorAll('#settings .seg button').forEach(b => onTap(b, () => { save.opt[b.parentElement.dataset.opt] = b.dataset.v; resize(); persist(); openSettings(); }));
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { AU.setHidden(document.hidden); if(document.hidden){ writeSave(); if(G.state === 'play') openMenu(); } else AU.resume(); });
  SDK.onMute = m => AU.setPortalMute(m);
}
function useBottle(){ if(save.up.bottle < 1 || G.bottleUsed || G.state !== 'play') return; G.bottleUsed = true; G.slowT = 2 + save.up.bottle; AU.bottle(); pop('TIME SLOWS...', G.W / 2, G.H * .3, '#c8a8ff', 24, 1.6); }

/* ---------------- tutorial ghost ---------------- */
function tutorialTick(){
  G.ghost = null;
  if(G.state !== 'play' || G.mode !== 'night' || G.spec.n !== 1 || save.tut >= 1) return;
  if(G.catches > 0){ save.tut = 1; persist(); tip('Wonderful! <b>Bigger loops</b> catch more, and every extra firefly multiplies the rest.', 4500); return; }
  if(PTR.down) return;
  // the densest little group
  let best = null, bn = 0; for(const f of G.flies){ let n = 0; for(const o of G.flies) if(Math.hypot(o.x - f.x, o.y - f.y) < 70) n++; if(n > bn){ bn = n; best = f; } }
  if(best) G.ghost = { x:best.x, y:best.y, r:75 };
}

/* ---------------- loop ---------------- */
let last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt = last ? (ts - last) / 1000 : 1 / 60; last = ts;
  if(dt <= 0) return; if(dt > .05) dt = .05;
  try{
    if(G.state !== 'pause') update(dt); else G.rt += dt;
    tutorialTick();
    render(); updateHUD();
  }catch(err){ console.error(err); }
}
addEventListener('error', e => { try{ console.error(e.error || e.message); }catch(_){} });

/* ---------------- boot ---------------- */
(async () => {
  resize();
  await SDK.init();
  SDK.loadingStart();
  loadSave();
  wire();
  titleScene();
  resize();
  requestAnimationFrame(frame);
  SDK.loadingStop();
  const b = $('boot'); b.style.opacity = '0'; setTimeout(() => b.remove(), 450);
})();

</script>
</body>
