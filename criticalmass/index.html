<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d24">
<meta name="description" content="CRITICAL MASS: one tap, total chain reaction. Set off a blast, watch the atoms pop each other and wipe the whole screen.">
<title>CRITICAL MASS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%230b0d24%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%233ff0ff%22/%3E%3Ccircle cx=%223.5%22 cy=%224%22 r=%221.5%22 fill=%22%23ff5ad9%22/%3E%3Ccircle cx=%2212.5%22 cy=%2211%22 r=%221.5%22 fill=%22%23ffd23c%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ HUD ============ -->
<div id="hud">
  <div id="hL"><b id="lvTxt">LEVEL 1</b><span id="wTxt">The Lab</span></div>
  <div id="hC">
    <div id="goalRow"><span id="goalTxt">0 / 7</span><span id="tapDots"></span></div>
    <div id="goalBar"><i></i><em class="st s1">★</em><em class="st s2">★</em><em class="st s3">★</em></div>
    <div id="meterBar" class="hidden"><i></i><span>OVERLOAD</span></div>
  </div>
  <div id="hR"><div id="energy">0</div><button id="menuBtn" class="icoBtn" aria-label="Menu">☰</button></div>
</div>
<div id="logoOv"><h1 id="logo">CRITICAL<br><span>MASS</span></h1><div class="tapHint">TAP TO SET OFF A <b>CHAIN REACTION</b></div></div>
<div id="tip" class="hidden"></div>

<!-- ============ RESULT ============ -->
<div id="result" class="sheet hidden">
  <div id="rTitle">LEVEL COMPLETE</div>
  <div id="rStars"><i>★</i><i>★</i><i>★</i></div>
  <div id="rStat"></div>
  <div id="rEnergy">+0</div>
  <div id="upRow"></div>
  <div class="rBtns">
    <button id="rMenu" class="btn ghost">☰</button>
    <button id="rRetry" class="btn">↻ RETRY</button>
    <button id="rNext" class="btn primary big">NEXT ▶</button>
  </div>
</div>

<!-- ============ NEW ATOM ============ -->
<div id="newAtom" class="screen dim hidden">
  <div class="naCard"><div class="naTag">NEW ATOM!</div><canvas id="naCv" width="160" height="160"></canvas><b id="naName">Heavy</b><span id="naDesc"></span><button id="naOk" class="btn primary">GOT IT</button></div>
</div>

<!-- ============ MENU ============ -->
<div id="menu" class="screen dim hidden">
  <h2>CRITICAL MASS</h2>
  <div class="menuGrid">
    <button id="mPlay" class="btn primary big">▶ CONTINUE</button>
    <button id="mLevels" class="btn wide">LEVELS</button>
    <button id="mEndless" class="btn wide special">∞ OVERLOAD <small id="eLock"></small></button>
    <button id="mDaily" class="btn wide daily">☀ DAILY REACTOR <small id="dLock"></small></button>
    <div class="row2"><button id="mAtoms" class="btn">ATOMS</button><button id="mSet" class="btn">SETTINGS</button></div>
  </div>
  <div id="mStats" class="hint"></div>
  <button class="btn ghost closeBtn">CLOSE</button>
</div>

<div id="levels" class="screen dim hidden">
  <h2>LEVELS</h2>
  <div id="lvGrid"></div>
  <button class="btn ghost closeBtn">BACK</button>
</div>

<div id="atoms" class="screen dim hidden">
  <h2>ATOMS</h2>
  <div id="atomList" class="list"></div>
  <button class="btn ghost closeBtn">BACK</button>
</div>

<div id="settings" class="screen dim hidden">
  <h2>SETTINGS</h2>
  <div class="list">
    <label class="setRow"><span>Sound effects</span><input type="checkbox" data-opt="sfx"><i class="sw"></i></label>
    <label class="setRow"><span>Music</span><input type="checkbox" data-opt="music"><i class="sw"></i></label>
    <div class="setRow"><span>Effects</span><div class="seg" data-opt="fx"><button data-v="low">LOW</button><button data-v="high">HIGH</button></div></div>
  </div>
  <button class="btn ghost closeBtn">BACK</button>
</div>

<div id="boot"><div class="bootLogo">CRITICAL MASS</div><div class="bootBar"><i></i></div></div>

<script src="js/sdk.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
