[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btb"
version = "1.0.0"
description = "Burn to Become — the 30-day Field Manual in your terminal"
requires-python = ">=3.10"

[project.scripts]
btb = "btb.cli:main"

[tool.setuptools.package-data]
btb = ["field_manual.json"]
