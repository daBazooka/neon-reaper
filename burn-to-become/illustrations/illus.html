<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:EBG;src:url(fonts/EB_Garamond-normal-400.ttf)}
@font-face{font-family:EBG;font-style:italic;src:url(fonts/EB_Garamond-italic-400.ttf)}
@font-face{font-family:EBG;font-weight:600;src:url(fonts/EB_Garamond-normal-600.ttf)}
@font-face{font-family:Bebas;src:url(fonts/Bebas_Neue-normal-400.ttf)}
@font-face{font-family:Oswald;font-weight:300;src:url(fonts/Oswald-normal-300.ttf)}
@font-face{font-family:Oswald;font-weight:400;src:url(fonts/Oswald-normal-400.ttf)}
@font-face{font-family:Oswald;font-weight:600;src:url(fonts/Oswald-normal-600.ttf)}
@font-face{font-family:Corm;font-weight:500;src:url(fonts/Cormorant_Garamond-normal-500.ttf)}
@font-face{font-family:Corm;font-style:italic;font-weight:500;src:url(fonts/Cormorant_Garamond-italic-500.ttf)}
@font-face{font-family:Corm;font-weight:700;src:url(fonts/Cormorant_Garamond-normal-700.ttf)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<span style="font-family:EBG">a</span><span style="font-family:EBG;font-style:italic">a</span><span style="font-family:Bebas">a</span><span style="font-family:Oswald">a</span><span style="font-family:Corm">a</span><span style="font-family:Corm;font-style:italic">a</span><span style="font-family:Corm;font-weight:700">a</span><span style="font-family:Oswald;font-weight:300">a</span><span style="font-family:Oswald;font-weight:600">a</span><span style="font-family:EBG;font-weight:600">a</span>
<script>
// ---------- utilities ----------
let seed = 7;
function rnd(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }
function rr(a,b){ return a + (b-a)*rnd(); }
function gauss(){ return (rnd()+rnd()+rnd()+rnd()-2)/2; }
const INK = '#141414', PAPER = '#ffffff';
let C, X, W, H;
function setup(w,h){ W=w; H=h; C=document.createElement('canvas'); C.width=w; C.height=h; document.body.appendChild(C); X=C.getContext('2d'); X.lineCap='round'; X.lineJoin='round'; }
function grain(amount, mono=true){
  const img = X.getImageData(0,0,W,H), d = img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*amount; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  X.putImageData(img,0,0);
}
function vignette(strength=0.6){
  const g = X.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${strength})`);
  X.fillStyle=g; X.fillRect(0,0,W,H);
}
function darkSky(top='#3a3a3a', bottom='#0b0b0b'){
  const g = X.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(1,bottom);
  X.fillStyle=g; X.fillRect(0,0,W,H);
}
function speckle(n, color, rmin, rmax, alpha=0.6, region){
  X.fillStyle=color;
  for(let i=0;i<n;i++){ const x=region?rr(region[0],region[2]):rr(0,W), y=region?rr(region[1],region[3]):rr(0,H);
    X.globalAlpha=rr(0.1,alpha); X.beginPath(); X.arc(x,y,rr(rmin,rmax),0,Math.PI*2); X.fill(); }
  X.globalAlpha=1;
}
// hatching strokes for ink texture
function hatch(x0,y0,x1,y1,n,angle,len,color,alpha,width=1.2){
  X.strokeStyle=color; X.lineWidth=width;
  for(let i=0;i<n;i++){ const x=rr(x0,x1), y=rr(y0,y1), a=angle+gauss()*0.15, l=len*rr(0.5,1.2);
    X.globalAlpha=rr(alpha*0.3,alpha); X.beginPath(); X.moveTo(x,y); X.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); X.stroke(); }
  X.globalAlpha=1;
}
// ---------- the wanderer silhouette ----------
function wanderer(x,y,h,{dir=1,lean=0,color=INK,staff=true,sword=true,flutter=1}={}){
  X.save(); X.translate(x,y); X.scale(h*dir,h); X.rotate(lean); X.fillStyle=color; X.strokeStyle=color;
  // legs
  X.lineWidth=0.045;
  X.beginPath(); X.moveTo(-0.05,-0.32); X.quadraticCurveTo(-0.08,-0.15,-0.1,-0.01); X.stroke();
  X.beginPath(); X.moveTo(0.05,-0.32); X.quadraticCurveTo(0.1,-0.18,0.12,-0.04); X.stroke();
  X.beginPath(); X.ellipse(-0.085,-0.005,0.045,0.018,0,0,Math.PI*2); X.fill();
  X.beginPath(); X.ellipse(0.14,-0.03,0.045,0.018,0.2,0,Math.PI*2); X.fill();
  // cloak
  X.beginPath();
  X.moveTo(-0.09,-0.78); X.quadraticCurveTo(-0.16,-0.6,-0.21,-0.3);
  X.lineTo(-0.16,-0.33); X.lineTo(-0.13,-0.27); X.lineTo(-0.08,-0.31); X.lineTo(-0.03,-0.26); X.lineTo(0.03,-0.3);
  X.lineTo(0.08,-0.27); X.lineTo(0.12,-0.32); X.lineTo(0.16,-0.3);
  X.quadraticCurveTo(0.14,-0.6,0.09,-0.78); X.closePath(); X.fill();
  // fluttering strips
  for(let i=0;i<2*flutter;i++){ const yy=-0.66+i*0.16; X.beginPath(); X.moveTo(-0.11,yy); X.quadraticCurveTo(-0.22,yy+0.02,-0.3,yy+0.1); X.quadraticCurveTo(-0.2,yy+0.06,-0.13,yy+0.09); X.closePath(); X.fill(); }
  // head + hat (kasa)
  X.beginPath(); X.arc(0,-0.83,0.055,0,Math.PI*2); X.fill();
  X.beginPath(); X.moveTo(-0.2,-0.855); X.quadraticCurveTo(0,-0.83,0.2,-0.855); X.lineTo(0.03,-0.99); X.lineTo(-0.03,-0.99); X.closePath(); X.fill();
  if(sword){ X.lineWidth=0.022; X.beginPath(); X.moveTo(-0.02,-0.55); X.lineTo(-0.27,-0.8); X.stroke(); X.lineWidth=0.035; X.beginPath(); X.moveTo(-0.17,-0.7); X.lineTo(-0.2,-0.73); X.stroke(); }
  if(staff){ X.lineWidth=0.018; X.beginPath(); X.moveTo(0.17,-0.92); X.lineTo(0.27,0.0); X.stroke();
    X.lineWidth=0.04; X.beginPath(); X.moveTo(0.12,-0.62); X.lineTo(0.2,-0.66); X.stroke(); }
  X.restore();
}
// ---------- feather wing ----------
function feather(x0,y0,ang,len,wid,color,alpha,curve=0.15){
  const bend = curve*len;
  const px = (t)=>{ const bx=x0+Math.cos(ang)*len*t, by=y0+Math.sin(ang)*len*t; const off=Math.sin(Math.PI*t)*bend; return [bx+Math.cos(ang+Math.PI/2)*off, by+Math.sin(ang+Math.PI/2)*off]; };
  X.strokeStyle=color; X.lineWidth=2.2; X.globalAlpha=alpha;
  X.beginPath(); for(let t=0;t<=1.001;t+=0.02){ const p=px(t); t===0?X.moveTo(p[0],p[1]):X.lineTo(p[0],p[1]); } X.stroke();
  const n = Math.floor(len/5);
  for(let i=0;i<n;i++){ const t=i/n, p=px(t), w=wid*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.15+0.05)),0.6)*(1-0.35*t);
    for(const s of [-1,1]){ const a=ang+s*(0.55+gauss()*0.12)+Math.PI*0.0; const l=w*rr(0.7,1.15);
      X.lineWidth=rr(0.8,1.8); X.globalAlpha=alpha*rr(0.35,1);
      X.beginPath(); X.moveTo(p[0],p[1]); X.quadraticCurveTo(p[0]+Math.cos(a)*l*0.5,p[1]+Math.sin(a)*l*0.5, p[0]+Math.cos(a+s*0.25)*l, p[1]+Math.sin(a+s*0.25)*l); X.stroke(); }
  }
  X.globalAlpha=1;
}
function wing(ox,oy,a0,a1,count,lmin,lmax,wid,color='#fff',alpha=0.9){
  for(let i=0;i<count;i++){ const t=i/(count-1); const a=a0+(a1-a0)*t+gauss()*0.03;
    const len = lmin + (lmax-lmin)*Math.pow(Math.sin(Math.PI*(0.15+0.85*t)),1.2)*rr(0.85,1.05);
    feather(ox+gauss()*10,oy+gauss()*10,a,len,wid*rr(0.7,1.1),color,alpha*rr(0.6,1),rr(-0.08,0.2)); }
}
function wing2(ox,oy,scale,color='#fff',alpha=0.95,dir=-1){
  // leading edge: shoulder -> wrist -> tip, sweeping up and out (dir=-1 = to the left)
  const P0=[ox,oy], P1=[ox+dir*0.12*scale,oy-0.85*scale], P2=[ox+dir*0.62*scale,oy-1.25*scale];
  const edge=(t)=>[(1-t)*(1-t)*P0[0]+2*(1-t)*t*P1[0]+t*t*P2[0],(1-t)*(1-t)*P0[1]+2*(1-t)*t*P1[1]+t*t*P2[1]];
  const rows=[{n:34,lmin:0.22,lmax:0.34,wid:0.035,a:0.55},{n:26,lmin:0.35,lmax:0.6,wid:0.05,a:0.8},{n:16,lmin:0.5,lmax:1.05,wid:0.065,a:1}];
  rows.reverse().forEach((row,ri)=>{ for(let i=0;i<row.n;i++){ const t=0.05+0.95*i/(row.n-1); const e=edge(t);
      // feathers fan: near shoulder point down, near tip point outward
      const ang = dir<0 ? (Math.PI*0.62 + t*Math.PI*0.55) : (Math.PI*0.38 - t*Math.PI*0.55);
      const len=scale*(row.lmin+(row.lmax-row.lmin)*Math.pow(t,1.3))*rr(0.9,1.05);
      feather(e[0],e[1],ang+gauss()*0.04,len,scale*row.wid,color,alpha*row.a,dir*rr(0.02,0.1)); } });
  // edge line
  X.strokeStyle=color; X.globalAlpha=alpha; X.lineWidth=scale*0.012; X.beginPath(); for(let t=0;t<=1;t+=0.02){const e=edge(t); t?X.lineTo(e[0],e[1]):X.moveTo(e[0],e[1]);} X.stroke(); X.globalAlpha=1;
}
// ---------- terrain ----------
function ridgeLine(y0,amp,rough,seedOff){ // midpoint displacement ridge returning array of y per x step
  const n=257, ys=new Array(n).fill(0); ys[0]=y0+gauss()*amp; ys[n-1]=y0+gauss()*amp;
  let step=n-1, a=amp;
  while(step>1){ for(let i=0;i<n-1;i+=step){ const m=i+step/2; ys[m]=(ys[i]+ys[i+step])/2+gauss()*a; } step/=2; a*=rough; }
  return ys;
}
function fillRidge(ys,color,bottom=H){
  X.fillStyle=color; X.beginPath(); X.moveTo(0,bottom);
  ys.forEach((y,i)=>X.lineTo(i/(ys.length-1)*W,y)); X.lineTo(W,bottom); X.closePath(); X.fill();
}
function scribbleBall(cx,cy,r,n=260,color=INK,alpha=0.55){
  X.strokeStyle=color;
  for(let i=0;i<n;i++){ const a=rr(0,Math.PI*2), rx=r*rr(0.55,1), ry=r*rr(0.55,1), rot=rr(0,Math.PI);
    X.lineWidth=rr(0.8,2.4); X.globalAlpha=rr(alpha*0.4,alpha);
    X.beginPath(); X.ellipse(cx+gauss()*r*0.05,cy+gauss()*r*0.05,rx,ry,rot,a,a+rr(1.5,4.5)); X.stroke(); }
  X.globalAlpha=1;
}
function brushStroke(points,width,color,dry=0.5){
  // points: array [x,y,w]; draws many thin parallel bristles
  const bristles=60;
  for(let b=0;b<bristles;b++){ const off=(b/(bristles-1)-0.5); const gap=rnd()<dry*0.25;
    X.strokeStyle=color; X.globalAlpha=gap?0.15:rr(0.55,0.95); X.lineWidth=width/bristles*2.2;
    X.beginPath();
    points.forEach((p,i)=>{ const q=points[Math.min(i+1,points.length-1)], pr=points[Math.max(i-1,0)];
      const dx=q[0]-pr[0], dy=q[1]-pr[1], L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
      const w=p[2]*width; const x=p[0]+nx*off*w, y=p[1]+ny*off*w;
      if(i===0) X.moveTo(x,y); else if(rnd()<dry*0.02*Math.abs(off)*4){ X.stroke(); X.beginPath(); X.moveTo(x,y);} else X.lineTo(x,y); });
    X.stroke(); }
  X.globalAlpha=1;
}
function text(str,x,y,font,color,align='center',spacing=0){
  X.font=font; X.fillStyle=color; X.textAlign=align; X.textBaseline='alphabetic';
  if('letterSpacing' in X) X.letterSpacing=spacing+'px';
  X.fillText(str,x,y); if('letterSpacing' in X) X.letterSpacing='0px';
}
function wrapText(str,x,y,maxW,lineH,font,color,align='center'){
  X.font=font; const words=str.split(' '); const lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(X.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; }
  lines.push(cur); lines.forEach((l,i)=>text(l,x,y+i*lineH,font,color,align)); return lines.length;
}
function star(x,y,r,color='#fff',alpha=1){ X.fillStyle=color; X.globalAlpha=alpha; X.beginPath(); X.arc(x,y,r,0,Math.PI*2); X.fill(); X.globalAlpha=1; }
function starfield(n,region){ for(let i=0;i<n;i++){ const s=Math.pow(rnd(),6)*4+0.6; star(rr(region[0],region[2]),rr(region[1],region[3]),s,'#fff',rr(0.3,1)); } }

function bottomShade(from=0.55){ const g=X.createLinearGradient(0,H*from,0,H*0.8); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.88)'); X.fillStyle=g; X.fillRect(0,H*from,W,H*(1-from)); }
// ---------- scenes ----------
const S = {};
// Frontispiece: the winged climber
S.frontispiece = ()=>{ setup(1800,2700); seed=11;
  darkSky('#4a4a4a','#0e0e0e');
  hatch(0,0,W,H*0.8,2500,-0.9,60,'#000',0.18,2);
  // slope
  const slope=(x)=>H*0.93 - (x/W)*H*0.34;
  X.fillStyle='#eeeeee'; X.beginPath(); X.moveTo(0,H); for(let x=0;x<=W;x+=10) X.lineTo(x,slope(x)+Math.sin(x*0.02)*6+gauss()*3); X.lineTo(W,H); X.fill();
  hatch(0,H*0.62,W,H,1800,-0.33,80,'#9a9a9a',0.35,1.4);
  const fx=1260, fy=slope(1260)+6;
  wing2(fx-60,fy-215,1050,'#ffffff',0.95,-1);
  wanderer(fx,fy,300,{lean:0.28});
  speckle(900,'#fff',0.6,2.2,0.7,[0,0,W,H*0.75]);
  X.globalAlpha=0.9; text('to become a star,',W*0.72,H*0.13,'italic 92px EBG','#fff','center'); text('you must burn.',W*0.72,H*0.13+110,'italic 92px EBG','#fff','center'); X.globalAlpha=1;
  vignette(0.55); grain(26);
};
// Part I: hallway of doors, one open
S.part1 = ()=>{ setup(1800,2700); seed=21;
  X.fillStyle='#0c0c0c'; X.fillRect(0,0,W,H);
  const vx=W/2, vy=H*0.33;
  // floor and walls perspective lines
  X.strokeStyle='#2a2a2a'; X.lineWidth=3;
  for(let i=-12;i<=12;i++){ X.beginPath(); X.moveTo(vx,vy); X.lineTo(vx+i*220,H); X.stroke(); }
  // doors receding on both sides
  for(let k=0;k<9;k++){ const t=Math.pow(0.72,k); const dw=260*t, dh=620*t;
    for(const s of [-1,1]){ const cx=vx+s*(700*t+40), top=vy+(H*0.62-vy)*t- dh*0.9, bottom=top+dh;
      X.strokeStyle='#3a3a3a'; X.lineWidth=Math.max(1,6*t); X.strokeRect(cx-dw/2,top,dw,dh);
      if(s===1 && k===2){ // open door with light
        const g=X.createLinearGradient(cx-dw/2,0,cx+dw/2,0); g.addColorStop(0,'#fffef6'); g.addColorStop(1,'#d9d6c9');
        X.fillStyle=g; X.fillRect(cx-dw/2,top,dw,dh);
        X.fillStyle='rgba(255,252,235,0.16)'; X.beginPath(); X.moveTo(cx-dw/2,bottom); X.lineTo(cx+dw/2,bottom); X.lineTo(cx+dw*3.5,H); X.lineTo(cx-dw*1.2,H); X.fill();
        X.fillStyle='#161616'; X.beginPath(); X.moveTo(cx-dw/2,top); X.lineTo(cx-dw/2-dw*0.35,top+dh*0.06); X.lineTo(cx-dw/2-dw*0.35,bottom+dh*0.04); X.lineTo(cx-dw/2,bottom); X.fill();
      }
    } }
  // tiny figure silhouette facing the light
  wanderer(vx+120,H*0.8,210,{dir:1,staff:false,sword:false,flutter:0,color:'#000'});
  hatch(0,0,W,H,2200,1.2,50,'#000',0.25,2);
  bottomShade(); vignette(0.7); grain(22);
};
// Part II: the wanderer and his reflection
S.part2 = ()=>{ setup(1800,2700); seed=31;
  darkSky('#d9d9d9','#8a8a8a');
  const wy=H*0.52;
  hatch(0,0,W,wy,1400,0.05,120,'#555',0.2,1.5);
  // water
  const g=X.createLinearGradient(0,wy,0,H); g.addColorStop(0,'#1c1c1c'); g.addColorStop(1,'#050505'); X.fillStyle=g; X.fillRect(0,wy,W,H-wy);
  // shore line
  X.fillStyle='#111'; X.fillRect(0,wy-8,W,16);
  wanderer(W*0.5,wy,520,{staff:true});
  // reflection: redraw flipped in light gray with ripples
  const off=document.createElement('canvas'); off.width=W; off.height=H; const oc=off.getContext('2d');
  const tmp=X; X=oc; X.lineCap='round'; X.lineJoin='round'; wanderer(W*0.5,wy,520,{staff:true,color:'#cfcfcf'}); X=tmp;
  for(let y=0;y<600;y+=3){ const shift=Math.sin(y*0.09)*(4+y*0.03)+gauss()*2; X.globalAlpha=Math.max(0,0.85-y/700);
    X.drawImage(off,0,wy-y-3,W,3,shift,wy+y,W,3); }
  X.globalAlpha=1;
  hatch(0,wy+10,W,H,1800,0,90,'#444',0.35,1.6);
  vignette(0.5); grain(24);
};
// Part III: ridges and a river, tiny army
S.part3 = ()=>{ setup(1800,2700); seed=41;
  darkSky('#bdbdbd','#6a6a6a');
  const cols=['#9a9a9a','#7d7d7d','#5f5f5f','#434343','#262626','#111'];
  cols.forEach((c,i)=>{ const ys=ridgeLine(H*(0.28+i*0.07),160-i*12,0.55); fillRidge(ys,c); hatch(0,H*(0.3+i*0.07),W,H,300,-0.6,40,'#000',0.08,1); });
  // river snaking
  X.strokeStyle='#e8e8e8'; X.lineWidth=40; X.globalAlpha=0.85; X.beginPath(); X.moveTo(W*0.1,H); X.bezierCurveTo(W*0.7,H*0.85,W*0.2,H*0.72,W*0.65,H*0.62); X.stroke();
  X.lineWidth=16; X.beginPath(); X.moveTo(W*0.65,H*0.62); X.quadraticCurveTo(W*0.8,H*0.57,W*0.72,H*0.53); X.stroke(); X.globalAlpha=1;
  // army dots
  for(let i=0;i<160;i++){ const x=rr(W*0.22,W*0.48), y=rr(H*0.73,H*0.76)+ (x-W*0.22)*0.08; X.fillStyle='#000'; X.fillRect(x,y,4,9); X.fillRect(x+1,y-8,1.5,8); }
  wanderer(W*0.3,H*0.72,110,{});
  bottomShade(); vignette(0.5); grain(24);
};
// Part IV: open birdcage, feathers escaping
S.part4 = ()=>{ setup(1800,2700); seed=51;
  darkSky('#2a2a2a','#060606');
  const cx=W*0.45, top=H*0.16, bot=H*0.6, r=380;
  X.strokeStyle='#d8d8d8'; X.lineWidth=7;
  // dome + bars
  for(let i=0;i<=12;i++){ const t=i/12, x=cx-r+t*2*r; const k=(x-cx)/r; const yTop=top+220-Math.sqrt(Math.max(0,1-k*k))*220;
    if(i>=7&&i<=9) continue; // opening
    X.beginPath(); X.moveTo(x,bot); X.lineTo(x,yTop+220*(1-Math.sqrt(Math.max(0,1-k*k)))*0 ); X.stroke(); }
  X.beginPath(); X.ellipse(cx,top+220,r,220,0,Math.PI,2*Math.PI); X.stroke();
  X.lineWidth=12; X.beginPath(); X.ellipse(cx,bot,r,40,0,0,Math.PI*2); X.stroke();
  X.beginPath(); X.arc(cx,top-40,36,0,Math.PI*2); X.stroke(); X.beginPath(); X.moveTo(cx,top-4); X.lineTo(cx,top); X.stroke();
  // open door swung out
  const dx=cx-r+2*r*(7/12), dw=2*r*(2/12);
  X.lineWidth=6; X.save(); X.translate(dx+dw,bot-40); X.transform(1,-0.18,0,1,0,0);
  X.strokeRect(0,-380,dw*0.9,380); for(let j=1;j<4;j++){ X.beginPath(); X.moveTo(dw*0.9*j/4,-380); X.lineTo(dw*0.9*j/4,0); X.stroke(); } X.restore();
  // feathers drifting out and up to the right
  for(let i=0;i<18;i++){ const t=i/17; const x=dx+dw/2+t*W*0.5+gauss()*60, y=bot-200-t*H*0.45+gauss()*80;
    feather(x,y,rr(-2.2,-0.6),rr(90,190)*(1-t*0.4),rr(18,30),'#fff',0.9*(1-t*0.5),rr(-0.2,0.2)); }
  vignette(0.6); grain(26);
};
// Part V: a single flame
function flame(cx,base,h,wid){
  for(let layer=0;layer<5;layer++){ const k=1-layer*0.18; const hh=h*k, ww=wid*k;

    X.fillStyle=g; X.beginPath(); X.moveTo(cx,base-hh);

    X.quadraticCurveTo(cx+ww*0.35,base,cx,base); X.quadraticCurveTo(cx-ww*0.35,base,cx-ww*0.5,base-hh*0.1);
    X.bezierCurveTo(cx-ww*0.6,base-hh*0.35,cx-ww*0.1,base-hh*0.55,cx,base-hh); X.fill(); }
  // flicker strokes
  X.strokeStyle='#fff'; for(let i=0;i<220;i++){ const t=rnd(); const y=base-h*t*1.1; const x=cx+gauss()*wid*0.35*(1-t);
    X.globalAlpha=rr(0.05,0.35)*(1-t); X.lineWidth=rr(1,3); X.beginPath(); X.moveTo(x,y); X.quadraticCurveTo(x+gauss()*30,y-40,x+gauss()*20,y-rr(40,120)); X.stroke(); }

}

function svgScene(w,h,markup){ return new Promise(res=>{ setup(w,h); const img=new Image(); const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><style>
 .t{font-family:EBG,serif;fill:${INK}} .l{font-family:Oswald,sans-serif;fill:${INK};letter-spacing:4px} .s{stroke:${INK};fill:none}
 </style><rect width="100%" height="100%" fill="${PAPER}"/>${markup}</svg>`;
 // draw via DOM text so web fonts work: render into canvas using drawImage of SVG can't use @font-face, so place SVG in DOM instead
 const div=document.createElement('div'); div.innerHTML=svg; document.body.innerHTML=''; document.body.appendChild(div); document.body.style.background='#fff'; res(); }); }

// ---------- typographic plates ----------
function plate(lines,{motif='wings',size=120,font='Bebas'}={}){ setup(1800,2700);
  darkSky('#1e1e1e','#050505'); hatch(0,0,W,H,1800,-1.0,70,'#000',0.25,2);
  if(motif==='wings'){ seed=5; wing2(W*0.66,H*0.86,620,'#fff',0.45,-1); wanderer(W*0.68,H*0.93,200,{lean:0.25,color:'#000'}); }
  if(motif==='boulder'){ X.fillStyle='#0a0a0a'; scribbleBall(W*0.7,H*0.8,170,300,'#cfcfcf',0.35); wanderer(W*0.7-250,H*0.8+160,230,{lean:0.75,staff:false,sword:false,color:'#cfcfcf'}); }
  if(motif==='flame'){ flame(W/2,H*0.86,380,190); }
  if(motif==='enso'){ const cx=W/2,cy=H*0.8,R=200,pts=[]; for(let t=0;t<=1;t+=0.005){const a=-Math.PI*0.35+t*Math.PI*1.86; pts.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R,0.3+0.7*Math.sin(Math.PI*Math.min(1,t*1.1))*(1-t*0.5)]);} brushStroke(pts,60,'#e5e5e5',0.8); }
  let y=H*0.3; const lh=size*1.12;
  const fontStr = font==='Bebas' ? `${size}px Bebas` : `italic ${size}px Corm`;
  X.font=fontStr; const all=[]; lines.forEach(l=>{ const words=l.split(' '); let cur=''; words.forEach(w=>{ const t=cur?cur+' '+w:w; if(X.measureText(t).width>W*0.86&&cur){all.push(cur);cur=w;} else cur=t; }); all.push(cur); });
  y = H*0.42 - (all.length*lh)/2;
  all.forEach((l,i)=>text(l,W/2,y+i*lh,fontStr,'#f2f2f2','center',font==='Bebas'?6:0));
  vignette(0.5); grain(24);
}
